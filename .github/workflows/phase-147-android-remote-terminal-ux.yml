name: Phase 147 Android Remote Terminal UX

on:
  push:
    paths:
      - '.github/workflows/phase-147-android-remote-terminal-ux.yml'

permissions:
  contents: write

jobs:
  validate-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Prove Phase 147 baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          report=logs/audits/phase-146-android-enrollment-device-management/PRW-PHASE-146-ANDROID-ENROLLMENT-DEVICE-MANAGEMENT-VALIDATION.txt
          test -f "$report"
          grep -Fq 'PERMANENT_ANDROID_CI_SUCCESS' "$report"
          grep -Fq 'READY_FOR_PHASE_147' "$report"
          test -f contracts/ANDROID_REMOTE_TERMINAL_UX_CONTRACT.md
          grep -Fq '31968345916' contracts/ANDROID_REMOTE_TERMINAL_UX_CONTRACT.md
          test -f apps/android/native/Cargo.lock
          test -f apps/android/native/src/lib.rs
          test -f apps/android/app/src/main/kotlin/com/privateworkspace/prw/MainViewModel.kt
          test -f .github/workflows/android-validation.yml
          ! grep -Fq 'prw-remote-bridge' apps/android/native/Cargo.toml
          cp apps/android/native/Cargo.lock "$RUNNER_TEMP/phase147-native-lock-before"
          echo phase147_baseline=pass

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Prepare exact validated Android and Rust toolchains
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          rustup component add --toolchain 1.97.1-x86_64-unknown-linux-gnu rustfmt clippy
          rustup target add --toolchain 1.97.1-x86_64-unknown-linux-gnu aarch64-linux-android x86_64-linux-android
          cargo +1.97.1 install --locked cargo-ndk --version 4.1.2
          cargo +1.97.1 ndk --version | grep -Fq 'cargo-ndk 4.1.2'
          echo phase147_toolchain=pass

      - name: Materialize Phase 147 candidate source in runner
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('apps/android/native/Cargo.toml')
          text = cargo.read_text()
          marker = 'prw-remote-transport = { path = "../../../crates/prw-remote-transport" }\n'
          replacement = (
              marker
              + 'prw-remote-bridge = { path = "../../../crates/prw-remote-bridge" }\n'
              + 'prw-terminal = { path = "../../../crates/prw-terminal" }\n'
          )
          if text.count(marker) != 1:
              raise SystemExit('Phase 147 native dependency insertion boundary mismatch')
          cargo.write_text(text.replace(marker, replacement, 1))

          lib = Path('apps/android/native/src/lib.rs')
          text = lib.read_text()
          marker = 'use prw_remote_transport::ControlFrame;\n'
          replacement = marker + '\nmod terminal;\n'
          if text.count(marker) != 1 or 'mod terminal;' in text:
              raise SystemExit('Phase 147 native module insertion boundary mismatch')
          lib.write_text(text.replace(marker, replacement, 1))
          PY

          cat > apps/android/native/src/terminal.rs <<'EOF'
          use jni::{
              EnvUnowned,
              errors::ThrowRuntimeExAndDefault,
              objects::{JByteArray, JClass},
              sys::{jboolean, jint, jlong},
          };
          use prw_remote_bridge::{BridgeCommand, MAX_BRIDGE_INLINE_BYTES};
          use prw_terminal::{TerminalGeometry, TerminalProfile, TerminalSessionId};

          const MAX_ANDROID_TERMINAL_IO_BYTES: usize = MAX_BRIDGE_INLINE_BYTES;

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          enum TerminalAdapterError {
              InvalidSessionId,
              InvalidProfile,
              InvalidGeometry,
              InvalidInput,
              InvalidRead,
              InvalidBridge,
          }

          fn session_id(value: i64) -> Result<TerminalSessionId, TerminalAdapterError> {
              let value = u64::try_from(value).map_err(|_| TerminalAdapterError::InvalidSessionId)?;
              TerminalSessionId::new(value).map_err(|_| TerminalAdapterError::InvalidSessionId)
          }

          const fn profile(value: i32) -> Result<TerminalProfile, TerminalAdapterError> {
              match value {
                  0 => Ok(TerminalProfile::PosixShell),
                  1 => Ok(TerminalProfile::BashShell),
                  _ => Err(TerminalAdapterError::InvalidProfile),
              }
          }

          fn geometry(columns: i32, rows: i32) -> Result<TerminalGeometry, TerminalAdapterError> {
              let columns = u16::try_from(columns).map_err(|_| TerminalAdapterError::InvalidGeometry)?;
              let rows = u16::try_from(rows).map_err(|_| TerminalAdapterError::InvalidGeometry)?;
              TerminalGeometry::new(columns, rows).map_err(|_| TerminalAdapterError::InvalidGeometry)
          }

          fn bridge_payload(command: BridgeCommand) -> Result<Vec<u8>, TerminalAdapterError> {
              command.encode().map_err(|_| TerminalAdapterError::InvalidBridge)
          }

          fn encode_terminal_open(
              session: i64,
              profile_code: i32,
              columns: i32,
              rows: i32,
          ) -> Result<Vec<u8>, TerminalAdapterError> {
              bridge_payload(BridgeCommand::TerminalOpen {
                  session_id: session_id(session)?,
                  profile: profile(profile_code)?,
                  geometry: geometry(columns, rows)?,
              })
          }

          fn encode_terminal_input(
              session: i64,
              input: &[u8],
          ) -> Result<Vec<u8>, TerminalAdapterError> {
              if input.is_empty() || input.len() > MAX_ANDROID_TERMINAL_IO_BYTES {
                  return Err(TerminalAdapterError::InvalidInput);
              }
              bridge_payload(BridgeCommand::TerminalInput {
                  session_id: session_id(session)?,
                  bytes: input.to_vec(),
              })
          }

          fn encode_terminal_resize(
              session: i64,
              columns: i32,
              rows: i32,
          ) -> Result<Vec<u8>, TerminalAdapterError> {
              bridge_payload(BridgeCommand::TerminalResize {
                  session_id: session_id(session)?,
                  geometry: geometry(columns, rows)?,
              })
          }

          fn encode_terminal_read(
              session: i64,
              maximum_bytes: i32,
          ) -> Result<Vec<u8>, TerminalAdapterError> {
              let maximum_bytes = usize::try_from(maximum_bytes)
                  .map_err(|_| TerminalAdapterError::InvalidRead)?;
              if maximum_bytes == 0 || maximum_bytes > MAX_ANDROID_TERMINAL_IO_BYTES {
                  return Err(TerminalAdapterError::InvalidRead);
              }
              bridge_payload(BridgeCommand::TerminalRead {
                  session_id: session_id(session)?,
                  maximum_bytes,
              })
          }

          fn encode_terminal_close(session: i64) -> Result<Vec<u8>, TerminalAdapterError> {
              bridge_payload(BridgeCommand::TerminalClose(session_id(session)?))
          }

          fn is_terminal_payload(payload: &[u8]) -> bool {
              matches!(
                  BridgeCommand::decode(payload),
                  Ok(
                      BridgeCommand::TerminalOpen { .. }
                          | BridgeCommand::TerminalInput { .. }
                          | BridgeCommand::TerminalResize { .. }
                          | BridgeCommand::TerminalRead { .. }
                          | BridgeCommand::TerminalClose(_)
                  )
              )
          }

          fn jni_output<'caller>(
              unowned_env: &mut EnvUnowned<'caller>,
              operation: impl FnOnce() -> Vec<u8>,
          ) -> JByteArray<'caller> {
              unowned_env
                  .with_env(|env| env.byte_array_from_slice(&operation()))
                  .resolve::<ThrowRuntimeExAndDefault>()
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_terminalOpenPayload<
              'caller,
          >(
              mut env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              session: jlong,
              profile_code: jint,
              columns: jint,
              rows: jint,
          ) -> JByteArray<'caller> {
              jni_output(&mut env, || {
                  encode_terminal_open(session, profile_code, columns, rows).unwrap_or_default()
              })
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_terminalInputPayload<
              'caller,
          >(
              mut unowned_env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              session: jlong,
              input: JByteArray<'caller>,
          ) -> JByteArray<'caller> {
              unowned_env
                  .with_env(|env| -> jni::errors::Result<_> {
                      let input = env.convert_byte_array(&input)?;
                      let payload = encode_terminal_input(session, &input).unwrap_or_default();
                      env.byte_array_from_slice(&payload)
                  })
                  .resolve::<ThrowRuntimeExAndDefault>()
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_terminalResizePayload<
              'caller,
          >(
              mut env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              session: jlong,
              columns: jint,
              rows: jint,
          ) -> JByteArray<'caller> {
              jni_output(&mut env, || {
                  encode_terminal_resize(session, columns, rows).unwrap_or_default()
              })
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_terminalReadPayload<
              'caller,
          >(
              mut env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              session: jlong,
              maximum_bytes: jint,
          ) -> JByteArray<'caller> {
              jni_output(&mut env, || {
                  encode_terminal_read(session, maximum_bytes).unwrap_or_default()
              })
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_terminalClosePayload<
              'caller,
          >(
              mut env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              session: jlong,
          ) -> JByteArray<'caller> {
              jni_output(&mut env, || encode_terminal_close(session).unwrap_or_default())
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_isTerminalPayload<
              'caller,
          >(
              mut unowned_env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              payload: JByteArray<'caller>,
          ) -> jboolean {
              unowned_env
                  .with_env(|env| -> jni::errors::Result<_> {
                      let payload = env.convert_byte_array(&payload)?;
                      Ok(is_terminal_payload(&payload))
                  })
                  .resolve::<ThrowRuntimeExAndDefault>()
          }

          #[cfg(test)]
          mod tests {
              use prw_remote_bridge::BridgeCommand;
              use prw_terminal::{TerminalGeometry, TerminalProfile, TerminalSessionId};

              use super::*;

              #[test]
              fn all_terminal_payloads_round_trip_through_existing_bridge_codec() {
                  let id = TerminalSessionId::new(147).expect("terminal id");
                  let geometry = TerminalGeometry::new(80, 24).expect("geometry");

                  let open = encode_terminal_open(147, 0, 80, 24).expect("open payload");
                  assert_eq!(
                      BridgeCommand::decode(&open).expect("decode open"),
                      BridgeCommand::TerminalOpen {
                          session_id: id,
                          profile: TerminalProfile::PosixShell,
                          geometry,
                      }
                  );

                  let input = encode_terminal_input(147, b"printf phase147\\n").expect("input payload");
                  assert_eq!(
                      BridgeCommand::decode(&input).expect("decode input"),
                      BridgeCommand::TerminalInput {
                          session_id: id,
                          bytes: b"printf phase147\\n".to_vec(),
                      }
                  );

                  let resize = encode_terminal_resize(147, 120, 40).expect("resize payload");
                  assert_eq!(
                      BridgeCommand::decode(&resize).expect("decode resize"),
                      BridgeCommand::TerminalResize {
                          session_id: id,
                          geometry: TerminalGeometry::new(120, 40).expect("resize geometry"),
                      }
                  );

                  let read = encode_terminal_read(147, 4096).expect("read payload");
                  assert_eq!(
                      BridgeCommand::decode(&read).expect("decode read"),
                      BridgeCommand::TerminalRead {
                          session_id: id,
                          maximum_bytes: 4096,
                      }
                  );

                  let close = encode_terminal_close(147).expect("close payload");
                  assert_eq!(
                      BridgeCommand::decode(&close).expect("decode close"),
                      BridgeCommand::TerminalClose(id)
                  );

                  for payload in [&open, &input, &resize, &read, &close] {
                      assert!(is_terminal_payload(payload));
                  }
              }

              #[test]
              fn invalid_terminal_values_fail_closed() {
                  assert_eq!(
                      encode_terminal_open(0, 0, 80, 24),
                      Err(TerminalAdapterError::InvalidSessionId)
                  );
                  assert_eq!(
                      encode_terminal_open(-1, 0, 80, 24),
                      Err(TerminalAdapterError::InvalidSessionId)
                  );
                  assert_eq!(
                      encode_terminal_open(1, 2, 80, 24),
                      Err(TerminalAdapterError::InvalidProfile)
                  );
                  assert_eq!(
                      encode_terminal_open(1, 0, 0, 24),
                      Err(TerminalAdapterError::InvalidGeometry)
                  );
                  assert_eq!(
                      encode_terminal_resize(1, 1001, 24),
                      Err(TerminalAdapterError::InvalidGeometry)
                  );
                  assert_eq!(
                      encode_terminal_input(1, b""),
                      Err(TerminalAdapterError::InvalidInput)
                  );
                  assert_eq!(
                      encode_terminal_input(1, &vec![0; MAX_ANDROID_TERMINAL_IO_BYTES + 1]),
                      Err(TerminalAdapterError::InvalidInput)
                  );
                  assert_eq!(encode_terminal_read(1, 0), Err(TerminalAdapterError::InvalidRead));
                  assert_eq!(
                      encode_terminal_read(1, i32::try_from(MAX_ANDROID_TERMINAL_IO_BYTES + 1).expect("bound")),
                      Err(TerminalAdapterError::InvalidRead)
                  );
              }

              #[test]
              fn terminal_recognizer_rejects_non_terminal_bridge_payload() {
                  let agent_status = BridgeCommand::AgentStatus.encode().expect("agent status");
                  assert!(!is_terminal_payload(&agent_status));
                  assert!(!is_terminal_payload(b"not-prwc"));
              }
          }
          EOF

          cat > apps/android/app/src/main/kotlin/com/privateworkspace/prw/NativeBridge.kt <<'EOF'
          package com.privateworkspace.prw

          internal object NativeBridge {
              init {
                  System.loadLibrary("prw_android_adapter")
              }

              @JvmStatic external fun protocolVersion(): Int
              @JvmStatic external fun roundTripControlFrame(frame: ByteArray): ByteArray
              @JvmStatic external fun canonicalSessionMessage(request: ByteArray): ByteArray
              @JvmStatic external fun verifySessionSignature(request: ByteArray, signature: ByteArray): Boolean
              @JvmStatic external fun canonicalEnrollmentMessage(request: ByteArray): ByteArray
              @JvmStatic external fun verifyEnrollmentSignature(request: ByteArray, signature: ByteArray): Boolean
              @JvmStatic external fun terminalOpenPayload(sessionId: Long, profileCode: Int, columns: Int, rows: Int): ByteArray
              @JvmStatic external fun terminalInputPayload(sessionId: Long, input: ByteArray): ByteArray
              @JvmStatic external fun terminalResizePayload(sessionId: Long, columns: Int, rows: Int): ByteArray
              @JvmStatic external fun terminalReadPayload(sessionId: Long, maximumBytes: Int): ByteArray
              @JvmStatic external fun terminalClosePayload(sessionId: Long): ByteArray
              @JvmStatic external fun isTerminalPayload(payload: ByteArray): Boolean
          }
          EOF

          cat > apps/android/app/src/main/kotlin/com/privateworkspace/prw/TerminalSession.kt <<'EOF'
          package com.privateworkspace.prw

          internal const val MAX_REMOTE_TERMINAL_BYTES = 60_000
          internal const val MAX_TERMINAL_DIMENSION = 1_000
          internal const val MAX_TERMINAL_TRANSCRIPT_CHARS = 262_144

          internal enum class TerminalProfileView(val nativeCode: Int) {
              PosixShell(0),
              BashShell(1),
          }

          internal enum class TerminalLifecycleView {
              Closed,
              Opening,
              Open,
              Closing,
              Failed,
          }

          internal interface TerminalCommandEncoder {
              fun open(sessionId: Long, profile: TerminalProfileView, columns: Int, rows: Int): ByteArray
              fun input(sessionId: Long, bytes: ByteArray): ByteArray
              fun resize(sessionId: Long, columns: Int, rows: Int): ByteArray
              fun read(sessionId: Long, maximumBytes: Int): ByteArray
              fun close(sessionId: Long): ByteArray
          }

          internal object NativeTerminalCommandEncoder : TerminalCommandEncoder {
              override fun open(sessionId: Long, profile: TerminalProfileView, columns: Int, rows: Int): ByteArray =
                  NativeBridge.terminalOpenPayload(sessionId, profile.nativeCode, columns, rows)

              override fun input(sessionId: Long, bytes: ByteArray): ByteArray =
                  NativeBridge.terminalInputPayload(sessionId, bytes)

              override fun resize(sessionId: Long, columns: Int, rows: Int): ByteArray =
                  NativeBridge.terminalResizePayload(sessionId, columns, rows)

              override fun read(sessionId: Long, maximumBytes: Int): ByteArray =
                  NativeBridge.terminalReadPayload(sessionId, maximumBytes)

              override fun close(sessionId: Long): ByteArray = NativeBridge.terminalClosePayload(sessionId)
          }

          internal data class TerminalUiState(
              val lifecycle: TerminalLifecycleView = TerminalLifecycleView.Closed,
              val sessionId: Long? = null,
              val profile: TerminalProfileView = TerminalProfileView.PosixShell,
              val columns: Int = 80,
              val rows: Int = 24,
              val transcript: String = "",
              val lastPayloadBytes: Int = 0,
              val detail: String = "No terminal session",
          )

          internal class TerminalSessionController(
              private val encoder: TerminalCommandEncoder,
              private val transcriptLimitChars: Int = MAX_TERMINAL_TRANSCRIPT_CHARS,
          ) {
              private var current = TerminalUiState()

              init {
                  require(transcriptLimitChars > 0)
              }

              fun state(): TerminalUiState = current

              fun requestOpen(
                  sessionId: Long,
                  profile: TerminalProfileView,
                  columns: Int,
                  rows: Int,
              ): Boolean {
                  if (current.lifecycle != TerminalLifecycleView.Closed || sessionId <= 0) return false
                  if (!validGeometry(columns, rows)) return false
                  val payload = runCatching { encoder.open(sessionId, profile, columns, rows) }.getOrNull()
                      ?: return false
                  if (payload.isEmpty()) return false
                  current = TerminalUiState(
                      lifecycle = TerminalLifecycleView.Opening,
                      sessionId = sessionId,
                      profile = profile,
                      columns = columns,
                      rows = rows,
                      lastPayloadBytes = payload.size,
                      detail = "Terminal open intent encoded; awaiting authoritative acceptance",
                  )
                  return true
              }

              fun applyAuthoritativeOpen(sessionId: Long): Boolean {
                  if (current.lifecycle != TerminalLifecycleView.Opening || current.sessionId != sessionId) return false
                  current = current.copy(
                      lifecycle = TerminalLifecycleView.Open,
                      detail = "Disposable authoritative open accepted",
                  )
                  return true
              }

              fun sendInput(bytes: ByteArray): Boolean {
                  val sessionId = current.sessionId ?: return false
                  if (current.lifecycle != TerminalLifecycleView.Open) return false
                  if (bytes.isEmpty() || bytes.size > MAX_REMOTE_TERMINAL_BYTES) return false
                  val payload = runCatching { encoder.input(sessionId, bytes) }.getOrNull() ?: return false
                  if (payload.isEmpty()) return false
                  current = current.copy(
                      lastPayloadBytes = payload.size,
                      detail = "Terminal input intent encoded; no remote output fabricated locally",
                  )
                  return true
              }

              fun requestRead(maximumBytes: Int): Boolean {
                  val sessionId = current.sessionId ?: return false
                  if (current.lifecycle != TerminalLifecycleView.Open) return false
                  if (maximumBytes !in 1..MAX_REMOTE_TERMINAL_BYTES) return false
                  val payload = runCatching { encoder.read(sessionId, maximumBytes) }.getOrNull() ?: return false
                  if (payload.isEmpty()) return false
                  current = current.copy(
                      lastPayloadBytes = payload.size,
                      detail = "Terminal output-read intent encoded",
                  )
                  return true
              }

              fun applyAuthoritativeOutput(bytes: ByteArray): Boolean {
                  if (current.lifecycle != TerminalLifecycleView.Open) return false
                  if (bytes.size > MAX_REMOTE_TERMINAL_BYTES) return false
                  val combined = current.transcript + bytes.toString(Charsets.UTF_8)
                  val bounded = if (combined.length <= transcriptLimitChars) {
                      combined
                  } else {
                      combined.takeLast(transcriptLimitChars)
                  }
                  current = current.copy(
                      transcript = bounded,
                      detail = "Disposable authoritative terminal output applied",
                  )
                  return true
              }

              fun resize(columns: Int, rows: Int): Boolean {
                  val sessionId = current.sessionId ?: return false
                  if (current.lifecycle != TerminalLifecycleView.Open || !validGeometry(columns, rows)) return false
                  val payload = runCatching { encoder.resize(sessionId, columns, rows) }.getOrNull() ?: return false
                  if (payload.isEmpty()) return false
                  current = current.copy(
                      columns = columns,
                      rows = rows,
                      lastPayloadBytes = payload.size,
                      detail = "Terminal resize intent encoded",
                  )
                  return true
              }

              fun requestClose(): Boolean {
                  val sessionId = current.sessionId ?: return false
                  if (current.lifecycle != TerminalLifecycleView.Open) return false
                  val payload = runCatching { encoder.close(sessionId) }.getOrNull() ?: return false
                  if (payload.isEmpty()) return false
                  current = current.copy(
                      lifecycle = TerminalLifecycleView.Closing,
                      lastPayloadBytes = payload.size,
                      detail = "Terminal close intent encoded; awaiting authoritative completion",
                  )
                  return true
              }

              fun applyAuthoritativeClosed(sessionId: Long): Boolean {
                  if (current.lifecycle != TerminalLifecycleView.Closing || current.sessionId != sessionId) return false
                  current = current.copy(
                      lifecycle = TerminalLifecycleView.Closed,
                      sessionId = null,
                      lastPayloadBytes = 0,
                      detail = "Disposable authoritative close completed",
                  )
                  return true
              }

              fun fail(detail: String): Boolean {
                  if (current.lifecycle == TerminalLifecycleView.Closed) return false
                  current = current.copy(lifecycle = TerminalLifecycleView.Failed, detail = detail)
                  return true
              }

              private fun validGeometry(columns: Int, rows: Int): Boolean =
                  columns in 1..MAX_TERMINAL_DIMENSION && rows in 1..MAX_TERMINAL_DIMENSION
          }
          EOF

          cat > apps/android/app/src/test/kotlin/com/privateworkspace/prw/TerminalSessionControllerTest.kt <<'EOF'
          package com.privateworkspace.prw

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class TerminalSessionControllerTest {
              private class FakeEncoder : TerminalCommandEncoder {
                  var inputCalls = 0
                  override fun open(sessionId: Long, profile: TerminalProfileView, columns: Int, rows: Int) = byteArrayOf(12)
                  override fun input(sessionId: Long, bytes: ByteArray): ByteArray {
                      inputCalls += 1
                      return byteArrayOf(13)
                  }
                  override fun resize(sessionId: Long, columns: Int, rows: Int) = byteArrayOf(14)
                  override fun read(sessionId: Long, maximumBytes: Int) = byteArrayOf(15)
                  override fun close(sessionId: Long) = byteArrayOf(16)
              }

              @Test fun open_request_does_not_forge_open_state() {
                  val controller = TerminalSessionController(FakeEncoder())
                  assertTrue(controller.requestOpen(147, TerminalProfileView.PosixShell, 80, 24))
                  assertEquals(TerminalLifecycleView.Opening, controller.state().lifecycle)
                  assertTrue(controller.applyAuthoritativeOpen(147))
                  assertEquals(TerminalLifecycleView.Open, controller.state().lifecycle)
              }

              @Test fun input_is_only_accepted_while_open_and_does_not_fabricate_output() {
                  val encoder = FakeEncoder()
                  val controller = TerminalSessionController(encoder)
                  assertFalse(controller.sendInput("pwd\n".encodeToByteArray()))
                  assertTrue(controller.requestOpen(147, TerminalProfileView.BashShell, 80, 24))
                  assertTrue(controller.applyAuthoritativeOpen(147))
                  assertTrue(controller.sendInput("pwd\n".encodeToByteArray()))
                  assertEquals(1, encoder.inputCalls)
                  assertEquals("", controller.state().transcript)
                  assertFalse(controller.sendInput(byteArrayOf()))
                  assertFalse(controller.sendInput(ByteArray(MAX_REMOTE_TERMINAL_BYTES + 1)))
              }

              @Test fun read_resize_and_close_respect_state_and_bounds() {
                  val controller = TerminalSessionController(FakeEncoder())
                  assertTrue(controller.requestOpen(147, TerminalProfileView.PosixShell, 80, 24))
                  assertFalse(controller.requestRead(4096))
                  assertTrue(controller.applyAuthoritativeOpen(147))
                  assertFalse(controller.requestRead(0))
                  assertFalse(controller.requestRead(MAX_REMOTE_TERMINAL_BYTES + 1))
                  assertTrue(controller.requestRead(4096))
                  assertFalse(controller.resize(0, 24))
                  assertFalse(controller.resize(1001, 24))
                  assertTrue(controller.resize(120, 40))
                  assertTrue(controller.requestClose())
                  assertEquals(TerminalLifecycleView.Closing, controller.state().lifecycle)
                  assertFalse(controller.sendInput("ignored".encodeToByteArray()))
                  assertTrue(controller.applyAuthoritativeClosed(147))
                  assertEquals(TerminalLifecycleView.Closed, controller.state().lifecycle)
              }

              @Test fun transcript_is_bounded_and_only_authoritative_output_is_applied() {
                  val controller = TerminalSessionController(FakeEncoder(), transcriptLimitChars = 8)
                  assertTrue(controller.requestOpen(147, TerminalProfileView.PosixShell, 80, 24))
                  assertTrue(controller.applyAuthoritativeOpen(147))
                  assertTrue(controller.applyAuthoritativeOutput("123456789".encodeToByteArray()))
                  assertEquals("23456789", controller.state().transcript)
                  assertFalse(controller.applyAuthoritativeOutput(ByteArray(MAX_REMOTE_TERMINAL_BYTES + 1)))
              }

              @Test fun failed_session_does_not_silently_reopen() {
                  val controller = TerminalSessionController(FakeEncoder())
                  assertTrue(controller.requestOpen(147, TerminalProfileView.PosixShell, 80, 24))
                  assertTrue(controller.fail("disposable failure"))
                  assertEquals(TerminalLifecycleView.Failed, controller.state().lifecycle)
                  assertFalse(controller.requestOpen(148, TerminalProfileView.BashShell, 80, 24))
              }
          }
