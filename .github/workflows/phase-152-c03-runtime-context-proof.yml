name: Phase 152 C03 Shared Runtime Context Proof

on:
  push:
    branches:
      - phase-152-c03-runtime-wiring-proof
    paths:
      - ".github/workflows/phase-152-c03-runtime-context-proof.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-152-c03-runtime-context-proof
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Verify proof source ancestry
        run: |
          test "$(git rev-parse HEAD^)" = "d3abca54726ffeea139599d4cdbd87fc778adb2e"
          test "$(git rev-parse HEAD^^)" = "d9cdd5a3e69ad98d51b3b603e7ba7a50243a07d9"

      - name: Materialize module declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/prw-agent/src/local_commands.rs')
          text = path.read_text()
          anchor = '''#[allow(
              dead_code,
              reason = "C02c provider lifecycle ownership seam is intentionally not runtime-wired"
          )]
          pub(crate) mod management_provider_lifecycle;
          '''
          replacement = anchor + '''#[allow(
              dead_code,
              reason = "C03 shared production runtime context is validated before worker wiring"
          )]
          pub(crate) mod management_runtime;
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one lifecycle module anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, replacement))
          PY
          cargo fmt --all

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libgtk-4-dev libadwaita-1-dev

      - name: Validate shared context and workspace
        shell: bash
        run: |
          set +e
          export CARGO_TARGET_DIR=/tmp/prw-c03-runtime-context-proof-target
          rm -rf target "$CARGO_TARGET_DIR"
          LOG_DIR=/tmp/prw-c03-runtime-context-proof-logs
          mkdir -p "$LOG_DIR"

          cargo metadata --locked --no-deps --format-version 1 >"$LOG_DIR/metadata.out" 2>&1
          METADATA_RC=$?
          cargo fmt --all -- --check >"$LOG_DIR/fmt.out" 2>&1
          FMT_RC=$?
          cargo test --locked -p prw-agent management_runtime::tests -- --nocapture >"$LOG_DIR/focused-test.out" 2>&1
          FOCUSED_TEST_RC=$?
          cargo clippy --locked -p prw-agent --all-targets --all-features -- -D warnings >"$LOG_DIR/focused-clippy.out" 2>&1
          FOCUSED_CLIPPY_RC=$?
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings >"$LOG_DIR/clippy.out" 2>&1
          CLIPPY_RC=$?
          cargo test --locked --workspace --all-targets >"$LOG_DIR/test.out" 2>&1
          TEST_RC=$?
          cargo build --locked --workspace --all-targets >"$LOG_DIR/build.out" 2>&1
          BUILD_RC=$?

          BASE_HEAD=$(git rev-parse HEAD)
          REPORT="logs/audits/phase-152-c03-runtime-management-integration/C03_SHARED_RUNTIME_CONTEXT_PROOF_${BASE_HEAD}.txt"
          mkdir -p "$(dirname "$REPORT")"
          {
            echo "BASE_HEAD=$BASE_HEAD"
            echo "PROOF_SOURCE_PARENT=d3abca54726ffeea139599d4cdbd87fc778adb2e"
            echo "ACTIVE_RUNTIME_BASE=d9cdd5a3e69ad98d51b3b603e7ba7a50243a07d9"
            echo "OWNERSHIP=OUTER_AGENT_SCOPE"
            echo "LIFECYCLE_SHARING=SERIALIZED_CROSS_CONNECTION"
            echo "REQUEST_SELECTED_ROOT=NO"
            echo "FABRICATED_REGISTRY_PRINCIPAL=NO"
            echo "LOCK_POISON_SUCCESS_ACK=NO"
            rustc --version
            cargo --version
            rustfmt --version
            cargo clippy --version
            echo "METADATA_RC=$METADATA_RC"
            echo "FMT_RC=$FMT_RC"
            echo "FOCUSED_TEST_RC=$FOCUSED_TEST_RC"
            echo "FOCUSED_CLIPPY_RC=$FOCUSED_CLIPPY_RC"
            echo "CLIPPY_RC=$CLIPPY_RC"
            echo "TEST_RC=$TEST_RC"
            echo "BUILD_RC=$BUILD_RC"
            echo "--- FOCUSED_TEST_TAIL ---"
            tail -n 160 "$LOG_DIR/focused-test.out"
            echo "--- FOCUSED_CLIPPY_TAIL ---"
            tail -n 120 "$LOG_DIR/focused-clippy.out"
            echo "--- WORKSPACE_CLIPPY_TAIL ---"
            tail -n 120 "$LOG_DIR/clippy.out"
            echo "--- WORKSPACE_TEST_TAIL ---"
            tail -n 180 "$LOG_DIR/test.out"
            echo "--- WORKSPACE_BUILD_TAIL ---"
            tail -n 100 "$LOG_DIR/build.out"
          } > "$REPORT"

          if [ "$METADATA_RC" -eq 0 ] && [ "$FMT_RC" -eq 0 ] && [ "$FOCUSED_TEST_RC" -eq 0 ] && [ "$FOCUSED_CLIPPY_RC" -eq 0 ] && [ "$CLIPPY_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ] && [ "$BUILD_RC" -eq 0 ]; then
            echo 'STATUS=PASS' >> "$REPORT"
            echo 'VALIDATION_STATUS=PASS' >> "$GITHUB_ENV"
          else
            echo 'STATUS=FAIL' >> "$REPORT"
            echo 'VALIDATION_STATUS=FAIL' >> "$GITHUB_ENV"
          fi

      - name: Commit proof evidence
        shell: bash
        run: |
          BASE_HEAD=$(git rev-parse HEAD)
          REMOTE_HEAD=$(git ls-remote origin refs/heads/phase-152-c03-runtime-wiring-proof | cut -f1)
          test "$REMOTE_HEAD" = "$BASE_HEAD"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/prw-agent/src/local_commands.rs crates/prw-agent/src/local_commands/management_runtime.rs logs/audits/phase-152-c03-runtime-management-integration/

          if [ "$VALIDATION_STATUS" = PASS ]; then
            git rm .github/workflows/phase-152-c03-runtime-context-proof.yml
            git commit -m "phase 152 c03: prove shared runtime context ${BASE_HEAD:0:12}"
          else
            git add .github/workflows/phase-152-c03-runtime-context-proof.yml
            git commit -m "phase 152 c03: record runtime context proof failure ${BASE_HEAD:0:12}"
          fi
          git push origin HEAD:phase-152-c03-runtime-wiring-proof

      - name: Fail on validation failure
        if: env.VALIDATION_STATUS != 'PASS'
        run: exit 1
