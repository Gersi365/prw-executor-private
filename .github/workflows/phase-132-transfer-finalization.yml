name: Phase 132 A01 Transfer Finalization

on:
  push:
    paths:
      - '.github/workflows/phase-132-transfer-finalization.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Require current Phase 130 and 131 authority and normalize integration
        shell: bash
        run: |
          set -Eeuo pipefail
          report130='logs/audits/phase-130-device-registry-workspace-membership/PRW-PHASE-130-REGISTRY-MEMBERSHIP-VALIDATION.txt'
          report131='logs/audits/phase-131-remote-file-management-foundation/PRW-PHASE-131-FILE-MANAGEMENT-FOUNDATION-VALIDATION.txt'
          test -f "$report130"
          test -f "$report131"
          grep -Fq 'PHASE_130_DONE / NO_PRODUCTION_REGISTRY_SIDE_EFFECT / REGISTRY_CURRENT_STATE_REVALIDATION_READY' "$report130"
          grep -Fq 'PHASE_131_DONE / READY_FOR_PHASE_132_VALIDATION' "$report131"

          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          member = '    "crates/prw-file-transfer",\n'
          if member not in text:
              needle = '    "crates/prw-file-service",\n'
              if text.count(needle) != 1:
                  raise SystemExit('prw-file-service workspace member prerequisite missing')
              cargo.write_text(text.replace(needle, needle + member))

          manifest = Path('crates/prw-file-service/Cargo.toml')
          text = manifest.read_text()
          old = 'rustix = { version = "=1.1.4", features = ["fs"] }'
          new = 'rustix = { version = "=1.1.4", features = ["fs", "process"] }\naws-lc-rs = { version = "=1.18.0", default-features = false, features = ["alloc", "non-fips"] }'
          if 'aws-lc-rs' not in text:
              if text.count(old) != 1:
                  raise SystemExit('prw-file-service rustix dependency shape mismatch')
              manifest.write_text(text.replace(old, new))
          elif 'features = ["fs", "process"]' not in text:
              raise SystemExit('unexpected preexisting transfer-storage dependency shape')

          lib = Path('crates/prw-file-service/src/lib.rs')
          text = lib.read_text()
          marker = 'mod transfer_storage;\npub use transfer_storage::{\n    MAX_TRANSFER_CHUNK_BYTES, StagedUploadFile, TransferStorageError, transfer_staging_name,\n};\n'
          if 'mod transfer_storage;' not in text:
              idx = text.find('\n\nuse std::{')
              if idx == -1:
                  raise SystemExit('file-service module insertion point missing')
              text = text[:idx] + '\n\n' + marker + text[idx:]
              lib.write_text(text)
          PY
          cargo fmt --all
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          grep -A3 '^name = "rustix"$' Cargo.lock | grep -Fq 'version = "1.1.4"'
          grep -A3 '^name = "aws-lc-rs"$' Cargo.lock | grep -Fq 'version = "1.18.0"'
          git restore --worktree -- target 2>/dev/null || true
          git diff --check

      - name: Apply machine-applicable Phase 132 lints only
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo clippy --fix --locked -p prw-file-service -p prw-file-transfer \
            --all-targets --all-features --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
          git restore --worktree -- target 2>/dev/null || true
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              Cargo.toml|Cargo.lock|\
              crates/prw-file-service/Cargo.toml|\
              crates/prw-file-service/src/lib.rs|\
              crates/prw-file-service/src/transfer_storage.rs|\
              crates/prw-file-transfer/Cargo.toml|\
              crates/prw-file-transfer/src/lib.rs) ;;
              *) echo "unexpected_phase132_fix_path=$path" >&2; exit 1 ;;
            esac
          done
          git diff --check

      - name: Run focused Phase 132 gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-file-service -p prw-file-transfer --all-targets --all-features -- -D warnings
          cargo test --locked -p prw-file-service -p prw-file-transfer --all-targets
          echo 'phase132_a01_focused=pass'

      - name: Run full workspace gates
        id: workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          git restore --worktree -- target 2>/dev/null || true
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          echo "lock_sha=$lock_sha" >> "$GITHUB_OUTPUT"
          echo "phase132_a01_workspace=pass lock_sha=$lock_sha"

      - name: Record authoritative Phase 132 report
        shell: bash
        env:
          LOCK_SHA: ${{ steps.workspace.outputs.lock_sha }}
        run: |
          set -Eeuo pipefail
          report_dir='logs/audits/phase-132-file-transfer-hardening'
          report="$report_dir/PRW-PHASE-132-FILE-TRANSFER-HARDENING-VALIDATION.txt"
          mkdir -p "$report_dir"
          cat > "$report" <<EOF
          Private Remote Workspace
          Phase 132 — Resumable File Transfer Hardening

          STATUS:
          PASS / CONTRACT_LOCKED / SAME_DIRECTORY_STAGING_VALIDATED / RESUMABLE_SEQUENTIAL_UPLOAD_VALIDATED / SHA256_INTEGRITY_VALIDATED / ATOMIC_NOREPLACE_COMMIT_VALIDATED / BOUNDED_DOWNLOAD_VALIDATED / FULL_WORKSPACE_VALIDATION_PASS / PRODUCTION_TRANSFER_NOT_ACTIVE

          Repository: Gersi365/prw-executor-private
          Branch: main
          Date: 2026-08-16
          Validation source head: $GITHUB_SHA
          Authoritative validation run: $GITHUB_RUN_ID
          Cargo.lock SHA-256: $LOCK_SHA

          CONTRACT
          contracts/FILE_TRANSFER_HARDENING_CONTRACT.md

          IMPLEMENTATION
          crates/prw-file-service/src/transfer_storage.rs
          crates/prw-file-transfer

          SECURITY/TRANSACTION OUTCOME
          TransferId is 128 bits / 32 lowercase hex externally. Maximum transfer is 1 GiB, maximum chunk 1 MiB, and the manager bound is 128 active uploads. Staging is PRW-generated in the descriptor-validated final parent. Resume reopens the exact NOFOLLOW staging file. Chunks require strict sequential offsets. Final length and AWS-LC SHA-256 must match the plan before same-directory Linux NOREPLACE publication. Existing final files are never overwritten. Parent directory sync follows commit/abort. Abort removes only the exact staging inode/path identity. Download is descriptor-anchored, regular-file-only and bounded to one chunk.

          VALIDATION
          The authoritative run passed bounded machine-applicable correction within Phase 132 files, focused file-service+file-transfer rustfmt/Clippy/tests, then full workspace/all-target Clippy, tests and build under the locked graph.

          INITIAL OVERWRITE POLICY
          Final overwrite/replace is disabled. Existing destinations fail closed.

          PRODUCTION BOUNDARY
          No production remote-file transport, capability policy, or arbitrary PowerCode file was activated or mutated. Production transfer remains dependent on authenticated transport, current registry validation, explicit file capability policy, and a deployed validated Agent build.

          FINAL CLASSIFICATION
          PHASE_132_DONE / NO_PRODUCTION_TRANSFER_SIDE_EFFECT / READY_FOR_PHASE_133_SOURCE_WORK
          EOF

      - name: Commit validated Phase 132 source graph and report only
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name Gersi365
          git config user.email Gersi365@outlook.com
          git add Cargo.toml Cargo.lock \
            crates/prw-file-service/Cargo.toml \
            crates/prw-file-service/src/lib.rs \
            crates/prw-file-service/src/transfer_storage.rs \
            crates/prw-file-transfer/Cargo.toml \
            crates/prw-file-transfer/src/lib.rs \
            logs/audits/phase-132-file-transfer-hardening/PRW-PHASE-132-FILE-TRANSFER-HARDENING-VALIDATION.txt
          git commit -m 'phase 132: finalize resumable file transfer hardening'
          git push origin HEAD:main
          echo 'phase132_a01_materialization=pass'
