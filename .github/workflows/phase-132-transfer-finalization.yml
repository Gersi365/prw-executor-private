name: Phase 132 Transfer Finalization

on:
  push:
    paths:
      - '.github/workflows/phase-132-transfer-finalization.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Require Phase 131 and normalize Phase 132 integration
        shell: bash
        run: |
          set -Eeuo pipefail
          report='logs/audits/phase-131-remote-file-management-foundation/PRW-PHASE-131-FILE-MANAGEMENT-FOUNDATION-VALIDATION.txt'
          test -f "$report"
          grep -Fq 'PHASE_131_SOURCE_AND_DISPOSABLE_FILE_FOUNDATION_DONE' "$report"

          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          member = '    "crates/prw-file-transfer",\n'
          if member not in text:
              needle = '    "crates/prw-file-service",\n'
              if text.count(needle) != 1:
                  raise SystemExit('prw-file-service workspace member prerequisite missing')
              cargo.write_text(text.replace(needle, needle + member))

          manifest = Path('crates/prw-file-service/Cargo.toml')
          text = manifest.read_text()
          old = 'rustix = { version = "=1.1.4", features = ["fs"] }'
          new = 'rustix = { version = "=1.1.4", features = ["fs", "process"] }\naws-lc-rs = { version = "=1.18.0", default-features = false, features = ["alloc", "non-fips"] }'
          if 'aws-lc-rs' not in text:
              if text.count(old) != 1:
                  raise SystemExit('prw-file-service rustix dependency shape mismatch')
              manifest.write_text(text.replace(old, new))
          elif 'features = ["fs", "process"]' not in text:
              raise SystemExit('unexpected preexisting transfer-storage dependency shape')

          lib = Path('crates/prw-file-service/src/lib.rs')
          text = lib.read_text()
          marker = 'mod transfer_storage;\npub use transfer_storage::{\n    MAX_TRANSFER_CHUNK_BYTES, StagedUploadFile, TransferStorageError, transfer_staging_name,\n};\n'
          if 'mod transfer_storage;' not in text:
              needle = '//! Phase 131 intentionally implements only bounded list/stat/read and creation-only\n'
              idx = text.find('\n\nuse std::{')
              if idx == -1:
                  raise SystemExit('file-service module insertion point missing')
              text = text[:idx] + '\n\n' + marker + text[idx:]
              lib.write_text(text)
          PY
          cargo fmt --all

      - name: Generate exact locked graph
        id: lock
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          grep -A3 '^name = "rustix"$' Cargo.lock | grep -Fq 'version = "1.1.4"'
          grep -A3 '^name = "aws-lc-rs"$' Cargo.lock | grep -Fq 'version = "1.18.0"'
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          echo "sha=$lock_sha" >> "$GITHUB_OUTPUT"
          echo "phase132_lock_sha256=$lock_sha"

      - name: Apply machine-applicable Phase 132 Clippy fixes only
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo clippy --fix --locked \
            -p prw-file-service -p prw-file-transfer \
            --all-targets --all-features --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          for path in "${changed[@]}"; do
            case "$path" in
              Cargo.toml|Cargo.lock|\
              crates/prw-file-service/Cargo.toml|\
              crates/prw-file-service/src/lib.rs|\
              crates/prw-file-service/src/transfer_storage.rs|\
              crates/prw-file-transfer/Cargo.toml|\
              crates/prw-file-transfer/src/lib.rs) ;;
              *) echo "unexpected_phase132_fix_path=$path" >&2; exit 1 ;;
            esac
          done
          git diff --check

      - name: Run focused Phase 132 gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-file-service -p prw-file-transfer --all-targets --all-features -- -D warnings 2>&1 | tee phase132-clippy.log
          cargo test --locked -p prw-file-service -p prw-file-transfer --all-targets 2>&1 | tee phase132-tests.log
          echo 'phase132_focused_validation=pass'

      - name: Run full workspace gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee phase132-workspace-clippy.log
          cargo test --locked --workspace --all-targets 2>&1 | tee phase132-workspace-tests.log
          cargo build --locked --workspace 2>&1 | tee phase132-workspace-build.log
          echo 'phase132_workspace_validation=pass'

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase132-failure-diagnostics
          path: |
            Cargo.lock
            phase132-*.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Record authoritative Phase 132 report and self-clean
        if: success()
        shell: bash
        env:
          LOCK_SHA: ${{ steps.lock.outputs.sha }}
        run: |
          set -Eeuo pipefail
          report_dir='logs/audits/phase-132-file-transfer-hardening'
          report="$report_dir/PRW-PHASE-132-FILE-TRANSFER-HARDENING-VALIDATION.txt"
          mkdir -p "$report_dir"
          cat > "$report" <<EOF
          Private Remote Workspace
          Phase 132 — Resumable File Transfer Hardening

          STATUS:
          PASS / CONTRACT_LOCKED / SAME_DIRECTORY_STAGING_VALIDATED / RESUMABLE_SEQUENTIAL_UPLOAD_VALIDATED / SHA256_INTEGRITY_VALIDATED / ATOMIC_NOREPLACE_COMMIT_VALIDATED / BOUNDED_DOWNLOAD_VALIDATED / FULL_WORKSPACE_VALIDATION_PASS / PRODUCTION_TRANSFER_NOT_ACTIVE

          Repository: Gersi365/prw-executor-private
          Branch: main
          Date: 2026-08-16
          Validation source head: $GITHUB_SHA
          Authoritative finalization run: $GITHUB_RUN_ID
          Cargo.lock SHA-256: $LOCK_SHA

          CONTRACT
          contracts/FILE_TRANSFER_HARDENING_CONTRACT.md

          IMPLEMENTATION
          crates/prw-file-service/src/transfer_storage.rs
          crates/prw-file-transfer

          SECURITY/TRANSACTION OUTCOME
          - TransferId is exactly 128 bits / 32 lowercase hex externally.
          - Maximum transfer is 1 GiB; maximum chunk is 1 MiB; active manager bound is 128 uploads.
          - Staging filename is generated by PRW and lives in the descriptor-validated final parent directory.
          - First begin is creation-only 0600 regular file; resume reopens exact NOFOLLOW staging.
          - Chunks are strict sequential offset writes and are synced before offset acknowledgement.
          - Final staged length must equal plan total.
          - SHA-256 is streamed through AWS-LC and must equal the plan digest before publication.
          - Final publication uses same-directory atomic Linux NOREPLACE; existing final files are never overwritten.
          - Parent directory is synced after commit/abort.
          - Abort removes only the exact staging inode/path identity.
          - Download chunks are descriptor-anchored, NOFOLLOW, regular-file-only, offset-bounded and at most 1 MiB.

          VALIDATION
          The authoritative run passed machine-applicable Clippy correction constrained to Phase 132 files, focused rustfmt/Clippy/tests for file-service+file-transfer, then full workspace/all-target Clippy, tests and build under the locked graph.

          Disposable tests cover transfer-id encoding, plan/chunk bounds, sequential offsets, resume after handle drop, digest/size failure without publication, NOREPLACE behavior, staging symlink substitution, abort, final content/mode, and bounded download/EOF behavior.

          INITIAL OVERWRITE POLICY
          Final overwrite/replace is intentionally disabled in Phase 132. Existing destinations fail closed. Any later replacement feature requires a separate versioned rollback contract.

          PRODUCTION BOUNDARY
          No production remote-file transport, capability policy, or arbitrary PowerCode file was activated or mutated by Phase 132 tests. Production transfer remains dependent on authenticated transport, current registry validation, explicit file capability policy, and a deployed validated Agent build.

          FINAL CLASSIFICATION
          PHASE_132_SOURCE_AND_DISPOSABLE_TRANSFER_HARDENING_DONE / NO_PRODUCTION_TRANSFER_SIDE_EFFECT / READY_FOR_PHASE_133_SOURCE_WORK
          EOF

          git rm -f -- .github/workflows/phase-132-transfer-finalization.yml
          rm -f phase132-*.log
          git diff --check
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          git add -A
          git commit -m 'phase 132: finalize resumable file transfer hardening'
          git push origin HEAD:main
          echo 'phase132_finalization=pass'
