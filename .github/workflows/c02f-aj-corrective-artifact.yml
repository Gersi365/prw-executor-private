name: Phase 152 C02f-AJ Corrective Artifact

on:
  pull_request:
    paths:
      - 'crates/prw-control-plane/src/fence_sequence.rs'
      - 'crates/prw-control-plane/src/recovery_epoch.rs'
      - 'apps/android/native/Cargo.lock'
      - '.github/workflows/c02f-aj-corrective-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correct:
    name: Build bounded AJ corrective artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare canonical Rust formatter
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup component add --toolchain 1.97.1-x86_64-unknown-linux-gnu rustfmt
          rustc +1.97.1 --version
          cargo +1.97.1 --version
          rustfmt +1.97.1 --version

      - name: Generate Android native lockfile with canonical Cargo
        shell: bash
        run: |
          set -Eeuo pipefail
          cd apps/android/native
          cargo +1.97.1 generate-lockfile

      - name: Apply exact AJ Clippy corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          fence_path = Path('crates/prw-control-plane/src/fence_sequence.rs')
          fence = fence_path.read_text()
          fence = replace_once(fence, '    pub fn new(bytes: [u8; 32]) -> Result<Self, FenceSequenceError> {', '''    /// Constructs a non-zero sequence-allocation attempt identifier.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`FenceSequenceError::ZeroAttemptId`] when `bytes` is all zero.\n    pub fn new(bytes: [u8; 32]) -> Result<Self, FenceSequenceError> {''', 'fence attempt docs')

          old_decode_head = '''pub fn decode_head(encoded: &[u8]) -> Result<FenceSequenceHead, FenceSequenceError> {\n    if encoded.len() != FENCE_SEQUENCE_HEAD_RECORD_BYTES {\n        return Err(FenceSequenceError::InvalidHeadLength);\n    }\n    if encoded[0..4] != FENCE_SEQUENCE_HEAD_MAGIC {\n        return Err(FenceSequenceError::InvalidMagic);\n    }\n    if u16::from_be_bytes(encoded[4..6].try_into().expect("fixed")) != FENCE_SEQUENCE_VERSION {\n        return Err(FenceSequenceError::UnsupportedVersion);\n    }\n    Ok(FenceSequenceHead {\n        epoch: RecoveryEpoch::new(u64::from_be_bytes(\n            encoded[6..14].try_into().expect("fixed"),\n        ))\n        .map_err(|_| FenceSequenceError::ZeroEpoch)?,\n        high_water: u64::from_be_bytes(encoded[14..22].try_into().expect("fixed")),\n    })\n}'''
          new_decode_head = '''/// Decodes one canonical `PRWF` head record.\n///\n/// # Errors\n///\n/// Returns an error for a non-canonical record length, magic, version, or zero epoch.\npub fn decode_head(encoded: &[u8]) -> Result<FenceSequenceHead, FenceSequenceError> {\n    if encoded.len() != FENCE_SEQUENCE_HEAD_RECORD_BYTES {\n        return Err(FenceSequenceError::InvalidHeadLength);\n    }\n    if encoded[0..4] != FENCE_SEQUENCE_HEAD_MAGIC {\n        return Err(FenceSequenceError::InvalidMagic);\n    }\n    let mut version_bytes = [0_u8; 2];\n    version_bytes.copy_from_slice(&encoded[4..6]);\n    if u16::from_be_bytes(version_bytes) != FENCE_SEQUENCE_VERSION {\n        return Err(FenceSequenceError::UnsupportedVersion);\n    }\n    let mut epoch_bytes = [0_u8; 8];\n    epoch_bytes.copy_from_slice(&encoded[6..14]);\n    let mut high_water_bytes = [0_u8; 8];\n    high_water_bytes.copy_from_slice(&encoded[14..22]);\n    Ok(FenceSequenceHead {\n        epoch: RecoveryEpoch::new(u64::from_be_bytes(epoch_bytes))\n            .map_err(|_| FenceSequenceError::ZeroEpoch)?,\n        high_water: u64::from_be_bytes(high_water_bytes),\n    })\n}'''
          fence = replace_once(fence, old_decode_head, new_decode_head, 'decode_head')

          old_decode_reservation = '''pub fn decode_reservation(encoded: &[u8]) -> Result<FenceSequenceReservation, FenceSequenceError> {\n    if encoded.len() != FENCE_SEQUENCE_RESERVATION_RECORD_BYTES {\n        return Err(FenceSequenceError::InvalidReservationLength);\n    }\n    if encoded[0..4] != FENCE_SEQUENCE_RESERVATION_MAGIC {\n        return Err(FenceSequenceError::InvalidMagic);\n    }\n    if u16::from_be_bytes(encoded[4..6].try_into().expect("fixed")) != FENCE_SEQUENCE_VERSION {\n        return Err(FenceSequenceError::UnsupportedVersion);\n    }\n    Ok(FenceSequenceReservation {\n        epoch: RecoveryEpoch::new(u64::from_be_bytes(\n            encoded[6..14].try_into().expect("fixed"),\n        ))\n        .map_err(|_| FenceSequenceError::ZeroEpoch)?,\n        sequence: NonZeroU64::new(u64::from_be_bytes(\n            encoded[14..22].try_into().expect("fixed"),\n        ))\n        .ok_or(FenceSequenceError::ZeroSequence)?,\n        attempt_id: SequenceAllocationAttemptId::new(encoded[22..54].try_into().expect("fixed"))?,\n    })\n}'''
          new_decode_reservation = '''/// Decodes one canonical `PRWR` reservation record.\n///\n/// # Errors\n///\n/// Returns an error for a non-canonical record length, magic, version, epoch, sequence, or attempt ID.\npub fn decode_reservation(encoded: &[u8]) -> Result<FenceSequenceReservation, FenceSequenceError> {\n    if encoded.len() != FENCE_SEQUENCE_RESERVATION_RECORD_BYTES {\n        return Err(FenceSequenceError::InvalidReservationLength);\n    }\n    if encoded[0..4] != FENCE_SEQUENCE_RESERVATION_MAGIC {\n        return Err(FenceSequenceError::InvalidMagic);\n    }\n    let mut version_bytes = [0_u8; 2];\n    version_bytes.copy_from_slice(&encoded[4..6]);\n    if u16::from_be_bytes(version_bytes) != FENCE_SEQUENCE_VERSION {\n        return Err(FenceSequenceError::UnsupportedVersion);\n    }\n    let mut epoch_bytes = [0_u8; 8];\n    epoch_bytes.copy_from_slice(&encoded[6..14]);\n    let mut sequence_bytes = [0_u8; 8];\n    sequence_bytes.copy_from_slice(&encoded[14..22]);\n    let mut attempt_bytes = [0_u8; 32];\n    attempt_bytes.copy_from_slice(&encoded[22..54]);\n    Ok(FenceSequenceReservation {\n        epoch: RecoveryEpoch::new(u64::from_be_bytes(epoch_bytes))\n            .map_err(|_| FenceSequenceError::ZeroEpoch)?,\n        sequence: NonZeroU64::new(u64::from_be_bytes(sequence_bytes))\n            .ok_or(FenceSequenceError::ZeroSequence)?,\n        attempt_id: SequenceAllocationAttemptId::new(attempt_bytes)?,\n    })\n}'''
          fence = replace_once(fence, old_decode_reservation, new_decode_reservation, 'decode_reservation')
          fence = replace_once(fence, '    pub fn new(value: Vec<u8>, mod_revision: i64) -> Result<Self, FenceSequenceError> {', '''    /// Builds a validated observation of the authoritative head key.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error when the revision is non-positive or `value` is not a canonical head record.\n    pub fn new(value: Vec<u8>, mod_revision: i64) -> Result<Self, FenceSequenceError> {''', 'head observation docs')
          fence = replace_once(fence, 'pub fn plan_allocation(\n    predecessor: FenceSequenceHeadObservation,', '''/// Builds the deterministic compare-and-swap plan for one sequence allocation.\n///\n/// # Errors\n///\n/// Returns an error when the predecessor high-water mark cannot advance to a non-zero `u64`.\npub fn plan_allocation(\n    predecessor: FenceSequenceHeadObservation,''', 'plan allocation docs')
          fence = replace_once(fence, 'pub fn classify_reobservation(\n    plan: &FenceSequenceAllocationPlan,', '''/// Classifies a strong head-plus-reservation re-observation after an indeterminate mutation.\n///\n/// # Errors\n///\n/// Returns [`FenceSequenceError::ContradictoryState`] when the observations cannot be reconciled\n/// with the retained exact allocation plan.\npub fn classify_reobservation(\n    plan: &FenceSequenceAllocationPlan,''', 'sequence reobservation docs')
          fence = replace_once(fence, '    pub fn consume(\n        &mut self,\n        observed: FenceSequenceReobservation,', '''    /// Consumes the single deliberate reissue allowance after proof of non-commit.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error unless non-commit was proven or when the one-reissue budget was already consumed.\n    pub fn consume(\n        &mut self,\n        observed: FenceSequenceReobservation,''', 'sequence budget docs')
          fence_path.write_text(fence)

          recovery_path = Path('crates/prw-control-plane/src/recovery_epoch.rs')
          recovery = recovery_path.read_text()
          recovery = replace_once(recovery, '    pub fn new(value: u64) -> Result<Self, RecoveryEpochError> {', '''    /// Constructs a non-zero issued recovery epoch.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`RecoveryEpochError::ZeroIssuedEpoch`] when `value` is zero.\n    pub fn new(value: u64) -> Result<Self, RecoveryEpochError> {''', 'recovery epoch docs')
          recovery = replace_once(recovery, '    pub fn checked_successor(self) -> Result<RecoveryEpoch, RecoveryEpochError> {', '''    /// Returns the next strictly greater recovery epoch.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`RecoveryEpochError::EpochOverflow`] when the current epoch is `u64::MAX`.\n    pub fn checked_successor(self) -> Result<RecoveryEpoch, RecoveryEpochError> {''', 'successor docs')
          recovery = replace_once(recovery, '    pub fn new(bytes: [u8; RECOVERY_EPOCH_ATTEMPT_ID_BYTES]) -> Result<Self, RecoveryEpochError> {', '''    /// Constructs a non-zero recovery-epoch issuance attempt identifier.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`RecoveryEpochError::ZeroAttemptId`] when `bytes` is the all-zero bootstrap marker.\n    pub fn new(bytes: [u8; RECOVERY_EPOCH_ATTEMPT_ID_BYTES]) -> Result<Self, RecoveryEpochError> {''', 'recovery attempt docs')
          recovery = replace_once(recovery, '    pub fn encode_columns(\n', '    pub const fn encode_columns(\n', 'encode columns const')
          recovery = replace_once(recovery, '    pub fn decode_columns(epoch_be: &[u8], attempt: &[u8]) -> Result<Self, RecoveryEpochError> {', '''    /// Decodes the canonical Spanner head-row epoch and attempt-ID columns.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error for invalid byte lengths, a non-canonical bootstrap marker, or a zero issued attempt ID.\n    pub fn decode_columns(epoch_be: &[u8], attempt: &[u8]) -> Result<Self, RecoveryEpochError> {''', 'decode columns docs')
          recovery = replace_once(recovery, '    pub fn new(\n        previous_epoch: RecoveryEpochValue,\n        attempt_id: RecoveryEpochAttemptId,', '''    /// Builds the exact retained `(H, N, A)` issuance plan.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`RecoveryEpochError::EpochOverflow`] when `previous_epoch` has no successor.\n    pub fn new(\n        previous_epoch: RecoveryEpochValue,\n        attempt_id: RecoveryEpochAttemptId,''', 'issuance plan docs')
          recovery = replace_once(recovery, 'pub fn classify_reobservation(\n    plan: RecoveryEpochIssuancePlan,', '''/// Classifies one strong head-plus-history re-observation against an exact issuance plan.\n///\n/// # Errors\n///\n/// Returns [`RecoveryEpochError::ContradictoryState`] when the observed durable state cannot be\n/// reconciled with the retained `(H, N, A)` plan.\npub fn classify_reobservation(\n    plan: RecoveryEpochIssuancePlan,''', 'epoch reobservation docs')
          recovery = replace_once(recovery, '    pub fn consume(\n        &mut self,\n        observed: RecoveryEpochReobservation,', '''    /// Consumes the single deliberate epoch-issuance reissue allowance.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error unless non-commit was proven or when the one-reissue budget was already consumed.\n    pub fn consume(\n        &mut self,\n        observed: RecoveryEpochReobservation,''', 'epoch budget docs')
          recovery = replace_once(recovery, 'pub fn decode_recovery_epoch(encoded: &[u8]) -> Result<RecoveryEpochValue, RecoveryEpochError> {', '''/// Decodes the canonical unsigned big-endian recovery-epoch bytes.\n///\n/// # Errors\n///\n/// Returns [`RecoveryEpochError::InvalidEpochLength`] unless `encoded` is exactly eight bytes.\npub fn decode_recovery_epoch(encoded: &[u8]) -> Result<RecoveryEpochValue, RecoveryEpochError> {''', 'epoch decoder docs')
          recovery = replace_once(recovery, '''    Ok(match NonZeroU64::new(value) {\n        Some(value) => RecoveryEpochValue::Issued(RecoveryEpoch(value)),\n        None => RecoveryEpochValue::Bootstrap,\n    })''', '''    Ok(NonZeroU64::new(value).map_or(\n        RecoveryEpochValue::Bootstrap,\n        |value| RecoveryEpochValue::Issued(RecoveryEpoch(value)),\n    ))''', 'epoch map_or')
          recovery_path.write_text(recovery)
          PY

      - name: Canonical rustfmt
        shell: bash
        run: cargo +1.97.1 fmt --all

      - name: Verify bounded corrective diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            apps/android/native/Cargo.lock
            crates/prw-control-plane/src/fence_sequence.rs
            crates/prw-control-plane/src/recovery_epoch.rs
          )
          printf '%s\n' "${changed[@]}" > /tmp/changed
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed

      - name: Upload bounded corrective artifact
        uses: actions/upload-artifact@v4
        with:
          name: c02f-aj-bounded-corrective
          path: |
            apps/android/native/Cargo.lock
            crates/prw-control-plane/src/fence_sequence.rs
            crates/prw-control-plane/src/recovery_epoch.rs
          if-no-files-found: error
          retention-days: 1
