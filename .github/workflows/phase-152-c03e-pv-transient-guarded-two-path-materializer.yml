name: Phase 152 C03e-PV transient guarded two-path materializer

on:
  push:
    branches:
      - phase-152-c03e-pv-production-requester-rendezvous-expected-device-admission-fallible-verifier-time-endpoint-lifecycle-callback-projection-source-materialization
    paths:
      - .github/workflows/phase-152-c03e-pv-transient-guarded-two-path-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard and materialize selected two-path projection
        shell: bash
        env:
          PU_HEAD: 024025b2f3a1d80111306b92d3813b3831acb195
          ENDPOINT_BLOB: 742a8caca5fb4be6c15d5c777c1f56e52b8d3e78
          PARENT_BLOB: de66532f18ebbca30ac6bd6b9da4983ded4b8bbe
          BRANCH: phase-152-c03e-pv-production-requester-rendezvous-expected-device-admission-fallible-verifier-time-endpoint-lifecycle-callback-projection-source-materialization
          HELPER: .github/workflows/phase-152-c03e-pv-transient-guarded-two-path-materializer.yml
          ENDPOINT: crates/prw-agent/src/remote_session_capability_runtime/remote_session_endpoint_lifecycle_runtime.rs
          PARENT: crates/prw-agent/src/remote_session_capability_runtime.rs
          AUTHENTICATED: crates/prw-agent/src/remote_session_capability_runtime/authenticated_remote_session_runtime.rs
        run: |
          set -euo pipefail

          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(git rev-parse HEAD^)" = "$PU_HEAD"
          test "$(git merge-base "$PU_HEAD" HEAD)" = "$PU_HEAD"

          mapfile -t pre_paths < <(git diff --name-only "$PU_HEAD"...HEAD)
          test "${#pre_paths[@]}" -eq 1
          test "${pre_paths[0]}" = "$HELPER"

          test "$(git hash-object "$ENDPOINT")" = "$ENDPOINT_BLOB"
          test "$(git hash-object "$PARENT")" = "$PARENT_BLOB"

          test "$(grep -Fxc 'pub(super) enum AuthenticatedRemoteSessionFallibleCapabilityRequestLoopError {' "$AUTHENTICATED")" -eq 1
          test "$(grep -Fxc 'pub(super) enum AuthenticatedRemoteSessionFallibleVerifierTimeWorkerStop {' "$AUTHENTICATED")" -eq 1
          test "$(grep -Fc 'pub(super) fn into_parts(' crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs)" -ge 1

          test "$(grep -Fc 'RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection' "$ENDPOINT")" -eq 0
          test "$(grep -Fc 'drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle_with_completion_projection' "$ENDPOINT")" -eq 0
          test "$(grep -Fc 'RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection' "$PARENT")" -eq 0

          python3 <<'PY'
          from pathlib import Path

          endpoint_path = Path("crates/prw-agent/src/remote_session_capability_runtime/remote_session_endpoint_lifecycle_runtime.rs")
          parent_path = Path("crates/prw-agent/src/remote_session_capability_runtime.rs")

          endpoint = endpoint_path.read_text()
          parent = parent_path.read_text()

          import_anchor = "use super::remote_session_executor_runtime::RemoteSessionFallibleVerifierTimeRegisteredWorkerCompletion;\n"
          assert endpoint.count(import_anchor) == 1
          endpoint = endpoint.replace(
              import_anchor,
              "use super::authenticated_remote_session_runtime::{\n"
              "    AuthenticatedRemoteSessionFallibleCapabilityRequestLoopError,\n"
              "    AuthenticatedRemoteSessionFallibleVerifierTimeWorkerStop,\n"
              "};\n"
              + import_anchor,
              1,
          )

          requester_projection = '''/// Bounded crate-visible terminal family for one requester-aware endpoint worker completion.
          #[allow(
              dead_code,
              clippy::redundant_pub_crate,
              reason = "C03e-LP preserves the exact LO-selected pub(crate) completion projection in the private child before separately gated higher-owner caller migration"
          )]
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum RemoteSessionRequesterAwareEndpointLifecycleCompletionProjection {
              /// Caller-owned cancellation won at one selected requester lifecycle cancellation boundary.
              Cancelled,
              /// The existing requester-aware serial lifecycle stopped on one ingress failure.
              IngressFailure,
              /// The existing requester-aware serial lifecycle stopped on one requester response failure.
              RequesterResponseFailure,
              /// Tokio reported abnormal completion for the retained requester-aware worker task.
              AbnormalTaskCompletion,
          }
          '''
          assert endpoint.count(requester_projection) == 1

          fallible_projection = '''
          /// Bounded crate-visible terminal family for one fallible verifier-time endpoint worker completion.
          #[allow(
              dead_code,
              clippy::redundant_pub_crate,
              reason = "C03e-PV preserves the exact C03e-PU-selected pub(crate) completion projection in the private child before separately gated higher-owner caller migration"
          )]
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection {
              /// Caller-owned cancellation won at the existing fallible verifier-time worker boundary.
              Cancelled,
              /// The existing PRWA verifier-time source failed.
              VerifierTimeFailure,
              /// The existing capability transaction failed after verifier-time acquisition.
              TransactionFailure,
              /// Tokio reported abnormal completion for the retained worker task.
              AbnormalTaskCompletion,
          }
          '''
          endpoint = endpoint.replace(requester_projection, requester_projection + fallible_projection, 1)

          method_anchor = '''    /// Consumes this startup owner and delegates one dormant production-durable repeated-admission
          '''
          assert endpoint.count(method_anchor) == 1

          adapter = '''    /// Consumes this endpoint owner and exposes only the C03e-PU-selected bounded fallible
              /// verifier-time completion family.
              ///
              /// The existing C03e-PT lifecycle remains sole owner of endpoint/executor behavior. This
              /// adapter invokes it exactly once, forwards every non-completion input and callback
              /// unchanged, and projects only the raw persistent-worker completion while preserving the
              /// authenticated owner-derived `DeviceId` unchanged.
              ///
              /// # Errors
              ///
              /// Returns the existing persistent-collection configuration error unchanged.
              #[allow(
                  dead_code,
                  reason = "C03e-PV materializes the C03e-PU-selected dormant completion projection before separately gated provider installation and higher-owner caller migration"
              )]
              #[expect(
                  clippy::too_many_arguments,
                  reason = "C03e-PV preserves the exact C03e-PT lifecycle inputs while projecting only completion"
              )]
              pub(crate) fn drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle_with_completion_projection<
                  P,
                  D,
                  T,
                  F,
                  C,
                  R,
                  E,
              >(
                  self,
                  max_active_workers: NonZeroUsize,
                  authority: &SharedCurrentCapabilityAuthority<P>,
                  session_authentication: &mut SessionAuthenticationService,
                  expected_requests: mpsc::Receiver<RemoteSessionExpectedDeviceAdmissionRequest<D, T>>,
                  admission_timing: F,
                  mut on_completion: C,
                  on_rejection: R,
                  on_admission_failure: E,
              ) -> Result<(), RemoteSessionPersistentCollectionConfigError>
              where
                  P: PolicyEvaluator + Send + Sync + 'static,
                  D: CapabilityDispatcher + Send + 'static,
                  T: FnMut() -> Result<u64, prw_session::prwa_verifier_source::PrwaVerifierSourceError>
                      + Send
                      + 'static,
                  F: FnMut(&DeviceId) -> RemoteSessionRealAdmissionTiming,
                  C: FnMut(DeviceId, RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection),
                  R: FnMut(RemoteSessionExpectedDeviceAdmissionRejection<D, T>),
                  E: FnMut(RemoteSessionRepeatedAdmissionFailure),
              {
                  self.drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle(
                      max_active_workers,
                      authority,
                      session_authentication,
                      expected_requests,
                      admission_timing,
                      |completion| {
                          let (device_id, result) = completion.into_parts();
                          let projection = match result {
                              Ok(AuthenticatedRemoteSessionFallibleVerifierTimeWorkerStop::Cancelled) => {
                                  RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection::Cancelled
                              }
                              Ok(AuthenticatedRemoteSessionFallibleVerifierTimeWorkerStop::Failed(
                                  AuthenticatedRemoteSessionFallibleCapabilityRequestLoopError::VerifierTime(_),
                              )) => {
                                  RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection::VerifierTimeFailure
                              }
                              Ok(AuthenticatedRemoteSessionFallibleVerifierTimeWorkerStop::Failed(
                                  AuthenticatedRemoteSessionFallibleCapabilityRequestLoopError::Transaction(_),
                              )) => {
                                  RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection::TransactionFailure
                              }
                              Err(RemoteSessionSpawnedWorkerJoinError::AbnormalTaskCompletion) => {
                                  RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection::AbnormalTaskCompletion
                              }
                          };
                          on_completion(device_id, projection);
                      },
                      on_rejection,
                      on_admission_failure,
                  )
              }
          
          '''
          endpoint = endpoint.replace(method_anchor, adapter + method_anchor, 1)

          reexport_anchor = '''#[allow(
              unused_imports,
              reason = "C03e-LP materializes the LO-reselected crate-visible completion projection before separately gated higher-owner caller migration"
          )]
          pub(crate) use remote_session_endpoint_lifecycle_runtime::RemoteSessionRequesterAwareEndpointLifecycleCompletionProjection;
          '''
          assert parent.count(reexport_anchor) == 1
          new_reexport = '''#[allow(
              unused_imports,
              reason = "C03e-PV materializes the C03e-PU-selected crate-visible fallible verifier-time completion projection before separately gated higher-owner caller migration"
          )]
          pub(crate) use remote_session_endpoint_lifecycle_runtime::RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection;
          '''
          parent = parent.replace(reexport_anchor, new_reexport + reexport_anchor, 1)

          endpoint_path.write_text(endpoint)
          parent_path.write_text(parent)
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

          test "$(grep -Fc 'pub(crate) enum RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection {' "$ENDPOINT")" -eq 1
          test "$(grep -Fc 'drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle_with_completion_projection<' "$ENDPOINT")" -eq 1
          test "$(grep -Fc 'pub(crate) use remote_session_endpoint_lifecycle_runtime::RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection;' "$PARENT")" -eq 1
          test "$(grep -Fc 'RemoteSessionFallibleVerifierTimeRegisteredWorkerCompletion' "$ENDPOINT")" -ge 1

          git rm "$HELPER"
          git add "$ENDPOINT" "$PARENT"

          mapfile -t final_paths < <(git diff --cached --name-only "$PU_HEAD")
          test "${#final_paths[@]}" -eq 2
          test "${final_paths[0]}" = "$PARENT"
          test "${final_paths[1]}" = "$ENDPOINT"

          test "$(git diff --cached --name-only "$PU_HEAD" | grep -Fxc "$ENDPOINT")" -eq 1
          test "$(git diff --cached --name-only "$PU_HEAD" | grep -Fxc "$PARENT")" -eq 1
          test "$(git diff --cached --name-only "$PU_HEAD" | grep -Fxc "$HELPER" || true)" -eq 0

          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git commit -m "C03e-PV: materialize fallible verifier-time endpoint callback projection"
          git push origin "HEAD:$BRANCH"
