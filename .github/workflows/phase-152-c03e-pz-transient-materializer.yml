name: Phase 152 C03e-PZ transient guarded one-path materializer

on:
  push:
    branches:
      - phase-152-c03e-pz-linux-production-reachability-fallible-verifier-time-callback-projection-operation-source-materialization

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'C03e-PZ: add transient guarded one-path materializer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard and materialize selected one-file sibling
        shell: bash
        run: |
          set -euo pipefail

          BASE='404df13bb15c0446267798cc5c1a72732e888279'
          SOURCE='crates/prw-agent/src/linux_bootstrap.rs'
          HELPER='.github/workflows/phase-152-c03e-pz-transient-materializer.yml'
          EXPECTED_SOURCE_BLOB='5984af5e0f3db211e484d4a6dd4935a3ffc8a630'
          TARGET='linux_agent_production_reachability_remote_process_operation_with_fallible_verifier_time_completion_projection'
          LOWER='drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle_with_completion_projection'

          test "$(git merge-base "$BASE" HEAD)" = "$BASE"

          mapfile -t pre_paths < <(git diff --name-only "$BASE"..HEAD)
          test "${#pre_paths[@]}" -eq 1
          test "${pre_paths[0]}" = "$HELPER"

          test "$(git hash-object "$SOURCE")" = "$EXPECTED_SOURCE_BLOB"
          test "$(grep -cF "$TARGET" "$SOURCE" || true)" -eq 0
          test "$(grep -cF "$LOWER" "$SOURCE" || true)" -eq 0

          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/prw-agent/src/linux_bootstrap.rs')
          text = path.read_text()

          import_anchor = '''    RemoteSessionExpectedDeviceAdmissionRequest, RemoteSessionRealAdmissionError,\n    RemoteSessionRealAdmissionTiming, RemoteSessionRegisteredWorkerCompletion,\n'''
          import_replacement = '''    RemoteSessionExpectedDeviceAdmissionRequest,\n    RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection,\n    RemoteSessionRealAdmissionError, RemoteSessionRealAdmissionTiming,\n    RemoteSessionRegisteredWorkerCompletion,\n'''

          if text.count(import_anchor) != 1:
              raise SystemExit(f'import anchor count={text.count(import_anchor)}')

          marker = '''/// Crate-private production requester/rendezvous process-operation lifetime custody selected by C03e-IH.\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'insertion marker count={text.count(marker)}')

          sibling = r'''/// Builds one dormant production-reachability operation with fallible verifier-time completion projection.
          ///
          /// Factory construction moves only the already-typed production inputs into one one-shot closure.
          /// Provider sampling, endpoint bind, controller publication and lifecycle drive remain deferred until a
          /// separately gated caller invokes that closure. Runtime invocation preserves the existing production
          /// reachability composition order and delegates exactly once to the C03e-PX projection-capable wrapper.
          ///
          /// No verifier-time provider installation or sampling, completion remapping, expected-request
          /// construction, requester/durable fusion, retry, second runtime, second teardown path, readiness
          /// publication or executable activation is added here.
          #[allow(
              dead_code,
              reason = "C03e-PZ materializes the PY-selected dormant Linux fallible verifier-time projection operation before separately gated higher-owner composition"
          )]
          pub(crate) fn linux_agent_production_reachability_remote_process_operation_with_fallible_verifier_time_completion_projection<
              P,
              D,
              T,
              F,
              C,
              R,
              E,
          >(
              inputs: LinuxAgentProductionReachabilityRemoteProcessOperationInputs<P, D, T, F, C, R, E>,
          ) -> impl FnOnce(LinuxAgentRemoteSupervisorShutdownPublisher) + Send + 'static
          where
              P: PolicyEvaluator + Send + Sync + 'static,
              D: CapabilityDispatcher + Send + 'static,
              T: FnMut() -> Result<u64, prw_session::prwa_verifier_source::PrwaVerifierSourceError>
                  + Send
                  + 'static,
              F: FnMut(&DeviceId) -> RemoteSessionRealAdmissionTiming + Send + 'static,
              C: FnMut(DeviceId, RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection)
                  + Send
                  + 'static,
              R: FnMut(RemoteSessionExpectedDeviceAdmissionRejection<D, T>) + Send + 'static,
              E: FnMut(RemoteSessionRepeatedAdmissionFailure) + Send + 'static,
          {
              move |publisher| {
                  let LinuxAgentProductionReachabilityRemoteProcessOperationInputs {
                      peer,
                      remote_process_inputs,
                  } = inputs;
                  let LinuxAgentRemoteProcessOperationInputs {
                      bind_addr,
                      max_active_workers,
                      capability_authority,
                      mut session_authentication,
                      expected_requests,
                      admission_timing,
                      on_completion,
                      on_rejection,
                      on_admission_failure,
                  } = remote_process_inputs;

                  let _ = run_remote_process_operation_composition(
                      RemoteSessionExecutorRuntime::new,
                      move |executor| {
                          executor.bootstrap_production_reachability_runtime_custody_from_systemd_credentials(
                              &peer,
                          )
                      },
                      move |executor, runtime_custody| {
                          runtime_custody.bind_remote_endpoint_with_executor_from_systemd_credentials(
                              executor, bind_addr,
                          )
                      },
                      move |controller| publisher.publish(controller),
                      move |lifecycle, _publication| {
                          let _ = lifecycle
                              .drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle_with_completion_projection(
                                  max_active_workers,
                                  &capability_authority,
                                  &mut session_authentication,
                                  expected_requests,
                                  admission_timing,
                                  on_completion,
                                  on_rejection,
                                  on_admission_failure,
                              );
                      },
                  );
              }
          }

          '''

          text = text.replace(import_anchor, import_replacement, 1)
          text = text.replace(marker, sibling + marker, 1)
          path.write_text(text)
          PY

          test "$(grep -cF "$TARGET" "$SOURCE" || true)" -eq 1
          test "$(grep -cF "$LOWER" "$SOURCE" || true)" -eq 1

          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

          mapfile -t worktree_paths < <(git diff --name-only)
          test "${#worktree_paths[@]}" -eq 1
          test "${worktree_paths[0]}" = "$SOURCE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SOURCE"
          git commit -m 'C03e-PZ: materialize Linux fallible verifier-time callback projection operation'

          rm "$HELPER"
          git add "$HELPER"
          git commit -m 'C03e-PZ: remove transient one-path materializer'

          mapfile -t final_paths < <(git diff --name-only "$BASE"..HEAD)
          test "${#final_paths[@]}" -eq 1
          test "${final_paths[0]}" = "$SOURCE"
          test ! -e "$HELPER"

          git push origin "HEAD:${GITHUB_REF_NAME}"
