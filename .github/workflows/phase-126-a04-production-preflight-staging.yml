name: Phase 126 A04 Production Preflight and Rollback Staging

on:
  push:
    paths:
      - '.github/workflows/phase-126-a04-production-preflight-staging.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build reproducible locked activation candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = 'aa453a154754f1f8ca25a2752bf5bf38af763cc2da82089035bf8b725c400424'
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets

          mkdir -p crates/prw-agent/examples
          cat > crates/prw-agent/examples/phase126_a04_status_probe.rs <<'RS'
          use std::{env, io::Write, os::unix::net::UnixStream};
          use prw_agent::local_commands::LocalAgentCommand;
          use prw_agent::local_commands::request_frame::stream::write_local_command_request;
          use prw_agent::local_commands::status_snapshot::LocalAgentRuntimeState;
          use prw_agent::local_commands::status_snapshot::response_frame::stream::read_success_status_response;
          use prw_agent::LocalIpcRequestId;

          fn main() {
              let socket = env::args().nth(1).expect("socket path argument");
              let mut stream = UnixStream::connect(socket).expect("connect Agent socket");
              let request_id = LocalIpcRequestId::new(12604).expect("non-zero request id");
              write_local_command_request(&mut stream, request_id, LocalAgentCommand::GetAgentStatus)
                  .expect("write status request");
              stream.flush().expect("flush request");
              let response = read_success_status_response(&mut stream).expect("read status response");
              assert_eq!(response.request_id(), request_id);
              assert_eq!(response.snapshot().runtime_state(), LocalAgentRuntimeState::Ready);
              assert!(response.snapshot().protocol_version().is_supported());
              println!("phase126_a04_status=Ready protocol_supported=yes");
          }
          RS

          rm -rf \
            target-phase126-a04-agent-1 \
            target-phase126-a04-agent-2 \
            target-phase126-a04-provisioner-1 \
            target-phase126-a04-provisioner-2 \
            target-phase126-a04-probe

          CARGO_TARGET_DIR="$PWD/target-phase126-a04-agent-1" \
            cargo build --release --locked -p prw-agent --bin prw-agent
          CARGO_TARGET_DIR="$PWD/target-phase126-a04-agent-2" \
            cargo build --release --locked -p prw-agent --bin prw-agent
          CARGO_TARGET_DIR="$PWD/target-phase126-a04-provisioner-1" \
            cargo build --release --locked -p prw-device-identity-provisioning --bin prw-device-identity-provision
          CARGO_TARGET_DIR="$PWD/target-phase126-a04-provisioner-2" \
            cargo build --release --locked -p prw-device-identity-provisioning --bin prw-device-identity-provision
          CARGO_TARGET_DIR="$PWD/target-phase126-a04-probe" \
            cargo build --release --locked -p prw-agent --example phase126_a04_status_probe

          cmp -s \
            target-phase126-a04-agent-1/release/prw-agent \
            target-phase126-a04-agent-2/release/prw-agent
          cmp -s \
            target-phase126-a04-provisioner-1/release/prw-device-identity-provision \
            target-phase126-a04-provisioner-2/release/prw-device-identity-provision
          echo 'phase126_a04_agent_reproducibility=byte_identical'
          echo 'phase126_a04_provisioner_reproducibility=byte_identical'

          mkdir -p phase126-a04-payload
          install -m 0755 target-phase126-a04-agent-1/release/prw-agent phase126-a04-payload/prw-agent
          install -m 0755 target-phase126-a04-provisioner-1/release/prw-device-identity-provision phase126-a04-payload/prw-device-identity-provision
          install -m 0755 target-phase126-a04-probe/release/examples/phase126_a04_status_probe phase126-a04-payload/phase126-a04-status-probe
          cp Cargo.lock phase126-a04-payload/Cargo.lock

          agent_sha=$(sha256sum phase126-a04-payload/prw-agent | cut -d' ' -f1)
          provisioner_sha=$(sha256sum phase126-a04-payload/prw-device-identity-provision | cut -d' ' -f1)
          probe_sha=$(sha256sum phase126-a04-payload/phase126-a04-status-probe | cut -d' ' -f1)
          lock_sha=$(sha256sum phase126-a04-payload/Cargo.lock | cut -d' ' -f1)

          test "$agent_sha" = '4dbb114edc5ad131dd8abcf2ba798a413a249f2a3931a43b59f67b496e0d242e'
          test "$lock_sha" = 'aa453a154754f1f8ca25a2752bf5bf38af763cc2da82089035bf8b725c400424'
          [[ "$provisioner_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$probe_sha" =~ ^[0-9a-f]{64}$ ]]

          {
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'cargo_lock_sha256=%s\n' "$lock_sha"
            printf 'candidate_agent_sha256=%s\n' "$agent_sha"
            printf 'provisioner_sha256=%s\n' "$provisioner_sha"
            printf 'status_probe_sha256=%s\n' "$probe_sha"
            printf 'rustc_version=%s\n' "$(rustc --version)"
            printf 'cargo_version=%s\n' "$(cargo --version)"
            printf 'build_contract=independent_clean_targets_repeat_twice\n'
          } > phase126-a04-payload/ACTIVATION-MANIFEST

          (cd phase126-a04-payload && sha256sum \
            prw-agent \
            prw-device-identity-provision \
            phase126-a04-status-probe \
            Cargo.lock \
            ACTIVATION-MANIFEST \
            > SHA256SUMS)
          (cd phase126-a04-payload && sha256sum -c SHA256SUMS)
          cat phase126-a04-payload/ACTIVATION-MANIFEST
          cat phase126-a04-payload/SHA256SUMS
          echo 'phase126_a04_hosted_candidate_build=pass'
      - uses: actions/upload-artifact@v4
        with:
          name: phase126-a04-activation-candidates
          path: phase126-a04-payload
          if-no-files-found: error
          retention-days: 1

  preflight-stage:
    needs: build
    runs-on: [self-hosted, prw-host]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phase126-a04-activation-candidates
          path: phase126-a04-payload
      - name: Read-only production preflight and secure rollback staging
        shell: bash
        run: |
          set -Eeuo pipefail

          payload="$GITHUB_WORKSPACE/phase126-a04-payload"
          cd "$payload"
          sha256sum -c SHA256SUMS
          chmod 0755 prw-agent prw-device-identity-provision phase126-a04-status-probe

          manifest_value() {
            key="$1"
            awk -F= -v key="$key" '$1 == key { sub(/^[^=]*=/, ""); print; found=1 } END { if (!found) exit 1 }' ACTIVATION-MANIFEST
          }

          expected_installed_agent='8d0fa919676d1d55200801dd979a5463228610ad0f5aea1d2fd8bbded7047fbf'
          expected_installed_unit='24f646dc96777542904cd824f1678e6c32256b64911d4a031c0315d198c0a909'
          expected_candidate_agent='4dbb114edc5ad131dd8abcf2ba798a413a249f2a3931a43b59f67b496e0d242e'
          expected_lock='aa453a154754f1f8ca25a2752bf5bf38af763cc2da82089035bf8b725c400424'
          expected_candidate_provisioner=$(manifest_value provisioner_sha256)
          expected_probe=$(manifest_value status_probe_sha256)

          test "$(manifest_value source_commit)" = "$GITHUB_SHA"
          test "$(manifest_value cargo_lock_sha256)" = "$expected_lock"
          test "$(manifest_value candidate_agent_sha256)" = "$expected_candidate_agent"
          test "$(manifest_value build_contract)" = 'independent_clean_targets_repeat_twice'
          [[ "$expected_candidate_provisioner" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_probe" =~ ^[0-9a-f]{64}$ ]]

          production_agent='/usr/lib/private-remote-workspace/prw-agent'
          production_unit='/usr/lib/systemd/user/prw-agent.service'
          production_socket="$XDG_RUNTIME_DIR/private-remote-workspace/agent.sock"
          state_root="${XDG_STATE_HOME:-$HOME/.local/state}"
          config_root="${XDG_CONFIG_HOME:-$HOME/.config}"
          production_cipher="$state_root/private-remote-workspace/credentials/device-identity-private-key-v1.cred"
          production_dropin="$config_root/systemd/user/prw-agent.service.d/20-device-identity-credential.conf"
          stage_parent="$state_root/private-remote-workspace/phase126/staging"
          stage="$stage_parent/$GITHUB_SHA"

          case "$state_root" in /*) ;; *) echo 'state_root_not_absolute' >&2; exit 1;; esac
          case "$config_root" in /*) ;; *) echo 'config_root_not_absolute' >&2; exit 1;; esac
          case "$stage" in /*) ;; *) echo 'stage_not_absolute' >&2; exit 1;; esac

          echo "phase126_a04_host=$(hostname) user=$USER uid=$(id -u) gid=$(id -g)"
          test "$(hostname)" = 'PowerCode'
          test "$(id -u)" = '1000'
          test "$(id -g)" = '1000'

          test -d "$XDG_RUNTIME_DIR"
          test ! -L "$XDG_RUNTIME_DIR"
          test "$(stat -c '%u:%g:%a' "$XDG_RUNTIME_DIR")" = '1000:1000:700'

          for root in "$state_root" "$config_root"; do
            test -d "$root"
            test ! -L "$root"
            test "$(stat -c '%u' "$root")" = '1000'
            mode=$(stat -c '%a' "$root")
            perm=$((8#$mode))
            test $((perm & 8#022)) -eq 0
          done
          echo "phase126_a04_xdg_state_root=$state_root"
          echo "phase126_a04_xdg_config_root=$config_root"

          test -f "$production_agent"
          test ! -L "$production_agent"
          test "$(stat -c '%u:%g:%a' "$production_agent")" = '0:0:755'
          test "$(sha256sum "$production_agent" | cut -d' ' -f1)" = "$expected_installed_agent"
          test -f "$production_unit"
          test ! -L "$production_unit"
          test "$(stat -c '%u:%g:%a' "$production_unit")" = '0:0:644'
          test "$(sha256sum "$production_unit" | cut -d' ' -f1)" = "$expected_installed_unit"

          test "$(systemctl --user is-active prw-agent.service)" = 'active'
          test "$(systemctl --user is-enabled prw-agent.service)" = 'enabled'
          test "$(loginctl show-user "$USER" -p Linger --value)" = 'yes'
          dropins=$(systemctl --user show prw-agent.service -p DropInPaths --value)
          test -z "$dropins"
          "$payload/phase126-a04-status-probe" "$production_socket"
          echo 'phase126_a04_production_runtime=pass'

          test ! -e "$production_cipher"
          test ! -L "$production_cipher"
          test ! -e "$production_dropin"
          test ! -L "$production_dropin"
          echo 'phase126_a04_identity_destinations_absent=pass'

          test -x /usr/bin/systemd-creds
          /usr/bin/systemd-creds has-tpm2 >/dev/null
          echo 'phase126_a04_tpm2_capability=pass'

          set +e
          sudo -n true >/dev/null 2>&1
          sudo_rc=$?
          set -e
          test "$sudo_rc" -ne 0
          echo "phase126_a04_sudo_noninteractive=no rc=$sudo_rc"

          test "$(sha256sum "$payload/prw-agent" | cut -d' ' -f1)" = "$expected_candidate_agent"
          test "$(sha256sum "$payload/prw-device-identity-provision" | cut -d' ' -f1)" = "$expected_candidate_provisioner"
          test "$(sha256sum "$payload/phase126-a04-status-probe" | cut -d' ' -f1)" = "$expected_probe"
          test "$(sha256sum "$payload/Cargo.lock" | cut -d' ' -f1)" = "$expected_lock"

          install -d -m 0700 "$stage_parent"
          test ! -e "$stage"
          test ! -L "$stage"
          mkdir -m 0700 "$stage"

          install -m 0755 "$payload/prw-agent" "$stage/candidate-prw-agent"
          install -m 0755 "$payload/prw-device-identity-provision" "$stage/prw-device-identity-provision"
          install -m 0755 "$payload/phase126-a04-status-probe" "$stage/phase126-a04-status-probe"
          install -m 0600 "$payload/ACTIVATION-MANIFEST" "$stage/ACTIVATION-MANIFEST"
          install -m 0700 "$production_agent" "$stage/rollback-prw-agent"
          install -m 0600 "$production_unit" "$stage/production-unit.snapshot"

          cat > "$stage/20-device-identity-credential.conf" <<EOF
          [Service]
          LoadCredentialEncrypted=prw.device-identity.private-key.v1:$production_cipher
          EOF
          chmod 0600 "$stage/20-device-identity-credential.conf"

          test "$(stat -c '%u:%g:%a' "$stage")" = '1000:1000:700'
          test "$(sha256sum "$stage/candidate-prw-agent" | cut -d' ' -f1)" = "$expected_candidate_agent"
          test "$(sha256sum "$stage/prw-device-identity-provision" | cut -d' ' -f1)" = "$expected_candidate_provisioner"
          test "$(sha256sum "$stage/phase126-a04-status-probe" | cut -d' ' -f1)" = "$expected_probe"
          test "$(sha256sum "$stage/rollback-prw-agent" | cut -d' ' -f1)" = "$expected_installed_agent"
          test "$(sha256sum "$stage/production-unit.snapshot" | cut -d' ' -f1)" = "$expected_installed_unit"
          test "$(stat -c '%u:%g:%a' "$stage/candidate-prw-agent")" = '1000:1000:755'
          test "$(stat -c '%u:%g:%a' "$stage/prw-device-identity-provision")" = '1000:1000:755'
          test "$(stat -c '%u:%g:%a' "$stage/rollback-prw-agent")" = '1000:1000:700'
          test "$(stat -c '%u:%g:%a' "$stage/ACTIVATION-MANIFEST")" = '1000:1000:600'
          test "$(stat -c '%u:%g:%a' "$stage/20-device-identity-credential.conf")" = '1000:1000:600'

          expected_dropin=$(printf '[Service]\nLoadCredentialEncrypted=prw.device-identity.private-key.v1:%s\n' "$production_cipher")
          actual_dropin=$(cat "$stage/20-device-identity-credential.conf")
          test "$actual_dropin" = "$expected_dropin"

          sha256sum \
            "$stage/candidate-prw-agent" \
            "$stage/prw-device-identity-provision" \
            "$stage/phase126-a04-status-probe" \
            "$stage/ACTIVATION-MANIFEST" \
            "$stage/rollback-prw-agent" \
            "$stage/production-unit.snapshot" \
            "$stage/20-device-identity-credential.conf" \
            > "$stage/SHA256SUMS"
          chmod 0600 "$stage/SHA256SUMS"
          (cd "$stage" && sha256sum -c SHA256SUMS)

          dropin_sha=$(sha256sum "$stage/20-device-identity-credential.conf" | cut -d' ' -f1)
          manifest_sha=$(sha256sum "$stage/ACTIVATION-MANIFEST" | cut -d' ' -f1)

          test ! -e "$production_cipher"
          test ! -e "$production_dropin"
          test "$(sha256sum "$production_agent" | cut -d' ' -f1)" = "$expected_installed_agent"
          test "$(sha256sum "$production_unit" | cut -d' ' -f1)" = "$expected_installed_unit"
          test "$(systemctl --user is-active prw-agent.service)" = 'active'
          test "$(systemctl --user is-enabled prw-agent.service)" = 'enabled'
          test "$(loginctl show-user "$USER" -p Linger --value)" = 'yes'
          test -z "$(systemctl --user show prw-agent.service -p DropInPaths --value)"
          "$payload/phase126-a04-status-probe" "$production_socket"

          echo "phase126_a04_stage=$stage"
          echo "phase126_a04_candidate_agent_sha256=$expected_candidate_agent"
          echo "phase126_a04_provisioner_sha256=$expected_candidate_provisioner"
          echo "phase126_a04_status_probe_sha256=$expected_probe"
          echo "phase126_a04_manifest_sha256=$manifest_sha"
          echo "phase126_a04_dropin_sha256=$dropin_sha"
          echo "phase126_a04_rollback_agent_sha256=$expected_installed_agent"
          echo "phase126_a04_rollback_unit_sha256=$expected_installed_unit"
          echo 'phase126_a04_staging=pass'
          echo 'phase126_a04_no_production_mutation=pass'
