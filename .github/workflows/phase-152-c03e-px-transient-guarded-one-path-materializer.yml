name: Phase 152 C03e-PX transient guarded one-path materializer

on:
  push:
    branches:
      - phase-152-c03e-px-production-reachability-endpoint-fallible-verifier-time-callback-projection-propagation-source-materialization
    paths:
      - .github/workflows/phase-152-c03e-px-transient-guarded-one-path-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PX branch
        uses: actions/checkout@v4
        with:
          ref: phase-152-c03e-px-production-reachability-endpoint-fallible-verifier-time-callback-projection-propagation-source-materialization
          fetch-depth: 0

      - name: Guard and materialize selected one-path propagation
        env:
          PW_HEAD: d993c51746f2ca144323cce1900af61211c23ac8
          EXPECTED_SOURCE_BLOB: 4030cac84cad1780cc37410d344ba642cb4ac6e4
          SOURCE: crates/prw-agent/src/production_reachability_endpoint_lifecycle.rs
          HELPER: .github/workflows/phase-152-c03e-px-transient-guarded-one-path-materializer.yml
          BRANCH: phase-152-c03e-px-production-reachability-endpoint-fallible-verifier-time-callback-projection-propagation-source-materialization
        run: |
          set -euo pipefail

          test "$(git merge-base HEAD "$PW_HEAD")" = "$PW_HEAD"
          test "$(git rev-parse "$PW_HEAD:$SOURCE")" = "$EXPECTED_SOURCE_BLOB"
          test "$(git rev-parse "HEAD:$SOURCE")" = "$EXPECTED_SOURCE_BLOB"

          mapfile -t pre_paths < <(git diff --name-only "$PW_HEAD"...HEAD)
          printf 'PX pre-source paths:\n%s\n' "${pre_paths[@]}"
          test "${#pre_paths[@]}" -eq 1
          test "${pre_paths[0]}" = "$HELPER"

          test "$(grep -cF 'drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle_with_completion_projection' "$SOURCE")" -eq 0
          test "$(grep -cF 'RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection' "$SOURCE")" -eq 0
          echo 'PX guards: PASS'

          python3 - <<'PY'
          from pathlib import Path

          source = Path("crates/prw-agent/src/production_reachability_endpoint_lifecycle.rs")
          text = source.read_text()

          import_anchor = """        RemoteSessionRealAdmissionError, RemoteSessionRealAdmissionTiming,\n        RemoteSessionRegisteredWorkerCompletion, RemoteSessionRepeatedAdmissionFailure,\n        RemoteSessionRequesterAwareEndpointLifecycleCompletionProjection,\n        SharedCurrentCapabilityAuthority, SharedRequesterRendezvousAuthority,\n"""
          import_replacement = """        RemoteSessionRealAdmissionError, RemoteSessionRealAdmissionTiming,\n        RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection,\n        RemoteSessionRegisteredWorkerCompletion, RemoteSessionRepeatedAdmissionFailure,\n        RemoteSessionRequesterAwareEndpointLifecycleCompletionProjection,\n        SharedCurrentCapabilityAuthority, SharedRequesterRendezvousAuthority,\n"""
          if text.count(import_anchor) != 1:
              raise SystemExit("expected import anchor exactly once")
          text = text.replace(import_anchor, import_replacement, 1)

          impl_close_anchor = """        })\n    }\n}\n\n/// Recoverable production endpoint-startup failure retaining complete pre-bind runtime custody.\n"""
          method = """        })\n    }\n\n    /// Drives the fallible verifier-time endpoint completion projection while retaining reachability custody.\n    ///\n    /// This dormant crate-internal sibling consumes the production wrapper once, retains the\n    /// distinct durable production reachability owner for the complete lower C03e-PV drive, and\n    /// forwards every existing non-custody lifecycle input unchanged. Completion projection remains\n    /// owned entirely by the C03e-PV raw endpoint adapter.\n    ///\n    /// No provider sampling, callback remapping, higher-owner caller migration, retry, endpoint\n    /// rebind, readiness publication, requester/durable fusion, or executable activation occurs here.\n    ///\n    /// # Errors\n    ///\n    /// Returns the existing persistent-collection configuration error unchanged.\n    #[allow(\n        dead_code,\n        reason = \"C03e-PX materializes the PW-selected dormant production-wrapper propagation before separately gated higher-owner composition\"\n    )]\n    #[expect(\n        clippy::too_many_arguments,\n        reason = \"C03e-PX forwards the exact C03e-PV fallible verifier-time projection inputs through retained production reachability custody\"\n    )]\n    pub(crate) fn drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle_with_completion_projection<\n        P,\n        D,\n        T,\n        F,\n        C,\n        R,\n        E,\n    >(\n        self,\n        max_active_workers: NonZeroUsize,\n        authority: &SharedCurrentCapabilityAuthority<P>,\n        session_authentication: &mut SessionAuthenticationService,\n        expected_requests: mpsc::Receiver<RemoteSessionExpectedDeviceAdmissionRequest<D, T>>,\n        admission_timing: F,\n        on_completion: C,\n        on_rejection: R,\n        on_admission_failure: E,\n    ) -> Result<(), RemoteSessionPersistentCollectionConfigError>\n    where\n        P: PolicyEvaluator + Send + Sync + 'static,\n        D: CapabilityDispatcher + Send + 'static,\n        T: FnMut()\n                -> Result<u64, prw_session::prwa_verifier_source::PrwaVerifierSourceError>\n            + Send\n            + 'static,\n        F: FnMut(&DeviceId) -> RemoteSessionRealAdmissionTiming,\n        C: FnMut(DeviceId, RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection),\n        R: FnMut(RemoteSessionExpectedDeviceAdmissionRejection<D, T>),\n        E: FnMut(RemoteSessionRepeatedAdmissionFailure),\n    {\n        let Self {\n            endpoint,\n            owner_custody,\n        } = self;\n\n        drive_with_retained_custody(endpoint, owner_custody, |endpoint| {\n            endpoint\n                .drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle_with_completion_projection(\n                    max_active_workers,\n                    authority,\n                    session_authentication,\n                    expected_requests,\n                    admission_timing,\n                    on_completion,\n                    on_rejection,\n                    on_admission_failure,\n                )\n        })\n    }\n}\n\n/// Recoverable production endpoint-startup failure retaining complete pre-bind runtime custody.\n"""
          if text.count(impl_close_anchor) != 1:
              raise SystemExit("expected impl-close anchor exactly once")
          text = text.replace(impl_close_anchor, method, 1)
          source.write_text(text)
          PY
          echo 'PX source edit: PASS'

          rustup component add rustfmt --toolchain 1.97.1-x86_64-unknown-linux-gnu
          echo 'PX rustfmt component: PASS'
          cargo fmt --all
          echo 'PX cargo fmt: PASS'
          cargo fmt --all -- --check
          echo 'PX cargo fmt check: PASS'
          git diff --check
          echo 'PX diff check: PASS'

          method_count="$(grep -cF 'drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle_with_completion_projection' "$SOURCE")"
          projection_count="$(grep -cF 'RemoteSessionFallibleVerifierTimeEndpointLifecycleCompletionProjection' "$SOURCE")"
          echo "PX method count: $method_count"
          echo "PX projection symbol count: $projection_count"
          test "$method_count" -eq 1
          test "$projection_count" -eq 2

          rm "$HELPER"

          mapfile -t final_paths < <(git diff --name-only "$PW_HEAD")
          printf 'PX final net paths:\n%s\n' "${final_paths[@]}"
          test "${#final_paths[@]}" -eq 1
          test "${final_paths[0]}" = "$SOURCE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SOURCE" "$HELPER"
          git commit -m "C03e-PX: materialize production reachability fallible verifier-time projection propagation"
          git push origin "HEAD:$BRANCH"
