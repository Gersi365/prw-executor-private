name: Phase 152 C03e-QJ Transient Guarded One-Path Materializer

on:
  push:
    branches:
      - phase-152-c03e-qj-production-expected-device-admission-status-only-dispatcher-factory-custody-source-materialization

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize selected dispatcher factory custody
        shell: bash
        env:
          BASE: 75d2a2a143b363a517edf5c2973c79574eb747a6
          BRANCH: phase-152-c03e-qj-production-expected-device-admission-status-only-dispatcher-factory-custody-source-materialization
          SOURCE: crates/prw-agent/src/linux_bootstrap.rs
          SOURCE_BLOB: 4c6e414e163bcadb5066e575ec418f2e4fe3d8ac
          HELPER: .github/workflows/phase-152-c03e-qj-transient-guarded-one-path-materializer.yml
          BLOCK_B64: 
        run: |
          set -euo pipefail

          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-parse "HEAD:$SOURCE")" = "$SOURCE_BLOB"

          mapfile -t initial_changed < <(git diff --name-only "$BASE"..HEAD)
          test "${#initial_changed[@]}" -eq 1
          test "${initial_changed[0]}" = "$HELPER"

          test "$(grep -c '^struct LinuxAgentProductionRemoteCapabilityDispatcherSource' "$SOURCE" || true)" -eq 0

          printf '%s' "$BLOCK_B64" | base64 --decode > /tmp/qj-block.rs
          test "$(grep -c '^struct LinuxAgentProductionRemoteCapabilityDispatcherSource' /tmp/qj-block.rs)" -eq 1
          test "$(grep -c 'inputs.status_snapshot()' /tmp/qj-block.rs)" -eq 1
          test "$(grep -c 'LinuxAgentProductionRemoteCapabilityDispatcher::new(self.status_snapshot)' /tmp/qj-block.rs)" -eq 1
          test "$(grep -c 'LocalAgentStatusSnapshot::current' /tmp/qj-block.rs || true)" -eq 0
          test "$(grep -E -c 'mpsc::channel|\.send\(|try_send|blocking_send|Arc<|Mutex<|RwLock<|watch::' /tmp/qj-block.rs || true)" -eq 0

          python3 - "$SOURCE" /tmp/qj-block.rs <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          block = Path(sys.argv[2]).read_text(encoding="utf-8")
          text = source.read_text(encoding="utf-8")
          anchor = "/// Dormant owned status-only adapter selected by C03e-NA.\n"

          if text.count(anchor) != 1:
              raise SystemExit("QJ anchor count mismatch")
          if "struct LinuxAgentProductionRemoteCapabilityDispatcherSource" in text:
              raise SystemExit("QJ source already materialized")

          source.write_text(text.replace(anchor, block + anchor, 1), encoding="utf-8")
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

          mapfile -t source_changed < <(git diff --name-only)
          test "${#source_changed[@]}" -eq 1
          test "${source_changed[0]}" = "$SOURCE"

          test "$(grep -c '^struct LinuxAgentProductionRemoteCapabilityDispatcherSource' "$SOURCE")" -eq 1
          test "$(grep -c 'inputs.status_snapshot()' "$SOURCE")" -eq 1

          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"

          git add "$SOURCE"
          git commit -m "C03e-QJ: materialize status-only dispatcher factory custody"

          git rm "$HELPER"
          git commit -m "C03e-QJ: remove transient one-path materializer"

          mapfile -t final_changed < <(git diff --name-only "$BASE"..HEAD)
          test "${#final_changed[@]}" -eq 1
          test "${final_changed[0]}" = "$SOURCE"
          test "$(grep -c '^struct LinuxAgentProductionRemoteCapabilityDispatcherSource' "$SOURCE")" -eq 1
          test "$(grep -c 'LocalAgentStatusSnapshot::current' /tmp/qj-block.rs || true)" -eq 0

          git push origin "HEAD:$BRANCH"
