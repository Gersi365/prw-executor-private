name: Phase 102 Standalone Binary Subprocess Proof A02

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase-102-binary-subprocess-proof-a02.yml"

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record pinned toolchain before proof generation
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Extract and validate standalone binary proof suite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/phase-102-binary-subprocess-proof.yml").read_text()
          start = "          cat > crates/prw-agent/tests/phase_102_binary_bootstrap.rs <<'RS'\n"
          end = "\n          RS\n"
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit("Phase 102 A02 proof payload anchors are not unique")
          payload = workflow.split(start, 1)[1].split(end, 1)[0]
          payload = textwrap.dedent(payload)
          payload = payload.replace(
              "use std::os::unix::fs::{FileTypeExt, PermissionsExt};",
              "use std::os::unix::fs::PermissionsExt;",
              1,
          )
          path = Path("crates/prw-agent/tests/phase_102_binary_bootstrap.rs")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(payload + "\n")
          PY

          cargo fmt --all
          tracked_changed="$(git diff --name-only | sort)"
          untracked="$(git ls-files --others --exclude-standard | sort)"
          test -z "$tracked_changed"
          test "$untracked" = "crates/prw-agent/tests/phase_102_binary_bootstrap.rs"
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked -p prw-agent --test phase_102_binary_bootstrap -- --test-threads=1
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          git diff --check

      - name: Commit validated binary proof and remove temporary workflows
        run: |
          rm .github/workflows/phase-102-binary-subprocess-proof.yml
          rm .github/workflows/phase-102-binary-subprocess-proof-a01.yml
          rm .github/workflows/phase-102-binary-subprocess-proof-a02.yml
          git add crates/prw-agent/tests/phase_102_binary_bootstrap.rs .github/workflows/phase-102-binary-subprocess-proof.yml .github/workflows/phase-102-binary-subprocess-proof-a01.yml .github/workflows/phase-102-binary-subprocess-proof-a02.yml
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git commit -m "Integrate Phase 102 standalone binary subprocess proofs"
          git push
