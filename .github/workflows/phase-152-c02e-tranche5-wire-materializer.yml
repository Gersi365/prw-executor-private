name: PRW Phase 152 C02e Tranche5 Freshness Wire Materializer
on:
  push:
    branches: [phase-152-c02e-dynamic-reachability-design]
    paths: [.github/workflows/phase-152-c02e-tranche5-wire-materializer.yml]
permissions:
  contents: write
concurrency:
  group: prw-c02e-tranche5-wire-materializer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Materialize exact reviewed payload
        shell: bash
        env:
          PAYLOAD_B64: ""
        run: |
          set -euo pipefail
          BRANCH=phase-152-c02e-dynamic-reachability-design
          SELF=.github/workflows/phase-152-c02e-tranche5-wire-materializer.yml
          EXPECTED_SHA=a3e656eb1d740ff38a7c626f865b375ec1df6c33e3ef3e9e5fd1e3b2500f8b88
          TRIGGER=${{ github.sha }}
          REMOTE="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          [[ "${REMOTE}" == "${TRIGGER}" ]]
          printf '%s' "${PAYLOAD_B64}" | base64 -d > "${RUNNER_TEMP}/payload.tar.xz"
          ACTUAL_SHA="$(sha256sum "${RUNNER_TEMP}/payload.tar.xz" | awk '{print $1}')"
          [[ "${ACTUAL_SHA}" == "${EXPECTED_SHA}" ]]
          tar -xJf "${RUNNER_TEMP}/payload.tar.xz" -C .
          git add contracts/DESKTOP_FUNCTIONAL_MANAGEMENT_SLICE_C02E_TRANCHE5_FRESHNESS_TOKEN_WIRE_RESYNCHRONIZATION.md crates/prw-remote-bridge/src/root.rs crates/prw-remote-bridge/src/reachability_freshness_wire.rs crates/prw-remote-bridge/tests/reachability_freshness_wire.rs logs/audits/phase-152-c02e-dynamic-reachability-design/C02E_TRANCHE5_FRESHNESS_TOKEN_WIRE_RESYNCHRONIZATION_AUDIT.md
          printf '%s\n' \
            contracts/DESKTOP_FUNCTIONAL_MANAGEMENT_SLICE_C02E_TRANCHE5_FRESHNESS_TOKEN_WIRE_RESYNCHRONIZATION.md \
            crates/prw-remote-bridge/src/reachability_freshness_wire.rs \
            crates/prw-remote-bridge/src/root.rs \
            crates/prw-remote-bridge/tests/reachability_freshness_wire.rs \
            logs/audits/phase-152-c02e-dynamic-reachability-design/C02E_TRANCHE5_FRESHNESS_TOKEN_WIRE_RESYNCHRONIZATION_AUDIT.md > "${RUNNER_TEMP}/expected"
          git diff --cached --name-only | sort > "${RUNNER_TEMP}/actual"
          diff -u "${RUNNER_TEMP}/expected" "${RUNNER_TEMP}/actual"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm "${SELF}"
          git commit -m 'phase 152 c02e: stage tranche5 freshness wire'
          git push origin "HEAD:${BRANCH}"
