name: Phase 109 A07 Daemon Reload Transaction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-109-a07-daemon-reload-transaction.yml'

permissions:
  contents: read

jobs:
  daemon-reload:
    runs-on: [self-hosted, prw-host]
    timeout-minutes: 5
    steps:
      - name: Execute separately audited user-manager daemon-reload
        shell: bash
        run: |
          set -Eeuo pipefail
          agent='/usr/lib/private-remote-workspace/prw-agent'
          unit='/usr/lib/systemd/user/prw-agent.service'
          expected_agent='8d0fa919676d1d55200801dd979a5463228610ad0f5aea1d2fd8bbded7047fbf'
          expected_unit='24f646dc96777542904cd824f1678e6c32256b64911d4a031c0315d198c0a909'

          echo '=== PRW PHASE 109 USER-MANAGER DAEMON-RELOAD TRANSACTION ==='
          test "$(hostname)" = 'PowerCode'
          test "$(id -un)" = 'gersi365'
          test "$(id -u)" = '1000'
          test "${XDG_RUNTIME_DIR:-}" = '/run/user/1000'
          test -S /run/user/1000/bus

          echo '--- locked payload preflight ---'
          test -f "$agent"
          test ! -L "$agent"
          test -f "$unit"
          test ! -L "$unit"
          test "$(stat -c '%u:%g:%a' "$agent")" = '0:0:755'
          test "$(stat -c '%u:%g:%a' "$unit")" = '0:0:644'
          test "$(sha256sum "$agent" | cut -d' ' -f1)" = "$expected_agent"
          test "$(sha256sum "$unit" | cut -d' ' -f1)" = "$expected_unit"

          before_enabled="$(systemctl --user is-enabled prw-agent.service 2>/dev/null || true)"
          before_active="$(systemctl --user is-active prw-agent.service 2>/dev/null || true)"
          echo "before_enabled=$before_enabled"
          echo "before_active=$before_active"
          test "$before_enabled" = 'disabled'
          test "$before_active" = 'inactive'
          systemctl --user show prw-agent.service -p LoadState -p ActiveState -p SubState -p UnitFileState -p NeedDaemonReload
          loginctl show-user gersi365 -p Linger -p RuntimePath -p State
          test "$(loginctl show-user gersi365 -p Linger --value)" = 'yes'

          echo '--- daemon-reload mutation ---'
          systemctl --user daemon-reload
          echo 'daemon_reload=success'

          echo '--- postconditions ---'
          test "$(sha256sum "$agent" | cut -d' ' -f1)" = "$expected_agent"
          test "$(sha256sum "$unit" | cut -d' ' -f1)" = "$expected_unit"
          after_enabled="$(systemctl --user is-enabled prw-agent.service 2>/dev/null || true)"
          after_active="$(systemctl --user is-active prw-agent.service 2>/dev/null || true)"
          echo "after_enabled=$after_enabled"
          echo "after_active=$after_active"
          test "$after_enabled" = 'disabled'
          test "$after_active" = 'inactive'
          systemctl --user show prw-agent.service -p LoadState -p ActiveState -p SubState -p UnitFileState -p NeedDaemonReload
          systemctl --user cat prw-agent.service
          test "$(loginctl show-user gersi365 -p Linger --value)" = 'yes'
          echo 'linger_unchanged=yes'
          echo 'phase109_daemon_reload=success'
