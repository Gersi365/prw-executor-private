name: Phase 115 Focused PoP Validation

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase-115-focused-pop-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Pin Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
          rustc --version
          cargo --version

      - name: Validate focused PoP state and composition tests
        run: |
          cargo test --locked -p prw-control-plane enrollment_pop
          cargo test --locked -p prw-device-identity --test enrollment_pop

      - name: Validate production signing boundary remains absent
        run: |
          if grep -Eq 'EcdsaKeyPair|SystemRandom|\.sign\(' crates/prw-device-identity/src/lib.rs; then
            echo 'production device identity crate unexpectedly exposes signing implementation' >&2
            exit 1
          fi
          echo 'phase115_production_signing_boundary_absent=PASS'

      - name: Validate Agent provider exclusion
        run: |
          cargo tree --locked -p prw-agent | tee /tmp/agent-tree.txt
          if grep -Eq 'prw-device-identity|aws-lc-rs|aws-lc-sys' /tmp/agent-tree.txt; then
            echo 'prw-agent unexpectedly depends on device identity provider' >&2
            exit 1
          fi
          echo 'phase115_agent_provider_exclusion=PASS'

      - name: Validate Android aarch64 production crate
        run: |
          rustup target add aarch64-linux-android --toolchain 1.97.1
          test -n "${ANDROID_NDK_HOME:-}"
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$toolchain/aarch64-linux-android24-clang"
          test -x "$toolchain/llvm-ar"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          cargo check --locked -p prw-device-identity --tests --target aarch64-linux-android
          echo 'phase115_android_aarch64_check=PASS'

      - name: Record lockfile evidence
        run: sha256sum Cargo.lock
