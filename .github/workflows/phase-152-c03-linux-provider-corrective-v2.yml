name: Phase 152 C03 Linux Provider Corrective V2

on:
  push:
    branches:
      - phase-152-c03-linux-provider-corrected-v2
    paths:
      - '.github/workflows/phase-152-c03-linux-provider-corrective-v2.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-152-c03-linux-provider-corrected-v2
          fetch-depth: 0
      - name: Verify exact baseline
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor b5c3bf5904148f10223a2c2ffdc83b0ac2a3d1b8 HEAD
          git diff --quiet b5c3bf5904148f10223a2c2ffdc83b0ac2a3d1b8 -- crates/prw-agent/src/local_commands/management_linux_backends.rs Cargo.lock crates/prw-agent/Cargo.toml
      - name: Apply diagnosed corrective
        run: |
          set -Eeuo pipefail
          python .github/scripts/phase152_c03_provider_correct.py
          cargo fmt --all
          git restore -- target || true
      - name: Verify scope and commit
        run: |
          set -Eeuo pipefail
          git diff --name-only | sort > /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 1
          grep -qx 'crates/prw-agent/src/local_commands/management_linux_backends.rs' /tmp/changed.txt
          rm .github/workflows/phase-152-c03-linux-provider-corrective-v2.yml
          rm .github/scripts/phase152_c03_provider_correct.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/prw-agent/src/local_commands/management_linux_backends.rs .github/workflows/phase-152-c03-linux-provider-corrective-v2.yml .github/scripts/phase152_c03_provider_correct.py
          git commit -m 'phase 152 c03: correct linux provider lifecycle lint'
          git push origin HEAD:phase-152-c03-linux-provider-corrected-v2
