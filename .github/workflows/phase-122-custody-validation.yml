name: Phase 122 Custody Validation

on:
  push:
    paths:
      - '.github/workflows/phase-122-custody-validation.yml'
      - 'Cargo.toml'
      - 'crates/prw-device-identity-custody/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record exact toolchain
        run: |
          rustc --version
          cargo --version
      - name: Generate deterministic candidate lockfile
        run: |
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          sha256sum Cargo.lock
      - name: Apply and guard mechanical formatting
        run: |
          cargo fmt --all
          changed="$(git diff --name-only -- crates/prw-device-identity-custody/src)"
          test "$changed" = "crates/prw-device-identity-custody/src/lib.rs"
          cargo fmt --all -- --check
      - name: Validate workspace and custody boundary
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          cargo test --locked -p prw-device-identity-custody
          if cargo tree --locked -p prw-agent | grep -E 'prw-device-identity-custody|prw-device-identity-signer|prw-device-identity|aws-lc-rs|aws-lc-sys'; then
            echo 'custody/signer/provider unexpectedly reachable from prw-agent dependency tree' >&2
            exit 1
          fi
          if grep -REn 'XDG_STATE_HOME|device-identity-private-key-v1\.cred|/run/credentials|\.local/state' crates/prw-device-identity-custody/src; then
            echo 'persistent or hardcoded credential fallback path detected in custody adapter' >&2
            exit 1
          fi
          if grep -REn 'pub[[:space:]]+fn[[:space:]]+.*(path|file|bytes)' crates/prw-device-identity-custody/src; then
            echo 'unexpected generic public custody surface detected' >&2
            exit 1
          fi
          test "$(find crates/prw-device-identity-custody/src -type f | wc -l)" -eq 1
      - name: Upload validated Phase 122 source and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: phase122-validated-source-lock
          path: |
            Cargo.lock
            crates/prw-device-identity-custody/src/lib.rs
          if-no-files-found: error
          retention-days: 1
