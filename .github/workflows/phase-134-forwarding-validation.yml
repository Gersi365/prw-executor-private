name: Phase 134 A01 Port Forwarding Foundation Validation

on:
  push:
    paths:
      - '.github/workflows/phase-134-forwarding-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Require Phase 133 authority and Phase 134 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f logs/audits/phase-133-terminal-session-foundation/PRW-PHASE-133-TERMINAL-SESSION-FOUNDATION-VALIDATION.txt
          grep -Fq 'PHASE_133_DONE' \
            logs/audits/phase-133-terminal-session-foundation/PRW-PHASE-133-TERMINAL-SESSION-FOUNDATION-VALIDATION.txt
          test -f contracts/PORT_FORWARDING_FOUNDATION_CONTRACT.md
          grep -Fq 'Status: Phase 134 implementation lock' contracts/PORT_FORWARDING_FOUNDATION_CONTRACT.md
          test -f crates/prw-forwarding/Cargo.toml
          test -f crates/prw-forwarding/src/lib.rs
          echo 'phase134_prerequisites=pass'

      - name: Register crate and apply exact first-run correctives
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          member = '    "crates/prw-forwarding",\n'
          if member not in text:
              needle = '    "crates/prw-terminal",\n'
              if text.count(needle) != 1:
                  raise SystemExit('forwarding workspace insertion point mismatch')
              cargo.write_text(text.replace(needle, needle + member))

          source = Path('crates/prw-forwarding/src/lib.rs')
          text = source.read_text()
          old = '    const fn require_active(&self) -> Result<(), ForwardingError> {'
          new = '    fn require_active(&self) -> Result<(), ForwardingError> {'
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('require_active corrective shape mismatch')

          old = '''        if self.sessions.contains_key(&id) {\n            return Err(ForwardingError::DuplicateSession);\n        }\n        if self.sessions.len() >= MAX_ACTIVE_PORT_FORWARDS {\n            return Err(ForwardingError::SessionCapacity);\n        }\n\n        match self.sessions.entry(id) {\n            Entry::Occupied(_) => Err(ForwardingError::DuplicateSession),\n            Entry::Vacant(entry) => {\n                let handle = self.backend.open(spec).map_err(|_| ForwardingError::Backend)?;'''
          new = '''        let at_capacity = self.sessions.len() >= MAX_ACTIVE_PORT_FORWARDS;\n        match self.sessions.entry(id) {\n            Entry::Occupied(_) => Err(ForwardingError::DuplicateSession),\n            Entry::Vacant(entry) => {\n                if at_capacity {\n                    return Err(ForwardingError::SessionCapacity);\n                }\n                let handle = self.backend.open(spec).map_err(|_| ForwardingError::Backend)?;'''
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('Entry corrective shape mismatch')
          source.write_text(text)
          PY
          git diff --check

      - name: Normalize locked graph
        id: graph
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version
          cargo fmt --all
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo clippy --fix --locked -p prw-forwarding --all-targets --all-features \
            --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
          git restore --worktree --staged -- target/.rustc_info.json 2>/dev/null || true
          mapfile -t changed < <(git diff --name-only -- . ':!target')
          for path in "${changed[@]}"; do
            case "$path" in
              Cargo.toml|Cargo.lock|crates/prw-forwarding/src/lib.rs) ;;
              *) echo "unexpected_phase134_fix_path=$path" >&2; exit 1 ;;
            esac
          done
          git diff --check
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          source_sha=$(sha256sum crates/prw-forwarding/src/lib.rs | cut -d' ' -f1)
          echo "lock_sha=$lock_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "phase134_lock_sha256=$lock_sha"
          echo "phase134_source_sha256=$source_sha"

      - name: Prove forwarding API boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          source='crates/prw-forwarding/src/lib.rs'
          ! grep -Fq 'TcpListener' "$source"
          ! grep -Fq 'TcpStream' "$source"
          ! grep -Fq 'UdpSocket' "$source"
          ! grep -Fq 'SocketAddr' "$source"
          ! grep -Fq 'std::process::Command' "$source"
          ! grep -Fq 'Command::new' "$source"
          ! grep -Fq 'unsafe {' "$source"
          grep -Fq 'MAX_ACTIVE_PORT_FORWARDS: usize = 32' "$source"
          grep -Fq 'pub enum LoopbackFamily' "$source"
          grep -Fq 'pub struct ForwardTarget' "$source"
          grep -Fq 'pub trait PortForwardBackend' "$source"
          echo 'phase134_typed_boundary=pass'

      - name: Run focused Phase 134 gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-forwarding --all-targets --all-features -- -D warnings
          cargo test --locked -p prw-forwarding --all-targets
          echo 'phase134_focused_validation=pass'

      - name: Run full workspace gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          echo 'phase134_workspace_validation=pass'

      - name: Record authoritative Phase 134 report
        shell: bash
        env:
          LOCK_SHA: ${{ steps.graph.outputs.lock_sha }}
          SOURCE_SHA: ${{ steps.graph.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          report_dir='logs/audits/phase-134-port-forwarding-foundation'
          report="$report_dir/PRW-PHASE-134-PORT-FORWARDING-FOUNDATION-VALIDATION.txt"
          mkdir -p "$report_dir"
          cat > "$report" <<EOF
          Private Remote Workspace
          Phase 134 — Port Forwarding Foundation

          STATUS:
          PASS / CONTRACT_LOCKED / TCP_LOOPBACK_ONLY_DOMAIN_IMPLEMENTED / TARGET_AND_SESSION_BOUNDS_VALIDATED / BACKEND_FAILURE_FAIL_CLOSED / FULL_WORKSPACE_VALIDATION_PASS / PRODUCTION_FORWARDING_NOT_ACTIVE

          Repository: Gersi365/prw-executor-private
          Branch: main
          Date: 2026-08-16
          Validation input head: $GITHUB_SHA
          Authoritative validation run: $GITHUB_RUN_ID
          Cargo.lock SHA-256: $LOCK_SHA
          prw-forwarding source SHA-256: $SOURCE_SHA

          CONTRACT
          contracts/PORT_FORWARDING_FOUNDATION_CONTRACT.md

          IMPLEMENTATION
          crates/prw-forwarding

          SECURITY OUTCOME
          Phase 134 represents TCP forwarding only. The bind side is a named LoopbackFamily plus a non-zero TCP port; arbitrary bind addresses, wildcard/public binds and socket-option bags are not representable. Targets are explicit IP addresses plus non-zero TCP ports; unspecified, multicast and IPv4 limited-broadcast targets fail closed, while loopback targets remain valid. No hostname/DNS input exists. One broker tracks at most 32 sessions and duplicate identifiers/capacity fail before backend mutation.

          IDENTITY/LIFECYCLE
          Every forwarding record immutably snapshots WorkspaceId, UserId, DeviceId and authenticated PRW SessionId from a registry-current principal boundary. Backend open failure creates no record. Backend close failure retains a Failed record. Successful close returns Closed and removes the record. Workspace role metadata does not itself grant forwarding capability.

          VALIDATION
          Initial run 31946876275 failed safely before focused tests because Rust 1.97.1 cannot use derived PartialEq inside the const require_active helper. This corrective removes only that invalid const qualifier and normalizes duplicate/capacity selection through HashMap Entry. The authoritative run then passes static no-network/no-shell boundary checks, focused prw-forwarding rustfmt/Clippy -D warnings/all-target tests, and full workspace/all-target rustfmt, Clippy, tests and build under the locked graph.

          DEFERRED
          Real TCP bind/accept/connect, byte pumping, half-close/backpressure, per-connection limits/timeouts, production forwarding capability policy, authenticated remote framing, public/LAN/reverse forwarding, UDP, SOCKS, DNS targets and Android/Desktop forwarding UI remain deferred. Phase 135 owns private remote connectivity/mesh path foundation; Phase 136 owns relay fallback.

          PRODUCTION BOUNDARY
          No listener, socket, firewall rule, router rule, public port, PowerCode forwarding capability, privilege change or user-impacting network state was created or mutated.

          FINAL CLASSIFICATION
          PHASE_134_DONE / NO_PRODUCTION_FORWARDING_SIDE_EFFECT / READY_FOR_PHASE_135_SOURCE_WORK
          EOF
          git diff --check

      - name: Commit validated forwarding graph and report only
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name Gersi365
          git config user.email Gersi365@outlook.com
          git add Cargo.toml Cargo.lock crates/prw-forwarding/src/lib.rs \
            logs/audits/phase-134-port-forwarding-foundation/PRW-PHASE-134-PORT-FORWARDING-FOUNDATION-VALIDATION.txt
          git diff --cached --check
          git commit -m 'phase 134: validate port forwarding foundation'
          git push origin HEAD:main
          echo 'phase134_materialization=pass'
