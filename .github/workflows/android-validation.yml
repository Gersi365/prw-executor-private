# Phase 149 materialized-source validation trigger; workflow semantics unchanged.
# Temporary C03e-BV lockfile materializer is branch-scoped and removed before final compare.
name: PRW Android Validation

on:
  push:
    paths:
      - 'apps/android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/android-validation.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/android-validation.yml'

permissions:
  contents: read

jobs:
  bv_lockfile_materialize:
    if: github.event_name == 'push' && github.ref_name == 'phase-152-c03e-bv-candidate-publication-prwp-prwc-pure-adapter-source-materialization-staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact BV root lockfile edge
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 metadata --no-deps --format-version 1 >/dev/null
          cargo +1.97.1 metadata --locked --no-deps --format-version 1 >/dev/null
          (cd apps/android/native && cargo +1.97.1 metadata --locked --no-deps --format-version 1 >/dev/null)
          if git diff --quiet -- Cargo.lock; then
            echo phase152_c03e_bv_root_lock_already_canonical=pass
            exit 0
          fi
          test "$(git diff --name-only)" = "Cargo.lock"
          test "$(git diff --numstat -- Cargo.lock)" = $'1\t0\tCargo.lock'
          git diff --unified=0 -- Cargo.lock | grep -Fq '+ "prw-control-transport",'
          ! git diff --unified=0 -- Cargo.lock | grep -E '^-[^-]'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Phase 152 C03e-BV: materialize Cargo-generated root lockfile edge"
          git push origin HEAD:"$GITHUB_REF_NAME"

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare exact Android and Rust toolchains
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y protobuf-compiler
          protoc --version
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          rustup component add --toolchain 1.97.1-x86_64-unknown-linux-gnu rustfmt clippy
          rustup target add --toolchain 1.97.1-x86_64-unknown-linux-gnu aarch64-linux-android x86_64-linux-android
          cargo +1.97.1 install --locked cargo-ndk --version 4.1.2
      - name: Validate native adapter
        shell: bash
        run: |
          set -Eeuo pipefail
          cd apps/android/native
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --locked --all-targets
      - name: Validate Android application
        shell: bash
        run: |
          set -Eeuo pipefail
          cd apps/android
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
