# Phase 146 materialized-source validation trigger; workflow semantics unchanged.
name: PRW Android Validation

on:
  push:
    paths:
      - 'apps/android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/android-validation.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/android-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare exact Android and Rust toolchains
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          rustup component add --toolchain 1.97.1-x86_64-unknown-linux-gnu rustfmt clippy
          rustup target add --toolchain 1.97.1-x86_64-unknown-linux-gnu aarch64-linux-android x86_64-linux-android
          cargo +1.97.1 install --locked cargo-ndk --version 4.1.2
      - name: Validate native adapter
        shell: bash
        run: |
          set -Eeuo pipefail
          cd apps/android/native
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --locked --all-targets
      - name: Validate Android application
        shell: bash
        run: |
          set -Eeuo pipefail
          cd apps/android
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
