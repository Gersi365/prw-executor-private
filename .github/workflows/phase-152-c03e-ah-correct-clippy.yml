name: Phase 152 C03e-AH Correct Clippy

on:
  push:
    branches:
      - phase-152-c03e-ah-current-thread-persistent-worker-collection-admission-source-materialization-staging
    paths:
      - .github/workflows/phase-152-c03e-ah-correct-clippy.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-152-c03e-ah-current-thread-persistent-worker-collection-admission-source-materialization-staging
          fetch-depth: 0

      - name: Apply exact Clippy-only corrections
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}")
              path.write_text(text.replace(old, new, 1))

          authenticated = Path("crates/prw-agent/src/remote_session_capability_runtime/authenticated_remote_session_runtime.rs")
          replace_exact(
              authenticated,
              "/// Returns the authenticated logical DeviceId retained by this runtime owner.\n",
              "/// Returns the authenticated logical `DeviceId` retained by this runtime owner.\n",
          )

          executor = Path("crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs")
          replace_exact(
              executor,
              "    fn logical_device_id(&self) -> &DeviceId {\n",
              "    const fn logical_device_id(&self) -> &DeviceId {\n",
          )
          replace_exact(
              executor,
              "    /// One active worker already owns the same authenticated logical DeviceId key.\n",
              "    /// One active worker already owns the same authenticated logical `DeviceId` key.\n",
          )
          replace_exact(
              executor,
              "/// One explicitly reaped persistent-worker completion associated with its logical DeviceId.\n",
              "/// One explicitly reaped persistent-worker completion associated with its logical `DeviceId`.\n",
          )
          replace_exact(
              executor,
              "    /// Returns the authenticated logical DeviceId that keyed the retained worker entry.\n",
              "    /// Returns the authenticated logical `DeviceId` that keyed the retained worker entry.\n",
          )
          replace_exact(
              executor,
              """    /// Returns the existing bounded worker/join terminal result.\n    #[must_use]\n    pub const fn result(\n""",
              """    /// Returns the existing bounded worker/join terminal result.\n    ///\n    /// # Errors\n    ///\n    /// Returns the stored bounded join error when Tokio reported abnormal worker completion.\n    pub const fn result(\n""",
          )
          replace_exact(
              executor,
              "fn validate_persistent_worker_capacity(\n",
              "const fn validate_persistent_worker_capacity(\n",
          )
          replace_exact(
              executor,
              "    /// workers are keyed only by the DeviceId derived from each authenticated runtime owner. The\n",
              "    /// workers are keyed only by the `DeviceId` derived from each authenticated runtime owner. The\n",
          )
          replace_exact(
              executor,
              "    /// Duplicate DeviceId candidates are rejected before worker spawn and returned intact through\n",
              "    /// Duplicate `DeviceId` candidates are rejected before worker spawn and returned intact through\n",
          )
          PY

      - name: Install exact rustfmt
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Canonical format
        shell: bash
        run: cargo +1.97.1 fmt --all

      - name: Verify bounded scope
        shell: bash
        run: |
          git diff --exit-code -- Cargo.lock crates/prw-agent/Cargo.toml crates/prw-remote-bridge/Cargo.toml

      - name: Remove temporary correction workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/phase-152-c03e-ah-correct-clippy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/prw-agent/src/remote_session_capability_runtime/authenticated_remote_session_runtime.rs \
                  crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs
          git commit -m "Phase 152 C03e-AH: satisfy Clippy hygiene"
          git push origin HEAD:phase-152-c03e-ah-current-thread-persistent-worker-collection-admission-source-materialization-staging
