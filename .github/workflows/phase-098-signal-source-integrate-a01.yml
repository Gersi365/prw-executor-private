name: Phase 098 Signal Source Integration A01

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase-098-signal-source-integrate-a01.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Integrate Clippy-corrected Phase 098 signal source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/prw-agent/src/linux_identity.rs")
          text = path.read_text()
          docs_old = "//! shutdown long-running runtime loop. The Agent bootstrap remains inactive;\n//! `main.rs`, OS signals, and systemd still do not start this loop."
          docs_new = "//! shutdown long-running runtime loop. Phase 098 adds a safe thread-affine\n//! SIGTERM/SIGINT `SignalFd` source while preserving `unsafe_code = forbid`. The\n//! Agent bootstrap remains inactive; `main.rs` and systemd still do not start\n//! this runtime."
          if text.count(docs_old) != 1:
              raise SystemExit("Phase 098 A01 signal source documentation anchor mismatch")
          text = text.replace(docs_old, docs_new, 1)

          anchor = "#[allow(\n    dead_code,\n    reason = \"pre-bootstrap Linux production runtime loop is intentionally crate-internal\"\n)]\n#[path = \"linux_production_runtime_loop.rs\"]\npub mod production_runtime_loop;\n"
          insert = anchor + "#[allow(\n    dead_code,\n    reason = \"pre-bootstrap safe Linux termination signal source is intentionally crate-internal\"\n)]\n#[path = \"linux_termination_signal.rs\"]\npub mod termination_signal;\n"
          if text.count(anchor) != 1:
              raise SystemExit("Phase 098 A01 signal source module insertion anchor mismatch")
          path.write_text(text.replace(anchor, insert, 1))
          PY

          cargo fmt --all
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' crates/prw-agent/src/linux_identity.rs crates/prw-agent/src/linux_termination_signal.rs | sort)"
          test "$changed" = "$expected"
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          git diff --check

      - name: Commit integrated source and remove temporary workflows
        run: |
          rm .github/workflows/phase-098-signal-source-integrate.yml
          rm .github/workflows/phase-098-signal-source-integrate-a01.yml
          git add crates/prw-agent/src/linux_identity.rs crates/prw-agent/src/linux_termination_signal.rs .github/workflows/phase-098-signal-source-integrate.yml .github/workflows/phase-098-signal-source-integrate-a01.yml
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git commit -m "Integrate Phase 098 safe termination signal source"
          git push
