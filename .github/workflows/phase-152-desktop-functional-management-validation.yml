name: PRW Phase 152 Desktop Functional Management Validation

on:
  push:
    branches:
      - phase-152-desktop-functional-management
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prw-phase-152-desktop-functional-management-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Phase 152 desktop functional management
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify candidate lineage and changed-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "phase-152-desktop-functional-management"
          BASELINE=3aec5d9307edfa5abe53c4ebe169a2445599a2c0
          C01_SOURCE=daf126a8e77bd6e2fc03179fa167aca028a2e7c5
          git merge-base --is-ancestor "${BASELINE}" HEAD
          git merge-base --is-ancestor "${C01_SOURCE}" HEAD

          mapfile -t changed < <(git diff --name-only "${BASELINE}..HEAD")
          printf 'Phase 152 candidate changed files:\n'
          printf '  %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "${path}" in
              apps/desktop/Cargo.toml|apps/desktop/src/main.rs|apps/desktop/src/management.rs|apps/desktop/src/local_management_ipc.rs|crates/prw-agent/Cargo.toml|crates/prw-agent/src/local_commands.rs|crates/prw-agent/src/local_commands/management_request.rs|crates/prw-remote-bridge/Cargo.toml|crates/prw-remote-bridge/src/lib.rs|crates/prw-remote-bridge/tests/end_to_end.rs|contracts/DESKTOP_FUNCTIONAL_MANAGEMENT_LOCAL_IPC_DEPENDENCY_CORRECTIVE.md|contracts/DESKTOP_FUNCTIONAL_MANAGEMENT_SLICE_C_AUTHORITY_GATE.md|logs/audits/phase-152-desktop-functional-management/c01-dependency-audit.txt|Cargo.lock|.github/workflows/phase-152-desktop-functional-management-validation.yml)
                ;;
              *)
                echo "Unexpected Phase 152 candidate path: ${path}" >&2
                exit 1
                ;;
            esac
          done

          mapfile -t post_c01 < <(git diff --name-only "${C01_SOURCE}..HEAD")
          printf 'Changes after validated C01 source commit:\n'
          printf '  %s\n' "${post_c01[@]}"
          for path in "${post_c01[@]}"; do
            test "${path}" = ".github/workflows/phase-152-desktop-functional-management-validation.yml" || {
              echo "C01 source tree drifted after ${C01_SOURCE}: ${path}" >&2
              exit 1
            }
          done

      - name: Verify committed C01 dependency and policy invariants
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fn 'prw-agent = { path = "../prw-agent" }' crates/prw-remote-bridge/Cargo.toml; then
            echo "C01 must not retain the bridge-to-Agent convenience dependency" >&2
            exit 1
          fi
          grep -Fn 'prw-remote-bridge = { path = "../prw-remote-bridge" }' crates/prw-agent/Cargo.toml
          if grep -En 'LocalAgentCommand|local_agent_command' crates/prw-remote-bridge/src/lib.rs crates/prw-remote-bridge/tests/end_to_end.rs; then
            echo "C01 dependency inversion left a bridge-side Agent command reference" >&2
            exit 1
          fi
          grep -Fn 'BoundedLocalReadPolicy::allow_local_reads()' crates/prw-agent/src/linux_bootstrap.rs
          grep -Fn 'BridgeCommand::decode' crates/prw-agent/src/local_commands/management_request.rs
          grep -Fn 'required_capability()' crates/prw-agent/src/local_commands/management_request.rs
          grep -Fn 'AuthenticatedLocalLinuxConnection' crates/prw-agent/src/local_commands/management_request.rs
          grep -Fn 'PolicyEvaluator' crates/prw-agent/src/local_commands/management_request.rs
          grep -Fn 'pub struct LocalManagementAdmission' crates/prw-agent/src/local_commands/management_request.rs
          echo "Committed C01 dependency inversion and fail-closed policy boundary are present"

      - name: Install locked desktop native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev
          pkg-config --modversion gtk4
          pkg-config --modversion libadwaita-1

      - name: Record Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Verify committed deterministic Cargo lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check

      - name: Run Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace --all-targets

      - name: Build workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --workspace --all-targets

      - name: Confirm Phase 152 production candidate surfaces have no direct host effects
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            apps/desktop/src/management.rs
            apps/desktop/src/local_management_ipc.rs
            crates/prw-agent/src/local_commands/management_request.rs
          )
          forbidden='std::process::Command|Command::new|TcpListener|TcpStream|UdpSocket|UnixListener|UnixStream|std::fs::|File::create|OpenOptions|resolvectl|/etc/resolv.conf|NetworkManager|systemctl|nft|iptables|tun|tap'
          for target in "${targets[@]}"; do
            production=$(mktemp)
            awk '/^#\[cfg\(test\)\]/{exit} {print}' "${target}" > "${production}"
            if grep -En "${forbidden}" "${production}"; then
              echo "Forbidden direct host-effect primitive found in production portion of ${target}" >&2
              rm -f "${production}"
              exit 1
            fi
            rm -f "${production}"
          done
          echo "No direct process/filesystem/socket/DNS/system-service mutation primitive found in Phase 152 production candidate surfaces"

      - name: Confirm C01 stops before provider dispatch or success acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          target=crates/prw-agent/src/local_commands/management_request.rs
          production=$(mktemp)
          awk '/^#\[cfg\(test\)\]/{exit} {print}' "${target}" > "${production}"
          if grep -En 'dispatch\(|provider\.|CapabilityDispatcher|LocalAgentResponseStatus::Ok|LocalIpcMessageKind::Response|ControlMessageKind::Response' "${production}"; then
            echo "C01 must stop at typed policy admission without provider dispatch or success acknowledgement" >&2
            rm -f "${production}"
            exit 1
          fi
          rm -f "${production}"
          echo "C01 remains admission-only; provider dispatch and management success acknowledgement stay gated by C02"

      - name: Confirm validation did not mutate committed source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          echo "Committed C01 source and lockfile remained unchanged throughout validation"
