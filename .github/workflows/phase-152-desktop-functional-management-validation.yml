name: PRW Phase 152 Desktop Functional Management Validation

on:
  push:
    branches:
      - phase-152-desktop-functional-management
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prw-phase-152-desktop-functional-management-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Phase 152 desktop functional management
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify candidate lineage and changed-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "phase-152-desktop-functional-management"
          BASELINE=3aec5d9307edfa5abe53c4ebe169a2445599a2c0
          git merge-base --is-ancestor "${BASELINE}" HEAD
          mapfile -t changed < <(git diff --name-only "${BASELINE}..HEAD")
          printf 'Phase 152 candidate changed files:\n'
          printf '  %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "${path}" in
              apps/desktop/Cargo.toml|apps/desktop/src/main.rs|apps/desktop/src/management.rs|apps/desktop/src/local_management_ipc.rs|crates/prw-agent/src/local_commands.rs|crates/prw-agent/src/local_commands/management_request.rs|contracts/DESKTOP_FUNCTIONAL_MANAGEMENT_LOCAL_IPC_DEPENDENCY_CORRECTIVE.md|contracts/DESKTOP_FUNCTIONAL_MANAGEMENT_SLICE_C_AUTHORITY_GATE.md|Cargo.lock|.github/workflows/phase-152-desktop-functional-management-validation.yml)
                ;;
              *)
                echo "Unexpected Phase 152 candidate path: ${path}" >&2
                exit 1
                ;;
            esac
          done

      - name: Record Slice C dependency and production-policy preconditions
        shell: bash
        run: |
          set -euo pipefail
          echo "Current prw-remote-bridge -> prw-agent edge:"
          grep -Fn 'prw-agent = { path = "../prw-agent" }' crates/prw-remote-bridge/Cargo.toml
          echo "Current bridge references to LocalAgentCommand/local_agent_command:"
          git grep -n -E 'LocalAgentCommand|local_agent_command' -- crates/prw-remote-bridge || true
          echo "Current prw-agent bridge dependency (expected absent before Slice C source mutation):"
          if grep -Fn 'prw-remote-bridge' crates/prw-agent/Cargo.toml; then
            echo "Unexpected pre-lock prw-agent -> prw-remote-bridge dependency" >&2
            exit 1
          fi
          echo "BoundedLocalReadPolicy remains the production bootstrap policy and denies management capabilities:"
          grep -Fn 'BoundedLocalReadPolicy::allow_local_reads()' crates/prw-agent/src/linux_bootstrap.rs
          grep -Fn 'Capability::TerminalOpen' crates/prw-policy/src/lib.rs
          grep -Fn 'Capability::FilesRead' crates/prw-policy/src/lib.rs
          grep -Fn 'Capability::ForwardingCreate' crates/prw-policy/src/lib.rs

      - name: Install locked desktop native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev
          pkg-config --modversion gtk4
          pkg-config --modversion libadwaita-1

      - name: Record Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Materialize deterministic Cargo lock candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          test -f Cargo.lock

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check

      - name: Run Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace --all-targets

      - name: Build workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --workspace --all-targets

      - name: Confirm Phase 152 desktop and Slice B framing have no direct host effects
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            apps/desktop/src/management.rs
            apps/desktop/src/local_management_ipc.rs
            crates/prw-agent/src/local_commands/management_request.rs
          )
          forbidden='std::process::Command|Command::new|TcpListener|TcpStream|UdpSocket|UnixListener|UnixStream|std::fs::|File::create|OpenOptions|resolvectl|/etc/resolv.conf|NetworkManager|systemctl|nft|iptables|tun|tap'
          for target in "${targets[@]}"; do
            if test -f "${target}" && grep -En "${forbidden}" "${target}"; then
              echo "Forbidden direct host-effect primitive found in ${target}" >&2
              exit 1
            fi
          done
          echo "No direct process/filesystem/socket/DNS/system-service mutation primitive found in Phase 152 candidate surfaces"

      - name: Confirm Slice B does not add live provider dispatch
        shell: bash
        run: |
          set -euo pipefail
          target=crates/prw-agent/src/local_commands/management_request.rs
          if test -f "${target}" && grep -En 'dispatch\(|provider\.|PolicyEvaluator|evaluate\(' "${target}"; then
            echo "Slice B management framing must not perform policy/provider dispatch" >&2
            exit 1
          fi
          echo "Slice B Agent module remains framing-only; live policy/provider dispatch stays gated by Slice C"

      - name: Commit validated generated lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches the validated dependency graph"
            exit 0
          fi
          git diff -- Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "phase 152: materialize validated desktop management lockfile"
          git push origin HEAD:phase-152-desktop-functional-management
