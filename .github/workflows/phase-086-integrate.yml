name: Phase 086 Integration

on:
  push:
    paths:
      - '.github/workflows/phase-086-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Integrate Phase 086 deterministically
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/prw-agent/src/linux_identity.rs')
          text = path.read_text()

          if 'pub mod bounded_scheduler_cycle;' in text:
              raise SystemExit('Phase 086 module is already integrated; refusing duplicate patch')

          old_doc = '''//! cancellation authority, and Phase 084 composes one capacity-gated scheduling
//! transaction. The Agent bootstrap remains inactive and no accept loop is enabled.
'''
          new_doc = '''//! cancellation authority, Phase 084 composes one capacity-gated scheduling
//! transaction, and Phase 086 adds a finite shutdown-gated scheduling cycle. The
//! Agent bootstrap remains inactive and no long-running accept loop is enabled.
'''
          if text.count(old_doc) != 1:
              raise SystemExit('Phase 086 expected doc marker mismatch')
          text = text.replace(old_doc, new_doc)

          marker = '''#[allow(
    dead_code,
    reason = "pre-listen bound Linux Agent socket is intentionally crate-internal"
)]
#[path = "linux_agent_bound_socket.rs"]
pub mod bound_socket;
'''
          insertion = '''#[allow(
    dead_code,
    reason = "pre-runtime bounded Linux scheduling cycle is intentionally crate-internal"
)]
#[path = "linux_bounded_scheduler_cycle.rs"]
pub mod bounded_scheduler_cycle;
''' + marker
          if text.count(marker) != 1:
              raise SystemExit('Phase 086 expected module marker mismatch')
          text = text.replace(marker, insertion)
          path.write_text(text)
          PY

          cargo fmt --all
          rm .github/workflows/phase-086-integrate.yml

      - name: Commit deterministic integration and self-delete
        shell: bash
        run: |
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          git add crates/prw-agent/src/linux_identity.rs .github/workflows/phase-086-integrate.yml
          git diff --cached --check
          git commit -m 'Integrate Phase 086 bounded scheduling cycle'
          git push origin HEAD:main
