          grep -Fq 'UploadPlan::new' "$rust"
          grep -Fq 'Capability::FilesRead' crates/prw-remote-bridge/src/lib.rs
          grep -Fq 'Capability::FilesWrite' crates/prw-remote-bridge/src/lib.rs
          ! grep -R -E 'runCommand|ProcessBuilder|Runtime\.getRuntime|\.exec\(' apps/android/app/src/main/kotlin apps/android/native/src/files.rs
          ! grep -R -E '(^|[^A-Za-z])(rm|scp|sftp|cp|mv)[[:space:]]' apps/android/app/src/main/kotlin/com/privateworkspace/prw/RemoteFiles.kt
          ! grep -E 'TcpStream|UdpSocket|std::net::|quinn::Endpoint' "$rust"
          ! grep -R -E 'https?://|wss?://' apps/android/app/src/main/kotlin/com/privateworkspace/prw/RemoteFiles.kt apps/android/native/src/files.rs
          git diff --exit-code -- apps/android/app/build.gradle.kts
          test -f "$RUNNER_TEMP/phase148-added-registry-packages.txt"
          echo phase148_security=pass

      - name: Revalidate root Rust workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          echo phase148_root=pass

      - name: Write authoritative Phase 148 validation report
        shell: bash
        run: |
          set -Eeuo pipefail
          report_dir=logs/audits/phase-148-android-remote-files-transfers
          report="$report_dir/PRW-PHASE-148-ANDROID-REMOTE-FILES-TRANSFERS-VALIDATION.txt"
          mkdir -p "$report_dir"
          native_lock_sha=$(sha256sum apps/android/native/Cargo.lock | cut -d' ' -f1)
          files_rust_sha=$(sha256sum apps/android/native/src/files.rs | cut -d' ' -f1)
          files_kotlin_sha=$(sha256sum apps/android/app/src/main/kotlin/com/privateworkspace/prw/RemoteFiles.kt | cut -d' ' -f1)
          apk_sha=$(cat "$RUNNER_TEMP/phase148-apk-sha.txt")
          added_packages=$(tr '\n' ',' < "$RUNNER_TEMP/phase148-added-registry-packages.txt" | sed 's/,$//')
          if [ -z "$added_packages" ]; then added_packages=NONE; fi
          printf '%s\n' \
            'Private Remote Workspace' \
            'Phase 148 — Android Remote Files and Transfers' \
            '' \
            'STATUS:' \
            'PASS / ANDROID_TYPED_REMOTE_FILE_BROWSER / RESUMABLE_UPLOAD_DOWNLOAD_UX / EXISTING_REMOTE_PATH_TRANSFER_AND_PRWC_AUTHORITIES_REUSED / ACKNOWLEDGED_PROGRESS_ONLY / NO_TERMINAL_AS_FILESYSTEM_API / ARM64_X86_64_NATIVE_PASS / ANDROID_UNIT_LINT_APK_PASS / ROOT_RUST_PASS / NO_PRODUCTION_SIDE_EFFECT' \
            '' \
            'Repository: Gersi365/prw-executor-private' \
            'Branch: main' \
            'Date: 2026-08-16' \
            "Validation source head: $GITHUB_SHA" \
            "Authoritative validation run: $GITHUB_RUN_ID" \
            "Native Cargo.lock SHA-256: $native_lock_sha" \
            "File Rust adapter SHA-256: $files_rust_sha" \
            "RemoteFiles Kotlin SHA-256: $files_kotlin_sha" \
            "Validated debug APK SHA-256: $apk_sha" \
            "New native-lock registry packages relative to Phase147: $added_packages" \
            '' \
            'CONTRACT: contracts/ANDROID_REMOTE_FILES_TRANSFERS_CONTRACT.md' \
            'PATHS: native adapter delegates relative path validation to existing RemotePath::parse.' \
            'TRANSFERS: native adapter delegates TransferId parsing, UploadPlan validation and PRWC encoding to existing Rust authorities.' \
            'PROGRESS: browser entries and upload/download acknowledged bytes change only from explicit disposable authoritative callbacks; request emission does not fabricate progress.' \
            'BOUNDS: routed chunks/read requests are capped at the narrower Phase143 60000-byte bridge bound; transfer total remains bounded by the existing 1 GiB plan authority.' \
            'INTEGRITY: upload plan carries exact SHA-256; finalize completion is not claimed until authoritative success.' \
            'FILESYSTEM API: no terminal/shell command path is used for browse/upload/download.' \
            'DEPENDENCIES: no Android dependency added; native adds only internal prw-file-service and prw-file-transfer path dependencies.' \
            'PRODUCTION BOUNDARY: no production file endpoint, Android arbitrary-storage write, Agent filesystem dispatch, overwrite/delete/move/rename, release signing/distribution, listener/relay/TUN/TAP/route/firewall/NAT/router/DNS mutation, or Agent replacement/restart.' \
            '' \
            'INTERIM CLASSIFICATION: PHASE_148_FUNCTIONALLY_VALIDATED / MATERIALIZATION_PENDING / NO_PRODUCTION_SIDE_EFFECT / PERMANENT_ANDROID_CI_PENDING_AFTER_MATERIALIZATION' \
            > "$report"
          echo phase148_report=pass

      - name: Stage only validated Phase 148 source and evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          report=logs/audits/phase-148-android-remote-files-transfers/PRW-PHASE-148-ANDROID-REMOTE-FILES-TRANSFERS-VALIDATION.txt
          git diff --check -- apps/android "$report"
          git add \
            apps/android/README.md \
            apps/android/app/src/main/kotlin/com/privateworkspace/prw/MainActivity.kt \
            apps/android/app/src/main/kotlin/com/privateworkspace/prw/MainViewModel.kt \
            apps/android/app/src/main/kotlin/com/privateworkspace/prw/NativeBridge.kt \
            apps/android/app/src/main/kotlin/com/privateworkspace/prw/RemoteFiles.kt \
            apps/android/app/src/test/kotlin/com/privateworkspace/prw/RemoteFilesControllerTest.kt \
            apps/android/native/Cargo.toml \
            apps/android/native/Cargo.lock \
            apps/android/native/src/lib.rs \
            apps/android/native/src/files.rs \
            "$report"
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          if printf '%s\n' "$staged" | grep -E '(^|/)(build|target|\.gradle)/'; then
            echo phase148_generated_output_staged >&2
            exit 1
          fi
          ! printf '%s\n' "$staged" | grep -Fxq 'apps/android/app/build.gradle.kts'
          grep -Fxq 'apps/android/native/src/files.rs' <<< "$staged"
          grep -Fxq 'apps/android/app/src/main/kotlin/com/privateworkspace/prw/RemoteFiles.kt' <<< "$staged"
          grep -Fxq "$report" <<< "$staged"
          echo phase148_staging=pass

      - name: Commit and push validated Phase 148 source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name Gersi365
          git config user.email Gersi365@outlook.com
          git commit -m 'phase 148: validate Android remote files and transfers'
          git push origin HEAD:main
          echo phase148_materialization=pass
