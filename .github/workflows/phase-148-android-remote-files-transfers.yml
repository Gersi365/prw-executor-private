name: Phase 148 Android Remote Files and Transfers

on:
  push:
    paths:
      - '.github/workflows/phase-148-android-remote-files-transfers.yml'

permissions:
  contents: write

jobs:
  validate-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4

      - name: Prove Phase 148 baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          report=logs/audits/phase-147-android-remote-terminal-ux/PRW-PHASE-147-ANDROID-REMOTE-TERMINAL-UX-VALIDATION.txt
          test -f "$report"
          grep -Fq 'PERMANENT_ANDROID_CI_SUCCESS' "$report"
          grep -Fq 'READY_FOR_PHASE_148' "$report"
          test -f contracts/ANDROID_REMOTE_FILES_TRANSFERS_CONTRACT.md
          test -f contracts/REMOTE_FILE_MANAGEMENT_CONTRACT.md
          test -f contracts/FILE_TRANSFER_HARDENING_CONTRACT.md
          test -f apps/android/native/src/terminal.rs
          grep -Fq 'prw-remote-bridge' apps/android/native/Cargo.toml
          ! grep -Fq 'prw-file-service = ' apps/android/native/Cargo.toml
          ! grep -Fq 'prw-file-transfer = ' apps/android/native/Cargo.toml
          cp apps/android/native/Cargo.lock "$RUNNER_TEMP/phase148-native-lock-before"
          echo phase148_baseline=pass

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Prepare exact validated Android and Rust toolchains
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          rustup component add --toolchain 1.97.1-x86_64-unknown-linux-gnu rustfmt clippy
          rustup target add --toolchain 1.97.1-x86_64-unknown-linux-gnu aarch64-linux-android x86_64-linux-android
          cargo +1.97.1 install --locked cargo-ndk --version 4.1.2
          cargo +1.97.1 ndk --version | grep -Fq 'cargo-ndk 4.1.2'
          echo phase148_toolchain=pass

      - name: Materialize Phase 148 candidate source in runner
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('apps/android/native/Cargo.toml')
          text = cargo.read_text()
          marker = 'prw-remote-bridge = { path = "../../../crates/prw-remote-bridge" }\n'
          replacement = (
              marker
              + 'prw-file-service = { path = "../../../crates/prw-file-service" }\n'
              + 'prw-file-transfer = { path = "../../../crates/prw-file-transfer" }\n'
          )
          if text.count(marker) != 1:
              raise SystemExit('Phase 148 native dependency insertion boundary mismatch')
          cargo.write_text(text.replace(marker, replacement, 1))

          lib = Path('apps/android/native/src/lib.rs')
          text = lib.read_text()
          marker = 'mod terminal;\n'
          if text.count(marker) != 1 or 'mod files;' in text:
              raise SystemExit('Phase 148 native module insertion boundary mismatch')
          lib.write_text(text.replace(marker, marker + 'mod files;\n', 1))
          PY

          cat > apps/android/native/src/files.rs <<'EOF'
          use jni::{
              EnvUnowned,
              errors::ThrowRuntimeExAndDefault,
              objects::{JByteArray, JClass},
              sys::{jboolean, jint, jlong},
          };
          use prw_file_service::RemotePath;
          use prw_file_transfer::{MAX_TRANSFER_BYTES, TransferId, UploadPlan};
          use prw_remote_bridge::{BridgeCommand, MAX_BRIDGE_INLINE_BYTES};

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          enum FileAdapterError {
              Path,
              TransferId,
              Digest,
              Total,
              Offset,
              Chunk,
              Read,
              Utf8,
              Bridge,
          }

          fn utf8(input: &[u8]) -> Result<&str, FileAdapterError> {
              std::str::from_utf8(input).map_err(|_| FileAdapterError::Utf8)
          }

          fn path(input: &[u8]) -> Result<RemotePath, FileAdapterError> {
              RemotePath::parse(utf8(input)?).map_err(|_| FileAdapterError::Path)
          }

          fn transfer_id(input: &[u8]) -> Result<TransferId, FileAdapterError> {
              TransferId::from_hex(utf8(input)?).map_err(|_| FileAdapterError::TransferId)
          }

          fn digest(input: &[u8]) -> Result<[u8; 32], FileAdapterError> {
              input.try_into().map_err(|_| FileAdapterError::Digest)
          }

          fn nonnegative_u64(value: i64, error: FileAdapterError) -> Result<u64, FileAdapterError> {
              u64::try_from(value).map_err(|_| error)
          }

          fn bridge_payload(command: &BridgeCommand) -> Result<Vec<u8>, FileAdapterError> {
              command.encode().map_err(|_| FileAdapterError::Bridge)
          }

          fn upload_plan(
              transfer: &[u8],
              destination: &[u8],
              total_bytes: i64,
              sha256: &[u8],
          ) -> Result<UploadPlan, FileAdapterError> {
              let total_bytes = nonnegative_u64(total_bytes, FileAdapterError::Total)?;
              if total_bytes > MAX_TRANSFER_BYTES {
                  return Err(FileAdapterError::Total);
              }
              UploadPlan::new(
                  transfer_id(transfer)?,
                  path(destination)?,
                  total_bytes,
                  digest(sha256)?,
              )
              .map_err(|_| FileAdapterError::Total)
          }

          fn encode_file_list(remote_path: &[u8]) -> Result<Vec<u8>, FileAdapterError> {
              bridge_payload(&BridgeCommand::FileList(path(remote_path)?))
          }

          fn encode_file_stat(remote_path: &[u8]) -> Result<Vec<u8>, FileAdapterError> {
              bridge_payload(&BridgeCommand::FileStat(path(remote_path)?))
          }

          fn encode_upload_begin(
              transfer: &[u8],
              destination: &[u8],
              total_bytes: i64,
              sha256: &[u8],
          ) -> Result<Vec<u8>, FileAdapterError> {
              bridge_payload(&BridgeCommand::UploadBegin(upload_plan(
                  transfer,
                  destination,
                  total_bytes,
                  sha256,
              )?))
          }

          fn encode_upload_resume(
              transfer: &[u8],
              destination: &[u8],
              total_bytes: i64,
              sha256: &[u8],
          ) -> Result<Vec<u8>, FileAdapterError> {
              bridge_payload(&BridgeCommand::UploadResume(upload_plan(
                  transfer,
                  destination,
                  total_bytes,
                  sha256,
              )?))
          }

          fn encode_upload_chunk(
              transfer: &[u8],
              offset: i64,
              chunk: &[u8],
          ) -> Result<Vec<u8>, FileAdapterError> {
              if chunk.is_empty() || chunk.len() > MAX_BRIDGE_INLINE_BYTES {
                  return Err(FileAdapterError::Chunk);
              }
              bridge_payload(&BridgeCommand::UploadChunk {
                  transfer_id: transfer_id(transfer)?,
                  offset: nonnegative_u64(offset, FileAdapterError::Offset)?,
                  chunk: chunk.to_vec(),
              })
          }

          fn encode_upload_finalize(transfer: &[u8]) -> Result<Vec<u8>, FileAdapterError> {
              bridge_payload(&BridgeCommand::UploadFinalize(transfer_id(transfer)?))
          }

          fn encode_upload_abort(transfer: &[u8]) -> Result<Vec<u8>, FileAdapterError> {
              bridge_payload(&BridgeCommand::UploadAbort(transfer_id(transfer)?))
          }

          fn encode_download_chunk(
              remote_path: &[u8],
              offset: i64,
              requested_len: i32,
          ) -> Result<Vec<u8>, FileAdapterError> {
              let requested_len = usize::try_from(requested_len).map_err(|_| FileAdapterError::Read)?;
              if requested_len == 0 || requested_len > MAX_BRIDGE_INLINE_BYTES {
                  return Err(FileAdapterError::Read);
              }
              bridge_payload(&BridgeCommand::DownloadChunk {
                  path: path(remote_path)?,
                  offset: nonnegative_u64(offset, FileAdapterError::Offset)?,
                  requested_len,
              })
          }

          fn is_file_transfer_payload(payload: &[u8]) -> bool {
              matches!(
                  BridgeCommand::decode(payload),
                  Ok(
                      BridgeCommand::FileList(_)
                          | BridgeCommand::FileStat(_)
                          | BridgeCommand::UploadBegin(_)
                          | BridgeCommand::UploadResume(_)
                          | BridgeCommand::UploadChunk { .. }
                          | BridgeCommand::UploadFinalize(_)
                          | BridgeCommand::UploadAbort(_)
                          | BridgeCommand::DownloadChunk { .. }
                  )
              )
          }

          fn byte_array<'caller>(
              unowned_env: &mut EnvUnowned<'caller>,
              operation: impl FnOnce() -> Vec<u8>,
          ) -> JByteArray<'caller> {
              unowned_env
                  .with_env(|env| env.byte_array_from_slice(&operation()))
                  .resolve::<ThrowRuntimeExAndDefault>()
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_fileListPayload<'caller>(
              mut unowned_env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              remote_path: JByteArray<'caller>,
          ) -> JByteArray<'caller> {
              unowned_env
                  .with_env(|env| -> jni::errors::Result<_> {
                      let remote_path = env.convert_byte_array(&remote_path)?;
                      let payload = encode_file_list(&remote_path).unwrap_or_default();
                      env.byte_array_from_slice(&payload)
                  })
                  .resolve::<ThrowRuntimeExAndDefault>()
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_fileStatPayload<'caller>(
              mut unowned_env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              remote_path: JByteArray<'caller>,
          ) -> JByteArray<'caller> {
              unowned_env
                  .with_env(|env| -> jni::errors::Result<_> {
                      let remote_path = env.convert_byte_array(&remote_path)?;
                      let payload = encode_file_stat(&remote_path).unwrap_or_default();
                      env.byte_array_from_slice(&payload)
                  })
                  .resolve::<ThrowRuntimeExAndDefault>()
          }

          fn jni_upload_plan<'caller>(
              unowned_env: &mut EnvUnowned<'caller>,
              transfer: &JByteArray<'caller>,
              destination: &JByteArray<'caller>,
              total_bytes: jlong,
              sha256: &JByteArray<'caller>,
              resume: bool,
          ) -> JByteArray<'caller> {
              unowned_env
                  .with_env(|env| -> jni::errors::Result<_> {
                      let transfer = env.convert_byte_array(transfer)?;
                      let destination = env.convert_byte_array(destination)?;
                      let sha256 = env.convert_byte_array(sha256)?;
                      let payload = if resume {
                          encode_upload_resume(&transfer, &destination, total_bytes, &sha256)
                      } else {
                          encode_upload_begin(&transfer, &destination, total_bytes, &sha256)
                      }
                      .unwrap_or_default();
                      env.byte_array_from_slice(&payload)
                  })
                  .resolve::<ThrowRuntimeExAndDefault>()
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_uploadBeginPayload<'caller>(
              mut env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              transfer: JByteArray<'caller>,
              destination: JByteArray<'caller>,
              total_bytes: jlong,
              sha256: JByteArray<'caller>,
          ) -> JByteArray<'caller> {
              jni_upload_plan(&mut env, &transfer, &destination, total_bytes, &sha256, false)
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_uploadResumePayload<'caller>(
              mut env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              transfer: JByteArray<'caller>,
              destination: JByteArray<'caller>,
              total_bytes: jlong,
              sha256: JByteArray<'caller>,
          ) -> JByteArray<'caller> {
              jni_upload_plan(&mut env, &transfer, &destination, total_bytes, &sha256, true)
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_uploadChunkPayload<'caller>(
              mut unowned_env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              transfer: JByteArray<'caller>,
              offset: jlong,
              chunk: JByteArray<'caller>,
          ) -> JByteArray<'caller> {
              unowned_env
                  .with_env(|env| -> jni::errors::Result<_> {
                      let transfer = env.convert_byte_array(&transfer)?;
                      let chunk = env.convert_byte_array(&chunk)?;
                      let payload = encode_upload_chunk(&transfer, offset, &chunk).unwrap_or_default();
                      env.byte_array_from_slice(&payload)
                  })
                  .resolve::<ThrowRuntimeExAndDefault>()
          }

          fn jni_transfer_only<'caller>(
              unowned_env: &mut EnvUnowned<'caller>,
              transfer: &JByteArray<'caller>,
              finalize: bool,
          ) -> JByteArray<'caller> {
              unowned_env
                  .with_env(|env| -> jni::errors::Result<_> {
                      let transfer = env.convert_byte_array(transfer)?;
                      let payload = if finalize {
                          encode_upload_finalize(&transfer)
                      } else {
                          encode_upload_abort(&transfer)
                      }
                      .unwrap_or_default();
                      env.byte_array_from_slice(&payload)
                  })
                  .resolve::<ThrowRuntimeExAndDefault>()
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_uploadFinalizePayload<'caller>(
              mut env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              transfer: JByteArray<'caller>,
          ) -> JByteArray<'caller> {
              jni_transfer_only(&mut env, &transfer, true)
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_uploadAbortPayload<'caller>(
              mut env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              transfer: JByteArray<'caller>,
          ) -> JByteArray<'caller> {
              jni_transfer_only(&mut env, &transfer, false)
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_downloadChunkPayload<'caller>(
              mut unowned_env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              remote_path: JByteArray<'caller>,
              offset: jlong,
              requested_len: jint,
          ) -> JByteArray<'caller> {
              unowned_env
                  .with_env(|env| -> jni::errors::Result<_> {
                      let remote_path = env.convert_byte_array(&remote_path)?;
                      let payload = encode_download_chunk(&remote_path, offset, requested_len).unwrap_or_default();
                      env.byte_array_from_slice(&payload)
                  })
                  .resolve::<ThrowRuntimeExAndDefault>()
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_isFileTransferPayload<'caller>(
              mut unowned_env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              payload: JByteArray<'caller>,
          ) -> jboolean {
              unowned_env
                  .with_env(|env| -> jni::errors::Result<_> {
                      let payload = env.convert_byte_array(&payload)?;
                      Ok(is_file_transfer_payload(&payload))
                  })
                  .resolve::<ThrowRuntimeExAndDefault>()
          }

          #[cfg(test)]
          mod tests {
              use prw_file_service::RemotePath;
              use prw_file_transfer::{MAX_TRANSFER_BYTES, TransferId, UploadPlan};
              use prw_remote_bridge::{BridgeCommand, MAX_BRIDGE_INLINE_BYTES};

              use super::*;

              const ID: &[u8] = b"abababababababababababababababab";

              fn expected_id() -> TransferId {
                  TransferId::from_hex("abababababababababababababababab").expect("transfer id")
              }

              #[test]
              fn all_phase148_payloads_round_trip_through_existing_bridge_codec() {
                  let root = encode_file_list(b"").expect("list root");
                  assert_eq!(
                      BridgeCommand::decode(&root).expect("decode list"),
                      BridgeCommand::FileList(RemotePath::parse("").expect("root path"))
                  );

                  let stat = encode_file_stat(b"docs/readme.txt").expect("stat");
                  assert_eq!(
                      BridgeCommand::decode(&stat).expect("decode stat"),
                      BridgeCommand::FileStat(RemotePath::parse("docs/readme.txt").expect("path"))
                  );

                  let sha = [7_u8; 32];
                  let plan = UploadPlan::new(
                      expected_id(),
                      RemotePath::parse("uploads/demo.bin").expect("destination"),
                      120_000,
                      sha,
                  )
                  .expect("plan");
                  let begin = encode_upload_begin(ID, b"uploads/demo.bin", 120_000, &sha).expect("begin");
                  assert_eq!(BridgeCommand::decode(&begin).expect("decode begin"), BridgeCommand::UploadBegin(plan.clone()));
                  let resume = encode_upload_resume(ID, b"uploads/demo.bin", 120_000, &sha).expect("resume");
                  assert_eq!(BridgeCommand::decode(&resume).expect("decode resume"), BridgeCommand::UploadResume(plan));

                  let chunk = encode_upload_chunk(ID, 60_000, b"abc").expect("chunk");
                  assert_eq!(
                      BridgeCommand::decode(&chunk).expect("decode chunk"),
                      BridgeCommand::UploadChunk { transfer_id: expected_id(), offset: 60_000, chunk: b"abc".to_vec() }
                  );

                  let finalize = encode_upload_finalize(ID).expect("finalize");
                  assert_eq!(BridgeCommand::decode(&finalize).expect("decode finalize"), BridgeCommand::UploadFinalize(expected_id()));
                  let abort = encode_upload_abort(ID).expect("abort");
                  assert_eq!(BridgeCommand::decode(&abort).expect("decode abort"), BridgeCommand::UploadAbort(expected_id()));

                  let download = encode_download_chunk(b"downloads/demo.bin", 60_000, 4096).expect("download");
                  assert_eq!(
                      BridgeCommand::decode(&download).expect("decode download"),
                      BridgeCommand::DownloadChunk { path: RemotePath::parse("downloads/demo.bin").expect("download path"), offset: 60_000, requested_len: 4096 }
                  );

                  for payload in [&root, &stat, &begin, &resume, &chunk, &finalize, &abort, &download] {
                      assert!(is_file_transfer_payload(payload));
                  }
              }

              #[test]
              fn path_and_transfer_bounds_fail_closed() {
                  assert_eq!(encode_file_list(b"/absolute"), Err(FileAdapterError::Path));
                  assert_eq!(encode_file_list(b"../escape"), Err(FileAdapterError::Path));
                  assert_eq!(encode_upload_finalize(b"ABABABABABABABABABABABABABABABAB"), Err(FileAdapterError::TransferId));
                  assert_eq!(encode_upload_begin(ID, b"file", 1, &[0; 31]), Err(FileAdapterError::Digest));
                  assert_eq!(encode_upload_begin(ID, b"file", -1, &[0; 32]), Err(FileAdapterError::Total));
                  assert_eq!(encode_upload_begin(ID, b"file", i64::try_from(MAX_TRANSFER_BYTES + 1).expect("bound"), &[0; 32]), Err(FileAdapterError::Total));
                  assert_eq!(encode_upload_chunk(ID, 0, b""), Err(FileAdapterError::Chunk));
                  assert_eq!(encode_upload_chunk(ID, 0, &vec![0; MAX_BRIDGE_INLINE_BYTES + 1]), Err(FileAdapterError::Chunk));
                  assert_eq!(encode_upload_chunk(ID, -1, b"a"), Err(FileAdapterError::Offset));
                  assert_eq!(encode_download_chunk(b"file", 0, 0), Err(FileAdapterError::Read));
                  assert_eq!(encode_download_chunk(b"file", 0, i32::try_from(MAX_BRIDGE_INLINE_BYTES + 1).expect("bound")), Err(FileAdapterError::Read));
              }

              #[test]
              fn recognizer_rejects_non_file_bridge_payload() {
                  let status = BridgeCommand::AgentStatus.encode().expect("status");
                  assert!(!is_file_transfer_payload(&status));
                  assert!(!is_file_transfer_payload(b"not-prwc"));
              }
          }
          EOF

          cat > apps/android/app/src/main/kotlin/com/privateworkspace/prw/RemoteFiles.kt <<'EOF'
          package com.privateworkspace.prw

          import java.security.MessageDigest

          internal const val MAX_REMOTE_FILE_CHUNK_BYTES = 60_000
          internal const val MAX_REMOTE_DIRECTORY_ENTRIES = 4_096
          internal const val MAX_REMOTE_ENTRY_NAME_BYTES = 255
          internal const val MAX_REMOTE_TRANSFER_BYTES = 1_073_741_824L
          internal const val MAX_DISPOSABLE_TRANSFER_MEMORY_BYTES = 1_048_576

          internal enum class RemoteEntryTypeView { RegularFile, Directory, SymbolicLink, Other }

          internal data class RemoteDirectoryEntryView(val name: String, val type: RemoteEntryTypeView)

          internal data class BrowserUiState(
              val path: String = "",
              val entries: List<RemoteDirectoryEntryView> = emptyList(),
              val pendingPath: String? = null,
              val lastPayloadBytes: Int = 0,
          )

          internal enum class UploadLifecycleView { Idle, Planning, Ready, Transferring, Finalizing, Completed, Failed, Aborted }

          internal data class UploadUiState(
              val lifecycle: UploadLifecycleView = UploadLifecycleView.Idle,
              val transferId: String? = null,
              val destination: String? = null,
              val totalBytes: Long = 0,
              val acknowledgedBytes: Long = 0,
              val sha256: ByteArray = byteArrayOf(),
              val source: ByteArray = byteArrayOf(),
              val pendingChunkBytes: Int = 0,
              val abortPending: Boolean = false,
              val lastPayloadBytes: Int = 0,
          ) {
              fun progress(): Float = if (totalBytes == 0L) 0f else (acknowledgedBytes.toDouble() / totalBytes.toDouble()).toFloat()
          }

          internal enum class DownloadLifecycleView { Idle, Ready, Transferring, Completed, Failed }

          internal data class DownloadUiState(
              val lifecycle: DownloadLifecycleView = DownloadLifecycleView.Idle,
              val path: String? = null,
              val expectedBytes: Long? = null,
              val acknowledgedBytes: Long = 0,
              val received: ByteArray = byteArrayOf(),
              val pendingRequestBytes: Int = 0,
              val lastPayloadBytes: Int = 0,
          ) {
              fun progress(): Float? = expectedBytes?.let { total ->
                  if (total == 0L) 0f else (acknowledgedBytes.toDouble() / total.toDouble()).toFloat()
              }
          }

          internal data class RemoteFilesUiState(
              val browser: BrowserUiState = BrowserUiState(),
              val upload: UploadUiState = UploadUiState(),
              val download: DownloadUiState = DownloadUiState(),
          )

          internal interface FileCommandEncoder {
              fun list(path: String): ByteArray
              fun stat(path: String): ByteArray
              fun uploadBegin(transferId: String, destination: String, totalBytes: Long, sha256: ByteArray): ByteArray
              fun uploadResume(transferId: String, destination: String, totalBytes: Long, sha256: ByteArray): ByteArray
              fun uploadChunk(transferId: String, offset: Long, chunk: ByteArray): ByteArray
              fun uploadFinalize(transferId: String): ByteArray
              fun uploadAbort(transferId: String): ByteArray
              fun download(path: String, offset: Long, requestedBytes: Int): ByteArray
          }

          internal object NativeFileCommandEncoder : FileCommandEncoder {
              override fun list(path: String) = NativeBridge.fileListPayload(path.encodeToByteArray())
              override fun stat(path: String) = NativeBridge.fileStatPayload(path.encodeToByteArray())
              override fun uploadBegin(transferId: String, destination: String, totalBytes: Long, sha256: ByteArray) =
                  NativeBridge.uploadBeginPayload(transferId.encodeToByteArray(), destination.encodeToByteArray(), totalBytes, sha256)
              override fun uploadResume(transferId: String, destination: String, totalBytes: Long, sha256: ByteArray) =
                  NativeBridge.uploadResumePayload(transferId.encodeToByteArray(), destination.encodeToByteArray(), totalBytes, sha256)
              override fun uploadChunk(transferId: String, offset: Long, chunk: ByteArray) =
                  NativeBridge.uploadChunkPayload(transferId.encodeToByteArray(), offset, chunk)
              override fun uploadFinalize(transferId: String) = NativeBridge.uploadFinalizePayload(transferId.encodeToByteArray())
              override fun uploadAbort(transferId: String) = NativeBridge.uploadAbortPayload(transferId.encodeToByteArray())
              override fun download(path: String, offset: Long, requestedBytes: Int) =
                  NativeBridge.downloadChunkPayload(path.encodeToByteArray(), offset, requestedBytes)
          }

          internal class RemoteFilesController(private val encoder: FileCommandEncoder) {
              private var current = RemoteFilesUiState()
              fun state(): RemoteFilesUiState = current

              fun requestList(path: String): Boolean {
                  val payload = runCatching { encoder.list(path) }.getOrNull() ?: return false
                  if (payload.isEmpty()) return false
                  current = current.copy(browser = current.browser.copy(pendingPath = path, lastPayloadBytes = payload.size))
                  return true
              }

              fun applyAuthoritativeDirectorySnapshot(path: String, entries: List<RemoteDirectoryEntryView>): Boolean {
                  if (current.browser.pendingPath != path || entries.size > MAX_REMOTE_DIRECTORY_ENTRIES) return false
                  if (entries.any { !validEntryName(it.name) }) return false
                  current = current.copy(browser = BrowserUiState(path = path, entries = entries.toList()))
                  return true
              }

              fun prepareUpload(transferId: String, destination: String, source: ByteArray): Boolean {
                  if (!validTransferId(transferId) || source.size > MAX_DISPOSABLE_TRANSFER_MEMORY_BYTES) return false
                  val digest = MessageDigest.getInstance("SHA-256").digest(source)
                  current = current.copy(
                      upload = UploadUiState(
                          lifecycle = UploadLifecycleView.Ready,
                          transferId = transferId,
                          destination = destination,
                          totalBytes = source.size.toLong(),
                          sha256 = digest,
                          source = source.copyOf(),
                      ),
                  )
                  return true
              }

              fun requestUploadBegin(resume: Boolean): Boolean {
                  val upload = current.upload
                  val id = upload.transferId ?: return false
                  val destination = upload.destination ?: return false
                  if (upload.lifecycle !in setOf(UploadLifecycleView.Ready, UploadLifecycleView.Failed)) return false
                  val payload = runCatching {
                      if (resume) encoder.uploadResume(id, destination, upload.totalBytes, upload.sha256)
                      else encoder.uploadBegin(id, destination, upload.totalBytes, upload.sha256)
                  }.getOrNull() ?: return false
                  if (payload.isEmpty()) return false
                  current = current.copy(upload = upload.copy(lifecycle = UploadLifecycleView.Planning, lastPayloadBytes = payload.size))
                  return true
              }

              fun applyAuthoritativeUploadOffset(offset: Long): Boolean {
                  val upload = current.upload
                  if (upload.lifecycle != UploadLifecycleView.Planning || offset !in 0..upload.totalBytes) return false
                  current = current.copy(upload = upload.copy(lifecycle = UploadLifecycleView.Transferring, acknowledgedBytes = offset))
                  return true
              }

              fun sendNextUploadChunk(): Boolean {
                  val upload = current.upload
                  val id = upload.transferId ?: return false
                  if (upload.lifecycle != UploadLifecycleView.Transferring || upload.pendingChunkBytes != 0) return false
                  if (upload.acknowledgedBytes >= upload.totalBytes) return false
                  val start = upload.acknowledgedBytes.toInt()
                  val count = minOf(MAX_REMOTE_FILE_CHUNK_BYTES, upload.source.size - start)
                  val chunk = upload.source.copyOfRange(start, start + count)
                  val payload = runCatching { encoder.uploadChunk(id, upload.acknowledgedBytes, chunk) }.getOrNull() ?: return false
                  if (payload.isEmpty()) return false
                  current = current.copy(upload = upload.copy(pendingChunkBytes = count, lastPayloadBytes = payload.size))
                  return true
              }

              fun applyAuthoritativeUploadChunkOffset(offset: Long): Boolean {
                  val upload = current.upload
                  if (upload.lifecycle != UploadLifecycleView.Transferring || upload.pendingChunkBytes == 0) return false
                  val expected = upload.acknowledgedBytes + upload.pendingChunkBytes
                  if (offset != expected || offset > upload.totalBytes) return false
                  current = current.copy(upload = upload.copy(acknowledgedBytes = offset, pendingChunkBytes = 0))
                  return true
              }

              fun requestUploadFinalize(): Boolean {
                  val upload = current.upload
                  val id = upload.transferId ?: return false
                  if (upload.lifecycle != UploadLifecycleView.Transferring || upload.pendingChunkBytes != 0 || upload.acknowledgedBytes != upload.totalBytes) return false
                  val payload = runCatching { encoder.uploadFinalize(id) }.getOrNull() ?: return false
                  if (payload.isEmpty()) return false
                  current = current.copy(upload = upload.copy(lifecycle = UploadLifecycleView.Finalizing, lastPayloadBytes = payload.size))
                  return true
              }

              fun applyAuthoritativeUploadFinalized(): Boolean {
                  val upload = current.upload
                  if (upload.lifecycle != UploadLifecycleView.Finalizing) return false
                  current = current.copy(upload = upload.copy(lifecycle = UploadLifecycleView.Completed))
                  return true
              }

              fun markUploadFailed(): Boolean {
                  val upload = current.upload
                  if (upload.lifecycle in setOf(UploadLifecycleView.Idle, UploadLifecycleView.Completed, UploadLifecycleView.Aborted)) return false
                  current = current.copy(upload = upload.copy(lifecycle = UploadLifecycleView.Failed, pendingChunkBytes = 0, abortPending = false))
                  return true
              }

              fun requestUploadAbort(): Boolean {
                  val upload = current.upload
                  val id = upload.transferId ?: return false
                  if (upload.lifecycle in setOf(UploadLifecycleView.Idle, UploadLifecycleView.Completed, UploadLifecycleView.Aborted) || upload.abortPending) return false
                  val payload = runCatching { encoder.uploadAbort(id) }.getOrNull() ?: return false
                  if (payload.isEmpty()) return false
                  current = current.copy(upload = upload.copy(abortPending = true, lastPayloadBytes = payload.size))
                  return true
              }

              fun applyAuthoritativeUploadAborted(): Boolean {
                  val upload = current.upload
                  if (!upload.abortPending) return false
                  current = current.copy(upload = upload.copy(lifecycle = UploadLifecycleView.Aborted, abortPending = false, pendingChunkBytes = 0))
                  return true
              }

              fun prepareDownload(path: String, expectedBytes: Long?): Boolean {
                  if (expectedBytes != null && expectedBytes !in 0..MAX_REMOTE_TRANSFER_BYTES) return false
                  current = current.copy(download = DownloadUiState(lifecycle = DownloadLifecycleView.Ready, path = path, expectedBytes = expectedBytes))
                  return true
              }

              fun requestDownloadChunk(requestedBytes: Int = MAX_REMOTE_FILE_CHUNK_BYTES): Boolean {
                  val download = current.download
                  val path = download.path ?: return false
                  if (download.lifecycle !in setOf(DownloadLifecycleView.Ready, DownloadLifecycleView.Transferring) || download.pendingRequestBytes != 0) return false
                  if (requestedBytes !in 1..MAX_REMOTE_FILE_CHUNK_BYTES) return false
                  val payload = runCatching { encoder.download(path, download.acknowledgedBytes, requestedBytes) }.getOrNull() ?: return false
                  if (payload.isEmpty()) return false
                  current = current.copy(download = download.copy(lifecycle = DownloadLifecycleView.Transferring, pendingRequestBytes = requestedBytes, lastPayloadBytes = payload.size))
                  return true
              }

              fun applyAuthoritativeDownloadChunk(chunk: ByteArray): Boolean {
                  val download = current.download
                  if (download.lifecycle != DownloadLifecycleView.Transferring || download.pendingRequestBytes == 0) return false
                  if (chunk.size > download.pendingRequestBytes || chunk.size > MAX_REMOTE_FILE_CHUNK_BYTES) return false
                  if (chunk.isEmpty()) {
                      val complete = download.expectedBytes == null || download.acknowledgedBytes == download.expectedBytes
                      current = current.copy(download = download.copy(lifecycle = if (complete) DownloadLifecycleView.Completed else DownloadLifecycleView.Failed, pendingRequestBytes = 0))
                      return complete
                  }
                  if (download.received.size + chunk.size > MAX_DISPOSABLE_TRANSFER_MEMORY_BYTES) return false
                  val newOffset = download.acknowledgedBytes + chunk.size
                  if (download.expectedBytes != null && newOffset > download.expectedBytes) return false
                  current = current.copy(download = download.copy(acknowledgedBytes = newOffset, received = download.received + chunk, pendingRequestBytes = 0))
                  return true
              }

              private fun validTransferId(value: String): Boolean = value.length == 32 && value.all { it in '0'..'9' || it in 'a'..'f' }

              private fun validEntryName(value: String): Boolean {
                  val bytes = value.encodeToByteArray()
                  return bytes.isNotEmpty() && bytes.size <= MAX_REMOTE_ENTRY_NAME_BYTES && value != "." && value != ".." && '/' !in value && '\\' !in value && '\u0000' !in value
              }
          }
