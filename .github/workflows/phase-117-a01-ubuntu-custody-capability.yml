name: Phase 117 A01 Ubuntu Custody Capability

on:
  push:
    paths:
      - '.github/workflows/phase-117-a01-ubuntu-custody-capability.yml'

permissions:
  contents: read

jobs:
  custody-capability:
    runs-on: [self-hosted, prw-host]
    timeout-minutes: 5
    steps:
      - name: Probe user-scoped encrypted credential capability
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "phase117_probe=begin"
          echo "hostname=$(hostname)"
          echo "user=$(id -un)"
          echo "uid=$(id -u)"
          echo "gid=$(id -g)"
          echo "xdg_runtime_dir=${XDG_RUNTIME_DIR:-}"

          command -v systemd-creds
          command -v systemd-run
          command -v systemctl
          systemd-creds --version | head -n 1
          systemctl --version | head -n 1
          systemctl --user is-system-running

          agent=/usr/lib/private-remote-workspace/prw-agent
          unit=/usr/lib/systemd/user/prw-agent.service
          test -f "$agent"
          test -f "$unit"

          before_agent_sha=$(sha256sum "$agent" | awk '{print $1}')
          before_unit_sha=$(sha256sum "$unit" | awk '{print $1}')
          before_service=$(systemctl --user show prw-agent.service -p LoadState -p ActiveState -p SubState -p UnitFileState -p FragmentPath --no-pager)

          echo "agent_sha_before=$before_agent_sha"
          echo "unit_sha_before=$before_unit_sha"
          printf '%s\n' "$before_service"

          echo "credential_related_files_before"
          find "$HOME" -maxdepth 5 -type f \( -iname '*credential*secret*' -o -path '*/systemd/*credential*' \) -printf '%p mode=%m uid=%U gid=%G\n' 2>/dev/null | sort || true

          tmp=$(mktemp -d "${RUNNER_TEMP:-/tmp}/prw-phase117.XXXXXX")
          chmod 700 "$tmp"
          cleanup() {
            rm -rf -- "$tmp"
          }
          trap cleanup EXIT INT TERM

          plain="$tmp/plain.txt"
          encrypted="$tmp/dummy.cred"
          direct="$tmp/direct.txt"
          tampered="$tmp/tampered.cred"
          tampered_out="$tmp/tampered.out"
          delivered="$tmp/delivered.txt"

          printf 'PRW-PHASE-117-DUMMY-CREDENTIAL-v1\n' > "$plain"
          chmod 600 "$plain"
          plain_sha=$(sha256sum "$plain" | awk '{print $1}')
          echo "dummy_plain_sha=$plain_sha"

          systemd-creds --user -H encrypt --name=phase117.dummy "$plain" "$encrypted"
          test -s "$encrypted"
          test ! -L "$encrypted"
          encrypted_sha=$(sha256sum "$encrypted" | awk '{print $1}')
          echo "dummy_encrypted_sha=$encrypted_sha"
          test "$encrypted_sha" != "$plain_sha"

          systemd-creds --user decrypt "$encrypted" "$direct"
          cmp -s "$plain" "$direct"
          echo "direct_decrypt=pass"

          cp -- "$encrypted" "$tampered"
          tampered_size=$(stat -c %s "$tampered")
          test "$tampered_size" -gt 1
          truncate -s $((tampered_size - 1)) "$tampered"
          set +e
          systemd-creds --user decrypt "$tampered" "$tampered_out" >/dev/null 2>&1
          tamper_rc=$?
          set -e
          echo "tampered_decrypt_rc=$tamper_rc"
          test "$tamper_rc" -ne 0
          echo "tamper_rejection=pass"

          systemd-run --user --wait --pipe --collect \
            -p "LoadCredentialEncrypted=phase117.dummy:$encrypted" \
            -- /bin/sh -ceu 'test -n "$CREDENTIALS_DIRECTORY"; cat "$CREDENTIALS_DIRECTORY/phase117.dummy"' \
            > "$delivered"
          cmp -s "$plain" "$delivered"
          echo "user_service_encrypted_delivery=pass"

          after_agent_sha=$(sha256sum "$agent" | awk '{print $1}')
          after_unit_sha=$(sha256sum "$unit" | awk '{print $1}')
          after_service=$(systemctl --user show prw-agent.service -p LoadState -p ActiveState -p SubState -p UnitFileState -p FragmentPath --no-pager)

          test "$after_agent_sha" = "$before_agent_sha"
          test "$after_unit_sha" = "$before_unit_sha"
          test "$after_service" = "$before_service"

          echo "agent_sha_after=$after_agent_sha"
          echo "unit_sha_after=$after_unit_sha"
          printf '%s\n' "$after_service"

          echo "credential_related_files_after"
          find "$HOME" -maxdepth 5 -type f \( -iname '*credential*secret*' -o -path '*/systemd/*credential*' \) -printf '%p mode=%m uid=%U gid=%G\n' 2>/dev/null | sort || true

          rm -rf -- "$tmp"
          trap - EXIT INT TERM

          echo "phase117_probe=success"
