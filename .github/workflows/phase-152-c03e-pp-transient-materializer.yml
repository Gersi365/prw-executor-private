name: C03e-PP transient guarded source materializer

on:
  push:
    branches:
      - phase-152-c03e-pp-production-requester-rendezvous-expected-device-admission-fallible-verifier-time-endpoint-lifecycle-composition-source-materialization

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PP branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard and materialize selected endpoint lifecycle sibling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs')
          expected_blob = 'aa2ee037d698d2c37b41dfd6aefa4b089131e2f3'
          actual_blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(f'unexpected predecessor blob: {actual_blob}')

          text = path.read_text(encoding='utf-8')
          method_name = 'drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle'
          if method_name in text:
              raise SystemExit('PP endpoint lifecycle sibling already exists before materialization')

          anchor = '''    impl RemoteSessionExecutorRuntime {
              /// Drives repeated expected-device real admission and the persistent worker collection inside
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected exactly one insertion anchor, found {text.count(anchor)}')

          insertion = '''    impl RemoteSessionExecutorRuntime {
              /// Drives the dormant fallible verifier-time repeated supervisor to full return and then
              /// deterministically closes and drains the already-bound remote endpoint on the same private
              /// current-thread runtime.
              ///
              /// The C03e-PN fallible repeated collection remains authoritative for request/admission,
              /// authenticated identity, worker cancellation/join custody and fallible verifier-time worker
              /// completion. This outer seam captures its exact result without early propagation, then reuses
              /// the existing endpoint teardown helper so close occurs exactly once before `wait_idle()` and
              /// the original collection result is returned unchanged.
              ///
              /// # Errors
              ///
              /// Returns the existing persistent-collection configuration error unchanged after endpoint close
              /// and idle drain when the fallible repeated collection rejects its worker-capacity configuration.
              #[allow(
                  dead_code,
                  reason = "C03e-PP materializes the PO-selected dormant fallible verifier-time endpoint lifecycle composition before separately gated production caller wiring"
              )]
              #[expect(
                  clippy::too_many_arguments,
                  reason = "C03e-PP composes the exact C03e-PN fallible repeated-collection inputs with the existing endpoint teardown helper"
              )]
              pub(super) fn drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle<
                  P,
                  D,
                  T,
                  S,
                  F,
                  C,
                  R,
                  E,
              >(
                  &mut self,
                  max_active_workers: NonZeroUsize,
                  transport_runtime: &AgentRemoteTransportRuntime,
                  authority: &SharedCurrentCapabilityAuthority<P>,
                  session_authentication: &mut SessionAuthenticationService,
                  expected_requests: mpsc::Receiver<RemoteSessionExpectedDeviceAdmissionRequest<D, T>>,
                  supervisor_shutdown: S,
                  admission_timing: F,
                  on_completion: C,
                  on_rejection: R,
                  on_admission_failure: E,
              ) -> Result<(), RemoteSessionPersistentCollectionConfigError>
              where
                  P: PolicyEvaluator + Send + Sync + 'static,
                  D: CapabilityDispatcher + Send + 'static,
                  T: FnMut() -> Result<u64, prw_session::prwa_verifier_source::PrwaVerifierSourceError>
                      + Send
                      + 'static,
                  S: Future<Output = ()> + Send,
                  F: FnMut(&DeviceId) -> RemoteSessionRealAdmissionTiming,
                  C: FnMut(super::RemoteSessionFallibleVerifierTimeRegisteredWorkerCompletion),
                  R: FnMut(RemoteSessionExpectedDeviceAdmissionRejection<D, T>),
                  E: FnMut(RemoteSessionRepeatedAdmissionFailure),
              {
                  let result = self
                      .drive_repeated_real_fallible_verifier_time_remote_admission_collection(
                          max_active_workers,
                          transport_runtime,
                          authority,
                          session_authentication,
                          expected_requests,
                          supervisor_shutdown,
                          admission_timing,
                          on_completion,
                          on_rejection,
                          on_admission_failure,
                      );

                  finish_remote_endpoint_shutdown(
                      self,
                      result,
                      |code, reason| transport_runtime.close(code, reason),
                      transport_runtime.wait_idle(),
                  )
              }
          }

          '''
          path.write_text(text.replace(anchor, insertion + anchor, 1), encoding='utf-8', newline='\n')
          PY

          rustup component add rustfmt
          cargo fmt --all

          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs" ]; then
            printf 'unexpected formatted path set:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi

          git diff --check
          grep -q 'drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle' crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs

      - name: Commit selected source materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs
          git commit -m 'C03e-PP: materialize fallible verifier-time endpoint lifecycle composition'
          git push
