name: Phase 152 C03 Lock-Late Rustfmt Corrective

on:
  push:
    branches:
      - phase-152-c03-runtime-lock-late-boundary-proof
    paths:
      - ".github/workflows/phase-152-c03-lock-late-rustfmt-corrective.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-152-c03-lock-late-rustfmt-corrective
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact corrective parent
        run: test "$(git rev-parse HEAD^)" = "47fa2397d96a13637cdef4b8fcb497f71433e3b4"

      - name: Apply rustfmt and verify scope
        run: |
          cargo fmt --all
          git diff --exit-code -- Cargo.lock
          CHANGED=$(git diff --name-only | sort)
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = "$(printf '%s\n' \
            crates/prw-agent/src/local_commands.rs \
            crates/prw-agent/src/local_commands/management_runtime.rs \
            crates/prw-agent/src/local_commands/management_runtime_boundary.rs | sort)"

      - name: Commit formatted proof
        run: |
          BASE_HEAD=$(git rev-parse HEAD)
          REMOTE_HEAD=$(git ls-remote origin refs/heads/phase-152-c03-runtime-lock-late-boundary-proof | cut -f1)
          test "$REMOTE_HEAD" = "$BASE_HEAD"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/prw-agent/src/local_commands.rs \
            crates/prw-agent/src/local_commands/management_runtime.rs \
            crates/prw-agent/src/local_commands/management_runtime_boundary.rs
          git rm .github/workflows/phase-152-c03-lock-late-rustfmt-corrective.yml
          git commit -m "phase 152 c03: rustfmt lock-late runtime boundary"
          git push origin HEAD:phase-152-c03-runtime-lock-late-boundary-proof
