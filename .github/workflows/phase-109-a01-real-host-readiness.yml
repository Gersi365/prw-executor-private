name: Phase 109 A01 Real Host Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-109-a01-real-host-readiness.yml'

permissions:
  contents: read

jobs:
  host-readiness:
    runs-on: [self-hosted, prw-host]
    timeout-minutes: 5
    steps:
      - name: Read-only host identity and activation preflight
        shell: bash
        run: |
          set -euo pipefail

          echo '=== PRW PHASE 109 A01 READ-ONLY HOST PREFLIGHT ==='
          printf 'hostname='; hostname
          printf 'user='; id -un
          printf 'uid='; id -u
          printf 'gid='; id -g
          printf 'kernel='; uname -srmo

          echo '--- os-release ---'
          cat /etc/os-release

          echo '--- systemd ---'
          systemctl --version | head -n 1

          echo '--- runtime environment ---'
          printf 'XDG_RUNTIME_DIR=%s\n' "${XDG_RUNTIME_DIR:-<unset>}"
          if [[ -n "${XDG_RUNTIME_DIR:-}" ]]; then
            stat -Lc 'runtime_dir_mode=%a runtime_dir_uid=%u runtime_dir_gid=%g runtime_dir_type=%F' "$XDG_RUNTIME_DIR"
            if [[ -S "$XDG_RUNTIME_DIR/bus" ]]; then
              echo 'user_bus_socket=present'
            else
              echo 'user_bus_socket=absent'
            fi
          fi

          echo '--- login/linger state ---'
          loginctl show-user "$(id -un)" -p Linger -p RuntimePath -p State

          echo '--- package destinations ---'
          for p in /usr/lib/private-remote-workspace/prw-agent /usr/lib/systemd/user/prw-agent.service; do
            if [[ -e "$p" || -L "$p" ]]; then
              stat -Lc '%n exists mode=%a uid=%u gid=%g type=%F' "$p"
              sha256sum "$p" || true
            else
              echo "$p absent"
            fi
          done

          echo '--- user service manager state ---'
          systemctl --user show prw-agent.service -p LoadState -p ActiveState -p SubState -p UnitFileState 2>&1 || true
          systemctl --user is-system-running 2>&1 || true

          echo '=== END READ-ONLY HOST PREFLIGHT ==='
