name: C03e-PN transient namespace corrector

on:
  push:
    branches:
      - phase-152-c03e-pn-production-requester-rendezvous-expected-device-admission-fallible-verifier-time-repeated-real-admission-persistent-collection-source-materialization

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PN branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard and correct only the two PN namespace references
        shell: bash
        run: |
          set -euo pipefail
          TARGET='crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs'
          EXPECTED_BLOB='6ac0ac08794c12674ee220468702afa8637d32e2'
          ACTUAL_BLOB="$(git hash-object "$TARGET")"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs')
          text = path.read_text(encoding='utf-8')
          start_marker = '    type FallibleVerifierTimeActiveRemoteWorkers = HashMap<'
          end_marker = (
              '    impl RemoteSessionExecutorRuntime {\n'
              '        /// Drives repeated expected-device real admission and the persistent worker collection inside\n'
          )
          if text.count(start_marker) != 1:
              raise SystemExit(f'expected exactly one PN start marker, found {text.count(start_marker)}')
          if text.count(end_marker) != 1:
              raise SystemExit(f'expected exactly one historical end marker, found {text.count(end_marker)}')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          prefix = text[:start]
          region = text[start:end]
          suffix = text[end:]

          old = 'super::authenticated_remote_session_runtime::AuthenticatedRemoteSessionFallibleVerifierTimeWorkerStop'
          new = 'crate::remote_session_capability_runtime::authenticated_remote_session_runtime::AuthenticatedRemoteSessionFallibleVerifierTimeWorkerStop'
          if region.count(old) != 2:
              raise SystemExit(f'expected exactly two PN-region namespace references, found {region.count(old)}')
          outside_before = prefix.count(old) + suffix.count(old)
          corrected_region = region.replace(old, new)
          if corrected_region.count(old) != 0 or corrected_region.count(new) != 2:
              raise SystemExit('PN-region namespace correction was not exact')
          corrected = prefix + corrected_region + suffix
          outside_after = corrected[:start].count(old) + corrected[start + len(corrected_region):].count(old)
          if outside_after != outside_before:
              raise SystemExit('namespace correction changed old-path count outside PN region')
          path.write_text(corrected, encoding='utf-8')
          PY

          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = "$TARGET"
          cargo fmt --all
          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = "$TARGET"
          cargo fmt --all -- --check
          git diff --check

      - name: Commit correction and remove transient workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          rm .github/workflows/c03e-pn-transient-namespace-corrector.yml
          git add crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs .github/workflows/c03e-pn-transient-namespace-corrector.yml
          git commit -m 'C03e-PN: correct fallible worker terminal namespace'
          git push origin HEAD:phase-152-c03e-pn-production-requester-rendezvous-expected-device-admission-fallible-verifier-time-repeated-real-admission-persistent-collection-source-materialization
