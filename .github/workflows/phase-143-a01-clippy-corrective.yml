name: Phase 143 A02 Test Corrective

on:
  push:
    paths:
      - '.github/workflows/phase-143-a01-clippy-corrective.yml'

permissions:
  contents: write

jobs:
  correct-validate-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prove Phase 143 A02 baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f contracts/END_TO_END_AUTHENTICATED_CAPABILITY_BRIDGE_CONTRACT.md
          test -f crates/prw-remote-bridge/src/lib.rs
          test -f crates/prw-remote-bridge/tests/end_to_end.rs
          grep -Fq 'fn validate_time(&self' crates/prw-remote-bridge/src/lib.rs
          grep -Fq 'fn map_transport_error(' crates/prw-remote-bridge/src/lib.rs
          grep -Fq 'let mut suspended_fixture = fixture(WorkspaceRole::Member);' crates/prw-remote-bridge/tests/end_to_end.rs
          rustc --version | grep -Fq 'rustc 1.97.1'
          cargo --version | grep -Fq 'cargo 1.97.1'
          echo phase143_a02_baseline=pass

      - name: Materialize Phase 143 registry and workspace graph
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('Cargo.toml')
          text = root.read_text()
          member = '    "crates/prw-remote-bridge",\n'
          if member not in text:
              anchor = '    "crates/prw-remote-transport",\n'
              if text.count(anchor) != 1:
                  raise SystemExit('workspace anchor mismatch')
              root.write_text(text.replace(anchor, anchor + member))

          manifest = Path('crates/prw-registry/Cargo.toml')
          text = manifest.read_text()
          dep = 'prw-connectivity = { path = "../prw-connectivity" }\n'
          if dep not in text:
              anchor = '[dependencies]\n'
              if text.count(anchor) != 1:
                  raise SystemExit('registry manifest anchor mismatch')
              manifest.write_text(text.replace(anchor, anchor + dep))

          bridge_manifest = Path('crates/prw-remote-bridge/Cargo.toml')
          text = bridge_manifest.read_text()
          if '[dev-dependencies]' not in text:
              marker = '\n[lints]\nworkspace = true\n'
              addition = ('\n[dev-dependencies]\n'
                          'aws-lc-rs = { version = "=1.18.0", default-features = false, features = ["alloc", "non-fips"] }\n'
                          'prw-control-plane = { path = "../prw-control-plane" }\n'
                          'prw-core = { path = "../prw-core" }\n'
                          'prw-device-identity-signer = { path = "../prw-device-identity-signer" }\n')
              if text.count(marker) != 1:
                  raise SystemExit('bridge dev dependency anchor mismatch')
              bridge_manifest.write_text(text.replace(marker, addition + marker))

          registry = Path('crates/prw-registry/src/lib.rs')
          text = registry.read_text()
          import_anchor = 'use prw_control_plane::{DeviceIdentityBinding, PublicIdentityMaterial};\n'
          import_line = 'use prw_connectivity::TransportIdentity;\n'
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('registry import anchor mismatch')
              text = text.replace(import_anchor, import_line + import_anchor)

          old = 'pub struct RegisteredDevice {\n    binding: DeviceIdentityBinding,\n}\n'
          new = 'pub struct RegisteredDevice {\n    binding: DeviceIdentityBinding,\n    transport_identity: Option<TransportIdentity>,\n}\n'
          if old in text:
              text = text.replace(old, new)
          elif text.count(new) != 1:
              raise SystemExit('registered device field mismatch')

          anchor = '    pub const fn binding(&self) -> &DeviceIdentityBinding {\n        &self.binding\n    }\n'
          addition = anchor + '\n    /// Returns the current separately rotatable transport identity, when bound.\n    #[must_use]\n    pub const fn transport_identity(&self) -> Option<TransportIdentity> {\n        self.transport_identity\n    }\n'
          if 'pub const fn transport_identity(&self)' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('transport getter anchor mismatch')
              text = text.replace(anchor, addition)

          old = '                Ok(entry.insert(RegisteredDevice { binding }))\n'
          new = '                Ok(entry.insert(RegisteredDevice {\n                    binding,\n                    transport_identity: None,\n                }))\n'
          if old in text:
              text = text.replace(old, new)
          elif text.count(new) != 1:
              raise SystemExit('registry insertion mismatch')

          error_anchor = '    /// Authenticated session identity differs from current registry identity.\n    SessionBindingMismatch,\n'
          error_add = error_anchor + '    /// A current transport identity is already bound for this device.\n    TransportIdentityAlreadyBound,\n    /// No current transport identity is bound for this device.\n    TransportIdentityMissing,\n    /// Presented/expected transport identity differs from the current binding.\n    TransportIdentityMismatch,\n    /// Transport rotation supplied the same identity as replacement.\n    TransportIdentityUnchanged,\n'
          if 'TransportIdentityAlreadyBound' not in text:
              if text.count(error_anchor) != 1:
                  raise SystemExit('registry error anchor mismatch')
              text = text.replace(error_anchor, error_add)

          display_anchor = '            Self::SessionBindingMismatch => "authenticated session binding mismatch",\n'
          display_add = display_anchor + '            Self::TransportIdentityAlreadyBound => "transport identity already bound",\n            Self::TransportIdentityMissing => "transport identity is not bound",\n            Self::TransportIdentityMismatch => "transport identity does not match current binding",\n            Self::TransportIdentityUnchanged => "transport identity rotation requires a distinct replacement",\n'
          if 'Self::TransportIdentityAlreadyBound =>' not in text:
              if text.count(display_anchor) != 1:
                  raise SystemExit('registry display anchor mismatch')
              text = text.replace(display_anchor, display_add)

          method_anchor = '    /// Revokes one enrolled device terminally while retaining its immutable tuple.\n'
          methods = ('    /// Binds the first current mesh transport identity to one enrolled registered device.\n'
                     '    ///\n    /// # Errors\n    ///\n'
                     '    /// Rejects unknown/revoked devices and a second initial bind.\n'
                     '    pub fn bind_transport_identity(&mut self, device_id: &DeviceId, identity: TransportIdentity) -> Result<(), RegistryError> {\n'
                     '        let device = self.devices.get_mut(device_id).ok_or(RegistryError::DeviceUnknown)?;\n'
                     '        if device.binding.lifecycle != DeviceLifecycle::Enrolled { return Err(RegistryError::DeviceRevoked); }\n'
                     '        if device.transport_identity.is_some() { return Err(RegistryError::TransportIdentityAlreadyBound); }\n'
                     '        device.transport_identity = Some(identity);\n        Ok(())\n    }\n\n'
                     '    /// Atomically compare-and-rotates one current mesh transport identity.\n'
                     '    ///\n    /// # Errors\n    ///\n'
                     '    /// Rejects unknown/revoked/unbound devices, stale expected identity or an unchanged replacement.\n'
                     '    pub fn rotate_transport_identity(&mut self, device_id: &DeviceId, expected_current: TransportIdentity, replacement: TransportIdentity) -> Result<(), RegistryError> {\n'
                     '        if expected_current == replacement { return Err(RegistryError::TransportIdentityUnchanged); }\n'
                     '        let device = self.devices.get_mut(device_id).ok_or(RegistryError::DeviceUnknown)?;\n'
                     '        if device.binding.lifecycle != DeviceLifecycle::Enrolled { return Err(RegistryError::DeviceRevoked); }\n'
                     '        let current = device.transport_identity.ok_or(RegistryError::TransportIdentityMissing)?;\n'
                     '        if current != expected_current { return Err(RegistryError::TransportIdentityMismatch); }\n'
                     '        device.transport_identity = Some(replacement);\n        Ok(())\n    }\n\n'
                     '    /// Validates one presented mesh transport identity against current device state.\n'
                     '    ///\n    /// # Errors\n    ///\n'
                     '    /// Rejects unknown/revoked/unbound devices and stale or mismatched identities.\n'
                     '    pub fn validate_transport_identity(&self, device_id: &DeviceId, presented: TransportIdentity) -> Result<(), RegistryError> {\n'
                     '        let device = self.devices.get(device_id).ok_or(RegistryError::DeviceUnknown)?;\n'
                     '        if device.binding.lifecycle != DeviceLifecycle::Enrolled { return Err(RegistryError::DeviceRevoked); }\n'
                     '        let current = device.transport_identity.ok_or(RegistryError::TransportIdentityMissing)?;\n'
                     '        if current != presented { return Err(RegistryError::TransportIdentityMismatch); }\n'
                     '        Ok(())\n    }\n\n')
          if 'pub fn bind_transport_identity(' not in text:
              if text.count(method_anchor) != 1:
                  raise SystemExit('registry method anchor mismatch')
              text = text.replace(method_anchor, methods + method_anchor)
          registry.write_text(text)
          PY
          echo phase143_a02_graph=pass

      - name: Apply exact Clippy and documentation correctives
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/prw-remote-bridge/src/lib.rs')
          text = path.read_text()
          replacements = {
              '    fn validate_time(&self, now_unix_seconds: u64) -> Result<(), RemoteBridgeError> {': '    const fn validate_time(&self, now_unix_seconds: u64) -> Result<(), RemoteBridgeError> {',
              'fn map_transport_error(_error: RemoteTransportError) -> RemoteBridgeError {': 'const fn map_transport_error(_error: RemoteTransportError) -> RemoteBridgeError {',
              'fn validate_nonzero_inline_length(length: usize) -> Result<(), RemoteBridgeError> {': 'const fn validate_nonzero_inline_length(length: usize) -> Result<(), RemoteBridgeError> {',
              'fn decode_terminal_profile(value: u8) -> Result<TerminalProfile, RemoteBridgeError> {': 'const fn decode_terminal_profile(value: u8) -> Result<TerminalProfile, RemoteBridgeError> {',
              '    fn finish(self) -> Result<(), RemoteBridgeError> {': '    const fn finish(self) -> Result<(), RemoteBridgeError> {',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'corrective boundary mismatch: {old}')
              text = text.replace(old, new)
          old = '    /// Dispatches one already-authorized typed request.\n    fn dispatch('
          new = '    /// Dispatches one already-authorized typed request.\n    ///\n    /// # Errors\n    ///\n    /// Returns the backend-specific bounded dispatch error without weakening bridge authorization.\n    fn dispatch('
          if text.count(old) != 1:
              raise SystemExit('dispatcher documentation boundary mismatch')
          path.write_text(text.replace(old, new))
          PY
          echo phase143_a02_correctives=pass

      - name: Lock and prove graph and static boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > /tmp/phase143-a02-metadata.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/phase143-a02-metadata.json'))
          bridge = next(p for p in data['packages'] if p['name'] == 'prw-remote-bridge')
          runtime = {d['name'] for d in bridge['dependencies'] if d.get('kind') is None}
          expected = {'prw-agent','prw-connectivity','prw-file-service','prw-file-transfer','prw-forwarding','prw-policy','prw-registry','prw-remote-transport','prw-session','prw-terminal'}
          if runtime != expected:
              raise SystemExit(f'Phase 143 runtime dependency mismatch: {runtime!r}')
          if any(d.get('source') is not None for d in bridge['dependencies'] if d.get('kind') is None):
              raise SystemExit('Phase 143 acquired external runtime dependency')
          print('phase143_a02_exact_graph=pass')
          PY
          source=crates/prw-remote-bridge/src/lib.rs
          for forbidden in 'UdpSocket' 'TcpStream' 'TcpListener' 'ToSocketAddrs' 'lookup_host' 'tokio::' 'std::process' 'Command::new' '/dev/net/tun' 'iptables' 'nftables'; do
            if grep -Fq "$forbidden" "$source"; then
              echo "phase143_a02_forbidden_runtime_token=$forbidden" >&2
              exit 1
            fi
          done
          grep -Fq 'validate_authenticated_session' "$source"
          grep -Fq 'validate_transport_identity' "$source"
          grep -Fq 'self.policy.evaluate(capability)' "$source"
          echo phase143_a02_static_boundary=pass

      - name: Focused Phase 143 validation
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all
          git diff --check -- . ':!target'
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-registry -p prw-remote-bridge --all-targets --all-features -- -D warnings
          cargo test --locked -p prw-registry -p prw-remote-bridge --all-targets
          cargo build --locked -p prw-remote-bridge --all-targets
          echo phase143_a02_focused=pass

      - name: Full workspace validation
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          echo phase143_a02_workspace=pass

      - name: Write authoritative Phase 143 report
        shell: bash
        run: |
          set -Eeuo pipefail
          report_dir=logs/audits/phase-143-end-to-end-authenticated-capability-bridge
          report="$report_dir/PRW-PHASE-143-END-TO-END-AUTHENTICATED-CAPABILITY-BRIDGE-VALIDATION.txt"
          mkdir -p "$report_dir"
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          registry_sha=$(sha256sum crates/prw-registry/src/lib.rs | cut -d' ' -f1)
          bridge_sha=$(sha256sum crates/prw-remote-bridge/src/lib.rs | cut -d' ' -f1)
          tests_sha=$(sha256sum crates/prw-remote-bridge/tests/end_to_end.rs | cut -d' ' -f1)
          printf '%s\n' \
            'Private Remote Workspace' \
            'Phase 143 — End-to-End Authenticated Capability Bridge' \
            '' \
            'STATUS:' \
            'PASS / CURRENT_REGISTRY_REVALIDATION / CURRENT_TRANSPORT_IDENTITY_BINDING / BOUNDED_REMOTE_SESSION_LEASE / PER_CAPABILITY_POLICY / TYPED_CAPABILITY_COMMANDS / FULL_WORKSPACE_VALIDATION_PASS / NO_PRODUCTION_SIDE_EFFECT' \
            '' \
            'Repository: Gersi365/prw-executor-private' \
            'Branch: main' \
            'Date: 2026-08-16' \
            "Validation source head: $GITHUB_SHA" \
            "Authoritative validation run: $GITHUB_RUN_ID" \
            "Cargo.lock SHA-256: $lock_sha" \
            "prw-registry/src/lib.rs SHA-256: $registry_sha" \
            "prw-remote-bridge/src/lib.rs SHA-256: $bridge_sha" \
            "end_to_end.rs SHA-256: $tests_sha" \
            '' \
            'CONTRACT: contracts/END_TO_END_AUTHENTICATED_CAPABILITY_BRIDGE_CONTRACT.md' \
            'IMPLEMENTATION: crates/prw-remote-bridge plus the Phase 139-required current TransportIdentity metadata in prw-registry.' \
            '' \
            'AUTHORIZATION CHAIN: PRWM Request -> bounded remote lease -> current authenticated-session registry revalidation -> current DeviceId/TransportIdentity validation -> PRWC typed operation decode -> exact policy Capability -> typed dispatcher. Transport, relay and WorkspaceRole never grant capability implicitly.' \
            '' \
            'OPERATIONS: Agent status; file list/stat/create/create-directory; upload begin/resume/chunk/finalize/abort; download chunk; terminal open/input/resize/read/close; loopback-to-explicit-IP forward open/close. No generic shell, arbitrary executable, FilesDelete, role-derived grant, DNS hostname target or unrestricted bind.' \
            '' \
            'BOUNDS: remote session lease <= 3,600 seconds; PRWC header 12 bytes; inline data <= 60,000 bytes under Phase 140 65,536-byte PRWM control ceiling.' \
            '' \
            'VALIDATION: all 18 operation codes round-trip to existing typed domain values and exact capability mappings. Disposable tests use real signed Phase 128 proof and Phase 130 current registry. Expiry/future time, membership suspension, device revocation, stale transport, malformed codec and policy denial prevent dispatch. Valid dispatch returns correlated Response; oversized response fails closed. Focused and full locked workspace validation passed.' \
            '' \
            'CORRECTIVE HISTORY: initial run passed prerequisites, registry materialization, exact graph and static boundary, then stopped on five const-eligible Clippy findings and one missing dispatcher # Errors section. A01 corrected those and reached test compilation, which exposed one regression-only local fixture name shadowing the fixture constructor. A02 renames only that local fixture variable and re-runs the same validated source correctives.' \
            '' \
            'PRODUCTION BOUNDARY: no production QUIC listener, ICE/STUN/TURN/relay activation, Agent restart/replacement, credential, firewall/NAT/router/TUN/TAP/route/DNS or client distribution state changed.' \
            '' \
            'FINAL CLASSIFICATION: PHASE_143_DONE / E2E_AUTHENTICATED_CAPABILITY_BRIDGE_VALIDATED / CURRENT_REGISTRY_AND_TRANSPORT_REVALIDATION / PER_CAPABILITY_POLICY_ENFORCED / READY_FOR_EXPLICIT_PHASE_144_ARCHITECTURE_DECISION' \
            > "$report"

      - name: Commit validated Phase 143 state only
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check -- . ':!target'
          git config user.name Gersi365
          git config user.email Gersi365@outlook.com
          git add Cargo.toml Cargo.lock crates/prw-registry/Cargo.toml crates/prw-registry/src/lib.rs crates/prw-remote-bridge logs/audits/phase-143-end-to-end-authenticated-capability-bridge/PRW-PHASE-143-END-TO-END-AUTHENTICATED-CAPABILITY-BRIDGE-VALIDATION.txt
          git commit -m 'phase 143: validate authenticated capability bridge'
          git push origin HEAD:main
          echo phase143_a02_materialization=pass
