name: Phase 143 Authenticated Capability Bridge Validation

on:
  push:
    paths:
      - '.github/workflows/phase-143-authenticated-capability-bridge-validation.yml'

permissions:
  contents: write

jobs:
  validate-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prove Phase 143 prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f contracts/END_TO_END_AUTHENTICATED_CAPABILITY_BRIDGE_CONTRACT.md
          test -f logs/audits/phase-142-disposable-relay-protocol-service/PRW-PHASE-142-DISPOSABLE-RELAY-PROTOCOL-SERVICE-VALIDATION.txt
          grep -Fq 'PHASE_142_DONE' logs/audits/phase-142-disposable-relay-protocol-service/PRW-PHASE-142-DISPOSABLE-RELAY-PROTOCOL-SERVICE-VALIDATION.txt
          test -f crates/prw-remote-bridge/Cargo.toml
          test -f crates/prw-remote-bridge/src/lib.rs
          test -f crates/prw-remote-bridge/tests/end_to_end.rs
          rustc --version | grep -Fq 'rustc 1.97.1'
          cargo --version | grep -Fq 'cargo 1.97.1'
          echo phase143_prerequisite=pass

      - name: Materialize current transport identity registry metadata and bridge graph
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('Cargo.toml')
          text = root.read_text()
          member = '    "crates/prw-remote-bridge",\n'
          if member not in text:
              anchor = '    "crates/prw-remote-transport",\n'
              if text.count(anchor) != 1:
                  raise SystemExit('remote bridge workspace anchor mismatch')
              root.write_text(text.replace(anchor, anchor + member))

          registry_manifest = Path('crates/prw-registry/Cargo.toml')
          text = registry_manifest.read_text()
          dep = 'prw-connectivity = { path = "../prw-connectivity" }\n'
          if dep not in text:
              anchor = '[dependencies]\n'
              if text.count(anchor) != 1:
                  raise SystemExit('registry dependency anchor mismatch')
              registry_manifest.write_text(text.replace(anchor, anchor + dep))

          bridge_manifest = Path('crates/prw-remote-bridge/Cargo.toml')
          text = bridge_manifest.read_text()
          if '[dev-dependencies]' not in text:
              marker = '\n[lints]\nworkspace = true\n'
              addition = ('\n[dev-dependencies]\n'
                          'aws-lc-rs = { version = "=1.18.0", default-features = false, features = ["alloc", "non-fips"] }\n'
                          'prw-control-plane = { path = "../prw-control-plane" }\n'
                          'prw-core = { path = "../prw-core" }\n'
                          'prw-device-identity-signer = { path = "../prw-device-identity-signer" }\n')
              if text.count(marker) != 1:
                  raise SystemExit('bridge dev dependency anchor mismatch')
              bridge_manifest.write_text(text.replace(marker, addition + marker))

          registry = Path('crates/prw-registry/src/lib.rs')
          text = registry.read_text()
          import_anchor = 'use prw_control_plane::{DeviceIdentityBinding, PublicIdentityMaterial};\n'
          import_line = 'use prw_connectivity::TransportIdentity;\n'
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('registry transport import anchor mismatch')
              text = text.replace(import_anchor, import_line + import_anchor)

          struct_old = ('pub struct RegisteredDevice {\n'
                        '    binding: DeviceIdentityBinding,\n'
                        '}\n')
          struct_new = ('pub struct RegisteredDevice {\n'
                        '    binding: DeviceIdentityBinding,\n'
                        '    transport_identity: Option<TransportIdentity>,\n'
                        '}\n')
          if struct_old in text:
              if text.count(struct_old) != 1:
                  raise SystemExit('registered device struct count mismatch')
              text = text.replace(struct_old, struct_new)
          elif text.count(struct_new) != 1:
              raise SystemExit('registered device transport field missing')

          getter_anchor = ('    pub const fn binding(&self) -> &DeviceIdentityBinding {\n'
                           '        &self.binding\n'
                           '    }\n')
          getter_add = (getter_anchor +
                        '\n    /// Returns the current separately rotatable transport identity, when bound.\n'
                        '    #[must_use]\n'
                        '    pub const fn transport_identity(&self) -> Option<TransportIdentity> {\n'
                        '        self.transport_identity\n'
                        '    }\n')
          if 'pub const fn transport_identity(&self)' not in text:
              if text.count(getter_anchor) != 1:
                  raise SystemExit('registered device getter anchor mismatch')
              text = text.replace(getter_anchor, getter_add)

          insertion_old = '                Ok(entry.insert(RegisteredDevice { binding }))\n'
          insertion_new = ('                Ok(entry.insert(RegisteredDevice {\n'
                           '                    binding,\n'
                           '                    transport_identity: None,\n'
                           '                }))\n')
          if insertion_old in text:
              if text.count(insertion_old) != 1:
                  raise SystemExit('registered device insertion count mismatch')
              text = text.replace(insertion_old, insertion_new)
          elif text.count(insertion_new) != 1:
              raise SystemExit('registered device transport initialization missing')

          error_anchor = ('    /// Authenticated session identity differs from current registry identity.\n'
                          '    SessionBindingMismatch,\n')
          error_add = (error_anchor +
                       '    /// A current transport identity is already bound for this device.\n'
                       '    TransportIdentityAlreadyBound,\n'
                       '    /// No current transport identity is bound for this device.\n'
                       '    TransportIdentityMissing,\n'
                       '    /// Presented/expected transport identity differs from the current binding.\n'
                       '    TransportIdentityMismatch,\n'
                       '    /// Transport rotation supplied the same identity as replacement.\n'
                       '    TransportIdentityUnchanged,\n')
          if 'TransportIdentityAlreadyBound' not in text:
              if text.count(error_anchor) != 1:
                  raise SystemExit('registry error anchor mismatch')
              text = text.replace(error_anchor, error_add)

          display_anchor = ('            Self::SessionBindingMismatch => "authenticated session binding mismatch",\n')
          display_add = (display_anchor +
                         '            Self::TransportIdentityAlreadyBound => "transport identity already bound",\n'
                         '            Self::TransportIdentityMissing => "transport identity is not bound",\n'
                         '            Self::TransportIdentityMismatch => "transport identity does not match current binding",\n'
                         '            Self::TransportIdentityUnchanged => "transport identity rotation requires a distinct replacement",\n')
          if 'Self::TransportIdentityAlreadyBound =>' not in text:
              if text.count(display_anchor) != 1:
                  raise SystemExit('registry display anchor mismatch')
              text = text.replace(display_anchor, display_add)

          method_anchor = ('    /// Revokes one enrolled device terminally while retaining its immutable tuple.\n')
          methods = (
              '    /// Binds the first current mesh transport identity to one enrolled registered device.\n'
              '    ///\n'
              '    /// # Errors\n'
              '    ///\n'
              '    /// Rejects unknown/revoked devices and a second initial bind.\n'
              '    pub fn bind_transport_identity(\n'
              '        &mut self,\n'
              '        device_id: &DeviceId,\n'
              '        identity: TransportIdentity,\n'
              '    ) -> Result<(), RegistryError> {\n'
              '        let device = self.devices.get_mut(device_id).ok_or(RegistryError::DeviceUnknown)?;\n'
              '        if device.binding.lifecycle != DeviceLifecycle::Enrolled {\n'
              '            return Err(RegistryError::DeviceRevoked);\n'
              '        }\n'
              '        if device.transport_identity.is_some() {\n'
              '            return Err(RegistryError::TransportIdentityAlreadyBound);\n'
              '        }\n'
              '        device.transport_identity = Some(identity);\n'
              '        Ok(())\n'
              '    }\n'
              '\n'
              '    /// Atomically compare-and-rotates one current mesh transport identity.\n'
              '    ///\n'
              '    /// # Errors\n'
              '    ///\n'
              '    /// Rejects unknown/revoked/unbound devices, stale expected identity or an unchanged replacement.\n'
              '    pub fn rotate_transport_identity(\n'
              '        &mut self,\n'
              '        device_id: &DeviceId,\n'
              '        expected_current: TransportIdentity,\n'
              '        replacement: TransportIdentity,\n'
              '    ) -> Result<(), RegistryError> {\n'
              '        if expected_current == replacement {\n'
              '            return Err(RegistryError::TransportIdentityUnchanged);\n'
              '        }\n'
              '        let device = self.devices.get_mut(device_id).ok_or(RegistryError::DeviceUnknown)?;\n'
              '        if device.binding.lifecycle != DeviceLifecycle::Enrolled {\n'
              '            return Err(RegistryError::DeviceRevoked);\n'
              '        }\n'
              '        let current = device.transport_identity.ok_or(RegistryError::TransportIdentityMissing)?;\n'
              '        if current != expected_current {\n'
              '            return Err(RegistryError::TransportIdentityMismatch);\n'
              '        }\n'
              '        device.transport_identity = Some(replacement);\n'
              '        Ok(())\n'
              '    }\n'
              '\n'
              '    /// Validates one presented mesh transport identity against current device state.\n'
              '    ///\n'
              '    /// # Errors\n'
              '    ///\n'
              '    /// Rejects unknown/revoked/unbound devices and stale or mismatched identities.\n'
              '    pub fn validate_transport_identity(\n'
              '        &self,\n'
              '        device_id: &DeviceId,\n'
              '        presented: TransportIdentity,\n'
              '    ) -> Result<(), RegistryError> {\n'
              '        let device = self.devices.get(device_id).ok_or(RegistryError::DeviceUnknown)?;\n'
              '        if device.binding.lifecycle != DeviceLifecycle::Enrolled {\n'
              '            return Err(RegistryError::DeviceRevoked);\n'
              '        }\n'
              '        let current = device.transport_identity.ok_or(RegistryError::TransportIdentityMissing)?;\n'
              '        if current != presented {\n'
              '            return Err(RegistryError::TransportIdentityMismatch);\n'
              '        }\n'
              '        Ok(())\n'
              '    }\n'
              '\n')
          if 'pub fn bind_transport_identity(' not in text:
              if text.count(method_anchor) != 1:
                  raise SystemExit('registry transport method anchor mismatch')
              text = text.replace(method_anchor, methods + method_anchor)

          registry.write_text(text)
          PY
          echo phase143_source_graph_materialization=pass

      - name: Lock and inspect exact dependency graph
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > /tmp/phase143-metadata.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/phase143-metadata.json'))
          bridge = next(p for p in data['packages'] if p['name'] == 'prw-remote-bridge')
          runtime = {d['name'] for d in bridge['dependencies'] if d.get('kind') is None}
          expected = {
              'prw-agent', 'prw-connectivity', 'prw-file-service', 'prw-file-transfer',
              'prw-forwarding', 'prw-policy', 'prw-registry', 'prw-remote-transport',
              'prw-session', 'prw-terminal'
          }
          if runtime != expected:
              raise SystemExit(f'Phase 143 runtime dependencies mismatch: {runtime!r}')
          external_runtime = [d for d in bridge['dependencies'] if d.get('kind') is None and d.get('source') is not None]
          if external_runtime:
              raise SystemExit(f'Phase 143 unexpectedly owns external runtime dependencies: {external_runtime!r}')
          registry = next(p for p in data['packages'] if p['name'] == 'prw-registry')
          registry_runtime = {d['name'] for d in registry['dependencies'] if d.get('kind') is None}
          if 'prw-connectivity' not in registry_runtime:
              raise SystemExit('registry current transport identity dependency missing')
          print('phase143_exact_graph=pass')
          PY
          echo "phase143_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"

      - name: Prove static bridge boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          source=crates/prw-remote-bridge/src/lib.rs
          for forbidden in 'UdpSocket' 'TcpStream' 'TcpListener' 'ToSocketAddrs' 'lookup_host' 'tokio::' 'std::process' 'Command::new' '/dev/net/tun' 'iptables' 'nftables'; do
            if grep -Fq "$forbidden" "$source"; then
              echo "phase143_forbidden_runtime_token=$forbidden" >&2
              exit 1
            fi
          done
          grep -Fq 'BRIDGE_MAGIC: [u8; 4] = *b"PRWC"' "$source"
          grep -Fq 'MAX_BRIDGE_INLINE_BYTES: usize = 60_000' "$source"
          grep -Fq 'MAX_REMOTE_SESSION_LEASE_SECONDS: u64 = 3_600' "$source"
          grep -Fq 'validate_authenticated_session' "$source"
          grep -Fq 'validate_transport_identity' "$source"
          grep -Fq 'self.policy.evaluate(capability)' "$source"
          grep -Fq 'Capability::AgentStatusRead' "$source"
          grep -Fq 'Capability::FilesRead' "$source"
          grep -Fq 'Capability::FilesWrite' "$source"
          grep -Fq 'Capability::TerminalOpen' "$source"
          grep -Fq 'Capability::TerminalExec' "$source"
          grep -Fq 'Capability::ForwardingCreate' "$source"
          if grep -Fq 'Capability::FilesDelete' "$source"; then
            echo phase143_unimplemented_delete_surface_detected >&2
            exit 1
          fi
          echo phase143_static_boundary=pass

      - name: Focused Phase 143 validation
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all
          git diff --check -- . ':!target'
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-registry -p prw-remote-bridge --all-targets --all-features -- -D warnings
          cargo test --locked -p prw-registry -p prw-remote-bridge --all-targets
          cargo build --locked -p prw-remote-bridge --all-targets
          echo phase143_focused_validation=pass

      - name: Full workspace validation
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          echo phase143_workspace_validation=pass

      - name: Write authoritative Phase 143 report
        shell: bash
        run: |
          set -Eeuo pipefail
          report_dir=logs/audits/phase-143-end-to-end-authenticated-capability-bridge
          report="$report_dir/PRW-PHASE-143-END-TO-END-AUTHENTICATED-CAPABILITY-BRIDGE-VALIDATION.txt"
          mkdir -p "$report_dir"
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          registry_sha=$(sha256sum crates/prw-registry/src/lib.rs | cut -d' ' -f1)
          bridge_sha=$(sha256sum crates/prw-remote-bridge/src/lib.rs | cut -d' ' -f1)
          tests_sha=$(sha256sum crates/prw-remote-bridge/tests/end_to_end.rs | cut -d' ' -f1)
          printf '%s\n' \
            'Private Remote Workspace' \
            'Phase 143 — End-to-End Authenticated Capability Bridge' \
            '' \
            'STATUS:' \
            'PASS / CURRENT_REGISTRY_REVALIDATION / CURRENT_TRANSPORT_IDENTITY_BINDING / BOUNDED_REMOTE_SESSION_LEASE / PER_CAPABILITY_POLICY / TYPED_CAPABILITY_COMMANDS / FULL_WORKSPACE_VALIDATION_PASS / NO_PRODUCTION_SIDE_EFFECT' \
            '' \
            'Repository: Gersi365/prw-executor-private' \
            'Branch: main' \
            'Date: 2026-08-16' \
            "Validation source head: $GITHUB_SHA" \
            "Authoritative validation run: $GITHUB_RUN_ID" \
            "Cargo.lock SHA-256: $lock_sha" \
            "prw-registry/src/lib.rs SHA-256: $registry_sha" \
            "prw-remote-bridge/src/lib.rs SHA-256: $bridge_sha" \
            "end_to_end.rs SHA-256: $tests_sha" \
            '' \
            'CONTRACT: contracts/END_TO_END_AUTHENTICATED_CAPABILITY_BRIDGE_CONTRACT.md' \
            'IMPLEMENTATION: crates/prw-remote-bridge plus the Phase 139-required current TransportIdentity metadata in prw-registry.' \
            '' \
            'AUTHORIZATION CHAIN: Phase 140 PRWM Request -> bounded Phase 143 remote lease -> Phase 130 current authenticated-session revalidation -> current DeviceId/TransportIdentity validation -> PRWC typed operation decode -> exact prw-policy Capability -> typed dispatcher. No transport, relay or registry role grants capability implicitly.' \
            '' \
            'REMOTE OPERATIONS: Agent status, file list/stat/create-directory/create-file, resumable upload begin/resume/chunk/finalize/abort, bounded download chunk, terminal open/input/resize/read/close and loopback-to-explicit-IP port-forward open/close. No generic shell command, arbitrary executable, FilesDelete, role-derived grant, DNS hostname target or unrestricted bind surface is introduced.' \
            '' \
            'BOUNDS: remote session lease maximum 3,600 seconds; PRWC fixed 12-byte header; inline terminal/file-transfer data maximum 60,000 bytes under the Phase 140 65,536-byte PRWM control payload bound. Existing RemotePath, UploadPlan, TerminalGeometry and forwarding endpoint constructors remain authoritative.' \
            '' \
            'REGISTRY TRANSPORT METADATA: first bind is enrolled-device-only; second bind fails; rotation is compare-and-replace with a distinct replacement; stale/missing/mismatched identities fail; device revocation overrides a retained transport identity. No key/certificate material is stored.' \
            '' \
            'VALIDATION: all 18 operation codes round-trip to existing typed domain values and exact capability mappings. Disposable end-to-end tests use real Phase 128 signed device-session proof, current Phase 130 registry membership/device state and transport binding. Tests prove expiry/not-yet-valid, membership suspension, device revocation, stale transport, malformed frame and policy denial prevent dispatch; valid dispatch returns correlated Phase 140 Response; oversized dispatcher response fails closed. Focused and full locked workspace Clippy/tests/build passed.' \
            '' \
            'PRODUCTION BOUNDARY: no production QUIC listener, ICE/STUN/TURN/relay activation, Agent restart/replacement, credential, firewall/NAT/router/TUN/TAP/route/DNS or Android/Desktop distribution state changed.' \
            '' \
            'FINAL CLASSIFICATION: PHASE_143_DONE / E2E_AUTHENTICATED_CAPABILITY_BRIDGE_VALIDATED / CURRENT_REGISTRY_AND_TRANSPORT_REVALIDATION / PER_CAPABILITY_POLICY_ENFORCED / READY_FOR_EXPLICIT_PHASE_144_ARCHITECTURE_DECISION' \
            > "$report"

      - name: Commit validated Phase 143 state only
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check -- . ':!target'
          git config user.name Gersi365
          git config user.email Gersi365@outlook.com
          git add Cargo.toml Cargo.lock crates/prw-registry/Cargo.toml crates/prw-registry/src/lib.rs crates/prw-remote-bridge logs/audits/phase-143-end-to-end-authenticated-capability-bridge/PRW-PHASE-143-END-TO-END-AUTHENTICATED-CAPABILITY-BRIDGE-VALIDATION.txt
          git commit -m 'phase 143: validate authenticated capability bridge'
          git push origin HEAD:main
          echo phase143_materialization=pass
