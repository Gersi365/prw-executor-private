name: Phase 145 A05 Android Binding Toolchain Probe

on:
  push:
    paths:
      - '.github/workflows/phase-145-a05-android-binding-toolchain-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prove Phase 144 handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/phase145-start-head"
          test -f contracts/ANDROID_CLIENT_ARCHITECTURE_DECISION.md
          test -f logs/audits/phase-144-android-client-architecture/PRW-PHASE-144-ANDROID-CLIENT-ARCHITECTURE-DECISION.txt
          grep -Fq 'PHASE_144_DONE' logs/audits/phase-144-android-client-architecture/PRW-PHASE-144-ANDROID-CLIENT-ARCHITECTURE-DECISION.txt
          echo phase145_a05_prerequisite=pass

      - name: Set up JDK and Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify exact Android SDK and NDK
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          echo phase145_a05_android_sdk=pass

      - name: Pin exact Rust Android toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc +1.97.1 --version | grep -Fq 'rustc 1.97.1'
          cargo +1.97.1 --version | grep -Fq 'cargo 1.97.1'
          rustup target add --toolchain 1.97.1-x86_64-unknown-linux-gnu aarch64-linux-android x86_64-linux-android
          rustup target list --installed --toolchain 1.97.1-x86_64-unknown-linux-gnu | tee "$RUNNER_TEMP/phase145-targets.txt"
          grep -Fxq 'aarch64-linux-android' "$RUNNER_TEMP/phase145-targets.txt"
          grep -Fxq 'x86_64-linux-android' "$RUNNER_TEMP/phase145-targets.txt"
          cargo +1.97.1 install --locked cargo-ndk --version 4.1.2
          cargo +1.97.1 ndk --version | grep -Fq 'cargo-ndk 4.1.2'
          echo phase145_a05_rust_toolchain=pass

      - name: Create and resolve isolated JNI crate
        shell: bash
        run: |
          set -Eeuo pipefail
          scratch="$RUNNER_TEMP/prw-phase145-a05"
          rm -rf "$scratch"
          mkdir -p "$scratch/native/src" "$scratch/android/app/src/main/kotlin/com/privateworkspace/prw" "$scratch/android/app/src/main"
          cat > "$scratch/native/Cargo.toml" <<'EOF'
          [package]
          name = "prw-android-probe"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.97.1"
          publish = false

          [lib]
          crate-type = ["cdylib"]

          [dependencies]
          jni = { version = "=0.22.4", default-features = false }
          EOF
          cat > "$scratch/native/src/lib.rs" <<'EOF'
          use jni::{JNIEnv, objects::JClass, sys::jint};

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeProbe_protocolVersion(
              _env: JNIEnv<'_>,
              _class: JClass<'_>,
          ) -> jint {
              1
          }
          EOF
          cd "$scratch/native"
          cargo +1.97.1 generate-lockfile
          cargo +1.97.1 metadata --locked --format-version 1 > "$scratch/native-metadata.json"
          python3 - <<'PY'
          import json, os
          scratch = os.environ['RUNNER_TEMP'] + '/prw-phase145-a05'
          data = json.load(open(scratch + '/native-metadata.json'))
          root = next(p for p in data['packages'] if p['name'] == 'prw-android-probe')
          deps = {d['name']: d['req'] for d in root['dependencies']}
          assert deps == {'jni': '=0.22.4'}, deps
          jni = next(p for p in data['packages'] if p['name'] == 'jni')
          assert jni['version'] == '0.22.4', jni['version']
          print('phase145_a05_jni_graph=pass')
          PY
          echo "phase145_a05_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"

      - name: Cross-build JNI probe for Android ABIs
        shell: bash
        run: |
          set -Eeuo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          scratch="$RUNNER_TEMP/prw-phase145-a05"
          cd "$scratch/native"
          cargo +1.97.1 ndk --platform 29 -t arm64-v8a -t x86_64 -o "$scratch/android/app/src/main/jniLibs" build --locked --release
          test -s "$scratch/android/app/src/main/jniLibs/arm64-v8a/libprw_android_probe.so"
          test -s "$scratch/android/app/src/main/jniLibs/x86_64/libprw_android_probe.so"
          file "$scratch/android/app/src/main/jniLibs/arm64-v8a/libprw_android_probe.so" | grep -Fq 'ARM aarch64'
          file "$scratch/android/app/src/main/jniLibs/x86_64/libprw_android_probe.so" | grep -Fq 'x86-64'
          echo phase145_a05_cross_build=pass

      - name: Create isolated Compose probe app
        shell: bash
        run: |
          set -Eeuo pipefail
          scratch="$RUNNER_TEMP/prw-phase145-a05/android"
          cat > "$scratch/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PrwPhase145Probe"
          include(":app")
          EOF
          cat > "$scratch/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "9.3.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
          }
          EOF
          cat > "$scratch/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          cat > "$scratch/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.privateworkspace.prw"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.privateworkspace.prw.probe"
                  minSdk = 29
                  targetSdk = 36
                  versionCode = 1
                  versionName = "0.1.0"
              }
              buildFeatures { compose = true }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2026.06.00")
              implementation(composeBom)
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0")
          }
          EOF
          cat > "$scratch/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="false" android:label="PRW Probe" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > "$scratch/app/src/main/kotlin/com/privateworkspace/prw/NativeProbe.kt" <<'EOF'
          package com.privateworkspace.prw
          internal object NativeProbe {
              init { System.loadLibrary("prw_android_probe") }
              external fun protocolVersion(): Int
          }
          EOF
          cat > "$scratch/app/src/main/kotlin/com/privateworkspace/prw/MainActivity.kt" <<'EOF'
          package com.privateworkspace.prw

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { MaterialTheme { Text("Private Remote Workspace") } }
              }
          }
          EOF
          echo phase145_a05_compose_sources=pass

      - name: Build and inspect isolated APK
        shell: bash
        run: |
          set -Eeuo pipefail
          scratch="$RUNNER_TEMP/prw-phase145-a05/android"
          cd "$scratch"
          gradle --no-daemon :app:assembleDebug :app:lintDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" > "$RUNNER_TEMP/phase145-a05-apk-list.txt"
          grep -Fq 'lib/arm64-v8a/libprw_android_probe.so' "$RUNNER_TEMP/phase145-a05-apk-list.txt"
          grep -Fq 'lib/x86_64/libprw_android_probe.so' "$RUNNER_TEMP/phase145-a05-apk-list.txt"
          echo "phase145_a05_apk_sha256=$(sha256sum "$apk" | cut -d' ' -f1)"
          echo phase145_a05_apk=pass

      - name: Prove repository immutability
        shell: bash
        run: |
          set -Eeuo pipefail
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/phase145-a05-status.txt"
          test ! -s "$RUNNER_TEMP/phase145-a05-status.txt"
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/phase145-start-head")"
          echo phase145_a05_repository_immutable=pass
