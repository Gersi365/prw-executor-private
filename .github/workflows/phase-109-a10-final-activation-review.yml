name: Phase 109 A10 Final Activation Review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-109-a10-final-activation-review.yml'

permissions:
  contents: read

jobs:
  final-review:
    runs-on: [self-hosted, prw-host]
    timeout-minutes: 5
    steps:
      - name: Read-only final activation and readiness review
        shell: bash
        run: |
          set -Eeuo pipefail
          agent='/usr/lib/private-remote-workspace/prw-agent'
          unit='/usr/lib/systemd/user/prw-agent.service'
          link='/home/gersi365/.config/systemd/user/default.target.wants/prw-agent.service'
          socket='/run/user/1000/private-remote-workspace/agent.sock'
          expected_agent='8d0fa919676d1d55200801dd979a5463228610ad0f5aea1d2fd8bbded7047fbf'
          expected_unit='24f646dc96777542904cd824f1678e6c32256b64911d4a031c0315d198c0a909'

          echo '=== PRW PHASE 109 FINAL READ-ONLY ACTIVATION REVIEW ==='
          test "$(hostname)" = 'PowerCode'
          test "$(id -un)" = 'gersi365'
          test "$(id -u)" = '1000'
          test "${XDG_RUNTIME_DIR:-}" = '/run/user/1000'
          test -S /run/user/1000/bus

          echo '--- installed package files ---'
          test -f "$agent" && test ! -L "$agent"
          test -f "$unit" && test ! -L "$unit"
          test "$(stat -c '%u:%g:%a' "$agent")" = '0:0:755'
          test "$(stat -c '%u:%g:%a' "$unit")" = '0:0:644'
          agent_hash="$(sha256sum "$agent" | cut -d' ' -f1)"
          unit_hash="$(sha256sum "$unit" | cut -d' ' -f1)"
          echo "agent_hash=$agent_hash"
          echo "unit_hash=$unit_hash"
          test "$agent_hash" = "$expected_agent"
          test "$unit_hash" = "$expected_unit"

          echo '--- enablement linkage ---'
          test -L "$link"
          link_target="$(readlink "$link")"
          resolved_link="$(readlink -f "$link")"
          echo "enablement_link_target=$link_target"
          echo "enablement_link_resolved=$resolved_link"
          test "$resolved_link" = "$unit"

          echo '--- systemd state ---'
          test "$(systemctl --user is-enabled prw-agent.service)" = 'enabled'
          test "$(systemctl --user is-active prw-agent.service)" = 'active'
          systemctl --user show prw-agent.service -p LoadState -p ActiveState -p SubState -p UnitFileState -p MainPID -p ExecMainPID -p ExecMainStatus -p Result -p NeedDaemonReload
          main_pid="$(systemctl --user show prw-agent.service -p MainPID --value)"
          test "$main_pid" -gt 0
          test -e "/proc/$main_pid/exe"
          resolved_exe="$(readlink -f "/proc/$main_pid/exe")"
          echo "main_pid=$main_pid"
          echo "resolved_exe=$resolved_exe"
          test "$resolved_exe" = "$agent"

          echo '--- runtime path and IPC trusted shape ---'
          test -d /run/user/1000/private-remote-workspace
          test "$(stat -c '%u:%g:%a' /run/user/1000/private-remote-workspace)" = '1000:1000:700'
          test -S "$socket"
          test "$(stat -c '%u:%g:%a' "$socket")" = '1000:1000:600'
          stat -Lc '%n mode=%a uid=%u gid=%g type=%F' /run/user/1000/private-remote-workspace "$socket"

          echo '--- independent GetAgentStatus readiness probe ---'
          python3 - <<'PY'
          import socket, struct
          path = '/run/user/1000/private-remote-workspace/agent.sock'
          request_id = 10910
          header = b'PRW\x00' + struct.pack('>HHBBH', 1, 0, 1, 0, 0) + struct.pack('>QI', request_id, 2)
          request = header + b'\x00\x01'
          assert len(header) == 24
          assert len(request) == 26

          def recv_exact(sock, n):
              data = bytearray()
              while len(data) < n:
                  chunk = sock.recv(n - len(data))
                  if not chunk:
                      raise SystemExit('unexpected_eof')
                  data.extend(chunk)
              return bytes(data)

          with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
              s.settimeout(2.0)
              s.connect(path)
              s.sendall(request)
              h = recv_exact(s, 24)
              if h[:4] != b'PRW\x00': raise SystemExit('invalid_magic')
              major, minor = struct.unpack('>HH', h[4:8])
              kind, flags = h[8], h[9]
              reserved = h[10:12]
              rid = struct.unpack('>Q', h[12:20])[0]
              plen = struct.unpack('>I', h[20:24])[0]
              if (major, minor) != (1, 0): raise SystemExit('invalid_protocol')
              if kind != 2: raise SystemExit('invalid_kind')
              if flags != 0 or reserved != b'\x00\x00': raise SystemExit('invalid_reserved')
              if rid != request_id: raise SystemExit('invalid_request_id')
              if plen != 7: raise SystemExit(f'invalid_payload_len:{plen}')
              payload = recv_exact(s, plen)

          status = struct.unpack('>H', payload[:2])[0]
          body = payload[2:]
          if status != 0: raise SystemExit(f'nonzero_status:{status}')
          if body != bytes([2,0,1,0,0]): raise SystemExit(f'not_ready:{body.hex()}')
          print('final_ipc_status=ok')
          print('final_runtime_state=ready')
          print('final_protocol=1.0')
          PY

          echo '--- linger ownership reconciliation ---'
          linger="$(loginctl show-user gersi365 -p Linger --value)"
          runtime_path="$(loginctl show-user gersi365 -p RuntimePath --value)"
          echo "linger=$linger"
          echo "runtime_path=$runtime_path"
          test "$linger" = 'yes'
          test "$runtime_path" = '/run/user/1000'
          echo 'linger_source=pre_existing_before_phase109'
          echo 'linger_mutation=none'

          echo 'phase109_final_activation_review=pass'
