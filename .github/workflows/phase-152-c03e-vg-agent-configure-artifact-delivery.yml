name: Phase 152 C03e-VG Agent Configure Artifact Delivery

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/prw-agent-systemd-orchestration/**"
      - "packaging/systemd/AGENT_CONFIGURE_ARTIFACT_DELIVERY.md"
      - "packaging/systemd/AGENT_CONFIGURE_INSTALL_TRANSACTION.md"
      - "packaging/systemd/install-prw-agent-configure.sh"
      - "packaging/systemd/README.md"
      - "scripts/prepare-phase-152-c03e-vg-agent-configure-artifact.sh"
      - "scripts/validate-phase-152-c03e-ve-agent-configure-packaging.sh"
      - ".github/workflows/phase-152-c03e-vg-agent-configure-artifact-delivery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-152-c03e-vg-agent-configure-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deliver:
    name: Build, validate and retain prw-agent-configure artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact source head
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          expected_sha='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$source_sha" = "$expected_sha"
          test "${#source_sha}" -eq 40
          echo "PRW_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "source_git_sha=$source_sha"

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y protobuf-compiler

      - name: Record toolchain
        run: |
          rustc --version
          cargo --version
          protoc --version
          bash --version | head -n 1

      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Reprove disposable package transaction on retained build
        run: bash scripts/validate-phase-152-c03e-ve-agent-configure-packaging.sh

      - name: Prepare checksum-bound delivery bundle
        shell: bash
        run: |
          set -euo pipefail
          delivery="$RUNNER_TEMP/c03e-vg-agent-configure-delivery"
          bash scripts/prepare-phase-152-c03e-vg-agent-configure-artifact.sh \
            --artifact target/debug/prw-agent-configure \
            --output "$delivery" \
            --source-sha "$PRW_SOURCE_SHA"
          echo "PRW_DELIVERY_DIR=$delivery" >> "$GITHUB_ENV"

      - name: Validate exact delivery bundle before upload
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRW_DELIVERY_DIR"
          test "$(find . -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
          test "$(find . -mindepth 1 -maxdepth 1 -type l | wc -l)" -eq 0
          test -f prw-agent-configure
          test -f SHA256SUMS
          test -f ARTIFACT-MANIFEST.txt
          sha256sum -c SHA256SUMS
          cmp -s prw-agent-configure "$GITHUB_WORKSPACE/target/debug/prw-agent-configure"
          binary_sha="$(sha256sum prw-agent-configure | awk '{print $1}')"
          grep -Fxq "source_git_sha=$PRW_SOURCE_SHA" ARTIFACT-MANIFEST.txt
          grep -Fxq "binary_sha256=$binary_sha" ARTIFACT-MANIFEST.txt
          grep -Fxq 'production_host_transfer=NOT_AUTHORIZED' ARTIFACT-MANIFEST.txt
          grep -Fxq 'production_host_staging=NOT_AUTHORIZED' ARTIFACT-MANIFEST.txt
          grep -Fxq 'real_root_install=NOT_AUTHORIZED' ARTIFACT-MANIFEST.txt
          grep -Fxq 'managed_configuration_write=NOT_AUTHORIZED' ARTIFACT-MANIFEST.txt
          grep -Fxq 'daemon_reload=NOT_AUTHORIZED' ARTIFACT-MANIFEST.txt
          grep -Fxq 'agent_activation=NOT_AUTHORIZED' ARTIFACT-MANIFEST.txt
          echo "retained_binary_sha256=$binary_sha"

      - name: Upload retained agent-configure artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c03e-vg-prw-agent-configure-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.PRW_DELIVERY_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Record retained artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_URL"
          test -n "$ARTIFACT_DIGEST"
          test "${#ARTIFACT_DIGEST}" -eq 64
          printf 'retained_artifact_id=%s\n' "$ARTIFACT_ID"
          printf 'retained_artifact_url=%s\n' "$ARTIFACT_URL"
          printf 'retained_artifact_digest_sha256=%s\n' "$ARTIFACT_DIGEST"
          printf 'retained_artifact_source_git_sha=%s\n' "$PRW_SOURCE_SHA"
          printf 'retained_artifact_retention_days=90\n'
          printf 'C03E_VG_ARTIFACT_DELIVERY=PASS\n'
