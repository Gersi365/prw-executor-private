name: Phase 152 C03e-PT transient guarded two-path materializer

on:
  push:
    branches:
      - phase-152-c03e-pt-production-requester-rendezvous-expected-device-admission-fallible-verifier-time-endpoint-lifecycle-runtime-composition-source-materialization

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phase-152-c03e-pt-production-requester-rendezvous-expected-device-admission-fallible-verifier-time-endpoint-lifecycle-runtime-composition-source-materialization

      - name: Guard and materialize exact PS-selected two-path seam
        shell: bash
        run: |
          set -euo pipefail

          BRANCH='phase-152-c03e-pt-production-requester-rendezvous-expected-device-admission-fallible-verifier-time-endpoint-lifecycle-runtime-composition-source-materialization'
          PS_HEAD='6b5fcc46a9e2294d715daede3e3e5824ba879a3a'
          FAILED_CANDIDATE='055922095bf95d21b400bdc236c1d94ec0273301'
          HELPER='.github/workflows/phase-152-c03e-pt-transient-materializer.yml'
          EXEC='crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs'
          ENDPOINT='crates/prw-agent/src/remote_session_capability_runtime/remote_session_endpoint_lifecycle_runtime.rs'
          EXPECTED_EXEC_BLOB='7ea5dbe8d6e7844d4c38ddd78c42e84311ac6d54'
          EXPECTED_ENDPOINT_BLOB='e9f82f32ba875c2461513e445f81962720dc3298'
          FAILED_CANDIDATE_ENDPOINT_BLOB='6ad9dde485fb772d63f794c18960ed21e782de9e'
          TARGET='drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle'

          test "$(git merge-base HEAD "$PS_HEAD")" = "$PS_HEAD"
          mapfile -t pre_source_paths < <(git diff --name-only "$PS_HEAD"...HEAD | sort)
          test "${#pre_source_paths[@]}" -eq 1
          test "${pre_source_paths[0]}" = "$HELPER"

          test "$(git hash-object "$EXEC")" = "$EXPECTED_EXEC_BLOB"
          test "$(git hash-object "$ENDPOINT")" = "$EXPECTED_ENDPOINT_BLOB"
          test "$(grep -cF "$TARGET" "$ENDPOINT" || true)" = '0'
          test "$(grep -cF 'pub(super) fn drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle<' "$EXEC")" = '1'
          test "$(git show "$FAILED_CANDIDATE:$ENDPOINT" | git hash-object --stdin)" = "$FAILED_CANDIDATE_ENDPOINT_BLOB"

          git diff --no-color "$PS_HEAD" "$FAILED_CANDIDATE" -- "$ENDPOINT" > /tmp/c03e-pt-endpoint.patch
          test -s /tmp/c03e-pt-endpoint.patch
          git apply --check /tmp/c03e-pt-endpoint.patch
          git apply /tmp/c03e-pt-endpoint.patch
          test "$(git hash-object "$ENDPOINT")" = "$FAILED_CANDIDATE_ENDPOINT_BLOB"

          python3 - <<'PY'
          from pathlib import Path

          exec_path = Path('crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs')
          endpoint_path = Path('crates/prw-agent/src/remote_session_capability_runtime/remote_session_endpoint_lifecycle_runtime.rs')

          executor = exec_path.read_text()
          old_visibility = 'pub(super) fn drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle<'
          new_visibility = 'pub(in crate::remote_session_capability_runtime) fn drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle<'
          assert executor.count(old_visibility) == 1
          assert executor.count(new_visibility) == 0
          executor = executor.replace(old_visibility, new_visibility, 1)
          exec_path.write_text(executor)

          endpoint = endpoint_path.read_text()
          import_anchor = 'use super::requester_rendezvous_retained_custody_dr_continuation::{\n'
          sibling_import = 'use super::remote_session_executor_runtime::RemoteSessionFallibleVerifierTimeRegisteredWorkerCompletion;\n'
          assert endpoint.count(import_anchor) == 1
          assert sibling_import not in endpoint
          endpoint = endpoint.replace(import_anchor, sibling_import + import_anchor, 1)

          old_completion = 'C: FnMut(super::RemoteSessionFallibleVerifierTimeRegisteredWorkerCompletion),'
          new_completion = 'C: FnMut(RemoteSessionFallibleVerifierTimeRegisteredWorkerCompletion),'
          assert endpoint.count(old_completion) == 1
          assert endpoint.count(new_completion) == 0
          endpoint = endpoint.replace(old_completion, new_completion, 1)
          endpoint_path.write_text(endpoint)
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "$ENDPOINT"
          test "${changed[1]}" = "$EXEC"

          test "$(grep -cF "$TARGET" "$ENDPOINT")" = '2'
          test "$(grep -cF 'pub(in crate::remote_session_capability_runtime) fn drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle<' "$EXEC")" = '1'
          test "$(grep -cF 'pub(super) fn drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle<' "$EXEC" || true)" = '0'
          test "$(grep -cF 'use super::remote_session_executor_runtime::RemoteSessionFallibleVerifierTimeRegisteredWorkerCompletion;' "$ENDPOINT")" = '1'
          test "$(grep -cF 'C: FnMut(RemoteSessionFallibleVerifierTimeRegisteredWorkerCompletion),' "$ENDPOINT")" = '1'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EXEC" "$ENDPOINT"
          git commit -m 'C03e-PT: materialize corrected fallible verifier-time endpoint lifecycle runtime composition'
          git push origin "HEAD:$BRANCH"
