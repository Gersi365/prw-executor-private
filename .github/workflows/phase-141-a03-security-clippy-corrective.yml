name: Phase 141 A03 Security and Clippy Corrective

on:
  push:
    paths:
      - '.github/workflows/phase-141-a03-security-clippy-corrective.yml'

permissions:
  contents: write

jobs:
  correct-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Prove corrective prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f contracts/NAT_TRAVERSAL_CONNECTIVITY_CHECKS_CONTRACT.md
          test -f crates/prw-nat-traversal/src/lib.rs
          test -f crates/prw-nat-traversal/tests/security_boundaries.rs
          rustc --version | grep -Fq 'rustc 1.97.1'
          cargo --version | grep -Fq 'cargo 1.97.1'
          grep -Fq '#[derive(Debug, Clone, PartialEq, Eq)]' crates/prw-nat-traversal/src/lib.rs
          grep -Fq 'message::{BINDING_REQUEST, Getter, Message, TransactionId}' crates/prw-nat-traversal/src/lib.rs
          test "$(grep -Fc 'datagram: TraversalDatagram,' crates/prw-nat-traversal/src/lib.rs)" -eq 2
          echo phase141_a03_prerequisite=pass

      - name: Apply exact bounded correctives
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('crates/prw-nat-traversal/src/lib.rs')
          text = source.read_text()

          old = '''#[derive(Debug, Clone, PartialEq, Eq)]
          pub struct IceCredentials {
              ufrag: String,
              password: String,
          }

          impl IceCredentials {'''.replace('          ', '')
          new = '''#[derive(Clone, PartialEq, Eq)]
          pub struct IceCredentials {
              ufrag: String,
              password: String,
          }

          impl fmt::Debug for IceCredentials {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter
                      .debug_struct("IceCredentials")
                      .field("ufrag", &self.ufrag)
                      .field("password", &"<redacted>")
                      .finish()
              }
          }

          impl IceCredentials {'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('IceCredentials corrective boundary mismatch')
          text = text.replace(old, new)

          old = 'message::{BINDING_REQUEST, Getter, Message, TransactionId},'
          new = 'message::{BINDING_REQUEST, BINDING_SUCCESS, Getter, Message, TransactionId},'
          if text.count(old) != 1:
              raise SystemExit('STUN import corrective boundary mismatch')
          text = text.replace(old, new)

          old = '''            let StunEvent::Message(message) = event else {
              return Err(TraversalError::StunTransactionFailed);
          };
          let mut mapped = XorMappedAddress::default();'''.replace('          ', '')
          new = '''            let StunEvent::Message(message) = event else {
              return Err(TraversalError::StunTransactionFailed);
          };
          if message.typ != BINDING_SUCCESS {
              return Err(TraversalError::StunTransactionFailed);
          }
          let mut mapped = XorMappedAddress::default();'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('STUN success-type corrective boundary mismatch')
          text = text.replace(old, new)

          signature = '        datagram: TraversalDatagram,\n        now: Instant,'
          if text.count(signature) != 2:
              raise SystemExit('handle_datagram signature corrective boundary mismatch')
          text = text.replace(
              signature,
              '        datagram: &TraversalDatagram,\n        now: Instant,',
          )

          text, temporary_calls = re.subn(
              r'(\.handle_datagram\(\s*)(TraversalDatagram::new\()',
              r'\1&\2',
              text,
          )
          if temporary_calls != 2:
              raise SystemExit(f'unexpected source temporary handle_datagram call count: {temporary_calls}')

          direct_calls = text.count('.handle_datagram(inbound, now)')
          if direct_calls != 2:
              raise SystemExit(f'unexpected source inbound handle_datagram call count: {direct_calls}')
          text = text.replace('.handle_datagram(inbound, now)', '.handle_datagram(&inbound, now)')
          source.write_text(text)

          security_test = Path('crates/prw-nat-traversal/tests/security_boundaries.rs')
          test_text = security_test.read_text()
          test_text, test_calls = re.subn(
              r'(\.handle_datagram\(\s*)(TraversalDatagram::new\()',
              r'\1&\2',
              test_text,
          )
          if test_calls != 1:
              raise SystemExit(f'unexpected security test handle_datagram call count: {test_calls}')
          security_test.write_text(test_text)
          PY
          grep -Fq '.field("password", &"<redacted>")' crates/prw-nat-traversal/src/lib.rs
          grep -Fq 'if message.typ != BINDING_SUCCESS' crates/prw-nat-traversal/src/lib.rs
          test "$(grep -Fc 'datagram: &TraversalDatagram,' crates/prw-nat-traversal/src/lib.rs)" -eq 2
          echo phase141_a03_source_corrective=pass

      - name: Materialize exact workspace graph transactionally
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          member = '    "crates/prw-nat-traversal",\n'
          if member not in text:
              needle = '    "crates/prw-connectivity",\n'
              if text.count(needle) != 1:
                  raise SystemExit('Phase 141 workspace insertion point mismatch')
              text = text.replace(needle, needle + member)
              cargo.write_text(text)
          PY
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > /tmp/phase141-a03-metadata.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/phase141-a03-metadata.json'))
          root=next(p for p in data['packages'] if p['name']=='prw-nat-traversal')
          direct={d['name']: d['req'] for d in root['dependencies']}
          expected={
            'prw-connectivity':'*',
            'prw-core':'*',
            'rtc-ice':'=0.20.2',
            'rtc-shared':'=0.20.2',
            'rtc-stun':'=0.20.2',
            'sansio':'=1.0.0',
          }
          if direct != expected:
              raise SystemExit(f'Phase 141 direct dependency mismatch: {direct!r}')
          versions={p['name']:p['version'] for p in data['packages'] if p['name'] in {'rtc-ice','rtc-shared','rtc-stun','sansio'}}
          expected_versions={'rtc-ice':'0.20.2','rtc-shared':'0.20.2','rtc-stun':'0.20.2','sansio':'1.0.0'}
          if versions != expected_versions:
              raise SystemExit(f'Phase 141 exact version mismatch: {versions!r}')
          print('phase141_a03_exact_graph=pass')
          PY
          echo "phase141_a03_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"

      - name: Re-prove static security and Sans-I/O boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          source=crates/prw-nat-traversal/src/lib.rs
          for forbidden in \
            'UdpSocket' 'TcpStream' 'TcpListener' 'ToSocketAddrs' 'lookup_host' \
            'tokio::' 'std::process' 'Command::new' '/dev/net/tun' 'iptables' 'nftables'; do
            if grep -Fq "$forbidden" "$source"; then
              echo "phase141_forbidden_runtime_token=$forbidden" >&2
              exit 1
            fi
          done
          grep -Fq 'MulticastDnsMode::Disabled' "$source"
          grep -Fq 'NetworkType::Udp4' "$source"
          grep -Fq 'NetworkType::Udp6' "$source"
          grep -Fq 'RelayDeferred' "$source"
          grep -Fq 'MAX_TRAVERSAL_DATAGRAM_BYTES: usize = 2048' "$source"
          grep -Fq '.field("password", &"<redacted>")' "$source"
          grep -Fq 'if message.typ != BINDING_SUCCESS' "$source"
          echo phase141_a03_static_boundary=pass

      - name: Format and focused validation
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all
          git diff --check -- . ':!target'
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-nat-traversal --all-targets --all-features -- -D warnings
          cargo test --locked -p prw-nat-traversal --all-targets
          echo phase141_a03_focused_validation=pass

      - name: Full workspace validation
        id: workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          source_sha=$(sha256sum crates/prw-nat-traversal/src/lib.rs | cut -d' ' -f1)
          echo "lock_sha=$lock_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "phase141_a03_workspace_validation=pass lock_sha=$lock_sha source_sha=$source_sha"

      - name: Write authoritative Phase 141 report
        shell: bash
        env:
          LOCK_SHA: ${{ steps.workspace.outputs.lock_sha }}
          SOURCE_SHA: ${{ steps.workspace.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          report_dir=logs/audits/phase-141-nat-traversal-connectivity-checks
          report="$report_dir/PRW-PHASE-141-NAT-TRAVERSAL-CONNECTIVITY-CHECKS-VALIDATION.txt"
          mkdir -p "$report_dir"
          cat > "$report" <<EOF
          Private Remote Workspace
          Phase 141 — NAT Traversal and Connectivity Checks

          STATUS:
          PASS / STANDARD_ICE_STUN / SANS_IO_BOUNDARY / PHASE135_SELECTOR_PRESERVED / CREDENTIAL_DEBUG_REDACTED / STUN_BINDING_SUCCESS_REQUIRED / FULL_WORKSPACE_VALIDATION_PASS / NO_PRODUCTION_NETWORK_SIDE_EFFECT

          Repository: Gersi365/prw-executor-private
          Branch: main
          Date: 2026-08-16
          Validation source head: $GITHUB_SHA
          Authoritative validation run: $GITHUB_RUN_ID
          Cargo.lock SHA-256: $LOCK_SHA
          prw-nat-traversal/src/lib.rs SHA-256: $SOURCE_SHA

          CONTRACT
          contracts/NAT_TRAVERSAL_CONNECTIVITY_CHECKS_CONTRACT.md

          IMPLEMENTATION
          crates/prw-nat-traversal

          DEPENDENCY DECISION
          Stable rtc-ice 0.20.2, rtc-stun 0.20.2, rtc-shared 0.20.2 and sansio 1.0.0, with default features disabled and AWS-LC selected for ICE/STUN cryptographic integrity paths.

          CORRECTIVE HISTORY
          Dependency probe run 31951951887 resolved exact versions and stopped only on a scratch-harness Vec<u8>/BytesMut construction mismatch. A01 run 31952085411 / job 95177012142 passed exact-version compile and repository-immutability checks on Rust/Cargo 1.97.1; scratch lock SHA-256 was ad791a289eb61b6d5839d8b94d612b2e67fbd6efa837f3648766393935e6cb96.
          Initial implementation validation run 31952482522 stopped only because its guard included tracked target build metadata. Validation run 31952566378 then passed prerequisite, exact graph, static and formatting gates and stopped safely at Clippy on two needless-pass-by-value findings. A03 corrected those API signatures to borrow datagrams, redacted ICE passwords from Debug output, and required actual STUN Binding success before accepting XOR-MAPPED-ADDRESS.

          SECURITY/ARCHITECTURE OUTCOME
          The traversal crate owns no socket, async runtime, DNS resolver, process, TUN/TAP, route or firewall API. Traversal datagrams are bounded to 2048 bytes. STUN discovery uses one explicit server SocketAddr, rejects wrong-source responses, and accepts mapped endpoints only from a Binding success. ICE is UDP4/UDP6 only with mDNS disabled and relay allocation deferred to Phase 142. Successful ICE selection yields only a reachability observation correlated to an existing Phase 135 CandidateId; Phase 135 remains the authoritative LocalDirect -> InternetDirect -> Relay -> Offline selector. ICE passwords are not exposed by PRW Debug output.

          VALIDATION
          Focused rustfmt, Clippy -D warnings and all-target tests passed, including credential-redaction and non-success-STUN negative tests. Full workspace/all-target Clippy, tests and build passed under the locked graph.

          PRODUCTION BOUNDARY
          No PowerCode production socket, service, Agent, key/certificate, firewall/NAT/router/TUN/TAP/route/DNS, persistent STUN/ICE/TURN traffic or relay was changed or activated.

          FINAL CLASSIFICATION
          PHASE_141_DONE / READY_FOR_PHASE_142_SOURCE_DISPOSABLE_RELAY_PROVIDER_WORK
          EOF

      - name: Commit validated Phase 141 materialization only
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check -- . ':!target'
          git config user.name Gersi365
          git config user.email Gersi365@outlook.com
          git add Cargo.toml Cargo.lock crates/prw-nat-traversal \
            logs/audits/phase-141-nat-traversal-connectivity-checks/PRW-PHASE-141-NAT-TRAVERSAL-CONNECTIVITY-CHECKS-VALIDATION.txt
          git commit -m 'phase 141: validate NAT traversal and connectivity checks'
          git push origin HEAD:main
          echo phase141_a03_materialization=pass
