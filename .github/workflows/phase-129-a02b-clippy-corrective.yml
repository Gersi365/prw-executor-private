name: Phase 129 A02B Clippy Corrective

on:
  push:
    paths:
      - '.github/workflows/phase-129-a02b-clippy-corrective.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact correctives and self-clean temporary workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          lib = Path('crates/prw-control-transport/src/lib.rs')
          text = lib.read_text()
          text2, count = re.subn(
              r'(?m)^fn validate_timeout\(timeout: Duration\) -> Result<\(\), ControlTransportError> \{$',
              'const fn validate_timeout(timeout: Duration) -> Result<(), ControlTransportError> {',
              text,
          )
          if count != 1:
              raise SystemExit(f'validate_timeout replacement count={count}')
          lib.write_text(text2)

          test = Path('crates/prw-control-transport/tests/tls_loopback.rs')
          text = test.read_text()
          text2, count = re.subn(
              r'(?m)^\s*net::\{TcpListener, TcpStream\},$',
              '    net::TcpListener,',
              text,
          )
          if count != 1:
              raise SystemExit(f'TcpStream import replacement count={count}')
          test.write_text(text2)
          PY

          cargo fmt --all -- --check
          grep -Fq 'const fn validate_timeout(timeout: Duration) -> Result<(), ControlTransportError> {' crates/prw-control-transport/src/lib.rs
          ! grep -Fq 'TcpStream' crates/prw-control-transport/tests/tls_loopback.rs

          git rm -f -- .github/workflows/phase-129-a02b-clippy-corrective.yml
          if [[ -e .github/workflows/phase-129-a02-clippy-corrective.yml ]]; then
            git rm -f -- .github/workflows/phase-129-a02-clippy-corrective.yml
          fi

          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              crates/prw-control-transport/src/lib.rs|\
              crates/prw-control-transport/tests/tls_loopback.rs|\
              .github/workflows/phase-129-a02-clippy-corrective.yml|\
              .github/workflows/phase-129-a02b-clippy-corrective.yml) ;;
              *) echo "unexpected_corrective_path=$path" >&2; exit 1 ;;
            esac
          done
          git diff --check
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          git add -A
          git commit -m 'phase 129 a02: satisfy Clippy transport lints'
          git push origin HEAD:main
          echo 'phase129_a02b_corrective=pass'
