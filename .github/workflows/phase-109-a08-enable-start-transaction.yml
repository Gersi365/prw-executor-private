name: Phase 109 A08 Enable Start Transaction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-109-a08-enable-start-transaction.yml'

permissions:
  contents: read

jobs:
  enable-start:
    runs-on: [self-hosted, prw-host]
    timeout-minutes: 5
    steps:
      - name: Enable and start with bounded readiness proof and rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          agent='/usr/lib/private-remote-workspace/prw-agent'
          unit='/usr/lib/systemd/user/prw-agent.service'
          socket='/run/user/1000/private-remote-workspace/agent.sock'
          expected_agent='8d0fa919676d1d55200801dd979a5463228610ad0f5aea1d2fd8bbded7047fbf'
          expected_unit='24f646dc96777542904cd824f1678e6c32256b64911d4a031c0315d198c0a909'
          enabled_by_tx=0
          started_by_tx=0

          rollback() {
            rc=$?
            trap - ERR INT TERM
            echo "phase109_enable_start=rollback_begin rc=$rc" >&2
            if (( started_by_tx || enabled_by_tx )); then
              systemctl --user disable --now prw-agent.service || true
            fi
            rb_enabled="$(systemctl --user is-enabled prw-agent.service 2>/dev/null || true)"
            rb_active="$(systemctl --user is-active prw-agent.service 2>/dev/null || true)"
            echo "rollback_enabled=$rb_enabled" >&2
            echo "rollback_active=$rb_active" >&2
            systemctl --user show prw-agent.service -p LoadState -p ActiveState -p SubState -p UnitFileState -p MainPID -p Result 2>&1 || true
            echo "phase109_enable_start=rolled_back rc=$rc" >&2
            exit "$rc"
          }
          trap rollback ERR INT TERM

          echo '=== PRW PHASE 109 ENABLE/START TRANSACTION ==='
          test "$(hostname)" = 'PowerCode'
          test "$(id -un)" = 'gersi365'
          test "$(id -u)" = '1000'
          test "${XDG_RUNTIME_DIR:-}" = '/run/user/1000'
          test -S /run/user/1000/bus
          command -v python3 >/dev/null

          echo '--- immutable preflight ---'
          test -f "$agent"
          test ! -L "$agent"
          test -f "$unit"
          test ! -L "$unit"
          test "$(stat -c '%u:%g:%a' "$agent")" = '0:0:755'
          test "$(stat -c '%u:%g:%a' "$unit")" = '0:0:644'
          test "$(sha256sum "$agent" | cut -d' ' -f1)" = "$expected_agent"
          test "$(sha256sum "$unit" | cut -d' ' -f1)" = "$expected_unit"
          test "$(loginctl show-user gersi365 -p Linger --value)" = 'yes'

          before_enabled="$(systemctl --user is-enabled prw-agent.service 2>/dev/null || true)"
          before_active="$(systemctl --user is-active prw-agent.service 2>/dev/null || true)"
          echo "before_enabled=$before_enabled"
          echo "before_active=$before_active"
          test "$before_enabled" = 'disabled'
          test "$before_active" = 'inactive'

          echo '--- enable mutation ---'
          systemctl --user enable prw-agent.service
          enabled_by_tx=1
          test "$(systemctl --user is-enabled prw-agent.service)" = 'enabled'
          echo 'enable=success'

          echo '--- start mutation ---'
          systemctl --user start prw-agent.service
          started_by_tx=1
          test "$(systemctl --user is-active prw-agent.service)" = 'active'
          echo 'start=success'

          echo '--- systemd postconditions ---'
          systemctl --user show prw-agent.service -p LoadState -p ActiveState -p SubState -p UnitFileState -p MainPID -p ExecMainPID -p ExecMainStatus -p Result -p RestartUSec
          main_pid="$(systemctl --user show prw-agent.service -p MainPID --value)"
          test "$main_pid" -gt 0
          test -e "/proc/$main_pid/exe"
          resolved_exe="$(readlink -f "/proc/$main_pid/exe")"
          echo "main_pid=$main_pid"
          echo "resolved_exe=$resolved_exe"
          test "$resolved_exe" = "$agent"

          echo '--- IPC readiness proof ---'
          python3 - <<'PY'
          import os
          import socket
          import stat
          import struct
          import time

          path = '/run/user/1000/private-remote-workspace/agent.sock'
          deadline = time.monotonic() + 5.0
          while True:
              try:
                  st = os.lstat(path)
                  if stat.S_ISSOCK(st.st_mode):
                      break
              except FileNotFoundError:
                  pass
              if time.monotonic() >= deadline:
                  raise SystemExit('ipc_socket_timeout')
              time.sleep(0.1)

          st = os.lstat(path)
          mode = stat.S_IMODE(st.st_mode)
          print(f'ipc_socket_uid={st.st_uid}')
          print(f'ipc_socket_gid={st.st_gid}')
          print(f'ipc_socket_mode={mode:03o}')
          if st.st_uid != 1000:
              raise SystemExit('ipc_socket_wrong_uid')
          if mode != 0o600:
              raise SystemExit('ipc_socket_wrong_mode')

          request_id = 109
          header = (
              b'PRW\x00'
              + struct.pack('>H', 1)
              + struct.pack('>H', 0)
              + bytes([1, 0])
              + b'\x00\x00'
              + struct.pack('>Q', request_id)
              + struct.pack('>I', 2)
          )
          request = header + b'\x00\x01'
          if len(request) != 26:
              raise SystemExit('request_wire_length_invalid')

          def recv_exact(sock, size):
              chunks = []
              total = 0
              while total < size:
                  chunk = sock.recv(size - total)
                  if not chunk:
                      raise SystemExit('unexpected_eof')
                  chunks.append(chunk)
                  total += len(chunk)
              return b''.join(chunks)

          with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
              s.settimeout(2.0)
              s.connect(path)
              s.sendall(request)
              response_header = recv_exact(s, 24)
              if response_header[:4] != b'PRW\x00':
                  raise SystemExit('response_magic_invalid')
              major, minor = struct.unpack('>HH', response_header[4:8])
              kind = response_header[8]
              flags = response_header[9]
              reserved = response_header[10:12]
              response_id = struct.unpack('>Q', response_header[12:20])[0]
              payload_len = struct.unpack('>I', response_header[20:24])[0]
              if (major, minor) != (1, 0):
                  raise SystemExit('response_protocol_invalid')
              if kind != 2:
                  raise SystemExit(f'response_kind_invalid:{kind}')
              if flags != 0 or reserved != b'\x00\x00':
                  raise SystemExit('response_reserved_invalid')
              if response_id != request_id:
                  raise SystemExit('response_request_id_invalid')
              if payload_len != 7:
                  raise SystemExit(f'response_payload_length_invalid:{payload_len}')
              payload = recv_exact(s, payload_len)

          status = struct.unpack('>H', payload[:2])[0]
          body = payload[2:]
          if status != 0:
              raise SystemExit(f'agent_status_error:{status}')
          if body != bytes([2, 0, 1, 0, 0]):
              raise SystemExit(f'agent_status_body_invalid:{body.hex()}')

          print('ipc_response_status=ok')
          print('ipc_runtime_state=ready')
          print('ipc_protocol=1.0')
          print('ipc_readiness=success')
          PY

          echo '--- final postconditions ---'
          test "$(systemctl --user is-enabled prw-agent.service)" = 'enabled'
          test "$(systemctl --user is-active prw-agent.service)" = 'active'
          test "$(sha256sum "$agent" | cut -d' ' -f1)" = "$expected_agent"
          test "$(sha256sum "$unit" | cut -d' ' -f1)" = "$expected_unit"
          test "$(loginctl show-user gersi365 -p Linger --value)" = 'yes'
          echo 'linger_unchanged=yes'

          trap - ERR INT TERM
          echo 'phase109_enable_start=success'
