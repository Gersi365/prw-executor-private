name: Phase 131 Authoritative Finalization

on:
  push:
    paths:
      - '.github/workflows/phase-131-authoritative-finalization.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Require Phase 130 authority and normalize exact Phase 131 source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f logs/audits/phase-130-device-registry-workspace-membership/PRW-PHASE-130-REGISTRY-MEMBERSHIP-VALIDATION.txt
          grep -Fq 'PHASE_130_SOURCE_AND_DISPOSABLE_REGISTRY_FOUNDATION_DONE' \
            logs/audits/phase-130-device-registry-workspace-membership/PRW-PHASE-130-REGISTRY-MEMBERSHIP-VALIDATION.txt

          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          member = '    "crates/prw-file-service",\n'
          if member not in text:
              needle = '    "crates/prw-files",\n'
              if text.count(needle) != 1:
                  raise SystemExit('workspace insertion point mismatch')
              cargo.write_text(text.replace(needle, needle + member))

          source = Path('crates/prw-file-service/src/lib.rs')
          text = source.read_text()
          import_line = 'use std::os::unix::fs::PermissionsExt;\n'
          if import_line not in text:
              needle = 'use rustix::{\n'
              if text.count(needle) != 1:
                  raise SystemExit('PermissionsExt insertion point mismatch')
              source.write_text(text.replace(needle, import_line + '\n' + needle))
          PY
          cargo fmt --all

      - name: Generate exact locked dependency graph
        id: lock
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          grep -A3 '^name = "rustix"$' Cargo.lock | grep -Fq 'version = "1.1.4"'
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          echo "sha=$lock_sha" >> "$GITHUB_OUTPUT"
          echo "phase131_lock_sha256=$lock_sha"

      - name: Run focused Phase 131 gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-file-service --all-targets --all-features -- -D warnings 2>&1 | tee phase131-clippy.log
          cargo test --locked -p prw-file-service --all-targets 2>&1 | tee phase131-tests.log
          echo 'phase131_focused_validation=pass'

      - name: Run permanent-equivalent full workspace gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee phase131-workspace-clippy.log
          cargo test --locked --workspace --all-targets 2>&1 | tee phase131-workspace-tests.log
          cargo build --locked --workspace 2>&1 | tee phase131-workspace-build.log
          echo 'phase131_workspace_validation=pass'

      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase131-failure-diagnostics
          path: |
            Cargo.lock
            phase131-*.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Record authoritative report and self-clean on success
        if: success()
        shell: bash
        env:
          LOCK_SHA: ${{ steps.lock.outputs.sha }}
        run: |
          set -Eeuo pipefail
          report_dir='logs/audits/phase-131-remote-file-management-foundation'
          report="$report_dir/PRW-PHASE-131-FILE-MANAGEMENT-FOUNDATION-VALIDATION.txt"
          mkdir -p "$report_dir"
          cat > "$report" <<EOF
          Private Remote Workspace
          Phase 131 — Remote File Management Foundation

          STATUS:
          PASS / CONTRACT_LOCKED / DESCRIPTOR_ANCHORED_ROOT_IMPLEMENTED / PATH_TRAVERSAL_FAIL_CLOSED / CREATE_ONLY_PRIMITIVES_VALIDATED / FULL_WORKSPACE_VALIDATION_PASS / PRODUCTION_REMOTE_FILES_NOT_ACTIVE

          Repository: Gersi365/prw-executor-private
          Branch: main
          Date: 2026-08-16
          Validation source head: $GITHUB_SHA
          Authoritative finalization run: $GITHUB_RUN_ID
          Cargo.lock SHA-256: $LOCK_SHA

          CONTRACT
          contracts/REMOTE_FILE_MANAGEMENT_CONTRACT.md

          IMPLEMENTATION
          crates/prw-file-service

          SECURITY MODEL
          - filesystem authority is anchored to an owned root directory descriptor;
          - no canonicalize-then-open security boundary;
          - descendant traversal is descriptor-relative and uses NOFOLLOW;
          - final regular-file reads use NOFOLLOW;
          - strict relative UTF-8 path components reject absolute paths, empty components, dot, dot-dot, NUL, backslash, and locked bounds;
          - root pathname replacement after descriptor open does not redirect authority;
          - symlink escape attempts fail closed;
          - writes are creation-only and cannot overwrite existing destinations;
          - new files normalize/verify 0600 and new directories 0700;
          - whole-file read/write is bounded to 1 MiB;
          - directory listing is bounded to 4096 entries and rejects lossy non-UTF-8 names.

          OPERATIONS
          - list directory;
          - metadata/stat without final symlink following;
          - bounded regular-file read;
          - creation-only regular-file write;
          - creation-only directory creation.

          VALIDATION
          The authoritative run passed focused rustfmt, Clippy -D warnings and all-target tests for prw-file-service, then full workspace/all-target Clippy, tests and build under the locked dependency graph.

          Disposable tests cover parser boundaries, list/stat/read, intermediate/final symlink rejection, root pathname replacement after descriptor open, create-only modes/non-overwrite, payload bounds, and directory-listing bounds.

          EXPLICITLY DEFERRED
          Phase 132 owns resumable/chunked transfer, transfer identifiers, content integrity, atomic replacement/overwrite semantics, interruption recovery/cleanup, and production transfer hardening. Delete/recursive operations and transport/policy activation remain deferred.

          PRODUCTION BOUNDARY
          No arbitrary PowerCode user files, production PRW state, remote transport, or capability grant were mutated or activated. Production remote file access remains dependent on authenticated transport, current registry validation, explicit file capability policy, and Phase 132 hardening.

          FINAL CLASSIFICATION
          PHASE_131_SOURCE_AND_DISPOSABLE_FILE_FOUNDATION_DONE / NO_PRODUCTION_REMOTE_FILE_SIDE_EFFECT / READY_FOR_PHASE_132_SOURCE_WORK
          EOF

          for path in \
            .github/workflows/phase-131-file-foundation-finalization.yml \
            .github/workflows/phase-131-authoritative-finalization.yml; do
            if [[ -e "$path" ]]; then
              git rm -f -- "$path"
            fi
          done
          rm -f phase131-*.log
          git diff --check
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          git add -A
          git commit -m 'phase 131: finalize anchored file management foundation'
          git push origin HEAD:main
          echo 'phase131_authoritative_finalization=pass'
