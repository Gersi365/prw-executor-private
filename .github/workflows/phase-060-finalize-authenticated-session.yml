name: PRW Phase 060 Finalize Authenticated Session

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase-060-finalize-authenticated-session.yml"

permissions:
  contents: write

jobs:
  finalize:
    name: Integrate validate audit and self-remove
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure exact Phase 060 module integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          session = Path("crates/prw-agent/src/linux_authenticated_session.rs")
          if not session.is_file():
              raise SystemExit("Phase 060 source missing")

          path = Path("crates/prw-agent/src/linux_identity.rs")
          text = path.read_text()

          if text.count('pub mod authenticated_session;') == 0:
              old_doc = '''//! from an already-existing socket file descriptor. Phase 058 adds same-UID
//! authorization, and Phase 059 adds typed authenticated stream ownership. This
//! boundary owns no listener or filesystem socket lifecycle.
'''
              new_doc = '''//! from an already-existing socket file descriptor. Phase 058 adds same-UID
//! authorization, Phase 059 adds typed authenticated stream ownership, and
//! Phase 060 composes authenticated application-session processing. This
//! boundary owns no listener or filesystem socket lifecycle.
'''
              old_modules = '''#[allow(
    dead_code,
    reason = "pre-runtime authenticated Linux connection wrapper is intentionally crate-internal"
)]
#[path = "linux_authenticated_connection.rs"]
pub mod authenticated_connection;
#[allow(
    dead_code,
    reason = "pre-runtime Linux same-UID authorization is intentionally crate-internal"
)]
'''
              new_modules = '''#[allow(
    dead_code,
    reason = "pre-runtime authenticated Linux connection wrapper is intentionally crate-internal"
)]
#[path = "linux_authenticated_connection.rs"]
pub mod authenticated_connection;
#[allow(
    dead_code,
    reason = "pre-runtime authenticated Linux application session is intentionally crate-internal"
)]
#[path = "linux_authenticated_session.rs"]
pub mod authenticated_session;
#[allow(
    dead_code,
    reason = "pre-runtime Linux same-UID authorization is intentionally crate-internal"
)]
'''
              if text.count(old_modules) != 1:
                  raise SystemExit("Phase 060 integration refused: expected module baseline not found exactly once")
              text = text.replace(old_modules, new_modules, 1)
              if old_doc in text:
                  text = text.replace(old_doc, new_doc, 1)
              path.write_text(text)
          elif text.count('pub mod authenticated_session;') != 1:
              raise SystemExit("Phase 060 integration refused: authenticated_session exported more than once")
          PY

      - name: Remove obsolete first-pass integration workflow if present
        run: rm -f .github/workflows/phase-060-integrate-authenticated-session.yml

      - name: Record toolchain
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-targets

      - name: Build workspace
        run: cargo build --locked --workspace --all-targets

      - name: Write authoritative Phase 060 audit after validation
        env:
          PHASE_RUN_ID: ${{ github.run_id }}
          PHASE_HEAD: ${{ github.sha }}
        run: |
          mkdir -p logs/audits/phase-060-linux-authenticated-application-session
          cat > logs/audits/phase-060-linux-authenticated-application-session/PRW-PHASE-060-LINUX-AUTHENTICATED-APPLICATION-SESSION.txt <<EOF
          Private Remote Workspace
          Phase 060 Linux Authenticated Application Session

          STATUS: PASS / IMPLEMENTED_AND_VALIDATED

          PURPOSE

          Compose the Phase 059 same-UID-authenticated Linux connection wrapper with the Phase 052 bounded provider-neutral application loop and one owned LocalServerConnectionState, without creating a listener or filesystem socket lifecycle.

          IMPLEMENTED

          - source: crates/prw-agent/src/linux_authenticated_session.rs
          - authenticated shared stream accessor: crates/prw-agent/src/linux_authenticated_connection.rs
          - platform module integration: crates/prw-agent/src/linux_identity.rs
          - contract: contracts/LINUX_AUTHENTICATED_APPLICATION_SESSION_CONTRACT.md
          - architecture: docs/architecture/PHASE_060_LINUX_AUTHENTICATED_APPLICATION_SESSION.md

          TYPE-LEVEL ORDERING

          Raw connected stream -> Phase 059 wrapper constructor -> Phase 058 kernel SO_PEERCRED same-effective-UID authorization -> AuthenticatedLocalLinuxConnection -> AuthenticatedLocalLinuxSession -> Phase 052 bounded application processing.

          The Phase 060 session constructor does not accept a raw stream. Its processing method operates only on the already-authenticated connection it owns.

          The session also owns the aggregate LocalServerConnectionState, so inbound/read poisoning and response-write poisoning persist across bounded processing invocations exactly as defined by Phases 044-052.

          POLICY BOUNDARY

          The PolicyEvaluator remains caller-supplied. Same-UID transport authentication does not claim or manufacture principal-to-capability binding. Phase 060 preserves that separation explicitly.

          VALIDATED BEHAVIOR

          Linux anonymous UnixStream::pair tests validate:
          - two authenticated Requests processed with a caller budget of two;
          - correlated success responses returned over the same authenticated stream;
          - clean EOF remains a normal stop;
          - malformed/truncated authenticated input updates the session-owned aggregate state to InboundRead;
          - peer credentials retained by the session match the effective Agent UID.

          No filesystem Unix socket pathname or listener is created by these tests.

          VALIDATION

          Authoritative Phase 060 finalizer GitHub Actions run: ${PHASE_RUN_ID}
          Workflow-trigger head before the self-removing audit commit: ${PHASE_HEAD}

          Passed gates:
          - cargo metadata --locked --no-deps --format-version 1
          - cargo fmt --all -- --check
          - cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          - cargo test --locked --workspace --all-targets
          - cargo build --locked --workspace --all-targets

          The finalizer removes itself and any obsolete first-pass Phase 060 integration workflow in the same repository commit after these gates pass. Those workflow-file removals and this audit text do not alter the validated Rust source/dependency tree.

          SCOPE PRESERVED

          Phase 060:
          - binds no filesystem socket;
          - creates no listener;
          - performs no accept/connect lifecycle;
          - creates/removes no XDG runtime path;
          - performs no stale-socket cleanup;
          - creates no automatic principal-bound policy evaluator;
          - adds no unsafe PRW code;
          - activates no service;
          - changes no database/network/DNS/TUN state;
          - performs no deployment.

          FINAL CLASSIFICATION

          AUTHENTICATED_STREAM_TO_BOUNDED_APPLICATION_LOOP_COMPOSED / AGGREGATE_STATE_OWNED / POLICY_BINDING_STILL_SEPARATE / PASS

          AUTHORITATIVE EVIDENCE

          This file is the single authoritative user-facing Phase 060 report.
          EOF

      - name: Self-remove finalizer and commit validated Phase 060 state
        run: |
          rm -f .github/workflows/phase-060-finalize-authenticated-session.yml
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize Phase 060 authenticated application session"
          git push origin HEAD:main
