name: C03e-RV transient one-path materializer

on:
  push:
    branches:
      - phase-152-c03e-rv-production-durable-post-auth-fallible-verifier-time-requester-rendezvous-expected-device-admission-request-construction-fallible-receipt-composition-source-materialization

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Guard, clone validated constructor, self-remove, and push
        shell: bash
        run: |
          set -euo pipefail
          BASE='8be3516c37528348038def4f113b0d50bfc6eb19'
          EXPECTED_BLOB='9129a78a81eab86b523136ea2982037c2214921f'
          TARGET='crates/prw-agent/src/remote_session_capability_runtime/remote_session_endpoint_lifecycle_runtime.rs'
          WF='.github/workflows/c03e-rv-materialize.yml'

          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git hash-object "$TARGET")" = "$EXPECTED_BLOB"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/prw-agent/src/remote_session_capability_runtime/remote_session_endpoint_lifecycle_runtime.rs')
          text = path.read_text()
          helper_doc = '/// Constructs exactly one expected-device admission request from one eligible continuation.\n'
          producer_doc = '/// Produces at most one live expected-device admission request and returns one terminal handoff receipt.\n'
          old_fn = 'construct_remote_session_expected_device_admission_request_with_fallible_verifier_time'
          new_fn = 'construct_remote_session_expected_device_admission_request_with_fallible_verifier_time_and_fallible_receipt'
          old_outcome = 'RemoteSessionExpectedDeviceAdmissionRequestConstructionOutcome'
          new_outcome = 'RemoteSessionExpectedDeviceAdmissionFallibleVerifierTimeRequestConstructionOutcome'
          old_receipt = 'RemoteSessionExpectedDeviceAdmissionHandoffReceipt'
          new_receipt = 'RemoteSessionExpectedDeviceAdmissionFallibleVerifierTimeHandoffReceipt'

          assert text.count(helper_doc) == 1
          assert text.count(producer_doc) == 1
          assert text.count(f'fn {old_fn}<D>') == 1
          assert new_outcome not in text
          assert f'fn {new_fn}<D>' not in text

          start = text.index(helper_doc)
          end = text.index(producer_doc, start)
          template = text[start:end]
          assert template.count(f'fn {old_fn}<D>') == 1
          assert template.count(old_outcome) >= 3
          assert template.count(old_receipt) >= 2

          clone = template.replace(
              'C03e-QH materializes only the QG-selected synchronous request-construction composition before separately gated producer/send composition',
              'C03e-RV materializes only the RU-selected synchronous fallible-receipt request-construction composition before separately gated producer/send composition',
          )
          clone = clone.replace(old_fn, new_fn)
          clone = clone.replace(old_outcome, new_outcome)
          clone = clone.replace(old_receipt, new_receipt)

          enum_block = '''/// Exact local result of one eligible fallible-verifier-time expected-device request-construction attempt.
          ///
          /// `Constructed` reuses the existing verifier-time-agnostic constructed-handoff custody.
          /// `ConstructionFailed` retains only the existing fallible terminal handoff receipt.
          #[allow(
              dead_code,
              clippy::large_enum_variant,
              reason = "C03e-RV materializes only the RU-selected fallible request-construction outcome before separately gated async producer/send composition"
          )]
          enum RemoteSessionExpectedDeviceAdmissionFallibleVerifierTimeRequestConstructionOutcome<D> {
              Constructed(RemoteSessionExpectedDeviceAdmissionConstructedHandoff<D>),
              ConstructionFailed(RemoteSessionExpectedDeviceAdmissionFallibleVerifierTimeHandoffReceipt),
          }

          '''

          text = text[:end] + enum_block + clone + text[end:]
          path.write_text(text)
          PY

          git diff --check
          test "$(grep -F -c 'enum RemoteSessionExpectedDeviceAdmissionFallibleVerifierTimeRequestConstructionOutcome<D>' "$TARGET")" = '1'
          test "$(grep -F -c 'fn construct_remote_session_expected_device_admission_request_with_fallible_verifier_time_and_fallible_receipt<D>' "$TARGET")" = '1'
          test "$(grep -F -c 'fn construct_remote_session_expected_device_admission_request_with_fallible_verifier_time<D>' "$TARGET")" = '1'
          test "$(grep -F -c 'ConstructionFailed(RemoteSessionExpectedDeviceAdmissionFallibleVerifierTimeHandoffReceipt)' "$TARGET")" = '1'

          git add "$TARGET"
          git rm "$WF"

          mapfile -t paths < <(git diff --cached --name-only "$BASE")
          test "${#paths[@]}" = '1'
          test "${paths[0]}" = "$TARGET"

          stats="$(git diff --cached --numstat "$BASE" -- "$TARGET")"
          additions="$(awk '{print $1}' <<<"$stats")"
          deletions="$(awk '{print $2}' <<<"$stats")"
          test "$additions" -gt 0
          test "$deletions" = '0'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'C03e-RV: materialize fallible request-construction receipt composition'
          git push origin "HEAD:${GITHUB_REF_NAME}"
