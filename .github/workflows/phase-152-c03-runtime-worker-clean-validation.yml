name: Phase 152 C03 Clean Management Worker Validation

on:
  push:
    branches:
      - phase-152-c03-runtime-worker-clean-integration

permissions:
  contents: write

concurrency:
  group: phase-152-c03-runtime-worker-clean-validation
  cancel-in-progress: true

jobs:
  validate-clean-worker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: /tmp/prw-c03-clean-worker-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact clean source parent
        run: |
          set -euo pipefail
          SOURCE_HEAD=16f1612067472be89624689bc7915c3b679f433a
          BASE_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${SOURCE_HEAD}"
          REMOTE_HEAD="$(git ls-remote origin refs/heads/phase-152-c03-runtime-worker-clean-integration | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${BASE_HEAD}"
          echo "BASE_HEAD=${BASE_HEAD}" >> "$GITHUB_ENV"

      - name: Isolate build artifacts
        run: |
          rm -rf target
          rm -rf "$CARGO_TARGET_DIR"

      - name: Install desktop native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev

      - name: Validate full Rust workspace
        run: |
          set +e
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          METADATA_RC=$?
          cargo fmt --all -- --check
          FMT_RC=$?
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          CLIPPY_RC=$?
          cargo test --locked --workspace --all-targets
          TEST_RC=$?
          cargo build --locked --workspace --all-targets
          BUILD_RC=$?
          set -e

          REPORT="logs/audits/phase-152-c03-runtime-management-integration/C03_RUNTIME_WORKER_CLEAN_VALIDATION_${BASE_HEAD}.txt"
          mkdir -p "$(dirname "${REPORT}")"
          {
            echo "PHASE=152"
            echo "SLICE=C03"
            echo "TRANCHE=RUNTIME_MANAGEMENT_WORKER"
            echo "SOURCE_HEAD=16f1612067472be89624689bc7915c3b679f433a"
            echo "VALIDATOR_HEAD=${BASE_HEAD}"
            echo "PROOF_RUN_ID=32240460154"
            echo "PROOF_FOCUSED_TESTS=PASS"
            echo "PROOF_AGENT_CLIPPY=PASS"
            echo "LEGACY_PUBLIC_WORKER_IMPLEMENTATION_CHANGED=NO"
            echo "MANAGEMENT_WORKER_VISIBILITY=pub(super)"
            echo "WORKER_PERMIT_RAII=PRESERVED"
            echo "REQUEST_BUDGET_SEMANTICS=PRESERVED"
            echo "READ_DEADLINE_SEMANTICS=PRESERVED"
            echo "DEFERRED_WRITE_DEADLINE_SEMANTICS=PRESERVED"
            echo "MANAGEMENT_LOCK_BEFORE_CLASSIFICATION=NO"
            echo "SPAWN_ADAPTER_ACTIVATION=NO"
            echo "SCHEDULER_ACTIVATION=NO"
            echo "BOOTSTRAP_ACTIVATION=NO"
            echo "METADATA_RC=${METADATA_RC}"
            echo "FMT_RC=${FMT_RC}"
            echo "CLIPPY_RC=${CLIPPY_RC}"
            echo "TEST_RC=${TEST_RC}"
            echo "BUILD_RC=${BUILD_RC}"
          } > "${REPORT}"

          if [ "${METADATA_RC}" -eq 0 ] && [ "${FMT_RC}" -eq 0 ] && [ "${CLIPPY_RC}" -eq 0 ] && [ "${TEST_RC}" -eq 0 ] && [ "${BUILD_RC}" -eq 0 ]; then
            echo "STATUS=PASS" >> "${REPORT}"
            echo "VALIDATION_STATUS=PASS" >> "$GITHUB_ENV"
          else
            echo "STATUS=FAIL" >> "${REPORT}"
            echo "VALIDATION_STATUS=FAIL" >> "$GITHUB_ENV"
          fi
          echo "REPORT=${REPORT}" >> "$GITHUB_ENV"

      - name: Preserve exact-head evidence
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/phase-152-c03-runtime-worker-clean-integration | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${BASE_HEAD}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp "${REPORT}" "${RUNNER_TEMP}/clean-worker-report.txt"
          git reset --hard "${BASE_HEAD}"
          mkdir -p "$(dirname "${REPORT}")"
          cp "${RUNNER_TEMP}/clean-worker-report.txt" "${REPORT}"
          git add "${REPORT}"

          if [ "${VALIDATION_STATUS}" = "PASS" ]; then
            rm -f .github/workflows/phase-152-c03-runtime-worker-clean-validation.yml
            git add -u .github/workflows
          fi

          git commit -m "phase 152 c03: record clean management worker validation"
          git push origin HEAD:phase-152-c03-runtime-worker-clean-integration

          if [ "${VALIDATION_STATUS}" != "PASS" ]; then
            exit 1
          fi
