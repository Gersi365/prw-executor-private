name: PRW Phase 152 C02e Tranche2 Clippy Corrective

on:
  push:
    branches:
      - phase-152-c02e-dynamic-reachability-design
    paths:
      - ".github/workflows/phase-152-c02e-tranche2-clippy-corrective.yml"

permissions:
  contents: write

concurrency:
  group: prw-phase-152-c02e-tranche2-clippy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  correct:
    name: Correct only Tranche2 integration lint findings
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact corrective base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact lint correctives and prepare evidence
        id: correct
        shell: bash
        run: |
          set -uo pipefail
          BRANCH="phase-152-c02e-dynamic-reachability-design"
          BASE_HEAD="$(git rev-parse HEAD)"
          TEST="crates/prw-remote-bridge/tests/reachability_phase141_integration.rs"
          MANIFEST="crates/prw-remote-bridge/Cargo.toml"
          AUDIT_DIR="logs/audits/phase-152-c02e-dynamic-reachability-design"
          REPORT="${AUDIT_DIR}/C02E_TRANCHE2_CLIPPY_CORRECTIVE_${BASE_HEAD}.txt"
          mkdir -p "${AUDIT_DIR}"

          LOCK_BEFORE="$(sha256sum Cargo.lock | awk '{print $1}')"
          MANIFEST_BEFORE="$(sha256sum "${MANIFEST}" | awk '{print $1}')"
          TEST_BEFORE="$(sha256sum "${TEST}" | awk '{print $1}')"
          STATUS=PASS
          FIRST_FAILURE=NONE
          PATCH_RC=0
          RUSTFMT_RC=SKIPPED
          MUTATION_GUARD_RC=SKIPPED

          set +e
          python3 - "${TEST}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          replacements = [
              (
                  ".map(|session| session as *const IceConnectivitySession)",
                  ".map(std::ptr::from_ref)",
                  1,
              ),
              (
                  "stale.as_ref() as *const IceConnectivitySession",
                  "std::ptr::from_ref(stale.as_ref())",
                  2,
              ),
              (
                  '.expect("publication");\n    let (session, mut peer) = ice_pair(retained, 43001);',
                  '.expect("publication");\n    assert_eq!(publication.candidates(), &[retained]);\n    let (session, mut peer) = ice_pair(retained, 43001);',
                  1,
              ),
          ]

          for old, new, expected_count in replacements:
              count = text.count(old)
              if count != expected_count:
                  raise SystemExit(
                      f"replacement count mismatch for {old!r}: expected={expected_count} actual={count}"
                  )
              text = text.replace(old, new)

          path.write_text(text)
          PY
          PATCH_RC=$?
          set -e
          if [[ ${PATCH_RC} -ne 0 ]]; then
            STATUS=FAIL
            FIRST_FAILURE=PATCH
          fi

          if [[ "${STATUS}" == "PASS" ]]; then
            set +e
            rustfmt --edition 2024 "${TEST}" && rustfmt --edition 2024 --check "${TEST}"
            RUSTFMT_RC=$?
            set -e
            if [[ ${RUSTFMT_RC} -ne 0 ]]; then
              STATUS=FAIL
              FIRST_FAILURE=RUSTFMT
            fi
          fi

          LOCK_AFTER="$(sha256sum Cargo.lock | awk '{print $1}')"
          MANIFEST_AFTER="$(sha256sum "${MANIFEST}" | awk '{print $1}')"
          TEST_AFTER="$(sha256sum "${TEST}" | awk '{print $1}')"

          if [[ "${STATUS}" == "PASS" ]]; then
            mapfile -t CHANGED < <(git diff --name-only)
            if [[ "${LOCK_BEFORE}" != "${LOCK_AFTER}" || "${MANIFEST_BEFORE}" != "${MANIFEST_AFTER}" || ${#CHANGED[@]} -ne 1 || "${CHANGED[0]}" != "${TEST}" ]]; then
              STATUS=FAIL
              FIRST_FAILURE=MUTATION_GUARD
              MUTATION_GUARD_RC=91
            else
              MUTATION_GUARD_RC=0
            fi
          fi

          {
            echo "PHASE=152-C02e-Tranche2-Clippy-Corrective"
            echo "BASE_HEAD=${BASE_HEAD}"
            echo "RUSTC=$(rustc --version 2>&1 || true)"
            echo "RUSTFMT=$(rustfmt --version 2>&1 || true)"
            echo "LOCK_SHA256_BEFORE=${LOCK_BEFORE}"
            echo "LOCK_SHA256_AFTER=${LOCK_AFTER}"
            echo "MANIFEST_SHA256_BEFORE=${MANIFEST_BEFORE}"
            echo "MANIFEST_SHA256_AFTER=${MANIFEST_AFTER}"
            echo "TEST_SHA256_BEFORE=${TEST_BEFORE}"
            echo "TEST_SHA256_AFTER=${TEST_AFTER}"
            echo "PATCH_RC=${PATCH_RC}"
            echo "RUSTFMT_RC=${RUSTFMT_RC}"
            echo "MUTATION_GUARD_RC=${MUTATION_GUARD_RC}"
            echo "FIRST_FAILURE=${FIRST_FAILURE}"
            echo "STATUS=${STATUS}"
            echo
            echo "===== DIFF ====="
            git diff -- "${TEST}" || true
          } > "${REPORT}"

          echo "status=${STATUS}" >> "${GITHUB_OUTPUT}"
          echo "base_head=${BASE_HEAD}" >> "${GITHUB_OUTPUT}"
          echo "report=${REPORT}" >> "${GITHUB_OUTPUT}"

      - name: Commit corrective evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS="${{ steps.correct.outputs.status }}"
          BASE_HEAD="${{ steps.correct.outputs.base_head }}"
          REPORT="${{ steps.correct.outputs.report }}"
          BRANCH="phase-152-c02e-dynamic-reachability-design"
          TEST="crates/prw-remote-bridge/tests/reachability_phase141_integration.rs"

          [[ -n "${BASE_HEAD}" && -n "${REPORT}" && -f "${REPORT}" ]]
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          [[ "${REMOTE_HEAD}" == "${BASE_HEAD}" ]]

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${STATUS}" == "PASS" ]]; then
            git add "${TEST}" "${REPORT}"
            git commit -m "phase 152 c02e: correct tranche2 integration lints ${BASE_HEAD:0:12}"
          else
            git checkout -- "${TEST}"
            git add "${REPORT}"
            git commit -m "phase 152 c02e: record tranche2 lint corrective failure ${BASE_HEAD:0:12}"
          fi
          git push origin "HEAD:${BRANCH}"

      - name: Surface corrective result
        if: always()
        shell: bash
        run: |
          [[ "${{ steps.correct.outputs.status }}" == "PASS" ]]
