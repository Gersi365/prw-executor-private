name: Phase 152 C03 Lock-Late Boundary Fast PR

on:
  pull_request:
    branches:
      - phase-152-c03-runtime-management-integration

permissions:
  contents: read

jobs:
  focused-boundary:
    if: github.head_ref == 'phase-152-c03-runtime-lock-late-boundary-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Focused boundary tests
        run: |
          export CARGO_TARGET_DIR="${RUNNER_TEMP}/prw-c03-lock-late-boundary-target"
          cargo fmt --all -- --check
          cargo test --locked -p prw-agent management_runtime::tests -- --nocapture
          cargo test --locked -p prw-agent management_runtime_boundary::tests -- --nocapture

      - name: Agent Clippy
        run: |
          export CARGO_TARGET_DIR="${RUNNER_TEMP}/prw-c03-lock-late-boundary-target"
          cargo clippy --locked -p prw-agent --all-targets --all-features -- -D warnings
