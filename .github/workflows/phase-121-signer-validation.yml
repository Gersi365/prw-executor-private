name: Phase 121 Signer Validation

on:
  push:
    paths:
      - '.github/workflows/phase-121-signer-validation.yml'
      - 'Cargo.toml'
      - 'crates/prw-device-identity-signer/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record exact toolchain
        run: |
          rustc --version
          cargo --version
      - name: Generate deterministic candidate lockfile
        run: |
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          sha256sum Cargo.lock
      - name: Validate workspace and signer boundary
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          cargo test --locked -p prw-device-identity-signer --test typed_signer
          if cargo tree --locked -p prw-agent | grep -E 'prw-device-identity-signer|prw-device-identity|aws-lc-rs|aws-lc-sys'; then
            echo 'signer/provider unexpectedly reachable from prw-agent dependency tree' >&2
            exit 1
          fi
          if grep -REn 'pub[[:space:]]+fn[[:space:]]+sign[[:space:]]*\(' crates/prw-device-identity-signer/src; then
            echo 'generic public sign(bytes) surface detected' >&2
            exit 1
          fi
          test "$(find crates/prw-device-identity-signer/src -type f | wc -l)" -eq 1
      - name: Upload validated Cargo.lock candidate
        uses: actions/upload-artifact@v4
        with:
          name: phase121-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
