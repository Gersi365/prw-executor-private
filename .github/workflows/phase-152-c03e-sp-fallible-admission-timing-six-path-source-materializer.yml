name: Phase 152 C03e-SP transient guarded six-path materializer

on:
  push:
    branches:
      - phase-152-c03e-sp-fallible-admission-timing-six-path-source-materialization
    paths:
      - .github/workflows/phase-152-c03e-sp-fallible-admission-timing-six-path-source-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard and materialize selected six-path fallible admission timing lane
        shell: bash
        env:
          SO_HEAD: ece909105886ffbe31c04e4aea6a0c92a0d4374c
          SO_CONTRACT_BLOB: a5ab2b5839c9b7d88ea99d1317eaf19193393cfc
          SN_CONTRACT_BLOB: c081a019cc06012464e5f1cc584dd1814fb6b586
          P0_BLOB: 2b6a0fd693f2ddacec608018a4db811cc36ef4c0
          P2_BLOB: d50e423d01b4161e244c075d59a85fd83533cf62
          P3_BLOB: 881846753f51bdf94cff32ff0f9649dbcf50a80f
          P4_BLOB: b5d236d3c0264ea8870e90af96c76294b50d0fc1
          P5_BLOB: cccefed1192243a16b67c971ca6ba8fe13ae2c82
          PROTECTED_BLOB: 1539b6b9a08bf18883d7a16022f15f7c240eaf08
          BRANCH: phase-152-c03e-sp-fallible-admission-timing-six-path-source-materialization
          HELPER: .github/workflows/phase-152-c03e-sp-fallible-admission-timing-six-path-source-materializer.yml
          P0: crates/prw-agent/src/remote_session_capability_runtime.rs
          P1: crates/prw-agent/src/remote_session_capability_runtime/admission_timing_failure.rs
          P2: crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime/recoverable_spawned_requester_rendezvous_worker/repeated_real_admission_requester_aware_persistent_fl_integration/production_durable_repeated_real_admission_collection.rs
          P3: crates/prw-agent/src/remote_session_capability_runtime/remote_session_endpoint_lifecycle_runtime.rs
          P4: crates/prw-agent/src/linux_bootstrap.rs
          P5: crates/prw-agent/src/production_durable_capability_higher_owner_custody.rs
          PROTECTED: crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs
          SN_CONTRACT: contracts/C03E_SN_FALLIBLE_ADMISSION_TIMING_SOURCE_LAYOUT_AND_PROPAGATION_SELECTION_STAGING.md
          SO_CONTRACT: contracts/C03E_SO_SIX_PATH_SOURCE_MATERIALIZATION_EXECUTION_MECHANISM_SELECTION_STAGING.md
        run: |
          set -euo pipefail

          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(git rev-parse HEAD^)" = "$SO_HEAD"
          test "$(git merge-base "$SO_HEAD" HEAD)" = "$SO_HEAD"
          mapfile -t pre_paths < <(git diff --name-only "$SO_HEAD"...HEAD)
          test "${#pre_paths[@]}" -eq 1
          test "${pre_paths[0]}" = "$HELPER"

          test "$(git hash-object "$P0")" = "$P0_BLOB"
          test "$(git hash-object "$P2")" = "$P2_BLOB"
          test "$(git hash-object "$P3")" = "$P3_BLOB"
          test "$(git hash-object "$P4")" = "$P4_BLOB"
          test "$(git hash-object "$P5")" = "$P5_BLOB"
          test "$(git hash-object "$PROTECTED")" = "$PROTECTED_BLOB"
          test "$(git hash-object "$SN_CONTRACT")" = "$SN_CONTRACT_BLOB"
          test "$(git hash-object "$SO_CONTRACT")" = "$SO_CONTRACT_BLOB"
          test ! -e "$P1"
          test -z "$(git status --porcelain)"

          test "$(grep -Fc 'RemoteSessionAdmissionTimingSourceError' "$P0")" -eq 0
          test "$(grep -Fc '_with_fallible_admission_timing' "$P2")" -eq 0
          test "$(grep -Fc '_with_fallible_admission_timing' "$P3")" -eq 0
          test "$(grep -Fc '_with_fallible_admission_timing' "$P4")" -eq 0
          test "$(grep -Fc '_with_fallible_admission_timing' "$P5")" -eq 0

          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          p0 = Path("crates/prw-agent/src/remote_session_capability_runtime.rs")
          p1 = Path("crates/prw-agent/src/remote_session_capability_runtime/admission_timing_failure.rs")
          p2 = Path("crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime/recoverable_spawned_requester_rendezvous_worker/repeated_real_admission_requester_aware_persistent_fl_integration/production_durable_repeated_real_admission_collection.rs")
          p3 = Path("crates/prw-agent/src/remote_session_capability_runtime/remote_session_endpoint_lifecycle_runtime.rs")
          p4 = Path("crates/prw-agent/src/linux_bootstrap.rs")
          p5 = Path("crates/prw-agent/src/production_durable_capability_higher_owner_custody.rs")

          def one(text, old, new):
              count = text.count(old)
              assert count == 1, (old[:120], count)
              return text.replace(old, new, 1)

          def find_fn_block(text, name):
              marker = f"fn {name}<"
              pos = text.find(marker)
              if pos < 0:
                  marker = f"fn {name}("
                  pos = text.find(marker)
              assert pos >= 0, name
              start = text.rfind("\n\n", 0, pos)
              start = 0 if start < 0 else start + 2
              brace = text.find("{", pos)
              assert brace >= 0, name
              depth = 0
              in_str = False
              escaped = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  if in_str:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == '"':
                          in_str = False
                  else:
                      if ch == '"':
                          in_str = True
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return start, i + 1, text[start:i + 1]
                  i += 1
              raise AssertionError(name)

          def add_generics(block, terminal, additions):
              old = f"        {terminal},\n    >("
              new = f"        {terminal},\n" + "".join(f"        {item},\n" for item in additions) + "    >("
              return one(block, old, new)

          # P0.
          s = p0.read_text()
          s = one(s, "mod authenticated_remote_session_runtime;\n", "mod admission_timing_failure;\nmod authenticated_remote_session_runtime;\n")
          anchor = "pub use authenticated_remote_session_runtime::AuthenticatedRemoteSessionRuntimeOwner;\n"
          reexport = dedent('''\
          #[allow(
              unused_imports,
              reason = "C03e-SP materializes the SN-selected crate-only admission-timing failure types before separately gated concrete provider/custodian integration"
          )]
          pub(crate) use admission_timing_failure::{
              RemoteSessionAdmissionTimingFailure, RemoteSessionAdmissionTimingSourceError,
          };
          ''')
          s = one(s, anchor, reexport + anchor)
          p0.write_text(s)

          # P1.
          p1.write_text(dedent(r'''\
          #![allow(
              clippy::redundant_pub_crate,
              reason = "C03e-SP preserves the SN-selected crate-visible failure types inside this private child module"
          )]

          use std::{error::Error, fmt};

          use super::RemoteSessionExpectedDeviceAdmissionRequest;

          #[non_exhaustive]
          pub(crate) enum RemoteSessionAdmissionTimingSourceError<Cause> {
              Acquisition(Cause),
              Policy(Cause),
              InvalidChallengeValidity,
              InvalidApplicationLease,
              ArithmeticOverflow,
          }

          impl<Cause> fmt::Debug for RemoteSessionAdmissionTimingSourceError<Cause> {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter.write_str(match self {
                      Self::Acquisition(_) => "RemoteSessionAdmissionTimingSourceError::Acquisition",
                      Self::Policy(_) => "RemoteSessionAdmissionTimingSourceError::Policy",
                      Self::InvalidChallengeValidity => "RemoteSessionAdmissionTimingSourceError::InvalidChallengeValidity",
                      Self::InvalidApplicationLease => "RemoteSessionAdmissionTimingSourceError::InvalidApplicationLease",
                      Self::ArithmeticOverflow => "RemoteSessionAdmissionTimingSourceError::ArithmeticOverflow",
                  })
              }
          }

          impl<Cause> fmt::Display for RemoteSessionAdmissionTimingSourceError<Cause> {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter.write_str(match self {
                      Self::Acquisition(_) => "remote session admission timing acquisition failed",
                      Self::Policy(_) => "remote session admission timing policy failed",
                      Self::InvalidChallengeValidity => "remote session admission challenge validity is invalid",
                      Self::InvalidApplicationLease => "remote session admission application lease is invalid",
                      Self::ArithmeticOverflow => "remote session admission timing arithmetic overflowed",
                  })
              }
          }

          impl<Cause> Error for RemoteSessionAdmissionTimingSourceError<Cause>
          where
              Cause: Error + 'static,
          {
              fn source(&self) -> Option<&(dyn Error + 'static)> {
                  match self {
                      Self::Acquisition(cause) | Self::Policy(cause) => Some(cause),
                      Self::InvalidChallengeValidity
                      | Self::InvalidApplicationLease
                      | Self::ArithmeticOverflow => None,
                  }
              }
          }

          pub(crate) struct RemoteSessionAdmissionTimingFailure<D, T, TimingError> {
              error: TimingError,
              request: RemoteSessionExpectedDeviceAdmissionRequest<D, T>,
          }

          impl<D, T, TimingError> RemoteSessionAdmissionTimingFailure<D, T, TimingError> {
              pub(crate) const fn new(
                  error: TimingError,
                  request: RemoteSessionExpectedDeviceAdmissionRequest<D, T>,
              ) -> Self {
                  Self { error, request }
              }

              pub(crate) const fn error(&self) -> &TimingError {
                  &self.error
              }

              pub(crate) const fn request(&self) -> &RemoteSessionExpectedDeviceAdmissionRequest<D, T> {
                  &self.request
              }

              pub(crate) fn into_parts(
                  self,
              ) -> (TimingError, RemoteSessionExpectedDeviceAdmissionRequest<D, T>) {
                  (self.error, self.request)
              }
          }

          #[cfg(test)]
          mod tests {
              use std::{error::Error, fmt};
              use prw_core::{DeviceId, SessionId};
              use super::{RemoteSessionAdmissionTimingFailure, RemoteSessionAdmissionTimingSourceError};
              use crate::remote_session_capability_runtime::RemoteSessionExpectedDeviceAdmissionRequest;

              struct SecretCause;
              impl fmt::Debug for SecretCause {
                  fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                      formatter.write_str("SECRET_CAUSE")
                  }
              }
              impl fmt::Display for SecretCause {
                  fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                      formatter.write_str("SECRET_CAUSE")
                  }
              }
              impl Error for SecretCause {}

              #[test]
              fn source_error_debug_is_bounded_and_source_is_retained() {
                  let error = RemoteSessionAdmissionTimingSourceError::Acquisition(SecretCause);
                  let rendered = format!("{error:?}");
                  assert_eq!(rendered, "RemoteSessionAdmissionTimingSourceError::Acquisition");
                  assert!(!rendered.contains("SECRET_CAUSE"));
                  assert!(error.source().is_some());
              }

              #[test]
              fn failure_carrier_returns_exact_owned_request_and_error() {
                  let device = DeviceId::new("device-c03e-sp").expect("valid test device");
                  let session = SessionId::new("session-c03e-sp").expect("valid test session");
                  let request = RemoteSessionExpectedDeviceAdmissionRequest::new(
                      device.clone(), session, 17, 23_u8, 29_u16,
                  );
                  let failure = RemoteSessionAdmissionTimingFailure::new(31_u32, request);
                  assert_eq!(*failure.error(), 31);
                  assert_eq!(failure.request().expected_device_id(), &device);
                  let (error, request) = failure.into_parts();
                  assert_eq!(error, 31);
                  let (returned_device, _session, request_id, dispatcher, verifier) = request.into_parts();
                  assert_eq!(returned_device, device);
                  assert_eq!(request_id, 17);
                  assert_eq!(dispatcher, 23);
                  assert_eq!(verifier, 29);
              }
          }
          '''))

          # P2 imports + pure preparation.
          s = p2.read_text()
          import_anchor = "use crate::remote_session_capability_runtime::requester_rendezvous_retained_custody_dr_continuation::{\n"
          imports = dedent('''\
          use std::convert::Infallible;
          use crate::remote_session_capability_runtime::{
              RemoteSessionAdmissionTimingFailure, RemoteSessionAdmissionTimingSourceError,
          };
          ''')
          s = one(s, import_anchor, imports + import_anchor)
          first_impl = "impl RemoteSessionExecutorRuntime {\n"
          helper = dedent('''\
          fn prepare_expected_request_with_timing_result<D, T, V, F, R, TimingError>(
              active: &std::collections::HashMap<DeviceId, V>,
              request: RemoteSessionExpectedDeviceAdmissionRequest<D, T>,
              admission_timing: &mut F,
              on_rejection: &mut R,
          ) -> Result<
              Option<(RemoteSessionExpectedDeviceAdmissionRequest<D, T>, RemoteSessionRealAdmissionTiming)>,
              RemoteSessionAdmissionTimingFailure<D, T, TimingError>,
          >
          where
              F: FnMut(&DeviceId) -> Result<RemoteSessionRealAdmissionTiming, TimingError>,
              R: FnMut(
                  RemoteSessionExpectedDeviceAdmissionRejectionReason,
                  RemoteSessionExpectedDeviceAdmissionRequest<D, T>,
              ),
          {
              let expected_device_id = request.expected_device_id().clone();
              if active.contains_key(&expected_device_id) {
                  on_rejection(
                      RemoteSessionExpectedDeviceAdmissionRejectionReason::DuplicateActiveDevice,
                      request,
                  );
                  return Ok(None);
              }
              match admission_timing(&expected_device_id) {
                  Ok(timing) => Ok(Some((request, timing))),
                  Err(error) => Err(RemoteSessionAdmissionTimingFailure::new(error, request)),
              }
          }

          ''')
          s = one(s, first_impl, helper + first_impl)

          # Pending-producer helper becomes timing-result capable.
          pending_name = "drive_pending_cooperative_fallible_verifier_time_scheduling_producer"
          a, b, pending = find_fn_block(s, pending_name)
          pending = add_generics(pending, "E", ["TimingError", "K"])
          pending = one(pending, "    on_admission_failure: &mut E,\n", "    on_admission_failure: &mut E,\n    on_timing_failure: &mut K,\n")
          pending = one(pending, "    F: FnMut(&DeviceId) -> RemoteSessionRealAdmissionTiming,\n", "    F: FnMut(&DeviceId) -> Result<RemoteSessionRealAdmissionTiming, TimingError>,\n    K: FnMut(RemoteSessionAdmissionTimingFailure<D, T, TimingError>),\n")
          old = dedent('''\
                      let Some((request, timing)) =
                          prepare_expected_request(active, request, admission_timing, on_rejection)
                      else {
                          continue;
                      };
          ''')
          new = dedent('''\
                      let (request, timing) = match prepare_expected_request_with_timing_result(
                          active,
                          request,
                          admission_timing,
                          on_rejection,
                      ) {
                          Ok(Some(prepared)) => prepared,
                          Ok(None) => continue,
                          Err(failure) => {
                              on_timing_failure(failure);
                              continue;
                          }
                      };
          ''')
          pending = one(pending, old, new)
          s = s[:a] + pending + s[b:]

          # S6 shared result-capable core + unchanged-name Infallible lift + new production sibling.
          s6 = "drive_recoverable_repeated_real_remote_admission_collection_with_production_durable_fallible_verifier_time_scheduling_producer"
          a, b, base = find_fn_block(s, s6)
          core_name = s6 + "_with_timing_result"
          core = base.replace(f"fn {s6}<", f"fn {core_name}<", 1)
          core = core.replace("pub(in super::super::super) fn", "fn", 1)
          core = add_generics(core, "E", ["TimingError", "K"])
          core = one(core, "        mut on_admission_failure: E,\n", "        mut on_admission_failure: E,\n        mut on_timing_failure: K,\n")
          core = one(core, "        F: FnMut(&DeviceId) -> RemoteSessionRealAdmissionTiming,\n", "        F: FnMut(&DeviceId) -> Result<RemoteSessionRealAdmissionTiming, TimingError>,\n        K: FnMut(RemoteSessionAdmissionTimingFailure<D, T, TimingError>),\n")
          pending_calls = re.subn(
              r"(?m)^(\s*)&mut on_admission_failure,\n(\s*)\)\n(\s*)\.await",
              lambda m: f"{m.group(1)}&mut on_admission_failure,\n{m.group(1)}&mut on_timing_failure,\n{m.group(2)})\n{m.group(3)}.await",
              core,
          )
          core, count = pending_calls
          assert count == 2, count
          idle_old = dedent('''\
                              let Some((request, timing)) = prepare_expected_request(
                                  &active,
                                  request,
                                  &mut admission_timing,
                                  &mut on_rejection,
                              ) else {
                                  continue;
                              };
          ''')
          idle_new = dedent('''\
                              let (request, timing) = match prepare_expected_request_with_timing_result(
                                  &active,
                                  request,
                                  &mut admission_timing,
                                  &mut on_rejection,
                              ) {
                                  Ok(Some(prepared)) => prepared,
                                  Ok(None) => continue,
                                  Err(failure) => {
                                      on_timing_failure(failure);
                                      continue;
                                  }
                              };
          ''')
          core = one(core, idle_old, idle_new)

          body_pos = base.find("    {", base.find(f"fn {s6}<"))
          header = base[:body_pos]
          compat = header + dedent('''\
              {
                  let mut admission_timing = admission_timing;
                  self.drive_recoverable_repeated_real_remote_admission_collection_with_production_durable_fallible_verifier_time_scheduling_producer_with_timing_result(
                      max_active_workers,
                      transport_runtime,
                      authority,
                      capability_authority,
                      policy_source,
                      requester_rendezvous_authority,
                      session_authentication,
                      expected_requests,
                      supervisor_shutdown,
                      producer,
                      suppress_on_shutdown,
                      observe_receipt,
                      move |device_id| Ok::<_, Infallible>(admission_timing(device_id)),
                      on_rejection,
                      on_admission_failure,
                      |failure: RemoteSessionAdmissionTimingFailure<D, T, Infallible>| {
                          let (error, _request) = failure.into_parts();
                          match error {}
                      },
                  )
              }
          ''')

          prod = base.replace(f"fn {s6}<", f"fn {s6}_with_fallible_admission_timing<", 1)
          prod = add_generics(prod, "E", ["Cause", "K"])
          prod = one(prod, "        mut on_admission_failure: E,\n", "        on_admission_failure: E,\n        on_timing_failure: K,\n")
          prod = one(prod, "        F: FnMut(&DeviceId) -> RemoteSessionRealAdmissionTiming,\n", "        F: FnMut(&DeviceId) -> Result<RemoteSessionRealAdmissionTiming, RemoteSessionAdmissionTimingSourceError<Cause>>,\n        Cause: std::error::Error + Send + 'static,\n        K: FnMut(RemoteSessionAdmissionTimingFailure<D, T, RemoteSessionAdmissionTimingSourceError<Cause>>),\n")
          prod_body = prod.find("    {", prod.find(f"fn {s6}_with_fallible_admission_timing<"))
          prod_header = prod[:prod_body]
          prod = prod_header + dedent('''\
              {
                  self.drive_recoverable_repeated_real_remote_admission_collection_with_production_durable_fallible_verifier_time_scheduling_producer_with_timing_result(
                      max_active_workers,
                      transport_runtime,
                      authority,
                      capability_authority,
                      policy_source,
                      requester_rendezvous_authority,
                      session_authentication,
                      expected_requests,
                      supervisor_shutdown,
                      producer,
                      suppress_on_shutdown,
                      observe_receipt,
                      admission_timing,
                      on_rejection,
                      on_admission_failure,
                      on_timing_failure,
                  )
              }
          ''')
          s = s[:a] + compat + "\n\n" + core + "\n\n" + prod + s[b:]

          # S5 fallible sibling, preserving exact close/wait_idle tail.
          s5 = "drive_repeated_real_remote_admission_endpoint_lifecycle_with_production_durable_fallible_verifier_time_scheduling_producer"
          a, b, block = find_fn_block(s, s5)
          n = block.replace(f"fn {s5}<", f"fn {s5}_with_fallible_admission_timing<", 1)
          n = add_generics(n, "E", ["Cause", "K"])
          n = one(n, "        on_admission_failure: E,\n", "        on_admission_failure: E,\n        on_timing_failure: K,\n")
          n = one(n, "        F: FnMut(&DeviceId) -> RemoteSessionRealAdmissionTiming,\n", "        F: FnMut(&DeviceId) -> Result<RemoteSessionRealAdmissionTiming, RemoteSessionAdmissionTimingSourceError<Cause>>,\n        Cause: std::error::Error + Send + 'static,\n        K: FnMut(RemoteSessionAdmissionTimingFailure<D, T, RemoteSessionAdmissionTimingSourceError<Cause>>),\n")
          n = n.replace(f".{s6}(", f".{s6}_with_fallible_admission_timing(", 1)
          n = one(n, "                on_admission_failure,\n            );", "                on_admission_failure,\n                on_timing_failure,\n            );")
          s = s[:b] + "\n\n" + n + s[b:]

          # P2 inline tests for the pure preparation law used by both driver request paths.
          s += dedent('''\

          #[cfg(test)]
          mod admission_timing_result_tests {
              use std::{cell::Cell, collections::HashMap};
              use prw_core::{DeviceId, SessionId};
              use super::{
                  RemoteSessionExpectedDeviceAdmissionRequest,
                  RemoteSessionExpectedDeviceAdmissionRejectionReason,
                  RemoteSessionRealAdmissionTiming,
                  prepare_expected_request_with_timing_result,
              };

              fn request(device: DeviceId) -> RemoteSessionExpectedDeviceAdmissionRequest<u8, u16> {
                  RemoteSessionExpectedDeviceAdmissionRequest::new(
                      device,
                      SessionId::new("session-c03e-sp-prep").expect("valid test session"),
                      41,
                      43,
                      47,
                  )
              }

              fn timing() -> RemoteSessionRealAdmissionTiming {
                  RemoteSessionRealAdmissionTiming::new(10..11, 12, 13..14)
              }

              #[test]
              fn duplicate_preflight_performs_zero_timing_samples() {
                  let device = DeviceId::new("device-c03e-sp-duplicate").expect("valid device");
                  let mut active = HashMap::new();
                  active.insert(device.clone(), ());
                  let samples = Cell::new(0);
                  let mut timing_source = |_device: &DeviceId| -> Result<_, &'static str> {
                      samples.set(samples.get() + 1);
                      Ok(timing())
                  };
                  let mut rejected = false;
                  let result = prepare_expected_request_with_timing_result(
                      &active,
                      request(device),
                      &mut timing_source,
                      &mut |reason, _request| {
                          assert!(matches!(reason, RemoteSessionExpectedDeviceAdmissionRejectionReason::DuplicateActiveDevice));
                          rejected = true;
                      },
                  );
                  assert!(matches!(result, Ok(None)));
                  assert!(rejected);
                  assert_eq!(samples.get(), 0);
              }

              #[test]
              fn timing_failure_preserves_exact_request_before_decomposition() {
                  let device = DeviceId::new("device-c03e-sp-failure").expect("valid device");
                  let active = HashMap::<DeviceId, ()>::new();
                  let mut timing_source = |_device: &DeviceId| -> Result<RemoteSessionRealAdmissionTiming, &'static str> { Err("timing-failed") };
                  let mut reject = |_reason, _request| panic!("vacant request must not be rejected");
                  let failure = prepare_expected_request_with_timing_result(
                      &active,
                      request(device.clone()),
                      &mut timing_source,
                      &mut reject,
                  ).expect_err("timing failure must retain request");
                  let (error, request) = failure.into_parts();
                  assert_eq!(error, "timing-failed");
                  assert_eq!(request.expected_device_id(), &device);
                  let (_device, _session, request_id, dispatcher, verifier) = request.into_parts();
                  assert_eq!(request_id, 41);
                  assert_eq!(dispatcher, 43);
                  assert_eq!(verifier, 47);
              }
          }
          ''')
          p2.write_text(s)

          # P3 imports + S4/S3/S2 siblings.
          s = p3.read_text()
          anchor = "    RemoteSessionExecutorRuntime, RemoteSessionExecutorRuntimeCreateError,\n"
          s = one(s, anchor, "    RemoteSessionAdmissionTimingFailure, RemoteSessionAdmissionTimingSourceError,\n" + anchor)

          s4 = "drive_repeated_real_remote_admission_endpoint_lifecycle_with_production_durable_fallible_verifier_time_scheduling_producer"
          a, b, block = find_fn_block(s, s4)
          n = block.replace(f"fn {s4}<", f"fn {s4}_with_fallible_admission_timing<", 1)
          n = add_generics(n, "E", ["Cause", "K"])
          n = one(n, "        on_admission_failure: E,\n", "        on_admission_failure: E,\n        on_timing_failure: K,\n")
