name: Phase 152 C03e-SP transient materializer anchor correction

on:
  push:
    branches:
      - phase-152-c03e-sp-fallible-admission-timing-six-path-source-materialization
    paths:
      - .github/workflows/phase-152-c03e-sp-fallible-admission-timing-six-path-source-materializer.yml

permissions:
  contents: write

jobs:
  correct-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore corrected self-contained materializer
        shell: bash
        env:
          SO_HEAD: ece909105886ffbe31c04e4aea6a0c92a0d4374c
          INITIAL_HELPER: 21cf148b65c3495bb9d972f3765e03222bf03bbc
          BRANCH: phase-152-c03e-sp-fallible-admission-timing-six-path-source-materialization
          HELPER: .github/workflows/phase-152-c03e-sp-fallible-admission-timing-six-path-source-materializer.yml
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(git rev-parse HEAD^)" = "$INITIAL_HELPER"
          test "$(git rev-parse "$INITIAL_HELPER^")" = "$SO_HEAD"
          test "$(git merge-base "$SO_HEAD" HEAD)" = "$SO_HEAD"

          git show "$INITIAL_HELPER:$HELPER" > /tmp/materializer.yml

          python3 <<'PY'
          from pathlib import Path

          path = Path('/tmp/materializer.yml')
          text = path.read_text()

          old_parent = '          test "$(git rev-parse HEAD^)" = "$SO_HEAD"\n'
          new_parent = '          test "$(git rev-parse 21cf148b65c3495bb9d972f3765e03222bf03bbc^)" = "$SO_HEAD"\n'
          assert text.count(old_parent) == 1, text.count(old_parent)
          text = text.replace(old_parent, new_parent, 1)

          old_anchor = '''          first_impl = "impl RemoteSessionExecutorRuntime {\\n"\n          helper = dedent('''\\\n'''
          new_anchor = '''          first_impl_positions = [match.start() for match in re.finditer(r"(?m)^impl RemoteSessionExecutorRuntime \\{$", s)]\n          assert len(first_impl_positions) == 5, len(first_impl_positions)\n          first_impl_index = first_impl_positions[0]\n          helper = dedent('''\\\n'''
          assert text.count(old_anchor) == 1, text.count(old_anchor)
          text = text.replace(old_anchor, new_anchor, 1)

          old_insert = '          s = one(s, first_impl, helper + first_impl)\n'
          new_insert = '          s = s[:first_impl_index] + helper + s[first_impl_index:]\n'
          assert text.count(old_insert) == 1, text.count(old_insert)
          text = text.replace(old_insert, new_insert, 1)

          path.write_text(text)
          PY

          cp /tmp/materializer.yml "$HELPER"
          git diff --check
          test "$(git diff --name-only)" = "$HELPER"

          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git add "$HELPER"
          git commit -m "C03e-SP: correct transient materializer anchor"
          git push origin "HEAD:$BRANCH"
