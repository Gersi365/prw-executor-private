name: Phase 129 Transport Finalizer

on:
  push:
    paths:
      - '.github/workflows/phase-129-finalize-validation.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Normalize exact known correctives
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          lib = Path('crates/prw-control-transport/src/lib.rs')
          text = lib.read_text()
          if 'const fn validate_timeout(timeout: Duration) -> Result<(), ControlTransportError> {' not in text:
              text, count = re.subn(
                  r'(?m)^fn validate_timeout\(timeout: Duration\) -> Result<\(\), ControlTransportError> \{$',
                  'const fn validate_timeout(timeout: Duration) -> Result<(), ControlTransportError> {',
                  text,
              )
              if count != 1:
                  raise SystemExit(f'validate_timeout replacement count={count}')
              lib.write_text(text)

          test = Path('crates/prw-control-transport/tests/tls_loopback.rs')
          text = test.read_text()
          if 'TcpStream' in text:
              text, count = re.subn(
                  r'(?m)^\s*net::\{TcpListener, TcpStream\},$',
                  '    net::TcpListener,',
                  text,
              )
              if count != 1:
                  raise SystemExit(f'TcpStream import replacement count={count}')
              test.write_text(text)
          PY
          cargo fmt --all
          grep -Fq 'const fn validate_timeout(timeout: Duration) -> Result<(), ControlTransportError> {' crates/prw-control-transport/src/lib.rs
          ! grep -Fq 'TcpStream' crates/prw-control-transport/tests/tls_loopback.rs

      - name: Generate exact locked dependency graph
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          grep -A3 '^name = "rustls"$' Cargo.lock | grep -Fq 'version = "0.23.43"'
          echo "phase129_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"

      - name: Run focused transport gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-control-transport --all-targets --all-features -- -D warnings
          cargo test --locked -p prw-control-transport --all-targets
          echo 'phase129_focused_validation=pass'

      - name: Run permanent-equivalent workspace gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace
          echo 'phase129_workspace_validation=pass'

      - name: Commit validated source and lockfile, then self-clean temporary workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            .github/workflows/phase-129-control-transport-validation.yml \
            .github/workflows/phase-129-a02-clippy-corrective.yml \
            .github/workflows/phase-129-a02b-clippy-corrective.yml \
            .github/workflows/phase-129-finalize-validation.yml; do
            if [[ -e "$path" ]]; then
              git rm -f -- "$path"
            fi
          done

          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          for path in "${changed[@]}"; do
            case "$path" in
              Cargo.lock|\
              crates/prw-control-transport/src/lib.rs|\
              crates/prw-control-transport/examples/phase129_tls_probe.rs|\
              crates/prw-control-transport/tests/tls_loopback.rs|\
              .github/workflows/phase-129-control-transport-validation.yml|\
              .github/workflows/phase-129-a02-clippy-corrective.yml|\
              .github/workflows/phase-129-a02b-clippy-corrective.yml|\
              .github/workflows/phase-129-finalize-validation.yml) ;;
              *) echo "unexpected_phase129_finalizer_path=$path" >&2; exit 1 ;;
            esac
          done
          git diff --check
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          git add -A
          git commit -m 'phase 129: validate and lock control transport'
          git push origin HEAD:main
          echo 'phase129_finalizer=pass'
