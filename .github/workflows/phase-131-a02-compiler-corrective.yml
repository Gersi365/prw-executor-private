name: Phase 131 A02 Compiler Corrective Finalization

on:
  push:
    paths:
      - '.github/workflows/phase-131-a02-compiler-corrective.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact Phase 131 compiler and lint correctives
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          member = '    "crates/prw-file-service",\n'
          if member not in text:
              needle = '    "crates/prw-files",\n'
              if text.count(needle) != 1:
                  raise SystemExit('workspace insertion point mismatch')
              cargo.write_text(text.replace(needle, needle + member))

          source = Path('crates/prw-file-service/src/lib.rs')
          text = source.read_text()

          import_line = '    os::unix::fs::PermissionsExt,\n'
          if import_line not in text:
              needle = '    os::fd::OwnedFd,\n'
              if text.count(needle) != 1:
                  raise SystemExit('PermissionsExt insertion point mismatch')
              text = text.replace(needle, needle + import_line)

          replacements = [
              ('        file.by_ref()\n', '        std::io::Read::by_ref(&mut file)\n'),
              ('    fn open_parent(&self, path: &RemotePath) -> Result<(OwnedFd, &str), FileServiceError> {', "    fn open_parent<'a>(&self, path: &'a RemotePath) -> Result<(OwnedFd, &'a str), FileServiceError> {"),
              ('    pub fn is_root(&self) -> bool {', '    pub const fn is_root(&self) -> bool {'),
              ('fn classify_mode(mode: rustix::fs::RawMode) -> RemoteFileType {', 'const fn classify_mode(mode: rustix::fs::RawMode) -> RemoteFileType {'),
          ]
          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'replacement count mismatch for {old!r}')
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'expected corrected form missing for {new!r}')

          source.write_text(text)
          PY
          cargo fmt --all
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          git diff --check

      - name: Prove Phase 131 focused and workspace gates
        id: validation
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-file-service --all-targets --all-features -- -D warnings
          cargo test --locked -p prw-file-service --all-targets
          echo 'phase131_a02_focused_validation=pass'
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          echo "lock_sha=$lock_sha" >> "$GITHUB_OUTPUT"
          echo "phase131_a02_workspace_validation=pass lock_sha=$lock_sha"

      - name: Record authoritative Phase 131 report
        shell: bash
        env:
          LOCK_SHA: ${{ steps.validation.outputs.lock_sha }}
        run: |
          set -Eeuo pipefail
          report_dir='logs/audits/phase-131-remote-file-management-foundation'
          report="$report_dir/PRW-PHASE-131-FILE-MANAGEMENT-FOUNDATION-VALIDATION.txt"
          mkdir -p "$report_dir"
          cat > "$report" <<EOF
          Private Remote Workspace
          Phase 131 — Remote File Management Foundation

          STATUS:
          PASS / CONTRACT_LOCKED / DESCRIPTOR_ANCHORED_ROOT_IMPLEMENTED / PATH_TRAVERSAL_FAIL_CLOSED / CREATE_ONLY_PRIMITIVES_VALIDATED / FULL_WORKSPACE_VALIDATION_PASS / PRODUCTION_REMOTE_FILES_NOT_ACTIVE

          Repository: Gersi365/prw-executor-private
          Branch: main
          Date: 2026-08-16
          Validation source head: $GITHUB_SHA
          Authoritative finalization run: $GITHUB_RUN_ID
          Cargo.lock SHA-256: $LOCK_SHA

          CONTRACT
          contracts/REMOTE_FILE_MANAGEMENT_CONTRACT.md

          IMPLEMENTATION
          crates/prw-file-service

          SECURITY OUTCOME
          Filesystem authority is anchored to an owned root directory descriptor. Descendant resolution is descriptor-relative and rejects symbolic-link traversal. Strict relative UTF-8 paths reject traversal and ambiguous syntax. Reads, writes and listings are bounded. Writes are creation-only, existing destinations are not replaced, file mode is 0600 and directory mode is 0700.

          VALIDATION
          The authoritative run passed focused prw-file-service rustfmt, Clippy -D warnings and all-target tests, then full workspace/all-target Clippy, tests and build under the locked graph. Run 31942435230 exposed Read::by_ref ambiguity and open_parent lifetime binding; run 31943111171 confirmed those compiler fixes and exposed only two const lints, corrected here without semantic change.

          DEFERRED
          Phase 132 owns resumable/chunked transfer, transfer IDs, content integrity, atomic final commit, interruption recovery and cleanup. Policy/remote transport integration remains deferred.

          PRODUCTION BOUNDARY
          No arbitrary PowerCode user file or production PRW state was mutated. No remote file capability is active in production.

          FINAL CLASSIFICATION
          PHASE_131_SOURCE_AND_DISPOSABLE_FILE_FOUNDATION_DONE / NO_PRODUCTION_REMOTE_FILE_SIDE_EFFECT / READY_FOR_PHASE_132_SOURCE_WORK
          EOF

      - name: Cleanup temporary Phase 131 workflows and commit validated result
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            .github/workflows/phase-131-file-foundation-finalization.yml \
            .github/workflows/phase-131-authoritative-finalization.yml \
            .github/workflows/phase-131-a01-bounded-clippy-finalization.yml \
            .github/workflows/phase-131-a02-compiler-corrective.yml; do
            if [[ -e "$path" ]]; then
              git rm -f -- "$path"
            fi
          done
          git diff --check
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          git add -A
          git commit -m 'phase 131: finalize anchored file management foundation'
          git push origin HEAD:main
          echo 'phase131_a02_finalization=pass'
