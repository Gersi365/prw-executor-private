name: PRW Phase 152 C02e Tranche5 Focused Test Corrective
on:
  push:
    branches: [phase-152-c02e-dynamic-reachability-design]
    paths: [.github/workflows/phase-152-c02e-tranche5-focused-test-corrective.yml]
permissions:
  contents: write
concurrency:
  group: prw-c02e-tranche5-focused-test-corrective-${{ github.ref }}
  cancel-in-progress: true
jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply exact test-shadowing corrective
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=phase-152-c02e-dynamic-reachability-design
          SELF=.github/workflows/phase-152-c02e-tranche5-focused-test-corrective.yml
          TEST=crates/prw-remote-bridge/tests/reachability_freshness_wire.rs
          BASE_HEAD="$(git rev-parse HEAD)"
          EXPECTED_LOCK=becbd46de66354591afd3a4d755a9b4ba06f9c9c15045069b85e04a99525423a
          [[ "$(sha256sum Cargo.lock | awk '{print $1}')" == "${EXPECTED_LOCK}" ]]
          python3 - "${TEST}" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          replacements = [
              ("    let transport = transport(31);\n", "    let current_transport = transport(31);\n"),
              ("        .bind_transport_identity(&target_device_id, transport)\n", "        .bind_transport_identity(&target_device_id, current_transport)\n"),
              ("    let plan = plan(target_device_id.clone(), transport);\n", "    let plan = plan(target_device_id.clone(), current_transport);\n"),
              ("        transport,\n        plan,\n", "        transport: current_transport,\n        plan,\n"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence, found {count}: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all -- --check
          git diff --check
          mapfile -t CHANGED < <(git diff --name-only)
          [[ ${#CHANGED[@]} -eq 1 && "${CHANGED[0]}" == "${TEST}" ]]
          [[ "$(sha256sum Cargo.lock | awk '{print $1}')" == "${EXPECTED_LOCK}" ]]
          REMOTE="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          [[ "${REMOTE}" == "${BASE_HEAD}" ]]
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${TEST}"
          git rm "${SELF}"
          git commit -m "phase 152 c02e: fix tranche5 focused test shadowing"
          git push origin "HEAD:${BRANCH}"
