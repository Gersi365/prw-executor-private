name: Phase 102 Bootstrap Surface Integration A01

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase-102-bootstrap-surface-integrate-a01.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply compile corrective and integrate bootstrap surface
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bootstrap_path = Path("crates/prw-agent/src/linux_bootstrap.rs")
          bootstrap = bootstrap_path.read_text()
          old = "const fn initial_runtime_config() -> LocalLinuxProductionRuntimeConfig {"
          new = "fn initial_runtime_config() -> LocalLinuxProductionRuntimeConfig {"
          if bootstrap.count(old) != 1:
              raise SystemExit("Phase 102 A01 config function anchor mismatch")
          bootstrap = bootstrap.replace(old, new, 1)

          old = "use prw_policy::{Capability, Decision, PolicyEvaluator};"
          new = "use prw_policy::{BoundedLocalReadPolicy, Capability, Decision, PolicyEvaluator};"
          if bootstrap.count(old) != 1:
              raise SystemExit("Phase 102 A01 test import anchor mismatch")
          bootstrap_path.write_text(bootstrap.replace(old, new, 1))

          lib_path = Path("crates/prw-agent/src/lib.rs")
          lib = lib_path.read_text()
          anchor = '''#[cfg(target_os = "linux")]
          #[allow(
              dead_code,
              reason = "pre-runtime Linux identity adapter is intentionally crate-internal"
          )]
          pub(crate) mod linux_identity;
          '''
          insert = anchor + '''#[cfg(target_os = "linux")]
          pub mod linux_bootstrap;
          '''
          if lib.count(anchor) != 1:
              raise SystemExit("Phase 102 A01 lib facade insertion anchor mismatch")
          lib_path.write_text(lib.replace(anchor, insert, 1))

          main_path = Path("crates/prw-agent/src/main.rs")
          main_path.write_text(r'''//! Headless Private Remote Workspace Agent binary bootstrap.
          //!
          //! Phase 102 keeps the executable thin: the library's Linux bootstrap
          //! facade owns the fixed Phase 101 profile and delegates to the validated
          //! signal-aware runtime. The binary owns only bounded stderr reporting and
          //! the simple success/failure process exit mapping.

          use std::process::ExitCode;

          #[cfg(target_os = "linux")]
          fn main() -> ExitCode {
              match prw_agent::linux_bootstrap::run() {
                  Ok(report) => {
                      let counters = report.counters();
                      let success = report.is_success();
                      eprintln!(
                          "prw-agent event=terminal terminal={} exit={} readiness_steps={} listener_armed_steps={} runtime_wakes={} wait_interruptions={} scheduling_attempts={} workers_registered={} worker_completions={} peer_rejections={} cleanup={} signal_mask_restore={}",
                          report.terminal().token(),
                          if success { "success" } else { "failure" },
                          counters.readiness_steps(),
                          counters.listener_armed_steps(),
                          counters.runtime_wakes(),
                          counters.wait_interruptions(),
                          counters.scheduling_attempts(),
                          counters.workers_registered(),
                          counters.worker_completions(),
                          counters.peer_rejections(),
                          report.cleanup().token(),
                          report.signal_mask_restore().token(),
                      );
                      if success {
                          ExitCode::SUCCESS
                      } else {
                          ExitCode::FAILURE
                      }
                  }
                  Err(failure) => {
                      eprintln!(
                          "prw-agent event=startup_failure kind={} exit=failure signal_mask_restore={}",
                          failure.kind().token(),
                          failure.signal_mask_restore().token(),
                      );
                      ExitCode::FAILURE
                  }
              }
          }

          #[cfg(not(target_os = "linux"))]
          fn main() -> ExitCode {
              eprintln!("prw-agent event=startup_failure kind=unsupported_platform exit=failure signal_mask_restore=not_applicable");
              ExitCode::FAILURE
          }
          ''')
          PY

          cargo fmt --all
          changed="$(git diff --name-only | sort)"
          python3 - "$changed" <<'PY'
          import sys
          changed = {line for line in sys.argv[1].splitlines() if line}
          allowed = {
              "crates/prw-agent/src/lib.rs",
              "crates/prw-agent/src/main.rs",
              "crates/prw-agent/src/linux_bootstrap.rs",
          }
          required = set(allowed)
          if not required.issubset(changed):
              raise SystemExit(f"Phase 102 A01 required mutation missing: {sorted(required - changed)}")
          if not changed.issubset(allowed):
              raise SystemExit(f"Phase 102 A01 unexpected mutation: {sorted(changed - allowed)}")
          PY
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          git diff --check

      - name: Commit integrated bootstrap surface and remove temporary workflows
        run: |
          rm .github/workflows/phase-102-bootstrap-surface-integrate.yml
          rm .github/workflows/phase-102-bootstrap-surface-integrate-a01.yml
          git add crates/prw-agent/src/lib.rs crates/prw-agent/src/main.rs crates/prw-agent/src/linux_bootstrap.rs .github/workflows/phase-102-bootstrap-surface-integrate.yml .github/workflows/phase-102-bootstrap-surface-integrate-a01.yml
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git commit -m "Integrate Phase 102 standalone Agent bootstrap surface"
          git push
