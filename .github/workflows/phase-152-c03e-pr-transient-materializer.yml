name: Phase 152 C03e-PR transient guarded source materializer

on:
  push:
    branches:
      - phase-152-c03e-pr-production-requester-rendezvous-expected-device-admission-fallible-verifier-time-endpoint-lifecycle-runtime-composition-source-materialization

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard and materialize C03e-PR source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='crates/prw-agent/src/remote_session_capability_runtime/remote_session_endpoint_lifecycle_runtime.rs'
          EXPECTED_BLOB='e9f82f32ba875c2461513e445f81962720dc3298'
          TARGET='drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle'

          actual_blob="$(git hash-object "$SOURCE")"
          test "$actual_blob" = "$EXPECTED_BLOB"
          test "$(grep -c "$TARGET" "$SOURCE" || true)" -eq 0

          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/prw-agent/src/remote_session_capability_runtime/remote_session_endpoint_lifecycle_runtime.rs')
          text = path.read_text(encoding='utf-8')
          target = 'drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle'
          if target in text:
              raise SystemExit('target method already exists')

          anchor = '''    /// Consumes this startup owner and delegates one dormant production-durable repeated-admission\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'unique insertion anchor required, observed {text.count(anchor)}')

          insertion = '''    /// Consumes this startup owner and delegates exactly once to the C03e-PP fallible\n    /// verifier-time repeated-admission endpoint lifecycle.\n    ///\n    /// The retained endpoint transport and the existing supervisor-shutdown signal are forwarded\n    /// unchanged into the executor boundary. Endpoint close and idle-drain ordering remain owned\n    /// exclusively by C03e-PP; this wrapper adds no second teardown path or error envelope.\n    ///\n    /// # Errors\n    ///\n    /// Returns the existing persistent-collection configuration error unchanged.\n    #[allow(\n        dead_code,\n        reason = "C03e-PR materializes the PQ-selected dormant fallible verifier-time endpoint-owner wrapper before separately gated provider and higher-caller wiring"\n    )]\n    #[expect(\n        clippy::too_many_arguments,\n        reason = "C03e-PR forwards the exact C03e-PP fallible endpoint-lifecycle inputs without introducing a new aggregate"\n    )]\n    pub(super) fn drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle<\n        P,\n        D,\n        T,\n        F,\n        C,\n        R,\n        E,\n    >(\n        self,\n        max_active_workers: NonZeroUsize,\n        authority: &SharedCurrentCapabilityAuthority<P>,\n        session_authentication: &mut SessionAuthenticationService,\n        expected_requests: mpsc::Receiver<RemoteSessionExpectedDeviceAdmissionRequest<D, T>>,\n        admission_timing: F,\n        on_completion: C,\n        on_rejection: R,\n        on_admission_failure: E,\n    ) -> Result<(), RemoteSessionPersistentCollectionConfigError>\n    where\n        P: PolicyEvaluator + Send + Sync + 'static,\n        D: CapabilityDispatcher + Send + 'static,\n        T: FnMut() -> Result<u64, prw_session::prwa_verifier_source::PrwaVerifierSourceError>\n            + Send\n            + 'static,\n        F: FnMut(&DeviceId) -> RemoteSessionRealAdmissionTiming,\n        C: FnMut(super::RemoteSessionFallibleVerifierTimeRegisteredWorkerCompletion),\n        R: FnMut(RemoteSessionExpectedDeviceAdmissionRejection<D, T>),\n        E: FnMut(RemoteSessionRepeatedAdmissionFailure),\n    {\n        let Self {\n            mut executor,\n            transport,\n            supervisor_shutdown,\n        } = self;\n\n        executor.drive_repeated_real_fallible_verifier_time_remote_admission_endpoint_lifecycle(\n            max_active_workers,\n            &transport,\n            authority,\n            session_authentication,\n            expected_requests,\n            supervisor_shutdown.into_shutdown(),\n            admission_timing,\n            on_completion,\n            on_rejection,\n            on_admission_failure,\n        )\n    }\n\n'''
          text = text.replace(anchor, insertion + anchor, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          test "$(grep -c "$TARGET" "$SOURCE")" -eq 2
          cargo fmt --all -- --check
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$SOURCE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SOURCE"
          git commit -m 'C03e-PR: materialize fallible verifier-time endpoint lifecycle runtime composition'
          git push origin "HEAD:${GITHUB_REF_NAME}"
