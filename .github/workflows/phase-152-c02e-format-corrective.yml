name: PRW Phase 152 C02e Format Corrective

on:
  push:
    branches:
      - phase-152-c02e-dynamic-reachability-design
    paths:
      - '.github/workflows/phase-152-c02e-format-corrective.yml'

permissions:
  contents: write

concurrency:
  group: prw-phase-152-c02e-format-corrective
  cancel-in-progress: false

jobs:
  format-corrective:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply exact pinned workspace rustfmt corrective
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "phase-152-c02e-dynamic-reachability-design"
          C02D=857583b25ed1206317641a93fd8f927819c954d8
          git merge-base --is-ancestor "${C02D}" HEAD
          test "$(git merge-base "${C02D}" HEAD)" = "${C02D}"

          BASE_HEAD="$(git rev-parse HEAD)"
          test "${BASE_HEAD}" = "${GITHUB_SHA}"

          rustc --version
          cargo --version
          rustfmt --version

          sha256sum Cargo.toml Cargo.lock crates/prw-remote-bridge/Cargo.toml \
            > "${RUNNER_TEMP}/dependency-before.sha256"

          cargo fmt --all

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          printf 'rustfmt changed paths:\n'
          printf '  %s\n' "${changed[@]}"

          for path in "${changed[@]}"; do
            case "${path}" in
              *.rs) ;;
              *)
                echo "rustfmt corrective attempted non-Rust mutation: ${path}" >&2
                exit 1
                ;;
            esac
          done

          sha256sum Cargo.toml Cargo.lock crates/prw-remote-bridge/Cargo.toml \
            > "${RUNNER_TEMP}/dependency-after.sha256"
          diff -u "${RUNNER_TEMP}/dependency-before.sha256" "${RUNNER_TEMP}/dependency-after.sha256"
          git diff --exit-code -- Cargo.toml Cargo.lock crates/prw-remote-bridge/Cargo.toml
          git diff --check

          REPORT="logs/audits/phase-152-c02e-dynamic-reachability-design/C02E_TRANCHE1_FORMAT_CORRECTIVE_${BASE_HEAD}.txt"
          {
            echo 'STATUS=FORMATTER_ONLY_CORRECTIVE'
            echo "BASE_HEAD=${BASE_HEAD}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUSTC=$(rustc --version)"
            echo "CARGO=$(cargo --version)"
            echo "RUSTFMT=$(rustfmt --version)"
            echo "CHANGED_RUST_PATH_COUNT=${#changed[@]}"
            printf 'CHANGED_RUST_PATH=%s\n' "${changed[@]}"
            echo 'DEPENDENCY_STATE=UNCHANGED'
            echo 'SEMANTIC_EDIT=NONE_INTENDED_EXACT_RUSTFMT_OUTPUT_ONLY'
          } > "${REPORT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs' "${REPORT}"
          git diff --cached --check
          git commit -m "phase 152 c02e: apply exact rustfmt corrective ${BASE_HEAD::12}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
