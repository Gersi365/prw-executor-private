name: Phase 098 Signal-Aware Runtime Integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase-098-signal-runtime-integrate.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Integrate Phase 098 signal-aware runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          types_path = Path("crates/prw-agent/src/linux_production_runtime_types.rs")
          types = types_path.read_text()
          import_old = "use super::runtime_orchestration::{\n    LocalLinuxRuntimeOrchestrationError, LocalLinuxRuntimeOrchestrationReport,\n    LocalLinuxRuntimeOrchestrationStop, LocalLinuxRuntimeSchedulingCycleError,\n};"
          import_new = "use super::runtime_orchestration::{\n    LocalLinuxRuntimeOrchestrationError, LocalLinuxRuntimeOrchestrationReport,\n    LocalLinuxRuntimeOrchestrationStop, LocalLinuxRuntimeSchedulingCycleError,\n    LocalLinuxRuntimeSchedulingCycleReport,\n};\nuse super::signal_aware_readiness::{\n    LocalLinuxSignalAwareReadinessOutcome, LocalLinuxSignalAwareReadinessReport,\n};"
          if types.count(import_old) != 1:
              raise SystemExit("Phase 098 counter import anchor mismatch")
          types = types.replace(import_old, import_new, 1)

          anchor = '''    /// Records evidence accumulated before one scheduling failure.\n    pub fn record_scheduling_error(&mut self, error: &LocalLinuxRuntimeSchedulingCycleError) {\n'''
          extra = '''    /// Records one successful signal-aware readiness step.\n    pub fn record_signal_aware_readiness(\n        &mut self,\n        report: &LocalLinuxSignalAwareReadinessReport,\n    ) {\n        self.readiness_steps.increment();\n        if report.listener_armed() {\n            self.listener_armed_steps.increment();\n        }\n        match report.outcome() {\n            LocalLinuxSignalAwareReadinessOutcome::RuntimeWake => self.runtime_wakes.increment(),\n            LocalLinuxSignalAwareReadinessOutcome::WaitInterrupted => {\n                self.wait_interruptions.increment();\n            }\n            LocalLinuxSignalAwareReadinessOutcome::ShutdownObserved\n            | LocalLinuxSignalAwareReadinessOutcome::TerminationSignal(_)\n            | LocalLinuxSignalAwareReadinessOutcome::ListenerReady => {}\n        }\n        self.worker_completions.add_usize(report.completions().len());\n    }\n\n    /// Records one successful runtime-specific scheduling cycle after readiness.\n    pub fn record_runtime_scheduling_report(\n        &mut self,\n        report: &LocalLinuxRuntimeSchedulingCycleReport,\n    ) {\n        self.scheduling_attempts\n            .add_usize(report.scheduling_attempts());\n        self.workers_registered\n            .add_usize(report.workers_registered());\n        self.worker_completions.add_usize(report.completions().len());\n    }\n\n    /// Records scheduling evidence after readiness was already counted separately.\n    pub fn record_runtime_scheduling_error(\n        &mut self,\n        error: &LocalLinuxRuntimeSchedulingCycleError,\n    ) {\n        self.scheduling_attempts\n            .add_usize(error.scheduling_attempts());\n        self.workers_registered.add_usize(error.workers_registered());\n        self.worker_completions.add_usize(error.completions().len());\n    }\n\n'''
          if types.count(anchor) != 1:
              raise SystemExit("Phase 098 counter method insertion anchor mismatch")
          types_path.write_text(types.replace(anchor, extra + anchor, 1))

          runtime_path = Path("crates/prw-agent/src/linux_signal_aware_runtime.rs")
          runtime = runtime_path.read_text()
          runtime = runtime.replace(
              "    LocalLinuxRuntimeShutdownHandle, LocalLinuxRuntimeSchedulingCycleError,\n    LocalLinuxRuntimeSchedulingCycleReport, run_bounded_runtime_scheduling_cycle,\n",
              "    LocalLinuxRuntimeShutdownHandle, run_bounded_runtime_scheduling_cycle,\n",
              1,
          )
          runtime = runtime.replace(
              "    LocalLinuxSignalAwareReadinessError, LocalLinuxSignalAwareReadinessOutcome,\n    LocalLinuxSignalAwareReadinessReport, wait_once_for_signal_aware_linux_runtime_readiness,\n",
              "    LocalLinuxSignalAwareReadinessError, LocalLinuxSignalAwareReadinessOutcome,\n    wait_once_for_signal_aware_linux_runtime_readiness,\n",
              1,
          )
          runtime = runtime.replace(
              "struct LocalLinuxSignalAwareRuntimeLoopExit {\n",
              "pub struct LocalLinuxSignalAwareRuntimeLoopExit {\n",
              1,
          )
          if runtime.count("counters.record_scheduling_error(&error);") != 1:
              raise SystemExit("Phase 098 scheduling-error counter anchor mismatch")
          runtime = runtime.replace(
              "counters.record_scheduling_error(&error);",
              "counters.record_runtime_scheduling_error(&error);",
              1,
          )
          runtime_path.write_text(runtime)

          identity_path = Path("crates/prw-agent/src/linux_identity.rs")
          identity = identity_path.read_text()
          docs_old = "//! `unsafe_code = forbid`. The Agent bootstrap remains inactive; `main.rs` and\n//! systemd still do not start this runtime."
          docs_new = "//! `unsafe_code = forbid`. Phase 098 also composes these primitives into a\n//! callable signal-aware long-running runtime with mask restoration after\n//! listener cleanup. The Agent bootstrap remains inactive; `main.rs` and systemd\n//! still do not start this runtime."
          if identity.count(docs_old) != 1:
              raise SystemExit("Phase 098 signal runtime documentation anchor mismatch")
          identity = identity.replace(docs_old, docs_new, 1)
          module_anchor = "#[allow(\n    dead_code,\n    reason = \"pre-bootstrap signal-aware Linux readiness is intentionally crate-internal\"\n)]\n#[path = \"linux_signal_aware_readiness.rs\"]\npub mod signal_aware_readiness;\n"
          module_insert = module_anchor + "#[allow(\n    dead_code,\n    reason = \"pre-bootstrap signal-aware Linux runtime is intentionally crate-internal\"\n)]\n#[path = \"linux_signal_aware_runtime.rs\"]\npub mod signal_aware_runtime;\n"
          if identity.count(module_anchor) != 1:
              raise SystemExit("Phase 098 signal runtime module anchor mismatch")
          identity_path.write_text(identity.replace(module_anchor, module_insert, 1))
          PY

          cargo fmt --all
          changed="$(git diff --name-only | sort)"
          allowed="$(printf '%s\n' crates/prw-agent/src/linux_identity.rs crates/prw-agent/src/linux_production_runtime_loop.rs crates/prw-agent/src/linux_production_runtime_types.rs crates/prw-agent/src/linux_signal_aware_runtime.rs | sort)"
          python3 - "$changed" "$allowed" <<'PY'
          import sys
          changed = {line for line in sys.argv[1].splitlines() if line}
          allowed = {line for line in sys.argv[2].splitlines() if line}
          required = {
              "crates/prw-agent/src/linux_identity.rs",
              "crates/prw-agent/src/linux_production_runtime_types.rs",
              "crates/prw-agent/src/linux_signal_aware_runtime.rs",
          }
          if not required.issubset(changed):
              raise SystemExit(f"Phase 098 required mutation missing: {sorted(required - changed)}")
          if not changed.issubset(allowed):
              raise SystemExit(f"Phase 098 unexpected mutation: {sorted(changed - allowed)}")
          PY
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          git diff --check

      - name: Commit integrated runtime and self-delete
        run: |
          rm .github/workflows/phase-098-signal-runtime-integrate.yml
          git add crates/prw-agent/src/linux_identity.rs crates/prw-agent/src/linux_production_runtime_loop.rs crates/prw-agent/src/linux_production_runtime_types.rs crates/prw-agent/src/linux_signal_aware_runtime.rs .github/workflows/phase-098-signal-runtime-integrate.yml
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git commit -m "Integrate Phase 098 signal-aware production runtime"
          git push
