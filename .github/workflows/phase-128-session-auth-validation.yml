name: Phase 128 Session Authentication Validation

on:
  push:
    paths:
      - '.github/workflows/phase-128-session-auth-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate session authentication contract and implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = 'e4a8c4100c2db7df74fb02f54df82908c7e376b1dc2e387822261150bbd7187e'
          cp Cargo.lock Cargo.lock.expected
          cargo generate-lockfile
          cmp -s Cargo.lock.expected Cargo.lock
          echo 'phase128_lockfile_reproduction=byte_identical'
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check
          cargo clippy --locked \
            -p prw-control-plane \
            -p prw-device-identity \
            -p prw-device-identity-signer \
            -p prw-session \
            --all-targets --all-features -- -D warnings
          cargo test --locked \
            -p prw-control-plane \
            -p prw-device-identity \
            -p prw-device-identity-signer \
            -p prw-session \
            --all-targets
          echo 'phase128_validation=pass'
