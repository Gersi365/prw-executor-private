name: Phase 152 C03 Management Transaction Import Corrective

on:
  push:
    branches:
      - phase-152-c03-management-transaction-import-corrective
    paths:
      - '.github/workflows/phase-152-c03-management-transaction-import-corrective.yml'

permissions:
  contents: write

jobs:
  correct-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-152-c03-management-transaction-import-corrective
          fetch-depth: 0
      - name: Verify exact corrected transaction baseline
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor c55117e3d625cd7737d901aa4b67ad370535f818 HEAD
          git diff --quiet c55117e3d625cd7737d901aa4b67ad370535f818 -- crates/prw-agent/src/local_commands/management_boundary_transaction.rs
      - name: Correct LocalIpcPayload test import
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/prw-agent/src/local_commands/management_boundary_transaction.rs')
          text = path.read_text()
          old = '''    use crate::LocalIpcRequestId;\n    use crate::frame_object::reader::read_frame;'''
          new = '''    use crate::LocalIpcRequestId;\n    use crate::frame_object::LocalIpcPayload;\n    use crate::frame_object::reader::read_frame;'''
          if text.count(old) != 1:
              raise SystemExit('unexpected LocalIpcRequestId anchor count')
          text = text.replace(old, new, 1)
          old = '''    use crate::{\n        LocalIpcFrameHeader, LocalIpcMessageKind, LocalIpcPayload, LocalIpcProtocolVersion,\n    };'''
          new = '''    use crate::{LocalIpcFrameHeader, LocalIpcMessageKind, LocalIpcProtocolVersion};'''
          if text.count(old) != 1:
              raise SystemExit('unexpected LocalIpcPayload root import anchor count')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          git restore -- target || true
      - name: Verify one-file source scope
        run: |
          set -Eeuo pipefail
          git diff --name-only | sort > /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 1
          grep -qx 'crates/prw-agent/src/local_commands/management_boundary_transaction.rs' /tmp/changed.txt
      - name: Validate from clean build artifacts
        run: |
          set -Eeuo pipefail
          rm -rf target
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo clippy --locked -p prw-agent --all-targets --all-features -- -D warnings
          git restore -- target || true
      - name: Commit source corrective and remove applicator
        run: |
          set -Eeuo pipefail
          rm .github/workflows/phase-152-c03-management-transaction-import-corrective.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/prw-agent/src/local_commands/management_boundary_transaction.rs .github/workflows/phase-152-c03-management-transaction-import-corrective.yml
          git commit -m 'phase 152 c03: correct transaction test payload import'
          git push origin HEAD:phase-152-c03-management-transaction-import-corrective
