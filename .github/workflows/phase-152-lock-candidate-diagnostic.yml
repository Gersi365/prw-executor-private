name: PRW Phase 152 Lock Candidate Diagnostic

on:
  push:
    branches:
      - phase-152-c02e-dynamic-reachability-design
    paths:
      - '.github/workflows/phase-152-lock-candidate-diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: prw-phase-152-lock-candidate-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Materialize candidate transiently and report exact dependency delta
        shell: bash
        run: |
          set -euo pipefail
          BASE_HEAD="$(git rev-parse HEAD)"
          test "${BASE_HEAD}" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "phase-152-c02e-dynamic-reachability-design"

          REPORT="logs/audits/phase-152-c02e-dynamic-reachability-design/C02E_LOCK_CANDIDATE_DIAGNOSTIC_${BASE_HEAD}.txt"
          mkdir -p "$(dirname "${REPORT}")"
          : > "${REPORT}"

          cp Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"
          cp target/.rustc_info.json "${RUNNER_TEMP}/rustc_info.before.json"

          python3 - <<'PY'
          import json, tomllib
          from pathlib import Path
          data = tomllib.loads(Path('Cargo.lock').read_text())
          external = sorted(
              (p['name'], p['version'], p.get('source'), p.get('checksum'))
              for p in data['package'] if p.get('source') is not None
          )
          local_deps = {
              p['name']: sorted(p.get('dependencies', []))
              for p in data['package'] if p.get('source') is None
          }
          Path('/tmp/external-before.json').write_text(json.dumps(external, sort_keys=True))
          Path('/tmp/local-deps-before.json').write_text(json.dumps(local_deps, sort_keys=True))
          PY

          set +e
          cargo metadata --format-version 1 > "${RUNNER_TEMP}/metadata.json" 2> "${RUNNER_TEMP}/metadata.stderr"
          metadata_rc=$?
          set -e

          {
            echo 'STATUS=DIAGNOSTIC_ONLY_NO_LOCK_COMMIT'
            echo "BASE_HEAD=${BASE_HEAD}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUSTC=$(rustc --version)"
            echo "CARGO=$(cargo --version)"
            echo "LOCK_BEFORE_SHA256=$(sha256sum "${RUNNER_TEMP}/Cargo.lock.before" | awk '{print $1}')"
            echo "CARGO_METADATA_RC=${metadata_rc}"
            echo '===== CARGO_METADATA_STDERR ====='
            cat "${RUNNER_TEMP}/metadata.stderr"
            echo '===== TRACKED_PATHS_CHANGED_BY_MATERIALIZATION ====='
            git diff --name-only
            echo '===== CARGO_LOCK_CANDIDATE_DIFF ====='
            git diff -- Cargo.lock
          } >> "${REPORT}"

          if [[ "${metadata_rc}" -eq 0 ]]; then
            python3 - <<'PY' >> "${REPORT}"
          import json, os, tomllib
          from pathlib import Path

          before_external = set(tuple(x) for x in json.loads(Path('/tmp/external-before.json').read_text()))
          before_deps = json.loads(Path('/tmp/local-deps-before.json').read_text())
          data = tomllib.loads(Path('Cargo.lock').read_text())
          after_external = set(
              (p['name'], p['version'], p.get('source'), p.get('checksum'))
              for p in data['package'] if p.get('source') is not None
          )
          after_deps = {
              p['name']: sorted(p.get('dependencies', []))
              for p in data['package'] if p.get('source') is None
          }

          print('===== SEMANTIC_LOCK_DELTA =====')
          print('EXTERNAL_ADDED=', json.dumps(sorted(after_external-before_external)))
          print('EXTERNAL_REMOVED=', json.dumps(sorted(before_external-after_external)))

          dep_changes = {}
          for name in sorted(set(before_deps) | set(after_deps)):
              b = set(before_deps.get(name, []))
              a = set(after_deps.get(name, []))
              if a != b:
                  dep_changes[name] = {'added': sorted(a-b), 'removed': sorted(b-a)}
          print('LOCAL_DEPENDENCY_CHANGES=', json.dumps(dep_changes, sort_keys=True))

          metadata = json.loads((Path(os.environ['RUNNER_TEMP']) / 'metadata.json').read_text())
          packages = {p['id']: p for p in metadata.get('packages', [])}
          nodes = {n['id']: n for n in (metadata.get('resolve') or {}).get('nodes', [])}
          target_ids = [pid for pid,p in packages.items() if p.get('name') == 'libyuv-sys']
          print('LIBYUV_SYS_PACKAGE_IDS=', json.dumps(target_ids))
          for tid in target_ids:
              p = packages[tid]
              print('LIBYUV_SYS_PACKAGE=', json.dumps({k:p.get(k) for k in ['name','version','source','manifest_path']}, sort_keys=True))
              rev = []
              for nid,node in nodes.items():
                  for dep in node.get('deps', []):
                      if dep.get('pkg') == tid:
                          parent = packages.get(nid, {})
                          rev.append({'parent_id':nid,'parent_name':parent.get('name'),'parent_version':parent.get('version'),'dep_name':dep.get('name')})
              print('LIBYUV_SYS_DIRECT_REVERSE_DEPS=', json.dumps(rev, sort_keys=True))

              reverse = {}
              for nid,node in nodes.items():
                  for dep in node.get('deps', []):
                      reverse.setdefault(dep.get('pkg'), []).append(nid)
              queue=[(tid,[tid])]
              paths=[]
              while queue and len(paths)<50:
                  cur,path=queue.pop(0)
                  for parent in reverse.get(cur,[]):
                      if parent in path:
                          continue
                      pp=packages.get(parent,{})
                      npath=path+[parent]
                      if pp.get('source') is None:
                          paths.append(npath)
                      if len(npath)<8:
                          queue.append((parent,npath))
              def label(pid):
                  p=packages.get(pid,{})
                  return f"{p.get('name')}@{p.get('version')}"
              print('LIBYUV_SYS_REVERSE_PATHS_TO_WORKSPACE=', json.dumps([[label(x) for x in reversed(path)] for path in paths], sort_keys=True))
          PY
          fi

          {
            echo "LOCK_CANDIDATE_SHA256=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "RUSTC_INFO_BEFORE_SHA256=$(sha256sum "${RUNNER_TEMP}/rustc_info.before.json" | awk '{print $1}')"
            echo "RUSTC_INFO_CANDIDATE_SHA256=$(sha256sum target/.rustc_info.json | awk '{print $1}')"
          } >> "${REPORT}"

          cp "${RUNNER_TEMP}/Cargo.lock.before" Cargo.lock
          cp "${RUNNER_TEMP}/rustc_info.before.json" target/.rustc_info.json
          git diff --exit-code -- Cargo.lock target/.rustc_info.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${REPORT}"
          git diff --cached --check
          git commit -m "phase 152 c02e: record lock candidate diagnostic ${BASE_HEAD::12}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
