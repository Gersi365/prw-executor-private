name: C03e-AL Canonical Rustfmt Temporary

on:
  push:
    branches:
      - phase-152-c03e-al-repeated-real-admission-persistent-collection-supervisor-source-materialization-staging

permissions:
  contents: write

jobs:
  format-and-self-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-152-c03e-al-repeated-real-admission-persistent-collection-supervisor-source-materialization-staging
          fetch-depth: 0
      - name: Apply canonical rustfmt
        run: cargo fmt --all
      - name: Self-remove formatter workflow
        run: rm .github/workflows/c03e-al-canonical-rustfmt.yml
      - name: Commit formatter result and self-removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Phase 152 C03e-AL: apply canonical rustfmt"
          git push origin HEAD:phase-152-c03e-al-repeated-real-admission-persistent-collection-supervisor-source-materialization-staging
