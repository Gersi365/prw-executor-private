name: Phase 109 A05 Post Rollback Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-109-a05-post-rollback-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, prw-host]
    timeout-minutes: 5
    steps:
      - name: Read-only post-rollback state and guard replay
        shell: bash
        run: |
          set -u
          stage='/home/gersi365/.local/state/private-remote-workspace/phase109/staging/8d283ec53bd37233a929fb720a189748dc7f992c'
          agent='/usr/lib/private-remote-workspace/prw-agent'
          unit='/usr/lib/systemd/user/prw-agent.service'
          dir='/usr/lib/private-remote-workspace'
          unit_parent='/usr/lib/systemd/user'

          echo '=== PRW PHASE 109 A05 POST-ROLLBACK DIAGNOSTIC ==='
          printf 'hostname='; hostname
          printf 'user='; id -un
          printf 'uid='; id -u

          echo '--- staging ---'
          for p in "$stage" "$stage/prw-agent" "$stage/prw-agent.service" "$stage/SHA256SUMS"; do
            if [[ -e "$p" || -L "$p" ]]; then
              stat -Lc '%n mode=%a uid=%u gid=%g type=%F' "$p"
            else
              echo "$p absent"
            fi
          done
          (cd "$stage" && sha256sum -c SHA256SUMS)

          echo '--- privileged guard replay (read-only) ---'
          check() { if eval "$2"; then echo "$1=PASS"; else echo "$1=FAIL"; fi; }
          check stage_dir 'test -d "$stage"'
          check stage_not_symlink 'test ! -L "$stage"'
          check stage_mode_owner 'test "$(stat -c "%u:%g:%a" "$stage")" = "1000:1000:700"'
          check agent_mode_owner 'test "$(stat -c "%u:%g:%a" "$stage/prw-agent")" = "1000:1000:755"'
          check unit_mode_owner 'test "$(stat -c "%u:%g:%a" "$stage/prw-agent.service")" = "1000:1000:644"'
          check agent_hash 'test "$(sha256sum "$stage/prw-agent" | cut -d" " -f1)" = "8d0fa919676d1d55200801dd979a5463228610ad0f5aea1d2fd8bbded7047fbf"'
          check unit_hash 'test "$(sha256sum "$stage/prw-agent.service" | cut -d" " -f1)" = "24f646dc96777542904cd824f1678e6c32256b64911d4a031c0315d198c0a909"'
          check agent_absent 'test ! -e "$agent" && test ! -L "$agent"'
          check unit_absent 'test ! -e "$unit" && test ! -L "$unit"'
          check unit_parent_dir 'test -d "$unit_parent"'
          check unit_parent_not_symlink 'test ! -L "$unit_parent"'
          check unit_parent_mode_owner 'test "$(stat -c "%u:%g:%a" "$unit_parent")" = "0:0:755"'

          echo '--- rollback destinations ---'
          for p in "$dir" "$agent" "$unit"; do
            if [[ -e "$p" || -L "$p" ]]; then
              stat -Lc '%n mode=%a uid=%u gid=%g type=%F' "$p"
              if [[ -f "$p" ]]; then sha256sum "$p"; fi
              if [[ -d "$p" ]]; then find "$p" -mindepth 1 -maxdepth 1 -printf 'child=%f type=%y\n' | sort; fi
            else
              echo "$p absent"
            fi
          done

          echo '--- service state ---'
          systemctl --user show prw-agent.service -p LoadState -p ActiveState -p SubState -p UnitFileState 2>&1 || true
          loginctl show-user gersi365 -p Linger -p RuntimePath -p State
          echo '=== END A05 DIAGNOSTIC ==='
          # Trigger marker: diagnostic content unchanged.
