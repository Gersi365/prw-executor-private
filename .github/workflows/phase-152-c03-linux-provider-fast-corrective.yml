name: Phase 152 C03 Linux Provider Fast Corrective

on:
  push:
    branches:
      - phase-152-c03-linux-provider-corrected-fast
    paths:
      - '.github/workflows/phase-152-c03-linux-provider-fast-corrective.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-152-c03-linux-provider-corrected-fast
          fetch-depth: 0
      - name: Verify exact failed provider source
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor b5c3bf5904148f10223a2c2ffdc83b0ac2a3d1b8 HEAD
          git diff --quiet b5c3bf5904148f10223a2c2ffdc83b0ac2a3d1b8 -- crates/prw-agent/src/local_commands/management_linux_backends.rs Cargo.lock crates/prw-agent/Cargo.toml
      - name: Apply exact diagnosed corrective
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/prw-agent/src/local_commands/management_linux_backends.rs')
          text = path.read_text()
          replacements = [
              ('pub(crate) struct LinuxLocalTerminalBackend;', 'pub struct LinuxLocalTerminalBackend;'),
              ('pub(crate) struct LinuxLocalTerminalHandle {', 'pub struct LinuxLocalTerminalHandle {'),
              ('pub(crate) struct LinuxLocalForwardingBackend<P> {', 'pub struct LinuxLocalForwardingBackend<P> {'),
              ('pub(crate) struct LinuxLocalForwardingHandle {', 'pub struct LinuxLocalForwardingHandle {'),
              ('    pub(crate) fn new(policy: P) -> Self {', '    pub fn new(policy: P) -> Self {'),
              ('''        let reader_thread = match thread::Builder::new()
            .name("prw-local-terminal-reader".into())
            .spawn(move || {
                let mut reader = reader;
                let mut buffer = [0_u8; TERMINAL_READER_CHUNK_BYTES];
                loop {
                    match reader.read(&mut buffer) {
                        Ok(0) => break,
                        Ok(count) => {
                            if sender.send(buffer[..count].to_vec()).is_err() {
                                break;
                            }
                        }
                        Err(error) if error.kind() == ErrorKind::Interrupted => {}
                        Err(_) => break,
                    }
                }
            }) {
            Ok(thread) => thread,
            Err(_) => {
                let _ = child.kill();
                let _ = child.wait();
                return Err(TerminalError::Backend);
            }
        };''', '''        let Ok(reader_thread) = thread::Builder::new()
            .name("prw-local-terminal-reader".into())
            .spawn(move || {
                let mut reader = reader;
                let mut buffer = [0_u8; TERMINAL_READER_CHUNK_BYTES];
                loop {
                    match reader.read(&mut buffer) {
                        Ok(0) => break,
                        Ok(count) => {
                            if sender.send(buffer[..count].to_vec()).is_err() {
                                break;
                            }
                        }
                        Err(error) if error.kind() == ErrorKind::Interrupted => {}
                        Err(_) => break,
                    }
                }
            })
        else {
            let _ = child.kill();
            let _ = child.wait();
            return Err(TerminalError::Backend);
        };'''),
              ('''        if let Some(reader_thread) = self.reader_thread.take() {
            if reader_thread.join().is_err() {
                success = false;
            }
        }''', '''        if let Some(reader_thread) = self.reader_thread.take()
            && reader_thread.join().is_err()
        {
            success = false;
        }'''),
              ('''            .spawn(move || run_accept_loop(listener, target, cancel_for_thread, aggregate))''', '''            .spawn(move || run_accept_loop(&listener, target, &cancel_for_thread, &aggregate))'''),
              ('''fn run_accept_loop(
    listener: TcpListener,
    target: SocketAddr,
    cancel: Arc<AtomicBool>,
    aggregate: Arc<AtomicUsize>,
) -> Result<(), ()> {''', '''fn run_accept_loop(
    listener: &TcpListener,
    target: SocketAddr,
    cancel: &Arc<AtomicBool>,
    aggregate: &Arc<AtomicUsize>,
) -> Result<(), ()> {'''),
              ('let cancel_for_worker = Arc::clone(&cancel);', 'let cancel_for_worker = Arc::clone(cancel);'),
              ('aggregate: Arc::clone(&aggregate),', 'aggregate: Arc::clone(aggregate),'),
              ('''                match thread::Builder::new()
                    .name("prw-local-forward-pump".into())
                    .spawn(move || {
                        let _lease = lease;
                        pump_forward(client, target, &cancel_for_worker);
                    }) {
                    Ok(worker) => workers.push(worker),
                    Err(_) => {
                        session_connections.fetch_sub(1, Ordering::AcqRel);
                        aggregate.fetch_sub(1, Ordering::AcqRel);
                    }
                }''', '''                if let Ok(worker) = thread::Builder::new()
                    .name("prw-local-forward-pump".into())
                    .spawn(move || {
                        let _lease = lease;
                        pump_forward(client, target, &cancel_for_worker);
                    })
                {
                    workers.push(worker);
                }'''),
              ('fn loopback_socket(spec: TcpForwardSpec) -> SocketAddr {', 'const fn loopback_socket(spec: TcpForwardSpec) -> SocketAddr {'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'unexpected corrective anchor count {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          git restore -- target || true
      - name: Verify exact one-file source delta
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --name-only | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 1
          grep -qx 'crates/prw-agent/src/local_commands/management_linux_backends.rs' /tmp/changed.txt
      - name: Remove applicator and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/phase-152-c03-linux-provider-fast-corrective.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/prw-agent/src/local_commands/management_linux_backends.rs .github/workflows/phase-152-c03-linux-provider-fast-corrective.yml
          git commit -m 'phase 152 c03: correct linux provider lifecycle lint'
          git push origin HEAD:phase-152-c03-linux-provider-corrected-fast
