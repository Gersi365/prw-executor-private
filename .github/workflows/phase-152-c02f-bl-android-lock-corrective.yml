name: PRW Phase 152 C02f-BL Android Lock Corrective

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: prw-phase-152-c02f-bl-android-lock-corrective-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'phase-152-c02f-bl-attempt-id-generation-materialization-staging'
    name: Materialize exact BL Android native lock delta
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact BL candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase-152-c02f-bl-attempt-id-generation-materialization-staging
          fetch-depth: 0

      - name: Update Android native lockfile with Cargo and enforce exact delta
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          cd apps/android/native
          cargo metadata --format-version 1 > /dev/null
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          git diff --check -- Cargo.lock
          numstat="$(git diff --numstat -- Cargo.lock)"
          additions="$(git diff -- Cargo.lock | grep '^+' | grep -v '^+++' || true)"
          deletions="$(git diff -- Cargo.lock | grep '^-' | grep -v '^---' || true)"
          test "$numstat" = $'1\t0\tCargo.lock'
          test "$additions" = '+ "aws-lc-rs",'
          test -z "$deletions"
          test "$(git status --short | awk '{print $2}')" = 'apps/android/native/Cargo.lock'
          base_blob="$(git rev-parse HEAD:apps/android/native/Cargo.lock)"
          target_blob="$(git hash-object Cargo.lock)"
          source_head="$(git rev-parse HEAD)"
          echo "base_blob=$base_blob" >> "$GITHUB_OUTPUT"
          echo "target_blob=$target_blob" >> "$GITHUB_OUTPUT"
          echo "source_head=$source_head" >> "$GITHUB_OUTPUT"

      - name: Commit exact Cargo-updated Android native lockfile through Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: phase-152-c02f-bl-attempt-id-generation-materialization-staging
          BASE_BLOB: ${{ steps.classify.outputs.base_blob }}
          TARGET_BLOB: ${{ steps.classify.outputs.target_blob }}
          SOURCE_HEAD: ${{ steps.classify.outputs.source_head }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD:apps/android/native/Cargo.lock)" = "$BASE_BLOB"
          test "$(git hash-object apps/android/native/Cargo.lock)" = "$TARGET_BLOB"
          python3 - <<'PY' > /tmp/android-lock-update.json
          import base64
          import json
          import os
          import sys
          with open('apps/android/native/Cargo.lock', 'rb') as handle:
              content = base64.b64encode(handle.read()).decode('ascii')
          json.dump({
              'message': 'phase 152 c02f-bl: materialize Cargo-generated Android native lock dependency',
              'content': content,
              'sha': os.environ['BASE_BLOB'],
              'branch': os.environ['BRANCH'],
          }, sys.stdout, separators=(',', ':'))
          PY
          response="$(curl --fail-with-body -sS \
            -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/apps/android/native/Cargo.lock" \
            --data-binary @/tmp/android-lock-update.json)"
          committed_blob="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["content"]["sha"])')"
          committed_sha="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          test "$committed_blob" = "$TARGET_BLOB"
          test -n "$committed_sha"
          printf 'C02F_BL_ANDROID_LOCK_COMMIT=%s\n' "$committed_sha"
          printf 'C02F_BL_ANDROID_LOCK_BLOB=%s\n' "$committed_blob"
