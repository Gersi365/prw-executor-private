name: PRW Phase 152 C02f-BL Android Lock Corrective

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: prw-phase-152-c02f-bl-android-lock-corrective-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'phase-152-c02f-bl-attempt-id-generation-materialization-staging'
    name: Diagnose BL Android native lock delta
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact BL candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase-152-c02f-bl-attempt-id-generation-materialization-staging
          fetch-depth: 0

      - name: Generate and report Android native lock delta without writing repository
        shell: bash
        run: |
          set -euo pipefail
          cd apps/android/native
          printf 'C02F_BL_ANDROID_LOCK_CWD=%s\n' "$PWD"
          printf 'C02F_BL_ANDROID_LOCK_SOURCE_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'C02F_BL_ANDROID_LOCK_BASE_BLOB=%s\n' "$(git rev-parse HEAD:apps/android/native/Cargo.lock)"
          cargo metadata --format-version 1 > /dev/null
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          git diff --check -- Cargo.lock
          printf '%s\n' 'C02F_BL_ANDROID_LOCK_STATUS_BEGIN'
          git status --short
          printf '%s\n' 'C02F_BL_ANDROID_LOCK_STATUS_END'
          printf '%s\n' 'C02F_BL_ANDROID_LOCK_NUMSTAT_BEGIN'
          git diff --numstat -- Cargo.lock
          printf '%s\n' 'C02F_BL_ANDROID_LOCK_NUMSTAT_END'
          printf 'C02F_BL_ANDROID_LOCK_TARGET_BLOB=%s\n' "$(git hash-object Cargo.lock)"
          printf '%s\n' 'C02F_BL_ANDROID_LOCK_DIFF_BEGIN'
          git diff -- Cargo.lock
          printf '%s\n' 'C02F_BL_ANDROID_LOCK_DIFF_END'
