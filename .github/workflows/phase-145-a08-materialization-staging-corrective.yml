name: Phase 145 A08 Materialization Staging Corrective

on:
  push:
    paths:
      - '.github/workflows/phase-145-a08-materialization-staging-corrective.yml'

permissions:
  contents: write

jobs:
  materialize-validated-a07:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prove A07 validated baseline and write-only failure
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .github/workflows/phase-145-a07-agp-jni-string-path-corrective.yml
          test -f .github/workflows/phase-145-a05-clippy-corrective.yml
          grep -Fq 'sourceSets["main"].jniLibs.directories.add(generatedJniLibs.get().asFile.absolutePath)' .github/workflows/phase-145-a07-agp-jni-string-path-corrective.yml
          grep -Fq "git add apps/android .github/workflows/android-validation.yml logs/audits/phase-145-android-client-foundation/PRW-PHASE-145-ANDROID-CLIENT-FOUNDATION-VALIDATION.txt" .github/workflows/phase-145-a07-agp-jni-string-path-corrective.yml
          echo phase145_a08_baseline=pass

      - name: Reconstruct exact A07 validated source candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def extract_run(source: str, step_name: str, next_step_name: str) -> str:
              marker = f'      - name: {step_name}\n'
              start = source.index(marker)
              run_marker = '        run: |\n'
              body_start = source.index(run_marker, start) + len(run_marker)
              end = source.index(f'      - name: {next_step_name}\n', body_start)
              lines = source[body_start:end].splitlines()
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          source = Path('.github/workflows/phase-145-a07-agp-jni-string-path-corrective.yml').read_text()
          script = extract_run(source, 'Reconstruct A05 validated native source candidate', 'Apply exact AGP JNI String path corrective')
          script += '\n' + extract_run(source, 'Apply exact AGP JNI String path corrective', 'Reuse A05 native graph validation')
          Path('/tmp/phase145-a08-source.sh').write_text(script)
          PY
          bash /tmp/phase145-a08-source.sh
          grep -Fq '#[must_use]' apps/android/native/src/lib.rs
          grep -Fq 'pub const extern "system" fn Java_com_privateworkspace_prw_NativeBridge_protocolVersion' apps/android/native/src/lib.rs
          grep -Fq 'sourceSets["main"].jniLibs.directories.add(generatedJniLibs.get().asFile.absolutePath)' apps/android/app/build.gradle.kts
          ! grep -Fq 'android.sourceset.disallowProvider=false' apps/android/gradle.properties
          grep -Fq 'dependsOn(buildPrwNative)' apps/android/app/build.gradle.kts
          echo phase145_a08_source=pass

      - name: Materialize exact A07 permanent CI and report
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/phase-145-a07-agp-jni-string-path-corrective.yml').read_text()
          start = source.index('      - name: Materialize permanent Android CI and authoritative A07 report\n')
          body_start = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index('      - name: Commit only validated Phase 145 state\n', body_start)
          lines = source[body_start:end].splitlines()
          Path('/tmp/phase145-a08-finalize.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          bash /tmp/phase145-a08-finalize.sh
          test -f .github/workflows/android-validation.yml
          report=logs/audits/phase-145-android-client-foundation/PRW-PHASE-145-ANDROID-CLIENT-FOUNDATION-VALIDATION.txt
          test -f "$report"
          grep -Fq 'A07 uses the same directories API with the resolved absolute String path' "$report"
          echo phase145_a08_finalize=pass

      - name: Correct generated-output ignore and prove staging boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/android/.gitignore')
          text = path.read_text()
          if '**/target/\n' not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += '**/target/\n'
          path.write_text(text)
          PY
          grep -Fxq '**/target/' apps/android/.gitignore
          mkdir -p apps/android/native/target
          printf 'probe\n' > apps/android/native/target/phase145-a08-ignore-probe
          git check-ignore -q apps/android/native/target/phase145-a08-ignore-probe
          rm -rf apps/android/native/target
          echo phase145_a08_ignore_boundary=pass

      - name: Record A08 materialization corrective in authoritative report
        shell: bash
        run: |
          set -Eeuo pipefail
          report=logs/audits/phase-145-android-client-foundation/PRW-PHASE-145-ANDROID-CLIENT-FOUNDATION-VALIDATION.txt
          cat >> "$report" <<'EOF'
          
          A08 materialization corrective:
          - A07 run 31960247020 passed native, Android unit/lint/APK, security-boundary, root-workspace, and report-generation gates.
          - Its final write step failed after broad `git add apps/android`; the Android ignore file covered Gradle/build outputs but not Cargo `native/target` outputs produced by native validation.
          - A08 adds only the non-semantic `**/target/` ignore rule and replaces broad staging with an explicit validated-source allowlist plus staged-path assertions.
          - No Android behavior, Rust/JNI behavior, security policy, endpoint, signing, deployment, authentication, database, or network behavior changes in A08.
          EOF
          grep -Fq 'A08 adds only the non-semantic `**/target/` ignore rule' "$report"
          echo phase145_a08_report=pass

      - name: Stage only authoritative Phase 145 source and evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check -- apps/android .github/workflows/android-validation.yml logs/audits/phase-145-android-client-foundation/PRW-PHASE-145-ANDROID-CLIENT-FOUNDATION-VALIDATION.txt

          git add \
            apps/android/.gitignore \
            apps/android/README.md \
            apps/android/settings.gradle.kts \
            apps/android/build.gradle.kts \
            apps/android/gradle.properties \
            apps/android/app/build.gradle.kts \
            apps/android/app/src/main/AndroidManifest.xml \
            apps/android/app/src/main/kotlin/com/privateworkspace/prw \
            apps/android/app/src/test/kotlin/com/privateworkspace/prw \
            apps/android/native/Cargo.toml \
            apps/android/native/Cargo.lock \
            apps/android/native/src \
            .github/workflows/android-validation.yml \
            logs/audits/phase-145-android-client-foundation/PRW-PHASE-145-ANDROID-CLIENT-FOUNDATION-VALIDATION.txt

          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          if printf '%s\n' "$staged" | grep -E '(^|/)(build|target|\.gradle)/' ; then
            echo 'generated output entered staged set' >&2
            exit 1
          fi
          if git status --porcelain --untracked-files=all | grep -E '(^| )apps/android/.*/(build|target|\.gradle)/' ; then
            echo 'generated output remains visible despite ignore policy' >&2
            exit 1
          fi
          printf '%s\n' "$staged" > /tmp/phase145-a08-staged.txt
          grep -Fxq 'apps/android/app/build.gradle.kts' /tmp/phase145-a08-staged.txt
          grep -Fxq 'apps/android/native/src/lib.rs' /tmp/phase145-a08-staged.txt
          grep -Fxq '.github/workflows/android-validation.yml' /tmp/phase145-a08-staged.txt
          grep -Fxq 'logs/audits/phase-145-android-client-foundation/PRW-PHASE-145-ANDROID-CLIENT-FOUNDATION-VALIDATION.txt' /tmp/phase145-a08-staged.txt
          echo phase145_a08_staging=pass

      - name: Commit and push validated Phase 145 state
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name Gersi365
          git config user.email Gersi365@outlook.com
          git commit -m 'phase 145: validate Android client foundation'
          git push origin HEAD:main
          echo phase145_a08_materialization=pass
