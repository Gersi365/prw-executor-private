          import os, tomllib
          from pathlib import Path

          def registry_packages(path):
              with open(path, 'rb') as handle:
                  data = tomllib.load(handle)
              return {(p['name'], p['version'], p.get('source'), p.get('checksum')) for p in data.get('package', []) if p.get('source', '').startswith('registry+')}

          before = registry_packages(Path(os.environ['RUNNER_TEMP']) / 'phase149-native-lock-before')
          after = registry_packages('apps/android/native/Cargo.lock')
          root = registry_packages('Cargo.lock')
          added = sorted(after - before)
          missing = [item for item in added if item not in root]
          if missing:
              raise SystemExit(f'Phase149 selected third-party versions absent from root lock: {missing}')
          Path(os.environ['RUNNER_TEMP'], 'phase149-added-registry-packages.txt').write_text(
              '\n'.join(f'{name} {version}' for name, version, _, _ in added) + ('\n' if added else '')
          )
