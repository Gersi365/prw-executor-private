name: Phase 149 Android Forwarding Network DNS

on:
  push:
    paths:
      - '.github/workflows/phase-149-android-forwarding-network-dns.yml'

permissions:
  contents: write

jobs:
  validate-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4

      - name: Prove Phase 149 baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          report=logs/audits/phase-148-android-remote-files-transfers/PRW-PHASE-148-ANDROID-REMOTE-FILES-TRANSFERS-VALIDATION.txt
          test -f "$report"
          for token in PHASE_148_FUNCTIONALLY_VALIDATED MATERIALIZED_ON_MAIN PERMANENT_ANDROID_CI_SUCCESS ROOT_RUST_CI_SUCCESS READY_FOR_PHASE_149; do
            grep -Fq "$token" "$report"
          done
          test -f contracts/ANDROID_FORWARDING_NETWORK_DNS_CONTRACT.md
          test -f contracts/PORT_FORWARDING_FOUNDATION_CONTRACT.md
          test -f contracts/PRIVATE_MESH_CONNECTIVITY_FOUNDATION_CONTRACT.md
          test -f contracts/OPTIONAL_PRIVATE_DNS_FOUNDATION_CONTRACT.md
          test -f apps/android/native/src/files.rs
          test ! -f apps/android/native/src/network.rs
          test ! -f apps/android/app/src/main/kotlin/com/privateworkspace/prw/NetworkManagement.kt
          ! grep -Fq 'prw-forwarding = ' apps/android/native/Cargo.toml
          ! grep -Fq 'prw-connectivity = ' apps/android/native/Cargo.toml
          ! grep -Fq 'prw-private-dns = ' apps/android/native/Cargo.toml
          cp apps/android/native/Cargo.lock "$RUNNER_TEMP/phase149-native-lock-before"
          echo phase149_baseline=pass

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Prepare exact validated Android and Rust toolchains
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          rustup component add --toolchain 1.97.1-x86_64-unknown-linux-gnu rustfmt clippy
          rustup target add --toolchain 1.97.1-x86_64-unknown-linux-gnu aarch64-linux-android x86_64-linux-android
          cargo +1.97.1 install --locked cargo-ndk --version 4.1.2
          cargo +1.97.1 ndk --version | grep -Fq 'cargo-ndk 4.1.2'
          echo phase149_toolchain=pass

      - name: Materialize Phase 149 candidate source in runner
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('apps/android/native/Cargo.toml')
          text = cargo.read_text()
          marker = 'prw-file-transfer = { path = "../../../crates/prw-file-transfer" }\n'
          addition = (
              marker
              + 'prw-forwarding = { path = "../../../crates/prw-forwarding" }\n'
              + 'prw-connectivity = { path = "../../../crates/prw-connectivity" }\n'
              + 'prw-private-dns = { path = "../../../crates/prw-private-dns" }\n'
          )
          if text.count(marker) != 1:
              raise SystemExit('Phase149 native dependency insertion boundary mismatch')
          cargo.write_text(text.replace(marker, addition, 1))

          lib = Path('apps/android/native/src/lib.rs')
          text = lib.read_text()
          marker = 'mod files;\n'
          if text.count(marker) != 1 or 'mod network;' in text:
              raise SystemExit('Phase149 native module insertion boundary mismatch')
          lib.write_text(text.replace(marker, marker + 'mod network;\n', 1))
          PY

          cat > apps/android/native/src/network.rs <<'EOF'
          use std::net::{IpAddr, Ipv4Addr};

          use jni::{
              EnvUnowned,
              errors::ThrowRuntimeExAndDefault,
              objects::{JByteArray, JClass},
              sys::{jboolean, jint, jlong},
          };
          use prw_connectivity::{
              CandidateId, ConnectivityCandidate, ConnectivityEndpoint, ConnectivityPathKind,
              PeerConnectivityIdentity, PeerConnectivityPlan, ReachabilityObservation,
              SelectedConnectivityPath, TransportIdentity,
          };
          use prw_core::DeviceId;
          use prw_forwarding::{
              ForwardTarget, LoopbackBind, LoopbackFamily, PortForwardId, TcpForwardSpec,
          };
          use prw_private_dns::{
              DnsDomainSuffix, PrivateDnsConfig, PrivateDnsMode, ResolverEndpoint,
          };
          use prw_remote_bridge::BridgeCommand;

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          enum NetworkAdapterError {
              Identifier,
              Family,
              Port,
              Address,
              Bridge,
              Observation,
              Connectivity,
              Dns,
              Utf8,
          }

          fn utf8(input: &[u8]) -> Result<&str, NetworkAdapterError> {
              std::str::from_utf8(input).map_err(|_| NetworkAdapterError::Utf8)
          }

          fn forward_id(value: i64) -> Result<PortForwardId, NetworkAdapterError> {
              let value = u64::try_from(value).map_err(|_| NetworkAdapterError::Identifier)?;
              PortForwardId::new(value).map_err(|_| NetworkAdapterError::Identifier)
          }

          const fn family(value: i32) -> Result<LoopbackFamily, NetworkAdapterError> {
              match value {
                  0 => Ok(LoopbackFamily::Ipv4),
                  1 => Ok(LoopbackFamily::Ipv6),
                  _ => Err(NetworkAdapterError::Family),
              }
          }

          fn port(value: i32) -> Result<u16, NetworkAdapterError> {
              u16::try_from(value).map_err(|_| NetworkAdapterError::Port)
          }

          fn target(input: &[u8], target_port: i32) -> Result<ForwardTarget, NetworkAdapterError> {
              let address = utf8(input)?
                  .parse::<IpAddr>()
                  .map_err(|_| NetworkAdapterError::Address)?;
              ForwardTarget::new(address, port(target_port)?)
                  .map_err(|_| NetworkAdapterError::Address)
          }

          fn encode_forward_open(
              id: i64,
              family_code: i32,
              bind_port: i32,
              target_address: &[u8],
              target_port: i32,
          ) -> Result<Vec<u8>, NetworkAdapterError> {
              let bind = LoopbackBind::new(family(family_code)?, port(bind_port)?)
                  .map_err(|_| NetworkAdapterError::Port)?;
              let spec = TcpForwardSpec::new(bind, target(target_address, target_port)?);
              BridgeCommand::ForwardOpen {
                  forward_id: forward_id(id)?,
                  spec,
              }
              .encode()
              .map_err(|_| NetworkAdapterError::Bridge)
          }

          fn encode_forward_close(id: i64) -> Result<Vec<u8>, NetworkAdapterError> {
              BridgeCommand::ForwardClose(forward_id(id)?)
                  .encode()
                  .map_err(|_| NetworkAdapterError::Bridge)
          }

          fn is_forward_payload(payload: &[u8]) -> bool {
              matches!(
                  BridgeCommand::decode(payload),
                  Ok(BridgeCommand::ForwardOpen { .. } | BridgeCommand::ForwardClose(_))
              )
          }

          const fn observation(value: i32) -> Result<ReachabilityObservation, NetworkAdapterError> {
              match value {
                  0 => Ok(ReachabilityObservation::Unknown),
                  1 => Ok(ReachabilityObservation::Reachable),
                  2 => Ok(ReachabilityObservation::Unreachable),
                  _ => Err(NetworkAdapterError::Observation),
              }
          }

          fn connectivity_candidate(
              id: u64,
              kind: ConnectivityPathKind,
              port: u16,
          ) -> Result<ConnectivityCandidate, NetworkAdapterError> {
              let id = CandidateId::new(id).map_err(|_| NetworkAdapterError::Connectivity)?;
              let endpoint = ConnectivityEndpoint::new(IpAddr::V4(Ipv4Addr::LOCALHOST), port)
                  .map_err(|_| NetworkAdapterError::Connectivity)?;
              Ok(ConnectivityCandidate::new(id, kind, endpoint))
          }

          fn selected_path_code(
              local: i32,
              internet: i32,
              relay: i32,
          ) -> Result<i32, NetworkAdapterError> {
              let peer = PeerConnectivityIdentity::new(
                  DeviceId::new("phase149-android-disposable")
                      .map_err(|_| NetworkAdapterError::Connectivity)?,
                  TransportIdentity::new([149; 32])
                      .map_err(|_| NetworkAdapterError::Connectivity)?,
              );
              let candidates = vec![
                  connectivity_candidate(1, ConnectivityPathKind::LocalDirect, 24_901)?,
                  connectivity_candidate(2, ConnectivityPathKind::InternetDirect, 24_902)?,
                  connectivity_candidate(3, ConnectivityPathKind::Relay, 24_903)?,
              ];
              let mut plan = PeerConnectivityPlan::new(peer, candidates)
                  .map_err(|_| NetworkAdapterError::Connectivity)?;
              for (id, value) in [(1, local), (2, internet), (3, relay)] {
                  plan.set_observation(
                      CandidateId::new(id).map_err(|_| NetworkAdapterError::Connectivity)?,
                      observation(value)?,
                  )
                  .map_err(|_| NetworkAdapterError::Connectivity)?;
              }
              Ok(match plan.selected_path() {
                  SelectedConnectivityPath::Offline => 0,
                  SelectedConnectivityPath::Candidate(candidate) => match candidate.kind() {
                      ConnectivityPathKind::LocalDirect => 1,
                      ConnectivityPathKind::InternetDirect => 2,
                      ConnectivityPathKind::Relay => 3,
                  },
              })
          }

          fn optional_suffix(input: &[u8]) -> Result<Option<DnsDomainSuffix>, NetworkAdapterError> {
              if input.is_empty() {
                  return Ok(None);
              }
              DnsDomainSuffix::new(utf8(input)?)
                  .map(Some)
                  .map_err(|_| NetworkAdapterError::Dns)
          }

          fn dns_valid(
              enabled: bool,
              device_naming: bool,
              device_domain: &[u8],
              resolver_address: &[u8],
              resolver_port: i32,
              split_domain: &[u8],
          ) -> bool {
              let result = (|| -> Result<PrivateDnsConfig, NetworkAdapterError> {
                  let mode = if enabled {
                      PrivateDnsMode::Enabled
                  } else {
                      PrivateDnsMode::Disabled
                  };
                  let device_domain = optional_suffix(device_domain)?;
                  let split_domains = optional_suffix(split_domain)?.into_iter().collect();
                  let resolvers = if resolver_address.is_empty() {
                      if resolver_port != 0 {
                          return Err(NetworkAdapterError::Dns);
                      }
                      Vec::new()
                  } else {
                      let address = utf8(resolver_address)?
                          .parse::<IpAddr>()
                          .map_err(|_| NetworkAdapterError::Dns)?;
                      let endpoint = ResolverEndpoint::new(
                          address,
                          port(resolver_port).map_err(|_| NetworkAdapterError::Dns)?,
                      )
                      .map_err(|_| NetworkAdapterError::Dns)?;
                      vec![endpoint]
                  };
                  PrivateDnsConfig::new(
                      mode,
                      device_naming,
                      device_domain,
                      resolvers,
                      split_domains,
                  )
                  .map_err(|_| NetworkAdapterError::Dns)
              })();
              result.is_ok()
          }

          fn jni_output<'caller>(
              unowned_env: &mut EnvUnowned<'caller>,
              operation: impl FnOnce() -> Vec<u8>,
          ) -> JByteArray<'caller> {
              unowned_env
                  .with_env(|env| env.byte_array_from_slice(&operation()))
                  .resolve::<ThrowRuntimeExAndDefault>()
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_forwardOpenPayload<'caller>(
              mut unowned_env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              id: jlong,
              family_code: jint,
              bind_port: jint,
              target_address: JByteArray<'caller>,
              target_port: jint,
          ) -> JByteArray<'caller> {
              unowned_env
                  .with_env(|env| -> jni::errors::Result<_> {
                      let target_address = env.convert_byte_array(&target_address)?;
                      let payload = encode_forward_open(
                          id,
                          family_code,
                          bind_port,
                          &target_address,
                          target_port,
                      )
                      .unwrap_or_default();
                      env.byte_array_from_slice(&payload)
                  })
                  .resolve::<ThrowRuntimeExAndDefault>()
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_forwardClosePayload<'caller>(
              mut env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              id: jlong,
          ) -> JByteArray<'caller> {
              jni_output(&mut env, || encode_forward_close(id).unwrap_or_default())
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_isForwardingPayload<'caller>(
              mut unowned_env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              payload: JByteArray<'caller>,
          ) -> jboolean {
              unowned_env
                  .with_env(|env| -> jni::errors::Result<_> {
                      let payload = env.convert_byte_array(&payload)?;
                      Ok(is_forward_payload(&payload))
                  })
                  .resolve::<ThrowRuntimeExAndDefault>()
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_connectivitySelectedPath<'caller>(
              _env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              local: jint,
              internet: jint,
              relay: jint,
          ) -> jint {
              selected_path_code(local, internet, relay).unwrap_or(-1)
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_privateworkspace_prw_NativeBridge_validatePrivateDnsConfig<'caller>(
              mut unowned_env: EnvUnowned<'caller>,
              _class: JClass<'caller>,
              enabled: jboolean,
              device_naming: jboolean,
              device_domain: JByteArray<'caller>,
              resolver_address: JByteArray<'caller>,
              resolver_port: jint,
              split_domain: JByteArray<'caller>,
          ) -> jboolean {
              unowned_env
                  .with_env(|env| -> jni::errors::Result<_> {
                      let device_domain = env.convert_byte_array(&device_domain)?;
                      let resolver_address = env.convert_byte_array(&resolver_address)?;
                      let split_domain = env.convert_byte_array(&split_domain)?;
                      Ok(dns_valid(
                          enabled != 0,
                          device_naming != 0,
                          &device_domain,
                          &resolver_address,
                          resolver_port,
                          &split_domain,
                      ))
                  })
                  .resolve::<ThrowRuntimeExAndDefault>()
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn forwarding_payloads_reuse_exact_phase143_bridge_operations() {
                  let open = encode_forward_open(149, 0, 41_149, b"127.0.0.1", 22)
                      .expect("valid forward open");
                  let expected = BridgeCommand::ForwardOpen {
                      forward_id: PortForwardId::new(149).expect("id"),
                      spec: TcpForwardSpec::new(
                          LoopbackBind::new(LoopbackFamily::Ipv4, 41_149).expect("bind"),
                          ForwardTarget::new(IpAddr::V4(Ipv4Addr::LOCALHOST), 22)
                              .expect("target"),
                      ),
                  };
                  assert_eq!(BridgeCommand::decode(&open).expect("decode"), expected);
                  assert!(is_forward_payload(&open));

                  let ipv6 = encode_forward_open(150, 1, 41_150, b"::1", 443)
                      .expect("valid ipv6 forward");
                  assert!(matches!(
                      BridgeCommand::decode(&ipv6).expect("decode ipv6"),
                      BridgeCommand::ForwardOpen { .. }
                  ));

                  let close = encode_forward_close(149).expect("close");
                  assert_eq!(
                      BridgeCommand::decode(&close).expect("decode close"),
                      BridgeCommand::ForwardClose(PortForwardId::new(149).expect("id"))
                  );
              }

              #[test]
              fn forwarding_inputs_fail_closed_through_existing_authorities() {
                  assert!(encode_forward_open(0, 0, 41_149, b"127.0.0.1", 22).is_err());
                  assert!(encode_forward_open(-1, 0, 41_149, b"127.0.0.1", 22).is_err());
                  assert!(encode_forward_open(149, 9, 41_149, b"127.0.0.1", 22).is_err());
                  assert!(encode_forward_open(149, 0, 0, b"127.0.0.1", 22).is_err());
                  assert!(encode_forward_open(149, 0, 65_536, b"127.0.0.1", 22).is_err());
                  assert!(encode_forward_open(149, 0, 41_149, b"127.0.0.1", 0).is_err());
                  assert!(encode_forward_open(149, 0, 41_149, b"example.com", 22).is_err());
                  assert!(encode_forward_open(149, 0, 41_149, b"0.0.0.0", 22).is_err());
                  assert!(encode_forward_open(149, 0, 41_149, b"224.0.0.1", 22).is_err());
                  assert!(encode_forward_open(149, 0, 41_149, b"255.255.255.255", 22).is_err());
              }

              #[test]
              fn connectivity_selection_reuses_existing_deterministic_authority() {
                  assert_eq!(selected_path_code(0, 0, 0).expect("offline"), 0);
                  assert_eq!(selected_path_code(1, 1, 1).expect("local"), 1);
                  assert_eq!(selected_path_code(2, 1, 1).expect("internet"), 2);
                  assert_eq!(selected_path_code(2, 2, 1).expect("relay"), 3);
                  assert!(selected_path_code(9, 1, 1).is_err());
              }

              #[test]
              fn private_dns_validation_is_typed_optional_and_non_mutating() {
                  assert!(dns_valid(false, false, b"", b"", 0, b""));
                  assert!(dns_valid(
                      true,
                      true,
                      b"prw.internal",
                      b"127.0.0.1",
                      53,
                      b"dev.internal",
                  ));
                  assert!(!dns_valid(true, true, b"", b"127.0.0.1", 53, b""));
                  assert!(!dns_valid(false, false, b"PRW.internal", b"", 0, b""));
                  assert!(!dns_valid(false, false, b"", b"resolver.local", 53, b""));
                  assert!(!dns_valid(false, false, b"", b"", 0, b"dev.internal"));

                  let before = selected_path_code(2, 1, 1).expect("before DNS");
                  assert!(dns_valid(true, false, b"", b"127.0.0.1", 53, b""));
                  let after = selected_path_code(2, 1, 1).expect("after DNS");
                  assert_eq!(before, after);
              }
          }
          EOF

          cat > apps/android/app/src/main/kotlin/com/privateworkspace/prw/NetworkManagement.kt <<'EOF'
          package com.privateworkspace.prw

          internal enum class ForwardLifecycleView {
              Closed,
              Opening,
              Active,
              Closing,
              Failed,
          }

          internal enum class LoopbackFamilyView(val code: Int) {
              Ipv4(0),
              Ipv6(1),
          }

          internal enum class ReachabilityView(val code: Int) {
              Unknown(0),
              Reachable(1),
              Unreachable(2),
          }

          internal enum class ConnectivityPathView {
              Offline,
              LocalDirect,
              InternetDirect,
              Relay,
          }

          internal data class ForwardingUiState(
              val lifecycle: ForwardLifecycleView = ForwardLifecycleView.Closed,
              val forwardId: Long? = null,
              val family: LoopbackFamilyView = LoopbackFamilyView.Ipv4,
              val bindPort: Int = 0,
              val targetAddress: String = "",
              val targetPort: Int = 0,
              val lastPayloadBytes: Int = 0,
          )

          internal data class PrivateDnsUiState(
              val requestedEnabled: Boolean = false,
              val validated: Boolean = true,
              val deviceNaming: Boolean = false,
              val deviceDomain: String = "",
              val resolverAddress: String = "",
              val resolverPort: Int = 0,
              val splitDomain: String = "",
              val osApplied: Boolean = false,
          )

          internal data class NetworkManagementUiState(
              val forwarding: ForwardingUiState = ForwardingUiState(),
              val selectedPath: ConnectivityPathView = ConnectivityPathView.Offline,
              val privateDns: PrivateDnsUiState = PrivateDnsUiState(),
          )

          internal interface NetworkCommandEncoder {
              fun forwardOpen(
                  forwardId: Long,
                  family: LoopbackFamilyView,
                  bindPort: Int,
                  targetAddress: String,
                  targetPort: Int,
              ): ByteArray

              fun forwardClose(forwardId: Long): ByteArray

              fun selectedPath(
                  local: ReachabilityView,
                  internet: ReachabilityView,
                  relay: ReachabilityView,
              ): Int

              fun validatePrivateDns(
                  enabled: Boolean,
                  deviceNaming: Boolean,
                  deviceDomain: String,
                  resolverAddress: String,
                  resolverPort: Int,
                  splitDomain: String,
              ): Boolean
          }

          internal object NativeNetworkCommandEncoder : NetworkCommandEncoder {
              override fun forwardOpen(
                  forwardId: Long,
                  family: LoopbackFamilyView,
                  bindPort: Int,
                  targetAddress: String,
                  targetPort: Int,
              ): ByteArray = NativeBridge.forwardOpenPayload(
                  forwardId,
                  family.code,
                  bindPort,
                  targetAddress.encodeToByteArray(),
                  targetPort,
              )

              override fun forwardClose(forwardId: Long): ByteArray =
                  NativeBridge.forwardClosePayload(forwardId)

              override fun selectedPath(
                  local: ReachabilityView,
                  internet: ReachabilityView,
                  relay: ReachabilityView,
              ): Int = NativeBridge.connectivitySelectedPath(local.code, internet.code, relay.code)

              override fun validatePrivateDns(
                  enabled: Boolean,
                  deviceNaming: Boolean,
                  deviceDomain: String,
                  resolverAddress: String,
                  resolverPort: Int,
                  splitDomain: String,
              ): Boolean = NativeBridge.validatePrivateDnsConfig(
                  enabled,
                  deviceNaming,
                  deviceDomain.encodeToByteArray(),
                  resolverAddress.encodeToByteArray(),
                  resolverPort,
                  splitDomain.encodeToByteArray(),
              )
          }

          internal class NetworkManagementController(private val encoder: NetworkCommandEncoder) {
              private var current = NetworkManagementUiState()

              fun state(): NetworkManagementUiState = current

              fun requestForwardOpen(
                  forwardId: Long,
                  family: LoopbackFamilyView,
                  bindPort: Int,
                  targetAddress: String,
                  targetPort: Int,
              ): Boolean {
                  if (current.forwarding.lifecycle !in setOf(ForwardLifecycleView.Closed, ForwardLifecycleView.Failed)) {
                      return false
                  }
                  val payload = runCatching {
                      encoder.forwardOpen(forwardId, family, bindPort, targetAddress, targetPort)
                  }.getOrNull() ?: return false
                  if (payload.isEmpty()) return false
                  current = current.copy(
                      forwarding = ForwardingUiState(
                          lifecycle = ForwardLifecycleView.Opening,
                          forwardId = forwardId,
                          family = family,
                          bindPort = bindPort,
                          targetAddress = targetAddress,
                          targetPort = targetPort,
                          lastPayloadBytes = payload.size,
                      ),
                  )
                  return true
              }

              fun applyAuthoritativeForwardOpen(forwardId: Long): Boolean {
                  val forward = current.forwarding
                  if (forward.lifecycle != ForwardLifecycleView.Opening || forward.forwardId != forwardId) return false
                  current = current.copy(forwarding = forward.copy(lifecycle = ForwardLifecycleView.Active))
                  return true
              }

              fun requestForwardClose(): Boolean {
                  val forward = current.forwarding
                  val id = forward.forwardId ?: return false
                  if (forward.lifecycle != ForwardLifecycleView.Active) return false
                  val payload = runCatching { encoder.forwardClose(id) }.getOrNull() ?: return false
                  if (payload.isEmpty()) return false
                  current = current.copy(
                      forwarding = forward.copy(
                          lifecycle = ForwardLifecycleView.Closing,
                          lastPayloadBytes = payload.size,
                      ),
                  )
                  return true
              }

              fun applyAuthoritativeForwardClosed(forwardId: Long): Boolean {
                  val forward = current.forwarding
                  if (forward.lifecycle != ForwardLifecycleView.Closing || forward.forwardId != forwardId) return false
                  current = current.copy(forwarding = ForwardingUiState())
                  return true
              }

              fun applyAuthoritativeForwardFailure(forwardId: Long): Boolean {
                  val forward = current.forwarding
                  if (forward.forwardId != forwardId || forward.lifecycle == ForwardLifecycleView.Closed) return false
                  current = current.copy(forwarding = forward.copy(lifecycle = ForwardLifecycleView.Failed))
                  return true
              }

              fun applyAuthoritativeConnectivitySnapshot(
                  local: ReachabilityView,
                  internet: ReachabilityView,
                  relay: ReachabilityView,
              ): Boolean {
                  val code = runCatching { encoder.selectedPath(local, internet, relay) }.getOrNull() ?: return false
                  val selected = when (code) {
                      0 -> ConnectivityPathView.Offline
                      1 -> ConnectivityPathView.LocalDirect
                      2 -> ConnectivityPathView.InternetDirect
                      3 -> ConnectivityPathView.Relay
                      else -> return false
                  }
                  current = current.copy(selectedPath = selected)
                  return true
              }

              fun validatePrivateDnsDraft(
                  enabled: Boolean,
                  deviceNaming: Boolean,
                  deviceDomain: String,
                  resolverAddress: String,
                  resolverPort: Int,
                  splitDomain: String,
              ): Boolean {
                  val accepted = runCatching {
                      encoder.validatePrivateDns(
                          enabled,
                          deviceNaming,
                          deviceDomain,
                          resolverAddress,
                          resolverPort,
                          splitDomain,
                      )
                  }.getOrDefault(false)
                  if (!accepted) return false
                  current = current.copy(
                      privateDns = PrivateDnsUiState(
                          requestedEnabled = enabled,
                          validated = true,
                          deviceNaming = deviceNaming,
                          deviceDomain = deviceDomain,
                          resolverAddress = resolverAddress,
