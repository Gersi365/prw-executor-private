name: PRW Phase 152 C02e Tranche2 Phase141 Validation

on:
  push:
    branches:
      - phase-152-c02e-dynamic-reachability-design
    paths:
      - ".github/workflows/phase-152-c02e-tranche2-phase141-validation.yml"
      - "crates/prw-remote-bridge/Cargo.toml"
      - "crates/prw-remote-bridge/tests/reachability_phase141_integration.rs"

permissions:
  contents: write

concurrency:
  group: prw-phase-152-c02e-tranche2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate actual Phase141 test edge
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install desktop native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev

      - name: Validate candidate and prepare evidence
        id: validate
        shell: bash
        run: |
          set -uo pipefail

          BRANCH="phase-152-c02e-dynamic-reachability-design"
          BASE_HEAD="$(git rev-parse HEAD)"
          AUDIT_DIR="logs/audits/phase-152-c02e-dynamic-reachability-design"
          REPORT="${AUDIT_DIR}/C02E_TRANCHE2_PHASE141_VALIDATION_${BASE_HEAD}.txt"
          mkdir -p "${AUDIT_DIR}"

          LOCK_BEFORE="${RUNNER_TEMP}/Cargo.lock.before"
          RUSTC_INFO_BEFORE="${RUNNER_TEMP}/rustc_info.before"
          cp Cargo.lock "${LOCK_BEFORE}"
          HAD_RUSTC_INFO=0
          if [[ -f target/.rustc_info.json ]]; then
            cp target/.rustc_info.json "${RUSTC_INFO_BEFORE}"
            HAD_RUSTC_INFO=1
          fi

          LOCK_SHA256_BEFORE="$(sha256sum Cargo.lock | awk '{print $1}')"
          MANIFEST_SHA256_BEFORE="$(sha256sum crates/prw-remote-bridge/Cargo.toml | awk '{print $1}')"
          TEST_SHA256_BEFORE="$(sha256sum crates/prw-remote-bridge/tests/reachability_phase141_integration.rs | awk '{print $1}')"

          STATUS="PASS"
          FIRST_FAILURE="NONE"
          CARGO_METADATA_MATERIALIZE_RC=0
          LOCK_AUDIT_RC=SKIPPED
          LOCKED_METADATA_RC=SKIPPED
          FORMAT_RC=SKIPPED
          INTEGRATION_TEST_RC=SKIPPED
          FOCUSED_CLIPPY_RC=SKIPPED
          FOCUSED_TESTS_RC=SKIPPED
          WORKSPACE_CLIPPY_RC=SKIPPED
          WORKSPACE_TESTS_RC=SKIPPED
          WORKSPACE_BUILD_RC=SKIPPED
          ZERO_DEPENDENCY_DRIFT_RC=SKIPPED
          LOCK_SHA256_CANDIDATE=UNAVAILABLE

          fail_once() {
            local gate="$1"
            local rc="$2"
            if [[ "${STATUS}" == "PASS" ]]; then
              STATUS="FAIL"
              FIRST_FAILURE="${gate}"
            fi
            return "${rc}"
          }

          run_gate() {
            local gate="$1"
            shift
            local log="${RUNNER_TEMP}/${gate}.log"
            set +e
            "$@" >"${log}" 2>&1
            local rc=$?
            set -e
            printf '%s_RC=%s\n' "${gate}" "${rc}" >> "${RUNNER_TEMP}/gate-rcs.txt"
            if [[ ${rc} -ne 0 ]]; then
              fail_once "${gate}" "${rc}" || true
              {
                printf '\n===== %s FAILURE TAIL =====\n' "${gate}"
                tail -n 240 "${log}"
              } >> "${RUNNER_TEMP}/failure-tail.txt"
            fi
            return 0
          }

          set +e
          cargo metadata --format-version 1 >"${RUNNER_TEMP}/metadata.json" 2>"${RUNNER_TEMP}/metadata.err"
          CARGO_METADATA_MATERIALIZE_RC=$?
          set -e
          if [[ ${CARGO_METADATA_MATERIALIZE_RC} -ne 0 ]]; then
            fail_once "CARGO_METADATA_MATERIALIZE" "${CARGO_METADATA_MATERIALIZE_RC}" || true
            cp "${LOCK_BEFORE}" Cargo.lock
          else
            LOCK_SHA256_CANDIDATE="$(sha256sum Cargo.lock | awk '{print $1}')"
            diff -u "${LOCK_BEFORE}" Cargo.lock > "${RUNNER_TEMP}/Cargo.lock.candidate.diff" || true
          fi

          if [[ "${STATUS}" == "PASS" ]]; then
            set +e
            python3 - "${LOCK_BEFORE}" Cargo.lock >"${RUNNER_TEMP}/lock-audit.txt" 2>&1 <<'PY'
          import sys
          import tomllib

          before_path, after_path = sys.argv[1:3]

          def load(path):
              with open(path, "rb") as handle:
                  return tomllib.load(handle)["package"]

          before = load(before_path)
          after = load(after_path)

          def key(pkg):
              return (pkg["name"], pkg["version"], pkg.get("source"))

          before_map = {key(pkg): pkg for pkg in before}
          after_map = {key(pkg): pkg for pkg in after}

          if before_map.keys() != after_map.keys():
              missing = sorted(before_map.keys() - after_map.keys())
              added = sorted(after_map.keys() - before_map.keys())
              raise SystemExit(f"package identity drift: removed={missing!r} added={added!r}")

          bridge_key = next(
              item for item in before_map
              if item[0] == "prw-remote-bridge" and item[2] is None
          )

          for item in before_map:
              left = before_map[item]
              right = after_map[item]
              if item != bridge_key and left != right:
                  raise SystemExit(f"unexpected lock package mutation: {item!r}")

          left = dict(before_map[bridge_key])
          right = dict(after_map[bridge_key])
          before_deps = list(left.pop("dependencies", []))
          after_deps = list(right.pop("dependencies", []))
          if left != right:
              raise SystemExit("prw-remote-bridge lock metadata changed outside dependencies")
          if "prw-nat-traversal" in before_deps:
              raise SystemExit("prw-nat-traversal unexpectedly present in pre-edge lock entry")
          expected = sorted(before_deps + ["prw-nat-traversal"])
          if sorted(after_deps) != expected:
              raise SystemExit(
                  "unexpected prw-remote-bridge dependency delta: "
                  f"before={before_deps!r} after={after_deps!r}"
              )

          external_before = sorted(
              (pkg["name"], pkg["version"], pkg.get("source"), pkg.get("checksum"))
              for pkg in before
              if pkg.get("source") is not None
          )
          external_after = sorted(
              (pkg["name"], pkg["version"], pkg.get("source"), pkg.get("checksum"))
              for pkg in after
              if pkg.get("source") is not None
          )
          if external_before != external_after:
              raise SystemExit("external dependency tuple drift detected")

          print("LOCK_AUDIT=PASS")
          print("PACKAGE_IDENTITIES=UNCHANGED")
          print("EXTERNAL_DEPENDENCY_TUPLES=UNCHANGED")
          print("ONLY_LOCAL_GRAPH_DELTA=prw-remote-bridge:+prw-nat-traversal")
          PY
            LOCK_AUDIT_RC=$?
            set -e
            if [[ ${LOCK_AUDIT_RC} -ne 0 ]]; then
              fail_once "LOCK_AUDIT" "${LOCK_AUDIT_RC}" || true
              cp "${LOCK_BEFORE}" Cargo.lock
            fi
          fi

          if [[ "${STATUS}" == "PASS" ]]; then
            run_gate LOCKED_METADATA cargo metadata --locked --no-deps --format-version 1
            LOCKED_METADATA_RC="$(awk -F= '$1=="LOCKED_METADATA_RC"{print $2}' "${RUNNER_TEMP}/gate-rcs.txt" | tail -1)"
          fi
          if [[ "${STATUS}" == "PASS" ]]; then
            run_gate FORMAT cargo fmt --all -- --check
            FORMAT_RC="$(awk -F= '$1=="FORMAT_RC"{print $2}' "${RUNNER_TEMP}/gate-rcs.txt" | tail -1)"
          fi
          if [[ "${STATUS}" == "PASS" ]]; then
            run_gate INTEGRATION_TEST cargo test --locked -p prw-remote-bridge --test reachability_phase141_integration
            INTEGRATION_TEST_RC="$(awk -F= '$1=="INTEGRATION_TEST_RC"{print $2}' "${RUNNER_TEMP}/gate-rcs.txt" | tail -1)"
          fi
          if [[ "${STATUS}" == "PASS" ]]; then
            run_gate FOCUSED_CLIPPY cargo clippy --locked -p prw-remote-bridge -p prw-nat-traversal --all-targets --all-features -- -D warnings
            FOCUSED_CLIPPY_RC="$(awk -F= '$1=="FOCUSED_CLIPPY_RC"{print $2}' "${RUNNER_TEMP}/gate-rcs.txt" | tail -1)"
          fi
          if [[ "${STATUS}" == "PASS" ]]; then
            run_gate FOCUSED_TESTS cargo test --locked -p prw-remote-bridge -p prw-nat-traversal --all-targets
            FOCUSED_TESTS_RC="$(awk -F= '$1=="FOCUSED_TESTS_RC"{print $2}' "${RUNNER_TEMP}/gate-rcs.txt" | tail -1)"
          fi
          if [[ "${STATUS}" == "PASS" ]]; then
            run_gate WORKSPACE_CLIPPY cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
            WORKSPACE_CLIPPY_RC="$(awk -F= '$1=="WORKSPACE_CLIPPY_RC"{print $2}' "${RUNNER_TEMP}/gate-rcs.txt" | tail -1)"
          fi
          if [[ "${STATUS}" == "PASS" ]]; then
            run_gate WORKSPACE_TESTS cargo test --locked --workspace --all-targets
            WORKSPACE_TESTS_RC="$(awk -F= '$1=="WORKSPACE_TESTS_RC"{print $2}' "${RUNNER_TEMP}/gate-rcs.txt" | tail -1)"
          fi
          if [[ "${STATUS}" == "PASS" ]]; then
            run_gate WORKSPACE_BUILD cargo build --locked --workspace --all-targets
            WORKSPACE_BUILD_RC="$(awk -F= '$1=="WORKSPACE_BUILD_RC"{print $2}' "${RUNNER_TEMP}/gate-rcs.txt" | tail -1)"
          fi

          if [[ ${HAD_RUSTC_INFO} -eq 1 ]]; then
            cp "${RUSTC_INFO_BEFORE}" target/.rustc_info.json
          fi

          MANIFEST_SHA256_AFTER="$(sha256sum crates/prw-remote-bridge/Cargo.toml | awk '{print $1}')"
          TEST_SHA256_AFTER="$(sha256sum crates/prw-remote-bridge/tests/reachability_phase141_integration.rs | awk '{print $1}')"

          if [[ "${MANIFEST_SHA256_BEFORE}" != "${MANIFEST_SHA256_AFTER}" || "${TEST_SHA256_BEFORE}" != "${TEST_SHA256_AFTER}" ]]; then
            ZERO_DEPENDENCY_DRIFT_RC=91
            fail_once "SOURCE_HASH_DRIFT" "${ZERO_DEPENDENCY_DRIFT_RC}" || true
          fi

          mapfile -t TRACKED_DIFF < <(git diff --name-only)
          if [[ "${STATUS}" == "PASS" ]]; then
            if [[ ${#TRACKED_DIFF[@]} -ne 1 || "${TRACKED_DIFF[0]}" != "Cargo.lock" ]]; then
              ZERO_DEPENDENCY_DRIFT_RC=92
              fail_once "TRACKED_DRIFT" "${ZERO_DEPENDENCY_DRIFT_RC}" || true
            else
              ZERO_DEPENDENCY_DRIFT_RC=0
            fi
          fi

          if [[ "${STATUS}" != "PASS" ]]; then
            cp "${LOCK_BEFORE}" Cargo.lock
            if [[ ${HAD_RUSTC_INFO} -eq 1 ]]; then
              cp "${RUSTC_INFO_BEFORE}" target/.rustc_info.json
            fi
          fi

          LOCK_SHA256_FINAL="$(sha256sum Cargo.lock | awk '{print $1}')"
          {
            echo "PHASE=152-C02e-Tranche2"
            echo "BASE_HEAD=${BASE_HEAD}"
            echo "RUSTC=$(rustc --version)"
            echo "CARGO=$(cargo --version)"
            echo "RUSTFMT=$(rustfmt --version)"
            echo "CLIPPY=$(cargo clippy --version)"
            echo "GTK4=$(pkg-config --modversion gtk4)"
            echo "LIBADWAITA=$(pkg-config --modversion libadwaita-1)"
            echo "LOCK_SHA256_BEFORE=${LOCK_SHA256_BEFORE}"
            echo "LOCK_SHA256_CANDIDATE=${LOCK_SHA256_CANDIDATE}"
            echo "LOCK_SHA256_FINAL=${LOCK_SHA256_FINAL}"
            echo "MANIFEST_SHA256_BEFORE=${MANIFEST_SHA256_BEFORE}"
            echo "MANIFEST_SHA256_AFTER=${MANIFEST_SHA256_AFTER}"
            echo "TEST_SHA256_BEFORE=${TEST_SHA256_BEFORE}"
            echo "TEST_SHA256_AFTER=${TEST_SHA256_AFTER}"
            echo "CARGO_METADATA_MATERIALIZE_RC=${CARGO_METADATA_MATERIALIZE_RC}"
            echo "LOCK_AUDIT_RC=${LOCK_AUDIT_RC}"
            echo "LOCKED_METADATA_RC=${LOCKED_METADATA_RC}"
            echo "FORMAT_RC=${FORMAT_RC}"
            echo "INTEGRATION_TEST_RC=${INTEGRATION_TEST_RC}"
            echo "FOCUSED_CLIPPY_RC=${FOCUSED_CLIPPY_RC}"
            echo "FOCUSED_TESTS_RC=${FOCUSED_TESTS_RC}"
            echo "WORKSPACE_CLIPPY_RC=${WORKSPACE_CLIPPY_RC}"
            echo "WORKSPACE_TESTS_RC=${WORKSPACE_TESTS_RC}"
            echo "WORKSPACE_BUILD_RC=${WORKSPACE_BUILD_RC}"
            echo "ZERO_DEPENDENCY_DRIFT_RC=${ZERO_DEPENDENCY_DRIFT_RC}"
            echo "FIRST_FAILURE=${FIRST_FAILURE}"
            echo "STATUS=${STATUS}"
            echo
            echo "===== LOCK AUDIT ====="
            cat "${RUNNER_TEMP}/lock-audit.txt" 2>/dev/null || true
            echo
            echo "===== CARGO.LOCK CANDIDATE DIFF ====="
            cat "${RUNNER_TEMP}/Cargo.lock.candidate.diff" 2>/dev/null || true
            echo
            echo "===== MATERIALIZATION STDERR ====="
            cat "${RUNNER_TEMP}/metadata.err" || true
            cat "${RUNNER_TEMP}/failure-tail.txt" 2>/dev/null || true
          } > "${REPORT}"

          echo "status=${STATUS}" >> "${GITHUB_OUTPUT}"
          echo "base_head=${BASE_HEAD}" >> "${GITHUB_OUTPUT}"
          echo "report=${REPORT}" >> "${GITHUB_OUTPUT}"

      - name: Commit evidence and validated lock
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS="${{ steps.validate.outputs.status }}"
          BASE_HEAD="${{ steps.validate.outputs.base_head }}"
          REPORT="${{ steps.validate.outputs.report }}"
          BRANCH="phase-152-c02e-dynamic-reachability-design"

          if [[ -z "${BASE_HEAD}" || -z "${REPORT}" || ! -f "${REPORT}" ]]; then
            echo "validation step did not produce evidence outputs" >&2
            exit 1
          fi

          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [[ "${REMOTE_HEAD}" != "${BASE_HEAD}" ]]; then
            echo "branch advanced during validation: base=${BASE_HEAD} remote=${REMOTE_HEAD}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${STATUS}" == "PASS" ]]; then
            git add Cargo.lock "${REPORT}"
            git commit -m "phase 152 c02e: record tranche2 phase141 validation ${BASE_HEAD:0:12}"
          else
            git add "${REPORT}"
            git commit -m "phase 152 c02e: record tranche2 phase141 validation failure ${BASE_HEAD:0:12}"
          fi
          git push origin "HEAD:${BRANCH}"

      - name: Surface validation result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.validate.outputs.status }}" != "PASS" ]]; then
            echo "Tranche2 validation failed at ${{ steps.validate.outputs.base_head }}" >&2
            exit 1
          fi
