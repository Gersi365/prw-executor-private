name: Phase 152 C02f-AA Lock Helper

on:
  push:
    branches:
      - phase-152-c02f-aa-lock-helper

permissions:
  contents: write

concurrency:
  group: phase-152-c02f-aa-lock-helper
  cancel-in-progress: false

jobs:
  materialize-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: phase-152-c02f-aa-lock-helper

      - name: Materialize full Cargo lock graph
        run: cargo metadata --format-version 1 > /dev/null

      - name: Verify only Cargo.lock changed
        run: |
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != {"Cargo.lock"}:
              raise SystemExit(f"unexpected helper mutation scope: {sorted(changed)}")
          PY

      - name: Commit Cargo-authored lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock
          git commit -m "phase 152 c02f-aa: materialize Cargo lock"
          git push origin HEAD:"${GITHUB_REF_NAME}"
