name: Phase 095 Integration A01

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase-095-integrate-a01.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Phase 095 const corrective and integrate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          types_path = Path("crates/prw-agent/src/linux_production_runtime_types.rs")
          types = types_path.read_text()
          replacements = [
              ("pub fn classify_production_runtime_error(\n", "pub const fn classify_production_runtime_error(\n", 1),
              ("    pub fn from_orchestration_error(error: &LocalLinuxRuntimeOrchestrationError) -> Option<Self> {\n", "    pub const fn from_orchestration_error(error: &LocalLinuxRuntimeOrchestrationError) -> Option<Self> {\n", 1),
              ("    pub fn new(\n        reason: LocalLinuxProductionRuntimeTerminalReason,\n", "    pub const fn new(\n        reason: LocalLinuxProductionRuntimeTerminalReason,\n", 1),
          ]
          for old, new, expected in replacements:
              count = types.count(old)
              if count != expected:
                  raise SystemExit(f"Phase 095 const corrective anchor mismatch: {old!r} count={count}")
              types = types.replace(old, new, expected)
          types_path.write_text(types)

          identity_path = Path("crates/prw-agent/src/linux_identity.rs")
          text = identity_path.read_text()
          old_docs = "//! a runtime-specific worker completion wake wrapper, Phase 091 adds one\n//! capacity-aware blocking readiness wait step, and Phase 092 adds finite\n//! readiness-plus-completion-wake scheduling orchestration. The Agent bootstrap\n//! remains inactive and no long-running accept/readiness loop is enabled."
          new_docs = "//! a runtime-specific worker completion wake wrapper, Phase 091 adds one\n//! capacity-aware blocking readiness wait step, Phase 092 adds finite\n//! readiness-plus-completion-wake scheduling orchestration, and Phase 095 adds\n//! immutable production-runtime configuration plus bounded evidence/disposition\n//! types. The Agent bootstrap remains inactive and no long-running runtime loop\n//! is enabled."
          if text.count(old_docs) != 1:
              raise SystemExit("Phase 095 linux_identity documentation anchor mismatch")
          text = text.replace(old_docs, new_docs, 1)
          anchor = "#[allow(\n    dead_code,\n    reason = \"pre-runtime Linux same-UID authorization is intentionally crate-internal\"\n)]\n#[path = \"linux_peer_auth.rs\"]\npub mod peer_auth;\n"
          insert = anchor + "#[allow(\n    dead_code,\n    reason = \"pre-bootstrap Linux production runtime types are intentionally crate-internal\"\n)]\n#[path = \"linux_production_runtime_types.rs\"]\npub mod production_runtime_types;\n"
          if text.count(anchor) != 1:
              raise SystemExit("Phase 095 module insertion anchor mismatch")
          identity_path.write_text(text.replace(anchor, insert, 1))
          PY

          cargo fmt --all
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' crates/prw-agent/src/linux_identity.rs crates/prw-agent/src/linux_production_runtime_types.rs | sort)"
          test "$changed" = "$expected"
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          git diff --check

      - name: Commit integrated source and remove temporary workflows
        run: |
          rm .github/workflows/phase-095-integrate.yml
          rm .github/workflows/phase-095-integrate-a01.yml
          git add crates/prw-agent/src/linux_identity.rs crates/prw-agent/src/linux_production_runtime_types.rs .github/workflows/phase-095-integrate.yml .github/workflows/phase-095-integrate-a01.yml
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git commit -m "Integrate Phase 095 production runtime types"
          git push
