          python3 - <<'PY'
          import json, os
          data = json.load(open(os.environ['RUNNER_TEMP'] + '/phase145-native-metadata.json'))
          root = next(p for p in data['packages'] if p['name'] == 'prw-android-adapter')
          direct = {d['name']: d['req'] for d in root['dependencies']}
          expected = {
              'aws-lc-rs': '=1.18.0',
              'jni': '=0.22.4',
              'prw-control-plane': '*',
              'prw-core': '*',
              'prw-device-identity': '*',
              'prw-device-identity-signer': '*',
              'prw-remote-transport': '*',
          }
          if direct != expected:
              raise SystemExit(f'Phase145 native direct graph mismatch: {direct!r}')
          jni = next(p for p in data['packages'] if p['name'] == 'jni')
          if jni['version'] != '0.22.4':
              raise SystemExit(f'jni resolved to {jni["version"]}')
