name: Phase 145 Android Client Foundation Validation

on:
  push:
    paths:
      - '.github/workflows/phase-145-android-client-foundation-validation.yml'

permissions:
  contents: write

jobs:
  validate-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prove Phase 145 contract and toolchain probe
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f contracts/ANDROID_CLIENT_FOUNDATION_CONTRACT.md
          grep -Fq 'Status: Phase 145 implementation lock' contracts/ANDROID_CLIENT_FOUNDATION_CONTRACT.md
          grep -Fq '31957645210' contracts/ANDROID_CLIENT_FOUNDATION_CONTRACT.md
          grep -Fq '34bfaab9e331f85e808296b766068f6fa6c7530834003d27190a4fdc8b55c2c6' contracts/ANDROID_CLIENT_FOUNDATION_CONTRACT.md
          grep -Fq 'c871ec404c7df4591b8153a96010c8fd7304b0200b6174f47ffe8128c7c0220a' contracts/ANDROID_CLIENT_FOUNDATION_CONTRACT.md
          rustc --version | grep -Fq 'rustc 1.97.1'
          cargo --version | grep -Fq 'cargo 1.97.1'
          echo phase145_contract_gate=pass

      - name: Set up JDK and Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install exact Android SDK NDK and Rust targets
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          rustup target add --toolchain 1.97.1-x86_64-unknown-linux-gnu aarch64-linux-android x86_64-linux-android
          cargo +1.97.1 install --locked cargo-ndk --version 4.1.2
          cargo +1.97.1 ndk --version | grep -Fq 'cargo-ndk 4.1.2'
          echo phase145_toolchain=pass

      - name: Materialize Android source in validation checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf apps/android
          mkdir -p \
            apps/android/app/src/main/kotlin/com/privateworkspace/prw \
            apps/android/app/src/test/kotlin/com/privateworkspace/prw \
            apps/android/native/src

          cat > apps/android/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PrivateRemoteWorkspaceAndroid"
          include(":app")
          EOF

          cat > apps/android/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.3.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
          }
          EOF

          cat > apps/android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > apps/android/.gitignore <<'EOF'
          .gradle/
          **/build/
          local.properties
          EOF

          cat > apps/android/README.md <<'EOF'
          # PRW Android Application

          Phase 145 establishes the first non-production native Android client foundation.

          Architecture:

          - Kotlin + Jetpack Compose UI;
          - Android Keystore non-exportable P-256 identity custody;
          - ViewModel + StateFlow presentation model;
          - a narrow standalone Rust/JNI adapter under `native/`;
          - no production endpoint, production account, release signing, boot receiver, or hidden daemon.

          Build prerequisites are locked by `contracts/ANDROID_CLIENT_ARCHITECTURE_DECISION.md` and `contracts/ANDROID_CLIENT_FOUNDATION_CONTRACT.md`.
          EOF

          cat > apps/android/app/build.gradle.kts <<'EOF'
          import org.gradle.api.tasks.Exec

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          val generatedJniLibs = layout.buildDirectory.dir("generated/prwJniLibs")

          val buildPrwNative by tasks.registering(Exec::class) {
              workingDir(rootProject.file("native"))
              environment("ANDROID_NDK_HOME", "${System.getenv("ANDROID_HOME")}/ndk/28.2.13676358")
              environment("ANDROID_NDK_ROOT", "${System.getenv("ANDROID_HOME")}/ndk/28.2.13676358")
              commandLine(
                  "cargo", "+1.97.1", "ndk",
                  "--platform", "29",
                  "-t", "arm64-v8a",
                  "-t", "x86_64",
                  "-o", generatedJniLibs.get().asFile.absolutePath,
                  "build", "--locked", "--release",
              )
          }

          android {
              namespace = "com.privateworkspace.prw"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.privateworkspace.prw"
                  minSdk = 29
                  targetSdk = 36
                  versionCode = 1
                  versionName = "0.1.0-dev"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

              buildFeatures {
                  compose = true
                  buildConfig = false
              }

              sourceSets["main"].jniLibs.srcDir(generatedJniLibs)

              packaging {
                  jniLibs {
                      useLegacyPackaging = false
                  }
              }
          }

          tasks.named("preBuild").configure {
              dependsOn(buildPrwNative)
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2026.06.00")
              implementation(composeBom)
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0")
              testImplementation("junit:junit:4.13.2")
          }
          EOF

          cat > apps/android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:label="Private Remote Workspace"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > apps/android/app/src/main/kotlin/com/privateworkspace/prw/ConnectionState.kt <<'EOF'
          package com.privateworkspace.prw

          internal enum class ConnectionState {
              Disconnected,
              Connecting,
              Authenticating,
              Connected,
              Suspended,
              Disconnecting,
              Error,
          }
          EOF

          cat > apps/android/app/src/main/kotlin/com/privateworkspace/prw/ConnectionController.kt <<'EOF'
          package com.privateworkspace.prw

          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow

          internal class ConnectionController {
              private val mutableState = MutableStateFlow(ConnectionState.Disconnected)
              val state: StateFlow<ConnectionState> = mutableState.asStateFlow()

              fun transition(target: ConnectionState): Boolean {
                  val current = mutableState.value
                  if (!isAllowed(current, target)) return false
                  mutableState.value = target
                  return true
              }

              companion object {
                  internal fun isAllowed(from: ConnectionState, to: ConnectionState): Boolean = when (from) {
                      ConnectionState.Disconnected -> to == ConnectionState.Connecting
                      ConnectionState.Connecting -> to in setOf(
                          ConnectionState.Authenticating,
                          ConnectionState.Disconnected,
                          ConnectionState.Error,
                      )
                      ConnectionState.Authenticating -> to in setOf(
                          ConnectionState.Connected,
                          ConnectionState.Disconnected,
                          ConnectionState.Error,
                      )
                      ConnectionState.Connected -> to in setOf(
                          ConnectionState.Suspended,
                          ConnectionState.Disconnecting,
                          ConnectionState.Error,
                      )
                      ConnectionState.Suspended -> to in setOf(
                          ConnectionState.Connecting,
                          ConnectionState.Disconnecting,
                          ConnectionState.Error,
                      )
                      ConnectionState.Disconnecting -> to == ConnectionState.Disconnected
                      ConnectionState.Error -> to in setOf(
                          ConnectionState.Disconnected,
                          ConnectionState.Connecting,
                      )
                  }
              }
          }
          EOF

          cat > apps/android/app/src/main/kotlin/com/privateworkspace/prw/BootstrapRequest.kt <<'EOF'
          package com.privateworkspace.prw

          import java.io.ByteArrayOutputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          internal data class BootstrapRequest(
              val workspaceId: String,
              val userId: String,
              val deviceId: String,
              val sessionId: String,
              val publicSpki: ByteArray,
              val nonce: ByteArray,
          ) {
              fun encode(): ByteArray {
                  require(nonce.size == NONCE_BYTES)
                  val output = ByteArrayOutputStream()
                  output.write(MAGIC)
                  output.write(shortBytes(VERSION))
                  writeUtf8(output, workspaceId)
                  writeUtf8(output, userId)
                  writeUtf8(output, deviceId)
                  writeUtf8(output, sessionId)
                  writeBytes(output, publicSpki)
                  output.write(nonce)
                  return output.toByteArray().also { require(it.size <= MAX_BYTES) }
              }

              companion object {
                  private val MAGIC = byteArrayOf('P'.code.toByte(), '1'.code.toByte(), '4'.code.toByte(), '5'.code.toByte())
                  private const val VERSION = 1
                  private const val NONCE_BYTES = 32
                  private const val MAX_FIELD_BYTES = 1024
                  private const val MAX_PUBLIC_SPKI_BYTES = 256
                  private const val MAX_BYTES = 4096

                  private fun shortBytes(value: Int): ByteArray = ByteBuffer
                      .allocate(2)
                      .order(ByteOrder.BIG_ENDIAN)
                      .putShort(value.toShort())
                      .array()

                  private fun writeUtf8(output: ByteArrayOutputStream, value: String) {
                      val bytes = value.toByteArray(Charsets.UTF_8)
                      require(bytes.isNotEmpty() && bytes.size <= MAX_FIELD_BYTES)
                      writeBytes(output, bytes)
                  }

                  private fun writeBytes(output: ByteArrayOutputStream, bytes: ByteArray) {
                      require(bytes.isNotEmpty() && bytes.size <= MAX_PUBLIC_SPKI_BYTES.coerceAtLeast(MAX_FIELD_BYTES))
                      require(bytes.size <= UShort.MAX_VALUE.toInt())
                      output.write(shortBytes(bytes.size))
                      output.write(bytes)
                  }
              }
          }
          EOF

          cat > apps/android/app/src/main/kotlin/com/privateworkspace/prw/AndroidKeyCustody.kt <<'EOF'
          package com.privateworkspace.prw

          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.security.keystore.StrongBoxUnavailableException
          import java.security.KeyPairGenerator
          import java.security.KeyStore
          import java.security.PrivateKey
          import java.security.Signature
          import java.security.spec.ECGenParameterSpec

          internal class AndroidKeyCustody(
              private val keyStore: KeyStore = KeyStore.getInstance(KEYSTORE_PROVIDER).apply { load(null) },
          ) {
              fun ensureDeviceIdentitySpki(): ByteArray = ensurePublicSpki(DEVICE_IDENTITY_ALIAS)

              fun ensureTransportIdentitySpki(): ByteArray = ensurePublicSpki(TRANSPORT_IDENTITY_ALIAS)

              fun deviceIdentityIsNonExportable(): Boolean = isNonExportable(DEVICE_IDENTITY_ALIAS)

              internal fun signCanonicalSessionProof(message: ByteArray): ByteArray {
                  require(message.isNotEmpty() && message.size <= MAX_TYPED_MESSAGE_BYTES)
                  ensurePublicSpki(DEVICE_IDENTITY_ALIAS)
                  val privateKey = keyStore.getKey(DEVICE_IDENTITY_ALIAS, null) as? PrivateKey
                      ?: error("device identity private key unavailable")
                  check(privateKey.encoded == null) { "Android Keystore private key became exportable" }
                  return Signature.getInstance(SIGNATURE_ALGORITHM).run {
                      initSign(privateKey)
                      update(message)
                      sign()
                  }
              }

              private fun ensurePublicSpki(alias: String): ByteArray {
                  if (!keyStore.containsAlias(alias)) {
                      generate(alias, strongBox = true)
                  }
                  val certificate = keyStore.getCertificate(alias)
                      ?: error("Android Keystore public identity unavailable")
                  return certificate.publicKey.encoded
                      ?: error("Android Keystore public identity SPKI unavailable")
              }

              private fun generate(alias: String, strongBox: Boolean) {
                  try {
                      generator(alias, strongBox).generateKeyPair()
                  } catch (error: StrongBoxUnavailableException) {
                      if (!strongBox) throw error
                      generator(alias, strongBox = false).generateKeyPair()
                  }
              }

              private fun generator(alias: String, strongBox: Boolean): KeyPairGenerator =
                  KeyPairGenerator.getInstance(KeyProperties.KEY_ALGORITHM_EC, KEYSTORE_PROVIDER).apply {
                      val builder = KeyGenParameterSpec.Builder(alias, KeyProperties.PURPOSE_SIGN)
                          .setAlgorithmParameterSpec(ECGenParameterSpec("secp256r1"))
                          .setDigests(KeyProperties.DIGEST_SHA256)
                          .setUserAuthenticationRequired(false)
                      if (strongBox) builder.setIsStrongBoxBacked(true)
                      initialize(builder.build())
                  }

              private fun isNonExportable(alias: String): Boolean {
                  ensurePublicSpki(alias)
                  val key = keyStore.getKey(alias, null) as? PrivateKey ?: return false
                  return key.encoded == null
              }

              companion object {
                  internal const val DEVICE_IDENTITY_ALIAS = "prw.device-identity.v1"
                  internal const val TRANSPORT_IDENTITY_ALIAS = "prw.transport-identity.v1"
                  private const val KEYSTORE_PROVIDER = "AndroidKeyStore"
                  private const val SIGNATURE_ALGORITHM = "SHA256withECDSA"
                  private const val MAX_TYPED_MESSAGE_BYTES = 4_442
              }
          }
          EOF

          cat > apps/android/app/src/main/kotlin/com/privateworkspace/prw/NativeBridge.kt <<'EOF'
          package com.privateworkspace.prw

          internal object NativeBridge {
              init {
                  System.loadLibrary("prw_android_adapter")
              }

              @JvmStatic external fun protocolVersion(): Int
              @JvmStatic external fun roundTripControlFrame(frame: ByteArray): ByteArray
              @JvmStatic external fun canonicalSessionMessage(request: ByteArray): ByteArray
              @JvmStatic external fun verifySessionSignature(request: ByteArray, signature: ByteArray): Boolean
          }
          EOF

          cat > apps/android/app/src/main/kotlin/com/privateworkspace/prw/MainViewModel.kt <<'EOF'
          package com.privateworkspace.prw

          import androidx.lifecycle.ViewModel
          import java.security.SecureRandom
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow

          internal data class PrwUiState(
              val connectionState: ConnectionState = ConnectionState.Disconnected,
              val identityReady: Boolean = false,
              val nativeBridgeReady: Boolean = false,
              val bootstrapValidated: Boolean = false,
              val detail: String = "Development bootstrap only — no production endpoint",
          )

          internal class MainViewModel(
              private val custody: AndroidKeyCustody = AndroidKeyCustody(),
              private val controller: ConnectionController = ConnectionController(),
          ) : ViewModel() {
              private val mutableUiState = MutableStateFlow(PrwUiState())
              val uiState: StateFlow<PrwUiState> = mutableUiState.asStateFlow()

              fun validateLocalBootstrap() {
                  if (!controller.transition(ConnectionState.Connecting)) return
                  publish("Preparing non-exportable Android identity")
                  runCatching {
                      check(NativeBridge.protocolVersion() == 1)
                      val spki = custody.ensureDeviceIdentitySpki()
                      check(custody.deviceIdentityIsNonExportable())
                      controller.transition(ConnectionState.Authenticating)
                      publish("Validating typed local session proof")
                      val nonce = ByteArray(32).also(SecureRandom()::nextBytes)
                      val request = BootstrapRequest(
                          workspaceId = "phase145-development-workspace",
                          userId = "phase145-development-user",
                          deviceId = "phase145-android-device",
                          sessionId = "phase145-local-session",
                          publicSpki = spki,
                          nonce = nonce,
                      ).encode()
                      val canonical = NativeBridge.canonicalSessionMessage(request)
                      check(canonical.isNotEmpty())
                      val signature = custody.signCanonicalSessionProof(canonical)
                      check(NativeBridge.verifySessionSignature(request, signature))
                      check(controller.transition(ConnectionState.Connected))
                  }.onSuccess {
                      mutableUiState.value = PrwUiState(
                          connectionState = ConnectionState.Connected,
                          identityReady = true,
                          nativeBridgeReady = true,
                          bootstrapValidated = true,
                          detail = "Local authenticated bootstrap validated; remote production networking remains disabled",
                      )
                  }.onFailure { error ->
                      controller.transition(ConnectionState.Error)
                      mutableUiState.value = PrwUiState(
                          connectionState = ConnectionState.Error,
                          identityReady = runCatching { custody.deviceIdentityIsNonExportable() }.getOrDefault(false),
                          nativeBridgeReady = runCatching { NativeBridge.protocolVersion() == 1 }.getOrDefault(false),
                          bootstrapValidated = false,
                          detail = error.message ?: "Local bootstrap failed closed",
                      )
                  }
              }

              fun disconnect() {
                  val current = controller.state.value
                  if (current == ConnectionState.Connected || current == ConnectionState.Suspended) {
                      check(controller.transition(ConnectionState.Disconnecting))
                      check(controller.transition(ConnectionState.Disconnected))
                  } else if (current == ConnectionState.Error) {
                      check(controller.transition(ConnectionState.Disconnected))
                  }
                  mutableUiState.value = PrwUiState(
                      connectionState = controller.state.value,
                      identityReady = mutableUiState.value.identityReady,
                      nativeBridgeReady = mutableUiState.value.nativeBridgeReady,
                      bootstrapValidated = false,
                  )
              }

              private fun publish(detail: String) {
                  mutableUiState.value = mutableUiState.value.copy(
                      connectionState = controller.state.value,
                      detail = detail,
                  )
              }
          }
          EOF

          cat > apps/android/app/src/main/kotlin/com/privateworkspace/prw/MainActivity.kt <<'EOF'
