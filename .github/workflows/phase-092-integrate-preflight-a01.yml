name: Phase 092 Integration Preflight A01

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase-092-integrate-preflight-a01.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reuse Phase 092 payload with cleanup correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/phase-092-integrate-preflight.yml").read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if workflow.count(start_marker) != 1:
              raise SystemExit("expected exactly one Phase 092 Python payload start")
          payload = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          payload = textwrap.dedent(payload)

          loop_marker = "for old, new, expected in replacements:\n"
          if payload.count(loop_marker) != 1:
              raise SystemExit("Phase 092 replacement-loop marker mismatch")
          cleanup_patch = (
              "replacements.append((\n"
              "    \"            drop(self.instance_lock);\\n            drop(self.runtime_directory);\\n            fs::remove_dir_all(self.root_path).expect(\\\"temporary Phase 092 root removes\\\");\",\n"
              "    \"            fs::remove_dir_all(&self.root_path).expect(\\\"temporary Phase 092 root removes\\\");\",\n"
              "    1,\n"
              "))\n\n"
          )
          payload = payload.replace(loop_marker, cleanup_patch + loop_marker, 1)
          exec(compile(payload, "phase-092-integrate-preflight-payload", "exec"), {"__name__": "__main__"})
          PY

          cargo fmt --all
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' crates/prw-agent/src/linux_identity.rs crates/prw-agent/src/linux_runtime_orchestration.rs | sort)"
          test "$changed" = "$expected"
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          git diff --check

      - name: Commit integrated preflight and remove temporary workflows
        run: |
          rm .github/workflows/phase-092-integrate-preflight.yml
          rm .github/workflows/phase-092-integrate-preflight-a01.yml
          git add crates/prw-agent/src/linux_identity.rs crates/prw-agent/src/linux_runtime_orchestration.rs .github/workflows/phase-092-integrate-preflight.yml .github/workflows/phase-092-integrate-preflight-a01.yml
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git commit -m "Integrate Phase 092 finite runtime orchestration"
          git push
