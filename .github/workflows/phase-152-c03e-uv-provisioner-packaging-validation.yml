name: Phase 152 C03e-UV Provisioner Packaging Validation

on:
  pull_request:
    paths:
      - "crates/prw-device-identity-provisioning/**"
      - "packaging/systemd/PROVISIONER_INSTALL_TRANSACTION.md"
      - "packaging/systemd/install-prw-device-identity-provision.sh"
      - "packaging/systemd/README.md"
      - "scripts/validate-phase-152-c03e-uv-provisioner-packaging.sh"
      - ".github/workflows/phase-152-c03e-uv-provisioner-packaging-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-152-c03e-uv-provisioner-packaging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate non-activating provisioner package transaction
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          rustc --version
          cargo --version
          bash --version | head -n 1

      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Validate provisioner packaging in disposable roots
        run: bash scripts/validate-phase-152-c03e-uv-provisioner-packaging.sh
