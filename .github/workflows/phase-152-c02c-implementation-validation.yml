name: PRW Phase 152 C02c Implementation Validation

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact C02c commit SHA approved for implementation validation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prw-phase-152-c02c-implementation-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate C02c implementation only
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout explicitly selected C02c ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Require exact branch and approved head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "phase-152-c02c-authority-foundation"
          actual_head="$(git rev-parse HEAD)"
          test "${actual_head}" = "${EXPECTED_HEAD}"
          test "${#EXPECTED_HEAD}" -eq 40
          echo "C02c validation head: ${actual_head}"

      - name: Verify frozen lineage and exact C02c source scope
        shell: bash
        run: |
          set -euo pipefail
          FROZEN=01f5466504684ea6a2c504613901d24018485887
          git merge-base --is-ancestor "${FROZEN}" HEAD
          test "$(git merge-base "${FROZEN}" HEAD)" = "${FROZEN}"

          mapfile -t changed < <(git diff --name-only "${FROZEN}..HEAD")
          printf 'C02c changed files:\n'
          printf '  %s\n' "${changed[@]}"

          for path in "${changed[@]}"; do
            case "${path}" in
              .github/workflows/phase-152-c02c-implementation-validation.yml|\
              contracts/DESKTOP_FUNCTIONAL_MANAGEMENT_SLICE_C02C_AUTHORITY_FOUNDATION_GATE.md|\
              crates/prw-agent/Cargo.toml|\
              crates/prw-agent/src/local_commands.rs|\
              crates/prw-agent/src/local_commands/management_authority.rs|\
              crates/prw-agent/src/local_commands/management_dispatch.rs|\
              crates/prw-agent/src/local_commands/management_execution.rs|\
              crates/prw-agent/src/local_commands/management_provider_lifecycle.rs|\
              crates/prw-agent/src/local_commands/management_response.rs|\
              crates/prw-agent/src/local_commands/management_typed_provider_dispatch.rs|\
              crates/prw-policy/src/lib.rs|\
              logs/audits/phase-152-c02c-authority-foundation/C02C_AUTHORITY_FOUNDATION_AUDIT.md)
                ;;
              *)
                echo "Unexpected C02c path: ${path}" >&2
                exit 1
                ;;
            esac
          done

          for forbidden in \
            Cargo.toml \
            Cargo.lock \
            crates/prw-agent/src/main.rs \
            crates/prw-agent/src/linux_bootstrap.rs \
            crates/prw-agent/src/linux_production_runtime_loop.rs; do
            if git diff --name-only "${FROZEN}..HEAD" -- "${forbidden}" | grep -q .; then
              echo "Forbidden C02c mutation: ${forbidden}" >&2
              exit 1
            fi
          done

      - name: Verify C02c non-activation invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fn 'Status: `IMPLEMENTATION_LOCK / NO_RUNTIME_WIRING / NO_PRODUCTION_ACTIVATION`' \
            contracts/DESKTOP_FUNCTIONAL_MANAGEMENT_SLICE_C02C_AUTHORITY_FOUNDATION_GATE.md
          grep -Fn 'BoundedLocalReadPolicy::allow_local_reads()' crates/prw-agent/src/linux_bootstrap.rs
          grep -Fn 'pub(crate) mod management_execution;' crates/prw-agent/src/local_commands.rs
          grep -Fn 'process_authenticated_linux_management_with_typed_providers' \
            crates/prw-agent/src/local_commands/management_execution.rs

          if grep -RFn 'process_authenticated_linux_management_with_typed_providers' \
            crates/prw-agent/src/linux_bootstrap.rs \
            crates/prw-agent/src/linux_production_runtime_loop.rs \
            crates/prw-agent/src/main.rs; then
            echo 'C02c execution seam became reachable from production runtime' >&2
            exit 1
          fi

          if grep -RFn 'BoundedLocalManagementPolicy' \
            crates/prw-agent/src/linux_bootstrap.rs \
            crates/prw-agent/src/linux_production_runtime_loop.rs \
            crates/prw-agent/src/main.rs; then
            echo 'C02c management policy was selected by production runtime' >&2
            exit 1
          fi

          echo 'C02c production activation remains absent'

      - name: Verify locked dependency graph remains deterministic
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cp Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"
          cargo generate-lockfile
          cmp -s "${RUNNER_TEMP}/Cargo.lock.before" Cargo.lock
          git diff --exit-code -- Cargo.lock

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check

      - name: Run C02c Clippy scope
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked \
            -p prw-policy \
            -p prw-agent \
            --all-targets \
            --all-features \
            -- -D warnings

      - name: Run C02c tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked \
            -p prw-policy \
            -p prw-agent \
            --all-targets

      - name: Build C02c implementation scope
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked \
            -p prw-policy \
            -p prw-agent \
            --all-targets

      - name: Reconfirm no committed mutation after validation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          echo 'Validation produced no committed-source drift'
