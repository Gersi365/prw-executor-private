name: Phase 136 Relay Fallback Foundation Validation

on:
  push:
    paths:
      - '.github/workflows/phase-136-relay-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Require Phase 135 authority and Phase 136 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f logs/audits/phase-135-private-mesh-connectivity-foundation/PRW-PHASE-135-PRIVATE-MESH-CONNECTIVITY-FOUNDATION-VALIDATION.txt
          grep -Fq 'PHASE_135_DONE' \
            logs/audits/phase-135-private-mesh-connectivity-foundation/PRW-PHASE-135-PRIVATE-MESH-CONNECTIVITY-FOUNDATION-VALIDATION.txt
          test -f contracts/RELAY_FALLBACK_FOUNDATION_CONTRACT.md
          grep -Fq 'Status: Phase 136 implementation lock' contracts/RELAY_FALLBACK_FOUNDATION_CONTRACT.md
          test -f crates/prw-relay/Cargo.toml
          test -f crates/prw-relay/src/lib.rs
          echo 'phase136_prerequisites=pass'

      - name: Register crate and normalize exact locked graph
        id: graph
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          member = '    "crates/prw-relay",\n'
          if member not in text:
              needle = '    "crates/prw-connectivity",\n'
              if text.count(needle) != 1:
                  raise SystemExit('relay workspace insertion point mismatch')
              cargo.write_text(text.replace(needle, needle + member))
          PY
          rustc --version
          cargo --version
          cargo fmt --all
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo clippy --fix --locked -p prw-relay --all-targets --all-features \
            --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
          git restore --worktree --staged -- target/.rustc_info.json 2>/dev/null || true
          mapfile -t changed < <(git diff --name-only -- . ':!target')
          for path in "${changed[@]}"; do
            case "$path" in
              Cargo.toml|Cargo.lock|crates/prw-relay/src/lib.rs) ;;
              *) echo "unexpected_phase136_fix_path=$path" >&2; exit 1 ;;
            esac
          done
          git diff --check
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          source_sha=$(sha256sum crates/prw-relay/src/lib.rs | cut -d' ' -f1)
          echo "lock_sha=$lock_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "phase136_lock_sha256=$lock_sha"
          echo "phase136_source_sha256=$source_sha"

      - name: Prove fallback-only opaque no-network boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          source='crates/prw-relay/src/lib.rs'
          ! grep -Fq 'TcpListener' "$source"
          ! grep -Fq 'TcpStream' "$source"
          ! grep -Fq 'UdpSocket' "$source"
          ! grep -Fq 'ToSocketAddrs' "$source"
          ! grep -Fq 'decrypt(' "$source"
          ! grep -Fq 'private_key' "$source"
          ! grep -Fq 'std::process::Command' "$source"
          ! grep -Fq 'Command::new' "$source"
          ! grep -Fq 'unsafe {' "$source"
          grep -Fq 'MAX_ACTIVE_RELAY_SESSIONS: usize = 32' "$source"
          grep -Fq 'MAX_RELAY_FRAME_BYTES: usize = 65_536' "$source"
          grep -Fq 'pub struct OpaqueRelayFrame' "$source"
          grep -Fq 'ConnectivityPathKind::Relay' "$source"
          grep -Fq 'pub trait RelayBackend' "$source"
          echo 'phase136_typed_boundary=pass'

      - name: Run focused Phase 136 gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-relay --all-targets --all-features -- -D warnings
          cargo test --locked -p prw-relay --all-targets
          echo 'phase136_focused_validation=pass'

      - name: Run full workspace gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          echo 'phase136_workspace_validation=pass'

      - name: Record authoritative Phase 136 report
        shell: bash
        env:
          LOCK_SHA: ${{ steps.graph.outputs.lock_sha }}
          SOURCE_SHA: ${{ steps.graph.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          report_dir='logs/audits/phase-136-relay-fallback-foundation'
          report="$report_dir/PRW-PHASE-136-RELAY-FALLBACK-FOUNDATION-VALIDATION.txt"
          mkdir -p "$report_dir"
          cat > "$report" <<EOF
          Private Remote Workspace
          Phase 136 — Relay Fallback Foundation

          STATUS:
          PASS / CONTRACT_LOCKED / FALLBACK_ONLY_RELAY_SPEC_VALIDATED / OPAQUE_FRAME_BOUNDARY_VALIDATED / SESSION_BOUNDS_FAIL_CLOSED / FULL_WORKSPACE_VALIDATION_PASS / PRODUCTION_RELAY_NOT_ACTIVE

          Repository: Gersi365/prw-executor-private
          Branch: main
          Date: 2026-08-16
          Validation input head: $GITHUB_SHA
          Authoritative validation run: $GITHUB_RUN_ID
          Cargo.lock SHA-256: $LOCK_SHA
          prw-relay source SHA-256: $SOURCE_SHA

          CONTRACT
          contracts/RELAY_FALLBACK_FOUNDATION_CONTRACT.md

          IMPLEMENTATION
          crates/prw-relay

          FALLBACK OUTCOME
          A relay session specification can be created only from a Phase 135 selected candidate whose kind is Relay. LocalDirect, InternetDirect and Offline selections fail closed. RelayRouteToken is opaque non-zero 32-byte routing metadata and is not a cryptographic private key.

          OPAQUE PAYLOAD OUTCOME
          OpaqueRelayFrame is non-empty and bounded to 64 KiB. The provider boundary exposes no payload parser or decrypt/private-key API. Tests prove exact frame bytes reach the backend unchanged. This is an architectural opacity boundary; Phase 136 does not claim arbitrary bytes are cryptographically valid ciphertext and does not invent encryption.

          LIFECYCLE/BOUNDS
          One broker tracks at most 32 sessions. Duplicate IDs and capacity fail before backend open. Provider open failure creates no record; transmit/close failure retains Failed; successful close returns Closed and removes the record. Logical DeviceId remains distinct from TransportIdentity.

          VALIDATION
          The authoritative run passed static fallback-only/no-socket/no-decrypt/no-shell checks, focused prw-relay rustfmt/Clippy -D warnings/all-target tests, then full workspace/all-target rustfmt, Clippy, tests and build under the locked graph.

          DEFERRED
          Relay server deployment, real dialing/sockets, route-token issuance, bandwidth/rate limiting, multi-region selection, reconnect/migration, end-to-end transport encryption integration and production capability policy remain deferred. Phase 137 owns optional private DNS.

          PRODUCTION BOUNDARY
          No relay server, connection, public endpoint, production route token, PowerCode network state, firewall rule or user-impacting production networking change was created or mutated.

          FINAL CLASSIFICATION
          PHASE_136_DONE / NO_PRODUCTION_RELAY_SIDE_EFFECT / READY_FOR_PHASE_137_SOURCE_WORK
          EOF
          git diff --check

      - name: Commit validated relay graph and report only
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name Gersi365
          git config user.email Gersi365@outlook.com
          git add Cargo.toml Cargo.lock crates/prw-relay/src/lib.rs \
            logs/audits/phase-136-relay-fallback-foundation/PRW-PHASE-136-RELAY-FALLBACK-FOUNDATION-VALIDATION.txt
          git diff --cached --check
          git commit -m 'phase 136: validate relay fallback foundation'
          git push origin HEAD:main
          echo 'phase136_materialization=pass'
