name: Phase 152 Desktop Envelope Rustfmt Corrective

on:
  push:
    branches:
      - phase-152-desktop-local-management-envelope-preview
    paths:
      - .github/workflows/phase-152-desktop-envelope-rustfmt-corrective.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard and apply exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "phase-152-desktop-local-management-envelope-preview"
          test "$(git hash-object apps/desktop/src/local_management_ipc.rs)" = "f710d75aa14df4f85f6cd301409e189dc5da68ef"
          test "$(git hash-object apps/desktop/src/ui.rs)" = "e1a2d819401eac6099c53bf5c17bceda049d3089"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/src/local_management_ipc.rs")
          text = path.read_text()
          old = '''        let command = BridgeCommand::FileList(\n            RemotePath::parse("workspace").expect("valid relative path"),\n        );\n'''
          new = '''        let command =\n            BridgeCommand::FileList(RemotePath::parse("workspace").expect("valid relative path"));\n'''
          if text.count(old) != 1:
              raise SystemExit("local IPC rustfmt guard failed")
          path.write_text(text.replace(old, new, 1))

          path = Path("apps/desktop/src/ui.rs")
          text = path.read_text()
          replacements = [
              (
                  '''fn local_management_envelope_status(\n    bridge_payload: &[u8],\n    operation: &str,\n) -> (String, String) {\n''',
                  '''fn local_management_envelope_status(bridge_payload: &[u8], operation: &str) -> (String, String) {\n''',
              ),
              (
                  '''            local_management_ipc::build_encoded_bridge_management_request(request_id, bridge_payload)\n                .ok()\n''',
                  '''            local_management_ipc::build_encoded_bridge_management_request(\n                request_id,\n                bridge_payload,\n            )\n            .ok()\n''',
              ),
              (
                  '''            format!(\n                "Agent command-3 local envelope: {payload_len} payload bytes. NOT DISPATCHED."\n            ),\n''',
                  '''            format!("Agent command-3 local envelope: {payload_len} payload bytes. NOT DISPATCHED."),\n''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit("UI rustfmt guard failed")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          test "$(git hash-object apps/desktop/src/local_management_ipc.rs)" = "1d6b2b08d02f2c33460400ec9cf74b2453fcd772"
          test "$(git hash-object apps/desktop/src/ui.rs)" = "00b4aabb9e350d3e16c9b8d3b6f8bed03c33678a"

      - name: Commit exact formatter correction and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase-152-desktop-envelope-rustfmt-corrective.yml
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v -E '^(apps/desktop/src/local_management_ipc.rs|apps/desktop/src/ui.rs|\.github/workflows/phase-152-desktop-envelope-rustfmt-corrective.yml)$' || true)"
          test -z "$unexpected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/local_management_ipc.rs apps/desktop/src/ui.rs .github/workflows/phase-152-desktop-envelope-rustfmt-corrective.yml
          git commit -m "phase 152 desktop: apply envelope rustfmt corrective"
          git push origin HEAD:phase-152-desktop-local-management-envelope-preview
