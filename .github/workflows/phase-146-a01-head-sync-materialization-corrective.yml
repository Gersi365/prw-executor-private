name: Phase 146 A01 Head-Sync Materialization Corrective

on:
  push:
    paths:
      - '.github/workflows/phase-146-a01-head-sync-materialization-corrective.yml'

permissions:
  contents: write

jobs:
  revalidate-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Prove A01 current-head baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .github/workflows/phase-146-android-enrollment-device-management.yml
          test -f contracts/ANDROID_ENROLLMENT_DEVICE_MANAGEMENT_CONTRACT.md
          test -f logs/audits/phase-145-android-client-foundation/PRW-PHASE-145-ANDROID-CLIENT-FOUNDATION-VALIDATION.txt
          grep -Fq 'PERMANENT_ANDROID_CI_SUCCESS' logs/audits/phase-145-android-client-foundation/PRW-PHASE-145-ANDROID-CLIENT-FOUNDATION-VALIDATION.txt
          grep -Fq 'Stage only validated Phase 146 source and evidence' .github/workflows/phase-146-android-enrollment-device-management.yml
          echo phase146_a01_baseline=pass

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Extract exact validated Phase 146 step bodies
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/phase-146-android-enrollment-device-management.yml').read_text()

          def extract_run(step_name: str, next_step_name: str) -> str:
              marker = f'      - name: {step_name}\n'
              start = source.index(marker)
              run_marker = '        run: |\n'
              body_start = source.index(run_marker, start) + len(run_marker)
              end = source.index(f'      - name: {next_step_name}\n', body_start)
              lines = source[body_start:end].splitlines()
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          pairs = [
              ('Prepare exact Phase 145 toolchains', 'Materialize Phase 146 candidate source in runner'),
              ('Materialize Phase 146 candidate source in runner', 'Validate Phase 146 native enrollment boundary'),
              ('Validate Phase 146 native enrollment boundary', 'Validate Phase 146 Android unit lint and APK'),
              ('Validate Phase 146 Android unit lint and APK', 'Prove Phase 146 authority and security boundaries'),
              ('Prove Phase 146 authority and security boundaries', 'Revalidate root Rust workspace'),
              ('Revalidate root Rust workspace', 'Write authoritative Phase 146 validation report'),
              ('Write authoritative Phase 146 validation report', 'Stage only validated Phase 146 source and evidence'),
              ('Stage only validated Phase 146 source and evidence', 'Commit and push validated Phase 146 source'),
          ]

          for index, pair in enumerate(pairs, 1):
              Path(f'/tmp/phase146-a01-step-{index}.sh').write_text(extract_run(*pair))
          PY
          echo phase146_a01_extraction=pass

      - name: Re-run exact validated Phase 146 bodies from current head
        shell: bash
        run: |
          set -Eeuo pipefail
          for step_script in /tmp/phase146-a01-step-{1..8}.sh; do
            (cd "$GITHUB_WORKSPACE" && bash "$step_script")
          done
          echo phase146_a01_revalidation=pass

      - name: Commit and push current-head validated Phase 146 source
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --cached --check
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          grep -Fxq 'apps/android/native/src/lib.rs' <<< "$staged"
          grep -Fxq 'apps/android/app/src/main/kotlin/com/privateworkspace/prw/EnrollmentProofRequest.kt' <<< "$staged"
          grep -Fxq 'apps/android/app/src/main/kotlin/com/privateworkspace/prw/DeviceManagement.kt' <<< "$staged"
          grep -Fxq 'logs/audits/phase-146-android-enrollment-device-management/PRW-PHASE-146-ANDROID-ENROLLMENT-DEVICE-MANAGEMENT-VALIDATION.txt' <<< "$staged"
          if printf '%s\n' "$staged" | grep -E '(^|/)(build|target|\.gradle)/'; then
            echo phase146_a01_generated_output_staged >&2
            exit 1
          fi
          git config user.name Gersi365
          git config user.email Gersi365@outlook.com
          git commit -m 'phase 146 a01: materialize validated Android enrollment device management'
          git push origin HEAD:main
          echo phase146_a01_materialization=pass
