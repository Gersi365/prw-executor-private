name: Phase 152 C03 Runtime Context PR Validation

on:
  pull_request:
    branches:
      - phase-152-c03-runtime-management-integration

permissions:
  contents: read

jobs:
  validate-context:
    if: github.head_ref == 'phase-152-c03-runtime-wiring-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact proof ancestry
        run: |
          test "$(git rev-parse HEAD^)" = "d73f7412048fd51368bdd176bb646d2b82050ecf"
          test "$(git rev-parse HEAD^^^)" = "d3abca54726ffeea139599d4cdbd87fc778adb2e"

      - name: Materialize proof module declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/prw-agent/src/local_commands.rs')
          text = path.read_text()
          anchor = '''#[allow(
              dead_code,
              reason = "C02c provider lifecycle ownership seam is intentionally not runtime-wired"
          )]
          pub(crate) mod management_provider_lifecycle;
          '''
          replacement = anchor + '''#[allow(
              dead_code,
              reason = "C03 shared production runtime context is validated before worker wiring"
          )]
          pub(crate) mod management_runtime;
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one lifecycle module anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, replacement))
          PY
          cargo fmt --all

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libgtk-4-dev libadwaita-1-dev

      - name: Validate context
        run: |
          export CARGO_TARGET_DIR="${RUNNER_TEMP}/prw-c03-context-pr-target"
          rm -rf target "$CARGO_TARGET_DIR"
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check
          cargo test --locked -p prw-agent management_runtime::tests -- --nocapture
          cargo clippy --locked -p prw-agent --all-targets --all-features -- -D warnings
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
