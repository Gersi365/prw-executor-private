name: Phase 152 C03e-AN Bounded Clippy Corrective

on:
  push:
    branches:
      - phase-152-c03e-an-remote-endpoint-supervisor-shutdown-lifecycle-source-materialization-staging
    paths:
      - .github/workflows/phase-152-c03e-an-clippy-corrective.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: phase-152-c03e-an-remote-endpoint-supervisor-shutdown-lifecycle-source-materialization-staging
          fetch-depth: 0

      - name: Apply exact bounded source corrective
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs")
          source = path.read_text(encoding="utf-8")

          old_executor = "        executor: &mut RemoteSessionExecutorRuntime,"
          new_executor = "        executor: &RemoteSessionExecutorRuntime,"
          assert source.count(old_executor) == 1, "unexpected executor parameter anchor count"
          source = source.replace(old_executor, new_executor, 1)

          old_docs = '''        /// This domain-specific seam uses only sequential private runtime drives. It exposes no
        /// generic `block_on`, runtime handle, second runtime, readiness or activation surface.
        #[expect(
'''
          new_docs = '''        /// This domain-specific seam uses only sequential private runtime drives. It exposes no
        /// generic `block_on`, runtime handle, second runtime, readiness or activation surface.
        ///
        /// # Errors
        ///
        /// Returns the existing persistent-collection configuration error unchanged after the
        /// deterministic endpoint close and idle drain when the C03e-AL drive rejects its worker
        /// capacity configuration.
        #[expect(
'''
          assert source.count(old_docs) == 1, "unexpected public-method docs anchor count"
          source = source.replace(old_docs, new_docs, 1)

          old_original = '''            let original = Err(
                RemoteSessionPersistentCollectionConfigError::CapacityExceedsRegisteredDeviceLimit,
            );
'''
          new_original = '''            let original: Result<(), RemoteSessionPersistentCollectionConfigError> = Err(
                RemoteSessionPersistentCollectionConfigError::CapacityExceedsRegisteredDeviceLimit,
            );
'''
          assert source.count(old_original) == 1, "unexpected test Result anchor count"
          source = source.replace(old_original, new_original, 1)

          path.write_text(source, encoding="utf-8")
          PY

          cargo fmt --all -- --check
          git diff --check

      - name: Commit source corrective and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          rm .github/workflows/phase-152-c03e-an-clippy-corrective.yml
          git add crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs .github/workflows/phase-152-c03e-an-clippy-corrective.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only | grep -Fx 'crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs'
          git diff --cached --name-only | grep -Fx '.github/workflows/phase-152-c03e-an-clippy-corrective.yml'
          git commit -m "Phase 152 C03e-AN: correct canonical Rust validation defects"
          git push origin HEAD:phase-152-c03e-an-remote-endpoint-supervisor-shutdown-lifecycle-source-materialization-staging
