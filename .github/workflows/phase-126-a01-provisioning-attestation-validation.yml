name: Phase 126 A01 Provisioning and Attestation Validation

on:
  push:
    paths:
      - '.github/workflows/phase-126-a01-provisioning-attestation-validation.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/prw-device-identity-provisioning/**'
      - 'crates/prw-device-identity-signer/**'
      - 'crates/prw-agent/**'

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and build disposable payload
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          sha256sum Cargo.lock
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          cargo build --release --locked -p prw-agent --bin prw-agent
          cargo build --release --locked -p prw-device-identity-provisioning --bin prw-device-identity-provision

          mkdir -p crates/prw-agent/examples
          cat > crates/prw-agent/examples/phase126_status_probe.rs <<'RS'
          use std::{env, io::Write, os::unix::net::UnixStream};
          use prw_agent::local_commands::LocalAgentCommand;
          use prw_agent::local_commands::request_frame::stream::write_local_command_request;
          use prw_agent::local_commands::status_snapshot::LocalAgentRuntimeState;
          use prw_agent::local_commands::status_snapshot::response_frame::stream::read_success_status_response;
          use prw_agent::LocalIpcRequestId;

          fn main() {
              let socket = env::args().nth(1).expect("socket path argument");
              let mut stream = UnixStream::connect(socket).expect("connect Agent socket");
              let request_id = LocalIpcRequestId::new(126).expect("non-zero request id");
              write_local_command_request(&mut stream, request_id, LocalAgentCommand::GetAgentStatus)
                  .expect("write status request");
              stream.flush().expect("flush request");
              let response = read_success_status_response(&mut stream).expect("read status response");
              assert_eq!(response.request_id(), request_id);
              assert_eq!(response.snapshot().runtime_state(), LocalAgentRuntimeState::Ready);
              assert!(response.snapshot().protocol_version().is_supported());
              println!("phase126_status=Ready protocol_supported=yes");
          }
          RS
          cargo build --release --locked -p prw-agent --example phase126_status_probe

          ! grep -RFn 'sh -c' crates/prw-device-identity-provisioning/src
          ! grep -REn 'Command::new\(("|r#")?(sh|bash)' crates/prw-device-identity-provisioning/src
          ! grep -REn 'pub[[:space:]]+fn[[:space:]]+(import|export|load).*private' crates/prw-device-identity-provisioning/src
          grep -Fq 'RenameFlags::NOREPLACE' crates/prw-device-identity-provisioning/src/lib.rs
          grep -Fq '/usr/bin/systemd-creds' crates/prw-device-identity-provisioning/src/lib.rs
          grep -Fq 'public_spki_sha256=' crates/prw-agent/src/main.rs

          mkdir -p phase126-payload
          install -m 0755 target/release/prw-agent phase126-payload/prw-agent
          install -m 0755 target/release/prw-device-identity-provision phase126-payload/prw-device-identity-provision
          install -m 0755 target/release/examples/phase126_status_probe phase126-payload/phase126-status-probe
          cp Cargo.lock phase126-payload/Cargo.lock
          (cd phase126-payload && sha256sum prw-agent prw-device-identity-provision phase126-status-probe Cargo.lock > SHA256SUMS)
          cat phase126-payload/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: phase126-a01-payload
          path: phase126-payload
          if-no-files-found: error
          retention-days: 1

  prove-powecode:
    needs: validate-build
    runs-on: [self-hosted, prw-host]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phase126-a01-payload
          path: phase126-payload
      - name: Prove disposable provisioning to runtime identity binding
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$GITHUB_WORKSPACE/phase126-payload"
          cd "$payload"
          sha256sum -c SHA256SUMS
          chmod 0755 prw-agent prw-device-identity-provision phase126-status-probe

          expected_installed_agent='8d0fa919676d1d55200801dd979a5463228610ad0f5aea1d2fd8bbded7047fbf'
          expected_installed_unit='24f646dc96777542904cd824f1678e6c32256b64911d4a031c0315d198c0a909'
          production_agent='/usr/lib/private-remote-workspace/prw-agent'
          production_unit='/usr/lib/systemd/user/prw-agent.service'
          production_socket="$XDG_RUNTIME_DIR/private-remote-workspace/agent.sock"
          credential_name='prw.device-identity.private-key.v1'
          root="$RUNNER_TEMP/prw-phase126-a01-${GITHUB_RUN_ID}"
          state_root="$root/state"
          config_root="$root/config"
          runtime_root="$XDG_RUNTIME_DIR/prw-phase126-a01-${GITHUB_RUN_ID}"
          unit="prw-phase126-a01-${GITHUB_RUN_ID}.service"
          cipher="$state_root/private-remote-workspace/credentials/device-identity-private-key-v1.cred"

          cleanup() {
            set +e
            systemctl --user stop "$unit" >/dev/null 2>&1 || true
            systemctl --user reset-failed "$unit" >/dev/null 2>&1 || true
            rm -rf -- "$root" "$runtime_root"
          }
          trap cleanup EXIT INT TERM

          test "$(sha256sum "$production_agent" | cut -d' ' -f1)" = "$expected_installed_agent"
          test "$(sha256sum "$production_unit" | cut -d' ' -f1)" = "$expected_installed_unit"
          test "$(systemctl --user is-active prw-agent.service)" = active
          test "$(systemctl --user is-enabled prw-agent.service)" = enabled
          test "$(loginctl show-user "$USER" -p Linger --value)" = yes
          "$payload/phase126-status-probe" "$production_socket"
          echo 'phase126_a01_production_preflight=pass'

          install -d -m 0700 "$root" "$state_root" "$config_root" "$runtime_root"

          provision_output=$(XDG_STATE_HOME="$state_root" XDG_CONFIG_HOME="$config_root" HOME="$HOME" "$payload/prw-device-identity-provision")
          echo "$provision_output"
          fingerprint=$(sed -n 's/.*public_spki_sha256=\([0-9a-f]\{64\}\).*/\1/p' <<<"$provision_output")
          test "${#fingerprint}" -eq 64
          test -f "$cipher"
          test ! -L "$cipher"
          test "$(stat -c '%u:%g:%a' "$cipher")" = "$(id -u):$(id -g):600"
          first_hash=$(sha256sum "$cipher" | cut -d' ' -f1)
          echo "phase126_a01_provisioning_fingerprint=$fingerprint"

          set +e
          second_output=$(XDG_STATE_HOME="$state_root" XDG_CONFIG_HOME="$config_root" HOME="$HOME" "$payload/prw-device-identity-provision" 2>&1)
          second_rc=$?
          set -e
          test "$second_rc" -ne 0
          test "$(sha256sum "$cipher" | cut -d' ' -f1)" = "$first_hash"
          grep -Fq 'event=failed' <<<"$second_output"
          echo 'phase126_a01_creation_only=pass'

          systemd-run --user \
            --unit="$unit" \
            --property=Type=exec \
            --property=Restart=no \
            --property="LoadCredentialEncrypted=$credential_name:$cipher" \
            --setenv="XDG_RUNTIME_DIR=$runtime_root" \
            "$payload/prw-agent"

          socket="$runtime_root/private-remote-workspace/agent.sock"
          for _ in $(seq 1 100); do
            [[ -S "$socket" ]] && break
            systemctl --user is-active --quiet "$unit" || {
              systemctl --user status "$unit" --no-pager || true
              journalctl --user -u "$unit" -n 30 --no-pager || true
              exit 1
            }
            sleep 0.05
          done
          test -S "$socket"
          "$payload/phase126-status-probe" "$socket"

          journal=''
          for _ in $(seq 1 50); do
            journal=$(journalctl --user -u "$unit" -o cat --no-pager 2>/dev/null || true)
            grep -Fq 'event=device_identity_loaded public_spki_sha256=' <<<"$journal" && break
            sleep 0.05
          done
          runtime_fingerprint=$(sed -n 's/.*event=device_identity_loaded public_spki_sha256=\([0-9a-f]\{64\}\).*/\1/p' <<<"$journal" | tail -n1)
          test "$runtime_fingerprint" = "$fingerprint"
          echo "phase126_a01_runtime_fingerprint=$runtime_fingerprint"
          echo 'phase126_a01_identity_binding=pass'

          systemctl --user stop "$unit"
          for _ in $(seq 1 100); do
            [[ ! -e "$socket" ]] && break
            sleep 0.05
          done
          test ! -e "$socket"

          test "$(sha256sum "$production_agent" | cut -d' ' -f1)" = "$expected_installed_agent"
          test "$(sha256sum "$production_unit" | cut -d' ' -f1)" = "$expected_installed_unit"
          test "$(systemctl --user is-active prw-agent.service)" = active
          test "$(systemctl --user is-enabled prw-agent.service)" = enabled
          test "$(loginctl show-user "$USER" -p Linger --value)" = yes
          "$payload/phase126-status-probe" "$production_socket"
          echo 'phase126_a01_production_unchanged=pass'
