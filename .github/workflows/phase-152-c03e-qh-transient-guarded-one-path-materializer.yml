name: Phase 152 C03e-QH Transient Guarded One-Path Materializer

on:
  push:
    branches:
      - phase-152-c03e-qh-production-expected-device-admission-fallible-verifier-time-request-construction-composition-source-materialization

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize selected request construction composition
        shell: bash
        env:
          BASE: 4612e6e247627e7b81f5a182e532447976f85c9f
          BRANCH: phase-152-c03e-qh-production-expected-device-admission-fallible-verifier-time-request-construction-composition-source-materialization
          SOURCE: crates/prw-agent/src/remote_session_capability_runtime/remote_session_endpoint_lifecycle_runtime.rs
          SOURCE_BLOB: 3b5537d7c176cc8ca1d34f65d47a71c7297effac
          HELPER: .github/workflows/phase-152-c03e-qh-transient-guarded-one-path-materializer.yml
          BLOCK_B64: 
        run: |
          set -euo pipefail

          test "$(git rev-parse --abbrev-ref HEAD)" = "$BRANCH"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" -eq 3
          test "$(git hash-object "$SOURCE")" = "$SOURCE_BLOB"

          mapfile -t pre_paths < <(git diff --name-only "$BASE"..HEAD)
          test "${#pre_paths[@]}" -eq 1
          test "${pre_paths[0]}" = "$HELPER"

          printf '%s' "$BLOCK_B64" | base64 -d > /tmp/qh-block.rs
          test "$(grep -c 'new_remote_session_expected_device_admission_target_session_id()' /tmp/qh-block.rs)" -eq 1
          test "$(grep -c 'new_remote_session_expected_device_authentication_request_id()' /tmp/qh-block.rs)" -eq 1
          test "$(grep -c 'scheduling_grant.into_parts()' /tmp/qh-block.rs)" -eq 1
          test "$(grep -c 'RemoteSessionExpectedDeviceAdmissionRequest::new(' /tmp/qh-block.rs)" -eq 1
          test "$(grep -c 'current_prwa_verifier_unix_seconds()' /tmp/qh-block.rs || true)" -eq 0
          test "$(grep -c 'mpsc::channel' /tmp/qh-block.rs || true)" -eq 0
          test "$(grep -c '\.send(' /tmp/qh-block.rs || true)" -eq 0

          python3 - "$SOURCE" /tmp/qh-block.rs <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          block = Path(sys.argv[2]).read_text(encoding="utf-8")
          text = source.read_text(encoding="utf-8")
          marker = "\n/// Recoverable failed startup transaction retaining the exact admitted reachability authority."
          if text.count(marker) != 1:
              raise SystemExit(f"expected exactly one insertion marker, found {text.count(marker)}")
          if "RemoteSessionExpectedDeviceAdmissionFallibleVerifierTimeSource" in text:
              raise SystemExit("QH materialization already present")
          source.write_text(text.replace(marker, "\n" + block + marker), encoding="utf-8", newline="\n")
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

          mapfile -t working_paths < <(git diff --name-only)
          test "${#working_paths[@]}" -eq 1
          test "${working_paths[0]}" = "$SOURCE"
          test "$(grep -c '^type RemoteSessionExpectedDeviceAdmissionFallibleVerifierTimeSource =' "$SOURCE")" -eq 1
          test "$(grep -c '^fn construct_remote_session_expected_device_admission_request_with_fallible_verifier_time<D>' "$SOURCE")" -eq 1
          test "$(grep -c 'scheduling_grant.into_parts()' "$SOURCE")" -eq 1
          test "$(grep -c 'RemoteSessionExpectedDeviceAdmissionRequest::new(' "$SOURCE")" -eq 1

          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          git add "$SOURCE"
          git commit -m 'C03e-QH: materialize fallible verifier-time request construction composition'

          git rm "$HELPER"
          git commit -m 'C03e-QH: remove transient one-path materializer'

          git diff --check "$BASE"..HEAD
          test ! -e "$HELPER"
          mapfile -t final_paths < <(git diff --name-only "$BASE"..HEAD)
          test "${#final_paths[@]}" -eq 1
          test "${final_paths[0]}" = "$SOURCE"
          test "$(git rev-list --count "$BASE"..HEAD)" -eq 5

          git push origin HEAD:"$BRANCH"
