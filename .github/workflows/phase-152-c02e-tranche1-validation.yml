name: PRW Phase 152 C02e Tranche 1 Validation

on:
  push:
    branches:
      - phase-152-c02e-dynamic-reachability-design
    paths-ignore:
      - "logs/audits/phase-152-c02e-dynamic-reachability-design/C02E_TRANCHE1_GITHUB_VALIDATION_*.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prw-phase-152-c02e-tranche1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate C02e current source without dependency mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Run Tranche 1 and capture auditable result
        id: validation
        shell: bash
        run: |
          set -u -o pipefail

          REPORT="logs/audits/phase-152-c02e-dynamic-reachability-design/C02E_TRANCHE1_GITHUB_VALIDATION_${GITHUB_SHA}.txt"
          mkdir -p "$(dirname "${REPORT}")"
          : > "${REPORT}"

          overall=0
          first_failure=""

          record() {
            printf '%s\n' "$*" | tee -a "${REPORT}"
          }

          gate() {
            local name="$1"
            local command="$2"

            if [[ "${overall}" -ne 0 ]]; then
              record "GATE_${name}=SKIPPED_AFTER_${first_failure}"
              return 0
            fi

            record "===== GATE ${name} ====="
            set +e
            bash -o pipefail -c "${command}" 2>&1 | tee -a "${REPORT}"
            local rc=${PIPESTATUS[0]}
            set -u -o pipefail
            record "GATE_${name}_RC=${rc}"

            if [[ "${rc}" -ne 0 ]]; then
              overall="${rc}"
              first_failure="${name}"
            fi
          }

          record "STATUS=RUNNING"
          record "WORKFLOW=phase-152-c02e-tranche1-validation.yml"
          record "RUN_ID=${GITHUB_RUN_ID}"
          record "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          record "REF=${GITHUB_REF_NAME}"
          record "HEAD=${GITHUB_SHA}"
          record "FROZEN_C02D=857583b25ed1206317641a93fd8f927819c954d8"
          record "RUNNER_OS=${RUNNER_OS}"

          gate lineage "test \"${GITHUB_REF_NAME}\" = \"phase-152-c02e-dynamic-reachability-design\" && test \"$(git rev-parse HEAD)\" = \"${GITHUB_SHA}\" && git merge-base --is-ancestor 857583b25ed1206317641a93fd8f927819c954d8 HEAD && test \"$(git merge-base 857583b25ed1206317641a93fd8f927819c954d8 HEAD)\" = \"857583b25ed1206317641a93fd8f927819c954d8\""

          gate native_prerequisites "sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libgtk-4-dev libadwaita-1-dev && pkg-config --modversion gtk4 && pkg-config --modversion libadwaita-1"

          gate toolchain "rustc --version && cargo --version && rustfmt --version && cargo clippy --version"

          record "===== PRE_VALIDATION_HASHES ====="
          sha256sum Cargo.toml Cargo.lock crates/prw-remote-bridge/Cargo.toml | tee "${RUNNER_TEMP}/c02e-tranche1-pre.sha256" | tee -a "${REPORT}"
          cp Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"

          gate locked_metadata "cargo metadata --locked --no-deps --format-version 1 > /dev/null && git diff --exit-code -- Cargo.toml Cargo.lock crates/prw-remote-bridge/Cargo.toml"
          gate focused_fmt "cargo fmt --all -- --check"
          gate focused_clippy "cargo clippy --locked -p prw-connectivity -p prw-remote-bridge --all-targets --all-features -- -D warnings"
          gate focused_connectivity_tests "cargo test --locked -p prw-connectivity --all-targets"
          gate focused_remote_bridge_tests "cargo test --locked -p prw-remote-bridge --all-targets"
          gate locked_metadata_recheck "cargo metadata --locked --no-deps --format-version 1 > /dev/null && cmp -s \"${RUNNER_TEMP}/Cargo.lock.before\" Cargo.lock && git diff --exit-code -- Cargo.toml Cargo.lock crates/prw-remote-bridge/Cargo.toml"
          gate workspace_fmt "cargo fmt --all -- --check"
          gate workspace_clippy "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"
          gate workspace_tests "cargo test --locked --workspace --all-targets"
          gate workspace_build "cargo build --locked --workspace --all-targets"

          record "===== POST_VALIDATION_HASHES ====="
          sha256sum Cargo.toml Cargo.lock crates/prw-remote-bridge/Cargo.toml | tee "${RUNNER_TEMP}/c02e-tranche1-post.sha256" | tee -a "${REPORT}"

          drift_rc=0
          diff -u "${RUNNER_TEMP}/c02e-tranche1-pre.sha256" "${RUNNER_TEMP}/c02e-tranche1-post.sha256" >> "${REPORT}" 2>&1 || drift_rc=$?
          cmp -s "${RUNNER_TEMP}/Cargo.lock.before" Cargo.lock || drift_rc=$?
          git diff --exit-code -- Cargo.toml Cargo.lock crates/prw-remote-bridge/Cargo.toml >> "${REPORT}" 2>&1 || drift_rc=$?
          record "ZERO_DEPENDENCY_DRIFT_RC=${drift_rc}"

          if [[ "${drift_rc}" -ne 0 && "${overall}" -eq 0 ]]; then
            overall="${drift_rc}"
            first_failure="dependency_source_drift"
          fi

          if [[ "${overall}" -eq 0 ]]; then
            record "STATUS=PASS"
            record "FIRST_FAILURE=NONE"
          else
            record "STATUS=FAIL"
            record "FIRST_FAILURE=${first_failure}"
          fi

          record "VALIDATION_RC=${overall}"
          printf 'validation_rc=%s\n' "${overall}" >> "${GITHUB_OUTPUT}"
          printf 'report=%s\n' "${REPORT}" >> "${GITHUB_OUTPUT}"

      - name: Commit validation evidence to the branch
        if: always()
        shell: bash
        env:
          REPORT: ${{ steps.validation.outputs.report }}
        run: |
          set -euo pipefail
          test -n "${REPORT}"
          test -f "${REPORT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${REPORT}"
          git diff --cached --exit-code >/dev/null 2>&1 && {
            echo "Validation report was not staged" >&2
            exit 1
          }
          git commit -m "phase 152 c02e: record tranche1 validation ${GITHUB_SHA::12}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail job when validation failed
        if: always()
        shell: bash
        env:
          VALIDATION_RC: ${{ steps.validation.outputs.validation_rc }}
        run: |
          set -euo pipefail
          test -n "${VALIDATION_RC}"
          test "${VALIDATION_RC}" -eq 0
