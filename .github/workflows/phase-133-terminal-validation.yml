name: Phase 133 A01 Terminal Foundation Validation

on:
  push:
    paths:
      - '.github/workflows/phase-133-terminal-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Require authoritative prerequisites and contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f logs/audits/phase-130-device-registry-workspace-membership/PRW-PHASE-130-REGISTRY-MEMBERSHIP-VALIDATION.txt
          grep -Fq 'PHASE_130_DONE' logs/audits/phase-130-device-registry-workspace-membership/PRW-PHASE-130-REGISTRY-MEMBERSHIP-VALIDATION.txt
          test -f logs/audits/phase-132-file-transfer-hardening/PRW-PHASE-132-FILE-TRANSFER-HARDENING-VALIDATION.txt
          grep -Fq 'PHASE_132_DONE' logs/audits/phase-132-file-transfer-hardening/PRW-PHASE-132-FILE-TRANSFER-HARDENING-VALIDATION.txt
          test -f contracts/TERMINAL_SESSION_FOUNDATION_CONTRACT.md
          grep -Fq 'Status: Phase 133 implementation lock' contracts/TERMINAL_SESSION_FOUNDATION_CONTRACT.md
          grep -Fq '"crates/prw-terminal"' Cargo.toml
          echo 'phase133_a01_prerequisites=pass'

      - name: Apply exact first-run Clippy correctives
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/prw-terminal/src/lib.rs')
          text = path.read_text()

          replacements = [
              ('    workspace_id: WorkspaceId,\n', '    workspace: WorkspaceId,\n'),
              ('    user_id: UserId,\n', '    user: UserId,\n'),
              ('    device_id: DeviceId,\n', '    device: DeviceId,\n'),
              ('    authenticated_session_id: SessionId,\n', '    authenticated_session: SessionId,\n'),
              ('            workspace_id: principal.workspace_id().clone(),\n', '            workspace: principal.workspace_id().clone(),\n'),
              ('            user_id: principal.user_id().clone(),\n', '            user: principal.user_id().clone(),\n'),
              ('            device_id: principal.device_id().clone(),\n', '            device: principal.device_id().clone(),\n'),
              ('            authenticated_session_id: session_id,\n', '            authenticated_session: session_id,\n'),
              ('        &self.workspace_id\n', '        &self.workspace\n'),
              ('        &self.user_id\n', '        &self.user\n'),
              ('        &self.device_id\n', '        &self.device\n'),
              ('        &self.authenticated_session_id\n', '        &self.authenticated_session\n'),
              ('            workspace_id: WorkspaceId::new("workspace-1").expect("workspace"),\n', '            workspace: WorkspaceId::new("workspace-1").expect("workspace"),\n'),
              ('            user_id: UserId::new("user-1").expect("user"),\n', '            user: UserId::new("user-1").expect("user"),\n'),
              ('            device_id: DeviceId::new("device-1").expect("device"),\n', '            device: DeviceId::new("device-1").expect("device"),\n'),
              ('            authenticated_session_id: SessionId::new("session-1").expect("session"),\n', '            authenticated_session: SessionId::new("session-1").expect("session"),\n'),
          ]
          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'Phase133 field corrective count mismatch for {old!r}')
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'Phase133 corrected field form missing for {new!r}')

          old = '''        let output = match backend.read_output(handle, maximum_bytes) {\n            Ok(output) => output,\n            Err(_) => {\n                terminal.record.mark_failed();\n                return Err(TerminalError::Backend);\n            }\n        };'''
          new = '''        let Ok(output) = backend.read_output(handle, maximum_bytes) else {\n            terminal.record.mark_failed();\n            return Err(TerminalError::Backend);\n        };'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('Phase133 read-output corrective count mismatch')
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('Phase133 corrected read-output form missing')

          old = '''    #[derive(Debug, Default)]\n    struct SpyBackend {\n        open_calls: usize,\n        write_calls: usize,\n        resize_calls: usize,\n        read_calls: usize,\n        close_calls: usize,\n        fail_open: bool,\n        fail_write: bool,\n        fail_read: bool,\n        fail_close: bool,\n        last_profile: Option<TerminalProfile>,\n        last_geometry: Option<TerminalGeometry>,\n        output: Vec<u8>,\n    }'''
          new = '''    #[derive(Debug, Clone, Copy, Default, PartialEq, Eq)]\n    enum FailureMode {\n        #[default]\n        None,\n        Open,\n        Write,\n        Read,\n        Close,\n    }\n\n    #[derive(Debug, Default)]\n    struct SpyBackend {\n        open_calls: usize,\n        write_calls: usize,\n        resize_calls: usize,\n        read_calls: usize,\n        close_calls: usize,\n        failure: FailureMode,\n        last_profile: Option<TerminalProfile>,\n        last_geometry: Option<TerminalGeometry>,\n        output: Vec<u8>,\n    }'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('Phase133 spy corrective count mismatch')
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('Phase133 corrected spy form missing')

          for old, new in [
              ('            if self.fail_open {\n', '            if self.failure == FailureMode::Open {\n'),
              ('            if self.fail_write {\n', '            if self.failure == FailureMode::Write {\n'),
              ('            if self.fail_read {\n', '            if self.failure == FailureMode::Read {\n'),
              ('            if self.fail_close {\n', '            if self.failure == FailureMode::Close {\n'),
              ('            fail_open: true,\n', '            failure: FailureMode::Open,\n'),
              ('            fail_read: true,\n', '            failure: FailureMode::Read,\n'),
              ('            fail_close: true,\n', '            failure: FailureMode::Close,\n'),
          ]:
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'Phase133 failure-mode form missing for {new!r}')

          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
          echo 'phase133_a01_exact_correctives=pass'

      - name: Normalize terminal source and exact locked graph
        id: lock
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo clippy --fix --locked -p prw-terminal --all-targets --all-features --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
          git restore --worktree --staged -- target/.rustc_info.json 2>/dev/null || true
          mapfile -t changed < <(git diff --name-only -- . ':!target')
          for path in "${changed[@]}"; do
            case "$path" in
              Cargo.lock|crates/prw-terminal/src/lib.rs) ;;
              *) echo "unexpected_phase133_fix_path=$path" >&2; exit 1 ;;
            esac
          done
          git diff --check
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          source_sha=$(sha256sum crates/prw-terminal/src/lib.rs | cut -d' ' -f1)
          echo "lock_sha=$lock_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "phase133_a01_lock_sha256=$lock_sha"
          echo "phase133_a01_source_sha256=$source_sha"

      - name: Prove terminal API boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          source='crates/prw-terminal/src/lib.rs'
          ! grep -Fq 'std::process::Command' "$source"
          ! grep -Fq 'process::Command' "$source"
          ! grep -Fq 'Command::new' "$source"
          ! grep -Fq 'TcpListener' "$source"
          ! grep -Fq 'TcpStream' "$source"
          ! grep -Fq 'unsafe {' "$source"
          grep -Fq 'MAX_ACTIVE_TERMINAL_SESSIONS: usize = 32' "$source"
          grep -Fq 'MAX_TERMINAL_IO_BYTES: usize = 65_536' "$source"
          grep -Fq 'pub enum TerminalProfile' "$source"
          grep -Fq 'pub trait TerminalBackend' "$source"
          echo 'phase133_a01_typed_boundary=pass'

      - name: Run focused Phase 133 gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-terminal --all-targets --all-features -- -D warnings
          cargo test --locked -p prw-terminal --all-targets
          echo 'phase133_a01_focused_validation=pass'

      - name: Run full workspace gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          echo 'phase133_a01_workspace_validation=pass'

      - name: Record authoritative Phase 133 report
        shell: bash
        env:
          LOCK_SHA: ${{ steps.lock.outputs.lock_sha }}
          SOURCE_SHA: ${{ steps.lock.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          report_dir='logs/audits/phase-133-terminal-session-foundation'
          report="$report_dir/PRW-PHASE-133-TERMINAL-SESSION-FOUNDATION-VALIDATION.txt"
          mkdir -p "$report_dir"
          cat > "$report" <<EOF
          Private Remote Workspace
          Phase 133 — Terminal Session Foundation

          STATUS:
          PASS / CONTRACT_LOCKED / TYPED_TERMINAL_BROKER_IMPLEMENTED / SESSION_AND_IO_BOUNDS_VALIDATED / BACKEND_FAILURE_FAIL_CLOSED / FULL_WORKSPACE_VALIDATION_PASS / PRODUCTION_REMOTE_TERMINAL_NOT_ACTIVE

          Repository: Gersi365/prw-executor-private
          Branch: main
          Date: 2026-08-16
          Validation input head: $GITHUB_SHA
          Authoritative validation run: $GITHUB_RUN_ID
          Cargo.lock SHA-256: $LOCK_SHA
          prw-terminal source SHA-256: $SOURCE_SHA

          CONTRACT
          contracts/TERMINAL_SESSION_FOUNDATION_CONTRACT.md

          IMPLEMENTATION
          crates/prw-terminal

          SECURITY OUTCOME
          TerminalSessionId is non-zero and broker scoped. TerminalGeometry is bounded to 1..1000 in each dimension. Input/output operations are bounded to 64 KiB and one broker tracks at most 32 sessions. Duplicate identifiers, capacity, empty input, oversized input and invalid output requests fail before backend mutation. The backend interface accepts only fixed TerminalProfile values and validated geometry/I/O; it accepts no caller-supplied executable path, argument vector, raw command string, environment injection, filesystem path, network endpoint or privilege instruction. Backend operation failures move retained records to Failed; successful explicit close returns a Closed record and later broker I/O for that record is rejected.

          IDENTITY BINDING
          A terminal record immutably snapshots WorkspaceId, UserId, DeviceId and authenticated PRW SessionId from a registry-current principal boundary. Workspace role metadata does not itself grant terminal capability.

          VALIDATION
          Run 31945258630 reached focused source validation and exposed only three Clippy issues: common field postfixes, manual let-else, and excessive bools in the test spy. This authoritative corrective run removes those mechanically without weakening the terminal contract, then passes typed-boundary checks, focused prw-terminal rustfmt/Clippy/tests, and full workspace/all-target rustfmt, Clippy, tests and build under the locked graph.

          DEFERRED
          Linux PTY/process spawning, production terminal capability policy, remote transport framing, reconnect/reattach persistence, shell environment policy, clipboard/file integration, Android/Desktop terminal UI and port forwarding remain deferred. Phase 134 owns port-forwarding foundation.

          PRODUCTION BOUNDARY
          No production remote shell, PTY, SSH listener, public listener, PowerCode runtime terminal capability, privilege change or user-impacting network state was activated or mutated.

          FINAL CLASSIFICATION
          PHASE_133_DONE / NO_PRODUCTION_REMOTE_TERMINAL_SIDE_EFFECT / READY_FOR_PHASE_134_SOURCE_WORK
          EOF
          git diff --check

      - name: Commit validated terminal source graph and report only
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name Gersi365
          git config user.email Gersi365@outlook.com
          git add Cargo.lock crates/prw-terminal/src/lib.rs logs/audits/phase-133-terminal-session-foundation/PRW-PHASE-133-TERMINAL-SESSION-FOUNDATION-VALIDATION.txt
          git diff --cached --check
          git commit -m 'phase 133: validate terminal session foundation'
          git push origin HEAD:main
          echo 'phase133_a01_materialization=pass'
