name: Phase 152 C03e-QF Transient Guarded One-Path Materializer

on:
  push:
    branches:
      - phase-152-c03e-qf-production-durable-reachability-fallible-verifier-time-production-source-population-companion-composition-source-materialization

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize selected production-source population companion composition
        shell: bash
        env:
          BASE: ed6185a579beeafbbbbb6d6c72cd73a908557ce5
          BRANCH: phase-152-c03e-qf-production-durable-reachability-fallible-verifier-time-production-source-population-companion-composition-source-materialization
          SOURCE: crates/prw-agent/src/production_durable_capability_higher_owner_custody.rs
          SOURCE_BLOB: 72a3341b112c49e2d314eed0ba3986f0a4053166
          HELPER: .github/workflows/phase-152-c03e-qf-transient-materializer.yml
          BLOCK_B64: 
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse "HEAD:$SOURCE")" = "$SOURCE_BLOB"

          mapfile -t pre_paths < <(git diff --name-only "$BASE..HEAD")
          test "${#pre_paths[@]}" -eq 1
          test "${pre_paths[0]}" = "$HELPER"

          target='pub(crate) async fn run_with_production_durable_reachability_remote_process_companion_with_fallible_verifier_time_completion_projection_from_production_sources<'
          error_target='pub(crate) enum LinuxAgentProductionDurableReachabilityFallibleVerifierTimePopulationCompanionError'
          population='pub(crate) async fn linux_agent_production_durable_reachability_remote_process_operation_inputs_from_production_sources_with_fail_closed_current_capability_authority<'
          companion='pub(crate) fn run_with_production_durable_reachability_remote_process_companion_with_fallible_verifier_time_completion_projection<'
          marker='/// Builds one dormant production operation that retains durable capability-authority custody.'

          test "$(grep -cF "$target" "$SOURCE" || true)" -eq 0
          test "$(grep -cF "$error_target" "$SOURCE" || true)" -eq 0
          test "$(grep -cF "$population" "$SOURCE" || true)" -eq 1
          test "$(grep -cF "$companion" "$SOURCE" || true)" -eq 1
          test "$(grep -cF "$marker" "$SOURCE" || true)" -eq 1

          printf '%s' "$BLOCK_B64" | base64 -d > /tmp/qf-block.rs
          python3 - "$SOURCE" /tmp/qf-block.rs <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          block = Path(sys.argv[2]).read_text(encoding="utf-8")
          text = source.read_text(encoding="utf-8")
          marker = "/// Builds one dormant production operation that retains durable capability-authority custody."
          target = "pub(crate) async fn run_with_production_durable_reachability_remote_process_companion_with_fallible_verifier_time_completion_projection_from_production_sources<"
          error_target = "pub(crate) enum LinuxAgentProductionDurableReachabilityFallibleVerifierTimePopulationCompanionError"
          population = "pub(crate) async fn linux_agent_production_durable_reachability_remote_process_operation_inputs_from_production_sources_with_fail_closed_current_capability_authority<"
          companion = "pub(crate) fn run_with_production_durable_reachability_remote_process_companion_with_fallible_verifier_time_completion_projection<"
          assert text.count(marker) == 1
          assert text.count(target) == 0
          assert text.count(error_target) == 0
          assert text.count(population) == 1
          assert text.count(companion) == 1
          source.write_text(text.replace(marker, block + "\n" + marker, 1), encoding="utf-8")
          PY

          rustup component add rustfmt
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

          test "$(grep -cF "$target" "$SOURCE" || true)" -eq 1
          test "$(grep -cF "$error_target" "$SOURCE" || true)" -eq 1
          test "$(grep -cF "$population" "$SOURCE" || true)" -eq 2
          test "$(grep -cF "$companion" "$SOURCE" || true)" -eq 2

          git diff --unified=0 -- "$SOURCE" | grep '^+' | grep -v '^+++' > /tmp/qf-added-lines.txt || true
          if grep -E 'Arc::(new|clone)|SharedRequesterRendezvousAuthority|requester_rendezvous|sender\.send|mpsc::channel|current_prwa_verifier_unix_seconds|authorize_capability_transaction|block_on' /tmp/qf-added-lines.txt; then
            echo "forbidden selected-boundary widening detected" >&2
            exit 1
          fi

          mapfile -t source_paths < <(git diff --name-only)
          test "${#source_paths[@]}" -eq 1
          test "${source_paths[0]}" = "$SOURCE"

          git add "$SOURCE"
          git commit -m "C03e-QF: materialize fallible verifier-time production-source population companion composition"

          git rm "$HELPER"
          git commit -m "C03e-QF: remove transient one-path materializer"

          test ! -e "$HELPER"
          mapfile -t final_paths < <(git diff --name-only "$BASE..HEAD")
          test "${#final_paths[@]}" -eq 1
          test "${final_paths[0]}" = "$SOURCE"

          git push origin HEAD:"$BRANCH"
