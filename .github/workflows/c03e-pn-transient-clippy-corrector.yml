name: C03e-PN transient Clippy custody corrector

on:
  push:
    branches:
      - phase-152-c03e-pn-production-requester-rendezvous-expected-device-admission-fallible-verifier-time-repeated-real-admission-persistent-collection-source-materialization

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PN branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard and add only the PN mutable-custody lint expectation
        shell: bash
        run: |
          set -euo pipefail
          TARGET='crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs'
          EXPECTED_BLOB='eab2a9d8021800752979f1e3d1a0b42bca15d2d4'
          ACTUAL_BLOB="$(git hash-object "$TARGET")"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs')
          text = path.read_text(encoding='utf-8')
          method_marker = 'pub(super) fn drive_repeated_real_fallible_verifier_time_remote_admission_collection<'
          start_marker = '    type FallibleVerifierTimeActiveRemoteWorkers = HashMap<'
          end_marker = (
              '    impl RemoteSessionExecutorRuntime {\n'
              '        /// Drives repeated expected-device real admission and the persistent worker collection inside\n'
          )
          if text.count(method_marker) != 1 or text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('PN region markers are not unique')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          prefix, region, suffix = text[:start], text[start:end], text[end:]
          old = '            clippy::too_many_arguments,\n            clippy::too_many_lines,\n'
          new = '            clippy::too_many_arguments,\n            clippy::too_many_lines,\n            clippy::needless_pass_by_ref_mut,\n'
          if region.count(old) != 1:
              raise SystemExit(f'expected one PN lint-list anchor, found {region.count(old)}')
          corrected_region = region.replace(old, new)
          if corrected_region.count('clippy::needless_pass_by_ref_mut') != 1:
              raise SystemExit('PN mutable-custody lint expectation was not added exactly once')
          path.write_text(prefix + corrected_region + suffix, encoding='utf-8')
          PY

          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = "$TARGET"
          cargo fmt --all
          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = "$TARGET"
          cargo fmt --all -- --check
          git diff --check

      - name: Commit correction and remove transient workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          rm .github/workflows/c03e-pn-transient-clippy-corrector.yml
          git add crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs .github/workflows/c03e-pn-transient-clippy-corrector.yml
          git commit -m 'C03e-PN: preserve mutable executor custody under Clippy'
          git push origin HEAD:phase-152-c03e-pn-production-requester-rendezvous-expected-device-admission-fallible-verifier-time-repeated-real-admission-persistent-collection-source-materialization
