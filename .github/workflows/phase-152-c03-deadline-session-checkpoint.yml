name: Phase 152 C03 Deadline-Session Source Checkpoint

on:
  push:
    branches:
      - phase-152-c03-runtime-deadline-session-proof
    paths:
      - ".github/workflows/phase-152-c03-deadline-session-checkpoint.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-152-c03-deadline-session-checkpoint
  cancel-in-progress: true

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact PR-proven parent
        run: test "$(git rev-parse HEAD^)" = "8e846436d7b1d33d1786dab3d0a0edce8bf21769"

      - name: Materialize validated deadline-session source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor {old!r}, found {count}')
              p.write_text(text.replace(old, new))

          modules = Path('crates/prw-agent/src/local_commands.rs')
          text = modules.read_text()
          anchor = '#[allow(\n    dead_code,\n    reason = "C03 lock-late runtime boundary is validated before worker wiring"\n)]\npub(crate) mod management_runtime_boundary;\n'
          addition = anchor + '#[allow(\n    dead_code,\n    reason = "C03 aggregate server-state runtime proof is validated before session wiring"\n)]\npub(crate) mod management_runtime_server_connection;\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one runtime-boundary module anchor, found {text.count(anchor)}')
          modules.write_text(text.replace(anchor, addition))

          state = Path('crates/prw-agent/src/local_commands/server_connection_state.rs')
          text = state.read_text()
          pattern = re.compile(r'(?m)^    pub const fn response_write\(self\) -> LocalTerminalResponseWriteState \{\n        self\.response_write\n    \}\n')
          match = pattern.search(text)
          if match is None:
              raise SystemExit('expected response-write accessor body was not found')
          if pattern.search(text, match.end()) is not None:
              raise SystemExit('response-write accessor body is not unique')
          addition = match.group(0) + '\n    /// Borrows the authoritative component states for a crate-internal composed boundary.\n    pub(super) const fn runtime_component_states_mut(\n        &mut self,\n    ) -> (&mut LocalInboundRequestState, &mut LocalTerminalResponseWriteState) {\n        (&mut self.inbound, &mut self.response_write)\n    }\n'
          state.write_text(text[:match.start()] + addition + text[match.end():])

          proof = Path('crates/prw-agent/src/local_commands/management_runtime_server_connection.rs')
          text = proof.read_text()
          old = 'LocalTerminalResponseWriteError::Io'
          new = 'LocalTerminalResponseWriteError::Write(\n                        crate::frame_object::writer::LocalIpcFrameWriteError::HeaderIo\n                    )'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale write-error test anchor, found {text.count(old)}')
          proof.write_text(text.replace(old, new))

          session = Path('crates/prw-agent/src/linux_authenticated_session.rs')
          text = session.read_text()
          anchor = 'use crate::local_commands::status_snapshot::LocalAgentStatusSnapshot;\n'
          addition = anchor + '\n#[path = "linux_authenticated_session/management.rs"]\nmod management;\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one session module anchor, found {text.count(anchor)}')
          session.write_text(text.replace(anchor, addition))

          # Effective visibility stays crate-only because these items live behind crate-private/private modules.
          replace_one('crates/prw-agent/src/local_commands/management_authority.rs', 'pub(super) struct LocalManagementFilesystemAuthority', 'pub struct LocalManagementFilesystemAuthority')
          replace_one('crates/prw-agent/src/local_commands/management_authority.rs', 'pub(super) fn open_trusted_root(path: &Path)', 'pub fn open_trusted_root(path: &Path)')
          replace_one('crates/prw-agent/src/local_commands/management_provider_backend_policy.rs', 'pub(super) enum ExactForwardingEgressPolicyError', 'pub enum ExactForwardingEgressPolicyError')
          replace_one('crates/prw-agent/src/local_commands/management_provider_backend_policy.rs', 'pub(super) struct ExactForwardingEgressPolicy', 'pub struct ExactForwardingEgressPolicy')
          replace_one('crates/prw-agent/src/local_commands/management_provider_backend_policy.rs', 'pub(super) fn try_from_targets(', 'pub fn try_from_targets(')
          replace_one('crates/prw-agent/src/local_commands/management_provider_lifecycle.rs', 'pub(super) struct LocalManagementProviderLifecycle', 'pub struct LocalManagementProviderLifecycle')
          replace_one('crates/prw-agent/src/local_commands/management_provider_lifecycle.rs', '    pub(super) fn new(\n', '    pub fn new(\n')
          replace_one('crates/prw-agent/src/local_commands/management_runtime.rs', 'pub(super) type LocalLinuxManagementProviderLifecycle', 'pub type LocalLinuxManagementProviderLifecycle')
          replace_one('crates/prw-agent/src/local_commands/management_runtime.rs', 'pub(super) struct LocalLinuxManagementRuntimeContext', 'pub struct LocalLinuxManagementRuntimeContext')
          replace_one('crates/prw-agent/src/local_commands/management_runtime.rs', '    pub(super) const fn new(\n', '    pub const fn new(\n')
          replace_one('crates/prw-agent/src/local_commands/management_runtime_boundary.rs', 'pub(super) enum LocalManagementRuntimeBoundaryError', 'pub enum LocalManagementRuntimeBoundaryError')
          replace_one('crates/prw-agent/src/local_commands/management_runtime_server_connection.rs', 'pub(super) enum LocalManagementRuntimeServerConnectionError', 'pub enum LocalManagementRuntimeServerConnectionError')
          replace_one('crates/prw-agent/src/local_commands/management_runtime_server_connection.rs', 'pub(super) fn process_one_runtime_management_at_boundary_on_server_connection', 'pub fn process_one_runtime_management_at_boundary_on_server_connection')
          replace_one('crates/prw-agent/src/linux_authenticated_session/management.rs', 'pub(crate) enum LocalLinuxManagementDeadlineSessionProcessError', 'pub enum LocalLinuxManagementDeadlineSessionProcessError')
          replace_one('crates/prw-agent/src/linux_authenticated_session/management.rs', '    use std::io::Write;\n', '')
          PY
          cargo fmt --all

      - name: Validate Agent deadline-session checkpoint
        shell: bash
        run: |
          set +e
          export CARGO_TARGET_DIR=/tmp/prw-c03-deadline-session-checkpoint-target
          rm -rf target "$CARGO_TARGET_DIR"
          LOG_DIR=/tmp/prw-c03-deadline-session-checkpoint-logs
          mkdir -p "$LOG_DIR"

          cargo metadata --locked --no-deps --format-version 1 >"$LOG_DIR/metadata.out" 2>&1
          METADATA_RC=$?
          cargo fmt --all -- --check >"$LOG_DIR/fmt.out" 2>&1
          FMT_RC=$?
          cargo test --locked -p prw-agent >"$LOG_DIR/test.out" 2>&1
          TEST_RC=$?
          cargo clippy --locked -p prw-agent --all-targets --all-features -- -D warnings >"$LOG_DIR/clippy.out" 2>&1
          CLIPPY_RC=$?

          BASE_HEAD=$(git rev-parse HEAD)
          REPORT="logs/audits/phase-152-c03-runtime-management-integration/C03_MANAGEMENT_DEADLINE_SESSION_CHECKPOINT_${BASE_HEAD}.txt"
          mkdir -p "$(dirname "$REPORT")"
          {
            echo "BASE_HEAD=$BASE_HEAD"
            echo "PR_PROOF_HEAD=8e846436d7b1d33d1786dab3d0a0edce8bf21769"
            echo "PR_PROOF_RUN=32237384582"
            echo "SERVER_STATE_EVIDENCE=065af6024c7da36ee4d7f07342db1c6fd4dd9fae"
            echo "LEGACY_DEADLINE_API_CHANGED=NO"
            echo "MANAGEMENT_METHOD_VISIBILITY=pub(crate)"
            echo "ASSEMBLY_EFFECTIVE_VISIBILITY=crate-only"
            echo "MANAGEMENT_LOCK_BEFORE_CLASSIFICATION=NO"
            echo "METADATA_RC=$METADATA_RC"
            echo "FMT_RC=$FMT_RC"
            echo "TEST_RC=$TEST_RC"
            echo "CLIPPY_RC=$CLIPPY_RC"
            echo "--- TEST_TAIL ---"
            tail -n 180 "$LOG_DIR/test.out"
            echo "--- CLIPPY_TAIL ---"
            tail -n 160 "$LOG_DIR/clippy.out"
          } > "$REPORT"

          if [ "$METADATA_RC" -eq 0 ] && [ "$FMT_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ] && [ "$CLIPPY_RC" -eq 0 ]; then
            echo 'STATUS=PASS' >> "$REPORT"
            echo 'VALIDATION_STATUS=PASS' >> "$GITHUB_ENV"
          else
            echo 'STATUS=FAIL' >> "$REPORT"
            echo 'VALIDATION_STATUS=FAIL' >> "$GITHUB_ENV"
          fi

      - name: Commit checkpoint evidence
        shell: bash
        run: |
          BASE_HEAD=$(git rev-parse HEAD)
          REMOTE_HEAD=$(git ls-remote origin refs/heads/phase-152-c03-runtime-deadline-session-proof | cut -f1)
          test "$REMOTE_HEAD" = "$BASE_HEAD"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/prw-agent/src/local_commands.rs \
            crates/prw-agent/src/local_commands/server_connection_state.rs \
            crates/prw-agent/src/local_commands/management_authority.rs \
            crates/prw-agent/src/local_commands/management_provider_backend_policy.rs \
            crates/prw-agent/src/local_commands/management_provider_lifecycle.rs \
            crates/prw-agent/src/local_commands/management_runtime.rs \
            crates/prw-agent/src/local_commands/management_runtime_boundary.rs \
            crates/prw-agent/src/local_commands/management_runtime_server_connection.rs \
            crates/prw-agent/src/linux_authenticated_session.rs \
            crates/prw-agent/src/linux_authenticated_session/management.rs \
            logs/audits/phase-152-c03-runtime-management-integration/
          if [ "$VALIDATION_STATUS" = PASS ]; then
            git rm .github/workflows/phase-152-c03-deadline-session-checkpoint.yml
            git rm .github/workflows/phase-152-c03-deadline-session-pr-proof.yml
            git commit -m "phase 152 c03: checkpoint management deadline-session ${BASE_HEAD:0:12}"
          else
            git add .github/workflows/phase-152-c03-deadline-session-checkpoint.yml
            git commit -m "phase 152 c03: record management deadline-session checkpoint failure ${BASE_HEAD:0:12}"
          fi
          git push origin HEAD:phase-152-c03-runtime-deadline-session-proof

      - name: Fail on validation failure
        if: env.VALIDATION_STATUS != 'PASS'
        run: exit 1
