name: PRW Phase 152 C02e Tranche 1 Final Validation Transport

on:
  push:
    branches:
      - phase-152-c02e-dynamic-reachability-design
    paths:
      - '.github/workflows/phase-152-c02e-freshness-reference-clippy-corrective.yml'

permissions:
  contents: write

concurrency:
  group: prw-phase-152-c02e-tranche1-final-transport
  cancel-in-progress: true

jobs:
  validate:
    name: Validate current C02e source with zero dependency mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Run authoritative Tranche 1 sequence
        id: validation
        shell: bash
        run: |
          set -u -o pipefail
          REPORT="logs/audits/phase-152-c02e-dynamic-reachability-design/C02E_TRANCHE1_GITHUB_VALIDATION_${GITHUB_SHA}.txt"
          mkdir -p "$(dirname "${REPORT}")"; : > "${REPORT}"
          overall=0; first_failure=""
          record(){ printf '%s\n' "$*" | tee -a "${REPORT}"; }
          gate(){
            local name="$1" command="$2"
            if [[ "${overall}" -ne 0 ]]; then record "GATE_${name}=SKIPPED_AFTER_${first_failure}"; return 0; fi
            record "===== GATE ${name} ====="
            set +e; bash -o pipefail -c "${command}" 2>&1 | tee -a "${REPORT}"; local rc=${PIPESTATUS[0]}; set -u -o pipefail
            record "GATE_${name}_RC=${rc}"
            if [[ "${rc}" -ne 0 ]]; then overall="${rc}"; first_failure="${name}"; fi
          }

          record STATUS=RUNNING
          record WORKFLOW=phase-152-c02e-tranche1-final-validation-transport
          record "RUN_ID=${GITHUB_RUN_ID}"
          record "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          record "REF=${GITHUB_REF_NAME}"
          record "HEAD=${GITHUB_SHA}"
          record "SOURCE_PARENT=$(git rev-parse HEAD^)"
          record FROZEN_C02D=857583b25ed1206317641a93fd8f927819c954d8
          record "RUNNER_OS=${RUNNER_OS}"

          gate lineage "test \"${GITHUB_REF_NAME}\" = \"phase-152-c02e-dynamic-reachability-design\" && test \"$(git rev-parse HEAD)\" = \"${GITHUB_SHA}\" && git merge-base --is-ancestor 857583b25ed1206317641a93fd8f927819c954d8 HEAD && test \"$(git merge-base 857583b25ed1206317641a93fd8f927819c954d8 HEAD)\" = \"857583b25ed1206317641a93fd8f927819c954d8\""
          gate native_prerequisites "sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libgtk-4-dev libadwaita-1-dev && pkg-config --modversion gtk4 && pkg-config --modversion libadwaita-1"
          gate toolchain "rustc --version && cargo --version && rustfmt --version && cargo clippy --version"

          record '===== PRE_VALIDATION_HASHES ====='
          sha256sum Cargo.toml Cargo.lock crates/prw-agent/Cargo.toml crates/prw-remote-bridge/Cargo.toml | tee "${RUNNER_TEMP}/c02e-tranche1-pre.sha256" | tee -a "${REPORT}"
          cp Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"

          gate locked_metadata "cargo metadata --locked --no-deps --format-version 1 > /dev/null && git diff --exit-code -- Cargo.toml Cargo.lock crates/prw-agent/Cargo.toml crates/prw-remote-bridge/Cargo.toml"
          gate focused_fmt "cargo fmt --all -- --check"
          gate focused_clippy "cargo clippy --locked -p prw-connectivity -p prw-remote-bridge --all-targets --all-features -- -D warnings"
          gate focused_connectivity_tests "cargo test --locked -p prw-connectivity --all-targets"
          gate focused_remote_bridge_tests "cargo test --locked -p prw-remote-bridge --all-targets"
          gate locked_metadata_recheck "cargo metadata --locked --no-deps --format-version 1 > /dev/null && cmp -s \"${RUNNER_TEMP}/Cargo.lock.before\" Cargo.lock && git diff --exit-code -- Cargo.toml Cargo.lock crates/prw-agent/Cargo.toml crates/prw-remote-bridge/Cargo.toml"
          gate workspace_fmt "cargo fmt --all -- --check"
          gate workspace_clippy "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"
          gate workspace_tests "cargo test --locked --workspace --all-targets"
          gate workspace_build "cargo build --locked --workspace --all-targets"

          record '===== POST_VALIDATION_HASHES ====='
          sha256sum Cargo.toml Cargo.lock crates/prw-agent/Cargo.toml crates/prw-remote-bridge/Cargo.toml | tee "${RUNNER_TEMP}/c02e-tranche1-post.sha256" | tee -a "${REPORT}"
          drift_rc=0
          diff -u "${RUNNER_TEMP}/c02e-tranche1-pre.sha256" "${RUNNER_TEMP}/c02e-tranche1-post.sha256" >> "${REPORT}" 2>&1 || drift_rc=$?
          cmp -s "${RUNNER_TEMP}/Cargo.lock.before" Cargo.lock || drift_rc=$?
          git diff --exit-code -- Cargo.toml Cargo.lock crates/prw-agent/Cargo.toml crates/prw-remote-bridge/Cargo.toml >> "${REPORT}" 2>&1 || drift_rc=$?
          record "ZERO_DEPENDENCY_DRIFT_RC=${drift_rc}"
          if [[ "${drift_rc}" -ne 0 && "${overall}" -eq 0 ]]; then overall="${drift_rc}"; first_failure=dependency_source_drift; fi
          record RUNTIME_NETWORK_ACTIVATION=NONE
          if [[ "${overall}" -eq 0 ]]; then record STATUS=PASS; record FIRST_FAILURE=NONE; else record STATUS=FAIL; record "FIRST_FAILURE=${first_failure}"; fi
          record "VALIDATION_RC=${overall}"
          echo "validation_rc=${overall}" >> "${GITHUB_OUTPUT}"
          echo "report=${REPORT}" >> "${GITHUB_OUTPUT}"

      - name: Commit validation evidence only
        if: always()
        shell: bash
        env:
          REPORT: ${{ steps.validation.outputs.report }}
        run: |
          set -euo pipefail
          test -n "${REPORT}"; test -f "${REPORT}"
          git restore --source=HEAD -- Cargo.lock target/.rustc_info.json 2>/dev/null || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${REPORT}"
          git diff --cached --check
          git commit -m "phase 152 c02e: record final tranche1 validation ${GITHUB_SHA::12}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Surface validation result
        if: always()
        shell: bash
        env:
          VALIDATION_RC: ${{ steps.validation.outputs.validation_rc }}
        run: |
          set -euo pipefail
          test -n "${VALIDATION_RC}"; test "${VALIDATION_RC}" -eq 0
