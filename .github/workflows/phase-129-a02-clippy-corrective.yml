name: Phase 129 A02 Clippy Corrective

on:
  push:
    paths:
      - '.github/workflows/phase-129-a02-clippy-corrective.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Clippy correctives within Phase 129 boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/prw-control-transport/src/lib.rs')
          text = lib.read_text()
          old = 'fn validate_timeout(timeout: Duration) -> Result<(), ControlTransportError> {'
          new = 'const fn validate_timeout(timeout: Duration) -> Result<(), ControlTransportError> {'
          if text.count(old) != 1:
              raise SystemExit('validate_timeout replacement count mismatch')
          lib.write_text(text.replace(old, new))

          test = Path('crates/prw-control-transport/tests/tls_loopback.rs')
          text = test.read_text()
          old = '    net::{TcpListener, TcpStream},\n'
          new = '    net::TcpListener,\n'
          if text.count(old) != 1:
              raise SystemExit('TcpStream import replacement count mismatch')
          test.write_text(text.replace(old, new))
          PY
          cargo fmt --all -- --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' \
            crates/prw-control-transport/src/lib.rs \
            crates/prw-control-transport/tests/tls_loopback.rs | sort > /tmp/expected
          cmp -s /tmp/actual /tmp/expected
          git diff --check
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          git add -- "${changed[@]}"
          git commit -m 'phase 129 a02: satisfy Clippy transport lints'
          git push origin HEAD:main
          echo 'phase129_a02_corrective=pass'
