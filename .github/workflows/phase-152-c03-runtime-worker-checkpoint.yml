name: Phase 152 C03 Runtime Worker Checkpoint

on:
  push:
    branches:
      - phase-152-c03-runtime-worker-proof

permissions:
  contents: write

concurrency:
  group: phase-152-c03-runtime-worker-checkpoint
  cancel-in-progress: true

jobs:
  checkpoint-worker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact proof head
        run: |
          set -euo pipefail
          SOURCE_PARENT=43747c433216d7c2829af0ec6f96d5f9a7ecd882
          BASE_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${SOURCE_PARENT}"
          REMOTE_HEAD="$(git ls-remote origin refs/heads/phase-152-c03-runtime-worker-proof | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${BASE_HEAD}"
          echo "BASE_HEAD=${BASE_HEAD}" >> "$GITHUB_ENV"

      - name: Materialize validated worker source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('crates/prw-agent/src/linux_session_worker.rs')
          text = worker.read_text()
          anchor = 'use crate::local_commands::status_snapshot::LocalAgentStatusSnapshot;\n'
          declaration = '#[path = "linux_session_worker/management.rs"]\nmod management;\n'
          if declaration not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one worker module anchor, found {text.count(anchor)}')
              text = text.replace(anchor, anchor + '\n' + declaration)
          worker.write_text(text)

          proof = Path('crates/prw-agent/src/linux_session_worker/management.rs')
          text = proof.read_text()
          replacements = [
              ('pub(crate) enum LocalLinuxManagementSessionWorkerError', 'pub(super) enum LocalLinuxManagementSessionWorkerError'),
              ('pub(crate) fn run_authenticated_session_worker_with_management', 'pub(super) fn run_authenticated_session_worker_with_management'),
          ]
          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'expected one visibility anchor {old!r}, found {text.count(old)}')
                  text = text.replace(old, new)
              elif text.count(new) != 1:
                  raise SystemExit(f'validated visibility not found for {new!r}')
          proof.write_text(text)
          PY
          cargo fmt --all

      - name: Validate worker checkpoint
        run: |
          set +e
          export CARGO_TARGET_DIR="${RUNNER_TEMP}/prw-c03-runtime-worker-checkpoint-target"
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          METADATA_RC=$?
          cargo fmt --all -- --check
          FMT_RC=$?
          cargo test --locked -p prw-agent --all-targets
          TEST_RC=$?
          cargo clippy --locked -p prw-agent --all-targets --all-features -- -D warnings
          CLIPPY_RC=$?
          cargo build --locked -p prw-agent --all-targets --all-features
          BUILD_RC=$?
          set -e

          REPORT="logs/audits/phase-152-c03-runtime-management-integration/C03_RUNTIME_WORKER_CHECKPOINT_${BASE_HEAD}.txt"
          mkdir -p "$(dirname "${REPORT}")"
          {
            echo "PHASE=152"
            echo "SLICE=C03"
            echo "TRANCHE=RUNTIME_MANAGEMENT_WORKER"
            echo "BASE_HEAD=${BASE_HEAD}"
            echo "SOURCE_PARENT=43747c433216d7c2829af0ec6f96d5f9a7ecd882"
            echo "PR_PROOF_RUN=32240460154"
            echo "PR_PROOF_FOCUSED_TESTS=PASS"
            echo "PR_PROOF_AGENT_CLIPPY=PASS"
            echo "EXISTING_PUBLIC_WORKER_CHANGED=NO"
            echo "MANAGEMENT_WORKER_VISIBILITY=pub(super)"
            echo "WORKER_PERMIT_RAII=PRESERVED"
            echo "REQUEST_BUDGET_SEMANTICS=PRESERVED"
            echo "READ_DEADLINE_SEMANTICS=PRESERVED"
            echo "DEFERRED_WRITE_DEADLINE_SEMANTICS=PRESERVED"
            echo "MANAGEMENT_LOCK_BEFORE_CLASSIFICATION=NO"
            echo "SCHEDULER_ACTIVATION=NO"
            echo "BOOTSTRAP_ACTIVATION=NO"
            echo "METADATA_RC=${METADATA_RC}"
            echo "FMT_RC=${FMT_RC}"
            echo "TEST_RC=${TEST_RC}"
            echo "CLIPPY_RC=${CLIPPY_RC}"
            echo "BUILD_RC=${BUILD_RC}"
          } > "${REPORT}"

          if [ "${METADATA_RC}" -eq 0 ] && [ "${FMT_RC}" -eq 0 ] && [ "${TEST_RC}" -eq 0 ] && [ "${CLIPPY_RC}" -eq 0 ] && [ "${BUILD_RC}" -eq 0 ]; then
            echo "STATUS=PASS" >> "${REPORT}"
            echo "CHECKPOINT_STATUS=PASS" >> "$GITHUB_ENV"
          else
            echo "STATUS=FAIL" >> "${REPORT}"
            echo "CHECKPOINT_STATUS=FAIL" >> "$GITHUB_ENV"
          fi
          echo "REPORT=${REPORT}" >> "$GITHUB_ENV"

      - name: Preserve exact-head evidence
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/phase-152-c03-runtime-worker-proof | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${BASE_HEAD}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${CHECKPOINT_STATUS}" = "PASS" ]; then
            rm -f .github/workflows/phase-152-c03-runtime-worker-pr-proof.yml
            rm -f .github/workflows/phase-152-c03-runtime-worker-checkpoint.yml
            git add crates/prw-agent/src/linux_session_worker.rs
            git add crates/prw-agent/src/linux_session_worker/management.rs
            git add "${REPORT}"
            git add -u .github/workflows
          else
            cp "${REPORT}" "${RUNNER_TEMP}/worker-report.txt"
            git reset --hard "${BASE_HEAD}"
            mkdir -p "$(dirname "${REPORT}")"
            cp "${RUNNER_TEMP}/worker-report.txt" "${REPORT}"
            git add "${REPORT}"
          fi

          git diff --cached --quiet && exit 1
          git commit -m "phase 152 c03: checkpoint management worker ${BASE_HEAD:0:12}"
          git push origin HEAD:phase-152-c03-runtime-worker-proof

          if [ "${CHECKPOINT_STATUS}" != "PASS" ]; then
            exit 1
          fi
