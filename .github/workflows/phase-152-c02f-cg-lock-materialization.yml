name: Phase 152 C02f-CG Lock Materialization

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - phase-152-c02f-cf-agent-authority-bootstrap-composition-source-materialization-staging

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'phase-152-c02f-cg-agent-reachability-custody-bootstrap-facade-source-materialization-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact CG head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize exact allowed lock delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import subprocess

          path = Path("Cargo.lock")
          before = path.read_text()
          dep_line = ' "prw-reachability-custody",\n'
          marker = '[[package]]\nname = "prw-agent"\n'
          start = before.index(marker)
          end = before.index('\n[[package]]', start + len(marker))
          before_agent = before[start:end]

          if dep_line in before_agent:
              after = before
          else:
              insertion = ' "prw-policy",\n "prw-registry",\n'
              if before_agent.count(insertion) != 1:
                  raise SystemExit("unique prw-agent lock insertion point missing")
              after_agent = before_agent.replace(
                  insertion,
                  ' "prw-policy",\n "prw-reachability-custody",\n "prw-registry",\n',
                  1,
              )
              after = before[:start] + after_agent + before[end:]
              path.write_text(after)

          diff = list(difflib.ndiff(before.splitlines(keepends=True), after.splitlines(keepends=True)))
          added = [line[2:] for line in diff if line.startswith('+ ')]
          removed = [line[2:] for line in diff if line.startswith('- ')]
          if before != after and (removed or added != [dep_line]):
              raise SystemExit(
                  f"Cargo.lock drift exceeds one authorized line: added={added!r} removed={removed!r}"
              )

          after_start = after.index(marker)
          after_end = after.index('\n[[package]]', after_start + len(marker))
          if dep_line not in after[after_start:after_end]:
              raise SystemExit("CG dependency line absent from prw-agent lock block")

          custody_marker = '[[package]]\nname = "prw-reachability-custody"\n'
          before_start = before.index(custody_marker)
          before_end = before.index('\n[[package]]', before_start + len(custody_marker))
          after_start = after.index(custody_marker)
          after_end = after.index('\n[[package]]', after_start + len(custody_marker))
          if before[before_start:before_end] != after[after_start:after_end]:
              raise SystemExit("existing prw-reachability-custody package entry drifted")
          PY
          git diff --no-ext-diff -- Cargo.lock
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          git diff --exit-code -- . ':!Cargo.lock'

      - name: Commit lock materialization when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "CG lock already materialized"
            exit 0
          fi
          git add Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "phase 152 c02f-cg: materialize agent custody lock dependency"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
