name: Phase 152 C02f-CG Lock Materialization

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - phase-152-c02f-cf-agent-authority-bootstrap-composition-source-materialization-staging

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'phase-152-c02f-cg-agent-reachability-custody-bootstrap-facade-source-materialization-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact CG head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize exact allowed lock delta
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --no-deps > /dev/null
          git diff --no-ext-diff -- Cargo.lock || true
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import subprocess

          before = subprocess.check_output(["git", "show", "HEAD:Cargo.lock"], text=True)
          after = Path("Cargo.lock").read_text()
          dep_line = ' "prw-reachability-custody",\n'

          if before == after:
              marker = '[[package]]\nname = "prw-agent"\n'
              start = after.index(marker)
              end = after.index('\n[[package]]', start + len(marker))
              if dep_line not in after[start:end]:
                  raise SystemExit("CG dependency is absent but cargo metadata produced no lock delta")
          else:
              diff = list(difflib.ndiff(before.splitlines(keepends=True), after.splitlines(keepends=True)))
              added = [line[2:] for line in diff if line.startswith('+ ')]
              removed = [line[2:] for line in diff if line.startswith('- ')]
              if removed or added != [dep_line]:
                  raise SystemExit(
                      f"Cargo.lock drift exceeds one authorized line: added={added!r} removed={removed!r}"
                  )

              marker = '[[package]]\nname = "prw-agent"\n'
              start = after.index(marker)
              end = after.index('\n[[package]]', start + len(marker))
              if dep_line not in after[start:end]:
                  raise SystemExit("authorized dependency line was not added inside prw-agent lock block")

          cargo_marker = '[[package]]\nname = "prw-reachability-custody"\n'
          before_start = before.index(cargo_marker)
          before_end = before.index('\n[[package]]', before_start + len(cargo_marker))
          after_start = after.index(cargo_marker)
          after_end = after.index('\n[[package]]', after_start + len(cargo_marker))
          if before[before_start:before_end] != after[after_start:after_end]:
              raise SystemExit("existing prw-reachability-custody package entry drifted")
          PY
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          git diff --exit-code -- . ':!Cargo.lock'

      - name: Commit lock materialization when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "CG lock already materialized"
            exit 0
          fi
          git add Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "phase 152 c02f-cg: materialize agent custody lock dependency"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
