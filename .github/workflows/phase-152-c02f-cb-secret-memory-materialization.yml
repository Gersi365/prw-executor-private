name: Phase 152 C02f-CB guarded secret-memory materialization

on:
  pull_request:
    branches:
      - phase-152-c02f-ca-reachability-bootstrap-custody-secret-memory-selection-staging
    paths:
      - crates/prw-control-plane/Cargo.toml
      - crates/prw-control-plane/src/reachability_acquisition_evidence/bootstrap.rs
      - Cargo.lock
      - contracts/DESKTOP_FUNCTIONAL_MANAGEMENT_SLICE_C02F_CB_CONTROL_PLANE_ROLE_PRIVATE_KEY_ZEROIZATION_SOURCE_HARDENING_STAGING.md
      - .github/workflows/phase-152-c02f-cb-secret-memory-materialization.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'phase-152-c02f-cb-control-plane-role-private-key-zeroization-source-hardening-staging'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: phase-152-c02f-cb-control-plane-role-private-key-zeroization-source-hardening-staging
          fetch-depth: 0

      - name: Apply exact zeroization hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('crates/prw-control-plane/Cargo.toml')
          text = manifest.read_text()
          needle = 'prw-core = { path = "../prw-core" }\n'
          replacement = needle + 'zeroize = "=1.9.0"\n'
          if 'zeroize = "=1.9.0"' not in text:
              if text.count(needle) != 1:
                  raise SystemExit('unexpected control-plane manifest anchor')
              text = text.replace(needle, replacement, 1)
              manifest.write_text(text)

          source = Path('crates/prw-control-plane/src/reachability_acquisition_evidence/bootstrap.rs')
          text = source.read_text()

          replacements = [
              (
                  'use etcd_client::{Certificate, Client, ConnectOptions, Identity, TlsOptions};\n\nuse super::ReachabilityLiveOwnerAcquisitionPreparation;',
                  'use etcd_client::{Certificate, Client, ConnectOptions, Identity, TlsOptions};\nuse zeroize::Zeroizing;\n\nuse super::ReachabilityLiveOwnerAcquisitionPreparation;',
              ),
              (
                  '    private_key_pem: Vec<u8>,',
                  '    private_key_pem: Zeroizing<Vec<u8>>,',
              ),
              (
                  '        let private_key_pem = private_key_pem.into();\n        if !contains_non_whitespace(&private_key_pem) {',
                  '        let private_key_pem = Zeroizing::new(private_key_pem.into());\n        if !contains_non_whitespace(private_key_pem.as_slice()) {',
              ),
              (
                  '        if live_owner_identity.private_key_pem == fence_allocator_identity.private_key_pem {\n            return Err(ReachabilityLiveOwnerEtcdBootstrapConfigError::ReusedPrivateKey);\n        }',
                  '        if live_owner_identity.private_key_pem.as_slice()\n            == fence_allocator_identity.private_key_pem.as_slice()\n        {\n            return Err(ReachabilityLiveOwnerEtcdBootstrapConfigError::ReusedPrivateKey);\n        }',
              ),
          ]

          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected bootstrap anchor: {old[:80]!r}')
              text = text.replace(old, new, 1)

          source.write_text(text)
          PY

          cargo generate-lockfile
          cargo fmt --all

      - name: Guard exact materialized delta
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git diff --name-only | sort)
          expected=(
            Cargo.lock
            crates/prw-control-plane/Cargo.toml
            crates/prw-control-plane/src/reachability_acquisition_evidence/bootstrap.rs
          )
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${files[$i]}" = "${expected[$i]}"
          done

          test "$(git diff --numstat -- Cargo.lock)" = $'1\t0\tCargo.lock'
          git diff -- Cargo.lock | grep -F '+ "zeroize",'
          git diff -- Cargo.lock | grep -F 'name = "prw-control-plane"' -B 30 -A 30 >/dev/null

          git diff -- crates/prw-control-plane/Cargo.toml | grep -F '+zeroize = "=1.9.0"'
          git diff -- crates/prw-control-plane/src/reachability_acquisition_evidence/bootstrap.rs | grep -F '+use zeroize::Zeroizing;'
          git diff -- crates/prw-control-plane/src/reachability_acquisition_evidence/bootstrap.rs | grep -F '+    private_key_pem: Zeroizing<Vec<u8>>,'
          git diff -- crates/prw-control-plane/src/reachability_acquisition_evidence/bootstrap.rs | grep -F '+        let private_key_pem = Zeroizing::new(private_key_pem.into());'

          ! git diff -- crates/prw-control-plane/src/reachability_acquisition_evidence/bootstrap.rs | grep -F '+    pub fn private_key'
          ! git diff -- crates/prw-control-plane/src/reachability_acquisition_evidence/bootstrap.rs | grep -F '+#[derive(Clone'

          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check

      - name: Commit exact materialization
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo 'no materialization needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/prw-control-plane/Cargo.toml crates/prw-control-plane/src/reachability_acquisition_evidence/bootstrap.rs
          git commit -m 'phase 152 c02f-cb: harden role private-key zeroization'
          git push origin HEAD:phase-152-c02f-cb-control-plane-role-private-key-zeroization-source-hardening-staging
