name: PRW Phase 152 Inherited Lock Probe

on:
  push:
    branches:
      - phase-152-c02e-dynamic-reachability-design
    paths:
      - '.github/workflows/phase-152-inherited-lock-reconciliation-probe.yml'

permissions:
  contents: write

concurrency:
  group: prw-phase-152-inherited-lock-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Probe lock candidate and capture result
        id: probe
        shell: bash
        run: |
          set -u -o pipefail
          BASE_HEAD="$(git rev-parse HEAD)"
          REPORT="logs/audits/phase-152-c02e-dynamic-reachability-design/C02E_INHERITED_LOCK_PROBE_${BASE_HEAD}.txt"
          mkdir -p "$(dirname "${REPORT}")"
          : > "${REPORT}"
          overall=0
          failure=NONE
          record() { printf '%s\n' "$*" | tee -a "${REPORT}"; }
          fail() { if [[ "${overall}" -eq 0 ]]; then overall=1; failure="$1"; fi; record "FAILURE_${1}=1"; }

          record STATUS=RUNNING
          record "BASE_HEAD=${BASE_HEAD}"
          record "RUN_ID=${GITHUB_RUN_ID}"
          record "GITHUB_SHA=${GITHUB_SHA}"
          [[ "${BASE_HEAD}" = "${GITHUB_SHA}" ]] || fail checkout_head_mismatch
          [[ "${GITHUB_REF_NAME}" = "phase-152-c02e-dynamic-reachability-design" ]] || fail wrong_branch
          git merge-base --is-ancestor 857583b25ed1206317641a93fd8f927819c954d8 HEAD || fail c02d_not_ancestor

          rustc --version 2>&1 | tee -a "${REPORT}" || fail rustc_version
          cargo --version 2>&1 | tee -a "${REPORT}" || fail cargo_version
          cp Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"
          cp target/.rustc_info.json "${RUNNER_TEMP}/rustc_info.before.json"
          record "LOCK_BEFORE_SHA256=$(sha256sum Cargo.lock | awk '{print $1}')"

          python3 - <<'PY' || exit 70
          import json, tomllib
          from pathlib import Path
          d=tomllib.loads(Path('Cargo.lock').read_text())
          ext=sorted((p['name'],p['version'],p.get('source'),p.get('checksum')) for p in d['package'] if p.get('source') is not None)
          ident=sorted((p['name'],p['version']) for p in d['package'] if p.get('source') is None)
          deps={p['name']:sorted(p.get('dependencies',[])) for p in d['package'] if p.get('source') is None}
          Path('/tmp/ext-before.json').write_text(json.dumps(ext,sort_keys=True))
          Path('/tmp/ident-before.json').write_text(json.dumps(ident,sort_keys=True))
          Path('/tmp/deps-before.json').write_text(json.dumps(deps,sort_keys=True))
          PY

          if [[ "${overall}" -eq 0 ]]; then
            set +e
            cargo metadata --format-version 1 > /dev/null 2> "${RUNNER_TEMP}/metadata.stderr"
            metadata_rc=$?
            set -u -o pipefail
            record "CARGO_METADATA_RC=${metadata_rc}"
            cat "${RUNNER_TEMP}/metadata.stderr" >> "${REPORT}"
            [[ "${metadata_rc}" -eq 0 ]] || fail cargo_metadata
          fi

          if [[ "${overall}" -eq 0 ]]; then
            mapfile -t changed < <(git diff --name-only)
            record "CHANGED_PATH_COUNT=${#changed[@]}"
            printf 'CHANGED_PATH=%s\n' "${changed[@]}" | tee -a "${REPORT}"
            unexpected=0
            for path in "${changed[@]}"; do
              [[ "${path}" = Cargo.lock || "${path}" = target/.rustc_info.json ]] || unexpected=1
            done
            [[ "${unexpected}" -eq 0 ]] || fail unexpected_materialization_path
            printf '%s\n' "${changed[@]}" | grep -Fx Cargo.lock >/dev/null || fail cargo_lock_not_changed
          fi

          if [[ "${overall}" -eq 0 ]]; then
            set +e
            python3 - <<'PY' > "${RUNNER_TEMP}/semantic.out" 2>&1
          import json, tomllib
          from pathlib import Path
          be=[tuple(x) for x in json.loads(Path('/tmp/ext-before.json').read_text())]
          bi=[tuple(x) for x in json.loads(Path('/tmp/ident-before.json').read_text())]
          bd=json.loads(Path('/tmp/deps-before.json').read_text())
          d=tomllib.loads(Path('Cargo.lock').read_text())
          ae=sorted((p['name'],p['version'],p.get('source'),p.get('checksum')) for p in d['package'] if p.get('source') is not None)
          ai=sorted((p['name'],p['version']) for p in d['package'] if p.get('source') is None)
          ad={p['name']:sorted(p.get('dependencies',[])) for p in d['package'] if p.get('source') is None}
          print('EXTERNAL_REMOVED=',sorted(set(be)-set(ae)))
          print('EXTERNAL_ADDED=',sorted(set(ae)-set(be)))
          print('LOCAL_IDENTITY_REMOVED=',sorted(set(bi)-set(ai)))
          print('LOCAL_IDENTITY_ADDED=',sorted(set(ai)-set(bi)))
          changes={}
          for name in sorted(set(bd)|set(ad)):
              b=set(bd.get(name,[])); a=set(ad.get(name,[]))
              if a!=b: changes[name]={'added':sorted(a-b),'removed':sorted(b-a)}
          print('LOCAL_DEPENDENCY_CHANGES=',json.dumps(changes,sort_keys=True))
          PY
            semantic_rc=$?
            set -u -o pipefail
            cat "${RUNNER_TEMP}/semantic.out" | tee -a "${REPORT}"
            record "SEMANTIC_PROBE_RC=${semantic_rc}"
          fi

          record "LOCK_CANDIDATE_SHA256=$(sha256sum Cargo.lock | awk '{print $1}')"
          cp "${RUNNER_TEMP}/Cargo.lock.before" Cargo.lock
          cp "${RUNNER_TEMP}/rustc_info.before.json" target/.rustc_info.json
          git restore --source=HEAD -- Cargo.lock target/.rustc_info.json
          if git diff --quiet -- Cargo.lock target/.rustc_info.json; then record POST_RESTORE_AUTHORITY_STATE=UNCHANGED; else fail post_restore_drift; fi
          record STATUS=DIAGNOSTIC_ONLY_NO_LOCK_COMMIT
          record "PROBE_RC=${overall}"
          printf 'report=%s\n' "${REPORT}" >> "${GITHUB_OUTPUT}"

      - name: Commit probe evidence only
        if: always()
        shell: bash
        env:
          REPORT: ${{ steps.probe.outputs.report }}
        run: |
          set -euo pipefail
          test -n "${REPORT}"
          test -f "${REPORT}"
          git restore --source=HEAD -- Cargo.lock target/.rustc_info.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${REPORT}"
          git diff --cached --check
          git commit -m "phase 152 c02e: record inherited lock probe ${GITHUB_SHA::12}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
