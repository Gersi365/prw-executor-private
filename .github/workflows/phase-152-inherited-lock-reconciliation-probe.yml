name: PRW Phase 152 Exact Inherited Lock Materializer

on:
  push:
    branches:
      - phase-152-c02e-dynamic-reachability-design
    paths:
      - '.github/workflows/phase-152-inherited-lock-reconciliation-probe.yml'

permissions:
  contents: write

concurrency:
  group: prw-phase-152-exact-inherited-lock-materializer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Materialize exact inherited lock correction
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          BASE_HEAD="$(git rev-parse HEAD)"
          test "${BASE_HEAD}" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "phase-152-c02e-dynamic-reachability-design"
          C02D=857583b25ed1206317641a93fd8f927819c954d8
          git merge-base --is-ancestor "${C02D}" HEAD
          test "$(git merge-base "${C02D}" HEAD)" = "${C02D}"

          REPORT="logs/audits/phase-152-c02e-dynamic-reachability-design/C02E_INHERITED_LOCK_MATERIALIZATION_${BASE_HEAD}.txt"
          mkdir -p "$(dirname "${REPORT}")"
          echo "report=${REPORT}" >> "${GITHUB_OUTPUT}"
          cp Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"
          cp target/.rustc_info.json "${RUNNER_TEMP}/rustc_info.before.json"

          before_sha="$(sha256sum Cargo.lock | awk '{print $1}')"
          test "${before_sha}" = "1f42f678b8c83ee4ce6c35d30a1bf30aff1d20006f1ce9495afa5df3cf47a5dc"

          python3 - <<'PY'
          import json, tomllib
          from pathlib import Path
          d=tomllib.loads(Path('Cargo.lock').read_text())
          Path('/tmp/ext-before.json').write_text(json.dumps(sorted((p['name'],p['version'],p.get('source'),p.get('checksum')) for p in d['package'] if p.get('source') is not None),sort_keys=True))
          Path('/tmp/ident-before.json').write_text(json.dumps(sorted((p['name'],p['version']) for p in d['package'] if p.get('source') is None),sort_keys=True))
          Path('/tmp/deps-before.json').write_text(json.dumps({p['name']:sorted(p.get('dependencies',[])) for p in d['package'] if p.get('source') is None},sort_keys=True))
          PY

          cargo metadata --format-version 1 > /dev/null
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx Cargo.lock
          printf '%s\n' "${changed[@]}" | grep -Fx target/.rustc_info.json

          python3 - <<'PY' > "${RUNNER_TEMP}/semantic.out"
          import json, tomllib
          from pathlib import Path
          be=[tuple(x) for x in json.loads(Path('/tmp/ext-before.json').read_text())]
          bi=[tuple(x) for x in json.loads(Path('/tmp/ident-before.json').read_text())]
          bd=json.loads(Path('/tmp/deps-before.json').read_text())
          d=tomllib.loads(Path('Cargo.lock').read_text())
          ae=sorted((p['name'],p['version'],p.get('source'),p.get('checksum')) for p in d['package'] if p.get('source') is not None)
          ai=sorted((p['name'],p['version']) for p in d['package'] if p.get('source') is None)
          ad={p['name']:sorted(p.get('dependencies',[])) for p in d['package'] if p.get('source') is None}
          assert ae == be, 'external package identity drift'
          assert ai == bi, 'local package identity drift'
          changes={}
          for name in sorted(set(bd)|set(ad)):
              b=set(bd.get(name,[])); a=set(ad.get(name,[]))
              if a != b: changes[name]={'added':sorted(a-b),'removed':sorted(b-a)}
          expected={'prw-agent':{'added':['prw-file-service','prw-file-transfer','prw-forwarding','prw-registry','prw-session','prw-terminal'],'removed':[]}}
          assert changes == expected, f'unexpected local dependency delta: {changes}'
          print('EXTERNAL_PACKAGE_IDENTITY_DRIFT=NONE')
          print('WORKSPACE_PACKAGE_IDENTITY_DRIFT=NONE')
          print('LOCAL_DEPENDENCY_CHANGES='+json.dumps(changes,sort_keys=True))
          PY

          candidate_sha="$(sha256sum Cargo.lock | awk '{print $1}')"
          test "${candidate_sha}" = "c22b0efad4fc6e9e404ce68d182da6713296f88039338429a3af983b409b24cb"
          cargo metadata --locked --format-version 1 > /dev/null
          git diff --check -- Cargo.lock

          cp "${RUNNER_TEMP}/rustc_info.before.json" target/.rustc_info.json
          git restore --source=HEAD -- target/.rustc_info.json
          test -z "$(git diff --name-only | grep -v '^Cargo.lock$' || true)"

          {
            echo 'STATUS=PASS_TOOL_MATERIALIZED_INHERITED_LOCK_RECONCILIATION'
            echo "BASE_HEAD=${BASE_HEAD}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUSTC=$(rustc --version)"
            echo "CARGO=$(cargo --version)"
            echo "LOCK_BEFORE_SHA256=${before_sha}"
            echo "LOCK_AFTER_SHA256=${candidate_sha}"
            cat "${RUNNER_TEMP}/semantic.out"
            echo 'LOCKED_METADATA_RECHECK=PASS'
            echo 'MANIFEST_MUTATION=NONE'
            echo 'CACHE_MUTATION_COMMITTED=NO'
            echo 'LOCK_MATERIALIZER=cargo metadata --format-version 1'
          } > "${REPORT}"

      - name: Commit exact lock and evidence
        shell: bash
        env:
          REPORT: ${{ steps.materialize.outputs.report }}
        run: |
          set -euo pipefail
          test -n "${REPORT}"
          test -f "${REPORT}"
          test "$(git diff --name-only)" = "Cargo.lock"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock "${REPORT}"
          git diff --cached --check
          git commit -m "phase 152 c02e: reconcile inherited workspace lock ${GITHUB_SHA::12}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
