name: Phase 141 A05 Exact Validated State Materialization

on:
  push:
    paths:
      - '.github/workflows/phase-141-a05-materialization-validation.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact A04 validated source state idempotently
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          member = '    "crates/prw-nat-traversal",\n'
          if member not in text:
              needle = '    "crates/prw-connectivity",\n'
              if text.count(needle) != 1:
                  raise SystemExit('Phase 141 workspace insertion point mismatch')
              cargo.write_text(text.replace(needle, needle + member))

          source = Path('crates/prw-nat-traversal/src/lib.rs')
          text = source.read_text()

          old = '        datagram: TraversalDatagram,\n'
          new = '        datagram: &TraversalDatagram,\n'
          if old in text:
              if text.count(old) != 2:
                  raise SystemExit(f'expected 2 by-value datagram signatures, got {text.count(old)}')
              text = text.replace(old, new)
          elif text.count(new) != 2:
              raise SystemExit(f'expected 2 borrowed datagram signatures, got {text.count(new)}')

          old = '.handle_datagram(\n                TraversalDatagram::new('
          new = '.handle_datagram(\n                &TraversalDatagram::new('
          if old in text:
              if text.count(old) != 2:
                  raise SystemExit(f'expected 2 inline call sites, got {text.count(old)}')
              text = text.replace(old, new)
          elif text.count(new) != 2:
              raise SystemExit(f'expected 2 borrowed inline call sites, got {text.count(new)}')

          for old, new in {
              'b.handle_datagram(inbound, now)': 'b.handle_datagram(&inbound, now)',
              'a.handle_datagram(inbound, now)': 'a.handle_datagram(&inbound, now)',
          }.items():
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'unexpected call-site count for {old!r}')
                  text = text.replace(old, new)
              elif text.count(new) != 1:
                  raise SystemExit(f'expected corrected call site {new!r}')

          old = '    message::{BINDING_REQUEST, Getter, Message, TransactionId},\n'
          new = '    message::{BINDING_REQUEST, BINDING_SUCCESS, Getter, Message, TransactionId},\n'
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('STUN success import count mismatch')
              text = text.replace(old, new)
          elif text.count(new) != 1:
              raise SystemExit('corrected STUN success import missing')

          old = '#[derive(Debug, Clone, PartialEq, Eq)]\npub struct IceCredentials {'
          new = '#[derive(Clone, PartialEq, Eq)]\npub struct IceCredentials {'
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('IceCredentials derive count mismatch')
              text = text.replace(old, new)
          elif text.count(new) != 1:
              raise SystemExit('corrected IceCredentials derive missing')

          marker = '''pub struct IceCredentials {\n    ufrag: String,\n    password: String,\n}\n\nimpl IceCredentials {'''
          replacement = '''pub struct IceCredentials {\n    ufrag: String,\n    password: String,\n}\n\nimpl fmt::Debug for IceCredentials {\n    fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {\n        formatter\n            .debug_struct("IceCredentials")\n            .field("ufrag", &self.ufrag)\n            .field("password", &"<redacted>")\n            .finish()\n    }\n}\n\nimpl IceCredentials {'''
          if marker in text:
              if text.count(marker) != 1:
                  raise SystemExit('IceCredentials Debug insertion point mismatch')
              text = text.replace(marker, replacement)
          elif text.count('impl fmt::Debug for IceCredentials {') != 1:
              raise SystemExit('corrected IceCredentials Debug implementation missing')

          old = '''            let StunEvent::Message(message) = event else {\n                return Err(TraversalError::StunTransactionFailed);\n            };\n            let mut mapped = XorMappedAddress::default();'''
          new = '''            let StunEvent::Message(message) = event else {\n                return Err(TraversalError::StunTransactionFailed);\n            };\n            if message.typ != BINDING_SUCCESS {\n                return Err(TraversalError::StunTransactionFailed);\n            }\n            let mut mapped = XorMappedAddress::default();'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('STUN success guard insertion point mismatch')
              text = text.replace(old, new)
          elif text.count(new) != 1:
              raise SystemExit('corrected STUN success guard missing')

          source.write_text(text)

          test = Path('crates/prw-nat-traversal/tests/security_boundaries.rs')
          test_text = test.read_text()
          old = '''        .handle_datagram(\n            TraversalDatagram::new(local, server, invalid_response.raw)'''
          new = '''        .handle_datagram(\n            &TraversalDatagram::new(local, server, invalid_response.raw)'''
          if old in test_text:
              if test_text.count(old) != 1:
                  raise SystemExit('integration borrow corrective count mismatch')
              test_text = test_text.replace(old, new)
          elif test_text.count(new) != 1:
              raise SystemExit('corrected integration borrow call missing')
          test.write_text(test_text)
          PY

          cargo fmt --all
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > /tmp/phase141-a05-metadata.json
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          source_sha=$(sha256sum crates/prw-nat-traversal/src/lib.rs | cut -d' ' -f1)
          test_sha=$(sha256sum crates/prw-nat-traversal/tests/security_boundaries.rs | cut -d' ' -f1)
          test "$lock_sha" = 'd947c9950832933d27b397e2c411724c92c486150c0386180126e93767bb540d'
          test "$source_sha" = 'ac0433c9b94edee8d6c061af0a16becf5c99c622c1006a93c47154964c36a76b'
          echo "phase141_a05_exact_materialized_state=pass lock_sha=$lock_sha source_sha=$source_sha test_sha=$test_sha"
          git diff --check -- . ':!target'

      - name: Re-prove static Sans-I/O and security boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          source=crates/prw-nat-traversal/src/lib.rs
          for forbidden in \
            'UdpSocket' 'TcpStream' 'TcpListener' 'ToSocketAddrs' 'lookup_host' \
            'tokio::' 'std::process' 'Command::new' '/dev/net/tun' 'iptables' 'nftables'; do
            if grep -Fq "$forbidden" "$source"; then
              echo "phase141_a05_forbidden_runtime_token=$forbidden" >&2
              exit 1
            fi
          done
          grep -Fq 'MulticastDnsMode::Disabled' "$source"
          grep -Fq 'NetworkType::Udp4' "$source"
          grep -Fq 'NetworkType::Udp6' "$source"
          grep -Fq 'BINDING_SUCCESS' "$source"
          grep -Fq '<redacted>' "$source"
          grep -Fq 'RelayDeferred' "$source"
          grep -Fq 'MAX_TRAVERSAL_DATAGRAM_BYTES: usize = 2048' "$source"
          echo phase141_a05_static_security_boundary=pass

      - name: Focused Phase 141 revalidation
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-nat-traversal --all-targets --all-features -- -D warnings
          cargo test --locked -p prw-nat-traversal --all-targets
          echo phase141_a05_focused_validation=pass

      - name: Full workspace revalidation
        id: workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          source_sha=$(sha256sum crates/prw-nat-traversal/src/lib.rs | cut -d' ' -f1)
          test "$lock_sha" = 'd947c9950832933d27b397e2c411724c92c486150c0386180126e93767bb540d'
          test "$source_sha" = 'ac0433c9b94edee8d6c061af0a16becf5c99c622c1006a93c47154964c36a76b'
          echo "lock_sha=$lock_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo phase141_a05_workspace_validation=pass

      - name: Write authoritative Phase 141 materialization report
        shell: bash
        env:
          LOCK_SHA: ${{ steps.workspace.outputs.lock_sha }}
          SOURCE_SHA: ${{ steps.workspace.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          report_dir=logs/audits/phase-141-nat-traversal-connectivity-checks
          report="$report_dir/PRW-PHASE-141-NAT-TRAVERSAL-CONNECTIVITY-CHECKS-VALIDATION.txt"
          mkdir -p "$report_dir"
          cat > "$report" <<EOF
          Private Remote Workspace
          Phase 141 — NAT Traversal and Connectivity Checks

          STATUS:
          PASS / STANDARD_ICE_STUN / SANS_IO_BOUNDARY / CREDENTIAL_DEBUG_REDACTED / STUN_SUCCESS_CLASS_ENFORCED / PHASE135_SELECTOR_PRESERVED / FULL_WORKSPACE_VALIDATION_PASS / VALIDATED_STATE_MATERIALIZED / NO_PRODUCTION_NETWORK_SIDE_EFFECT

          Repository: Gersi365/prw-executor-private
          Branch: main
          Date: 2026-08-16
          Materialization source head: $GITHUB_SHA
          Authoritative materialization run: $GITHUB_RUN_ID
          Cargo.lock SHA-256: $LOCK_SHA
          prw-nat-traversal/src/lib.rs SHA-256: $SOURCE_SHA

          CONTRACT
          contracts/NAT_TRAVERSAL_CONNECTIVITY_CHECKS_CONTRACT.md

          IMPLEMENTATION
          crates/prw-nat-traversal

          DEPENDENCIES
          rtc-ice 0.20.2, rtc-stun 0.20.2, rtc-shared 0.20.2 and sansio 1.0.0 under Rust/Cargo 1.97.1. Corrective dependency probe run 31952085411 / job 95177012142 passed; scratch lock SHA-256 ad791a289eb61b6d5839d8b94d612b2e67fbd6efa837f3648766393935e6cb96.

          VALIDATION HISTORY
          Run 31952956070 / job 95179162831 passed exact graph, static security boundary, focused Clippy/tests and full workspace Clippy/tests/build. It proved 7 Phase 141 unit tests plus 2 security integration tests, including ICE credential Debug redaction and rejection of non-Binding-Success STUN responses carrying XOR-MAPPED-ADDRESS. It produced the exact validated Cargo.lock SHA-256 d947c9950832933d27b397e2c411724c92c486150c0386180126e93767bb540d and source SHA-256 ac0433c9b94edee8d6c061af0a16becf5c99c622c1006a93c47154964c36a76b. Its final push was rejected only because main advanced concurrently; no validation gate failed.

          This materialization run reapplied that exact validated state onto the current main head, verified both authoritative hashes before and after revalidation, reran focused Phase 141 validation and full workspace/all-target Clippy, tests and build, then committed only the validated workspace graph/source/report.

          SECURITY/ARCHITECTURE OUTCOME
          The traversal crate owns no socket, async runtime, DNS resolver, process, TUN/TAP, route or firewall API. Traversal datagrams are bounded to 2048 bytes. ICE credentials redact passwords from Debug. STUN discovery accepts an explicit SocketAddr only, rejects wrong-source input and requires BINDING_SUCCESS before XOR-MAPPED-ADDRESS. ICE is UDP4/UDP6 only with mDNS disabled and relay allocation deferred to Phase 142. Successful ICE selection yields only a reachability observation correlated to an existing Phase 135 CandidateId; Phase 135 remains the authoritative LocalDirect -> InternetDirect -> Relay -> Offline selector.

          PRODUCTION BOUNDARY
          No PowerCode production socket, service, Agent, key/certificate, firewall/NAT/router/TUN/TAP/route/DNS, persistent STUN/ICE/TURN traffic or relay was changed or activated.

          FINAL CLASSIFICATION
          PHASE_141_DONE / VALIDATED_STATE_MATERIALIZED / READY_FOR_PHASE_142_SOURCE_DISPOSABLE_RELAY_PROVIDER_WORK
          EOF

      - name: Commit only exact validated state and report
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check -- . ':!target'
          git config user.name Gersi365
          git config user.email Gersi365@outlook.com
          git add Cargo.toml Cargo.lock crates/prw-nat-traversal \
            logs/audits/phase-141-nat-traversal-connectivity-checks/PRW-PHASE-141-NAT-TRAVERSAL-CONNECTIVITY-CHECKS-VALIDATION.txt
          git commit -m 'phase 141: materialize validated NAT traversal state'
          git push origin HEAD:main
          echo phase141_a05_materialization=pass
