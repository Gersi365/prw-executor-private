name: Phase 152 C02e Tranche5 Const Corrective Apply

on:
  push:
    branches:
      - phase-152-c02e-dynamic-reachability-design
    paths:
      - ".github/workflows/phase-152-c02e-tranche5-const-corrective-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-152-c02e-tranche5-const-corrective-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact authoritative head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply proven one-line corrective
        shell: bash
        run: |
          set -euo pipefail
          BASE_HEAD="$GITHUB_SHA"
          BRANCH="phase-152-c02e-dynamic-reachability-design"
          SOURCE="crates/prw-remote-bridge/src/reachability_freshness_wire.rs"
          SELF=".github/workflows/phase-152-c02e-tranche5-const-corrective-apply.yml"

          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          [[ "$REMOTE_HEAD" == "$BASE_HEAD" ]]

          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/prw-remote-bridge/src/reachability_freshness_wire.rs")
          text = path.read_text()
          old = "pub fn bootstrap_token_delivery(\n"
          new = "pub const fn bootstrap_token_delivery(\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one non-const bootstrap function, found {text.count(old)}")
          if new in text:
              raise SystemExit("const corrective already present")
          path.write_text(text.replace(old, new, 1))
          PY

          mapfile -t DIFF_PATHS < <(git diff --name-only)
          [[ "${#DIFF_PATHS[@]}" -eq 1 ]]
          [[ "${DIFF_PATHS[0]}" == "$SOURCE" ]]

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SOURCE"
          git rm "$SELF"
          git commit -m "phase 152 c02e: apply proven tranche5 const corrective ${BASE_HEAD:0:12}"
          git push origin "HEAD:$BRANCH"
