name: PRW Phase 152 C02m etcd-client Dependency Probe

on:
  pull_request:
    branches:
      - phase-152-c02e-dynamic-reachability-design
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prw-phase-152-c02m-etcd-client-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate etcd-client dependency materialization
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout probe merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install etcd-client build prerequisite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y protobuf-compiler
          protoc --version

      - name: Record Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Resolve and lock dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          sha256sum Cargo.lock

      - name: Upload generated Cargo lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c02m-scoped-generated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run control-plane Clippy
        run: cargo clippy --locked -p prw-control-plane --all-targets --all-features -- -D warnings

      - name: Run control-plane tests
        run: cargo test --locked -p prw-control-plane --all-targets

      - name: Build control-plane
        run: cargo build --locked -p prw-control-plane --all-targets
