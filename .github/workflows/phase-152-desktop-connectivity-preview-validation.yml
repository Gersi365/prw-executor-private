name: Phase 152 Desktop Connectivity Preview Validation

on:
  push:
    branches:
      - phase-152-desktop-connectivity-preview
    paths:
      - "apps/desktop/src/ui.rs"
      - ".github/workflows/phase-152-desktop-connectivity-preview-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-152-desktop-connectivity-preview-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact preview head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install desktop native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev

      - name: Materialize bounded UI preview and validate app crate
        id: validation
        shell: bash
        run: |
          set -u
          BASE_HEAD="$GITHUB_SHA"
          SOURCE="apps/desktop/src/ui.rs"
          REPORT_DIR="logs/audits/phase-152-desktop-connectivity-preview"
          REPORT="$REPORT_DIR/DESKTOP_CONNECTIVITY_PREVIEW_VALIDATION_${BASE_HEAD}.txt"
          CLIPPY_LOG="${RUNNER_TEMP}/desktop-connectivity-clippy.log"
          mkdir -p "$REPORT_DIR"

          set +e
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/src/ui.rs")
          text = path.read_text()

          replacements = [
              (
                  "use gtk::glib;\nuse prw_forwarding::LoopbackFamily;",
                  "use gtk::glib;\nuse prw_connectivity::{ConnectivityPathKind, ReachabilityObservation, SelectedConnectivityPath};\nuse prw_forwarding::LoopbackFamily;",
              ),
              (
                  "    for destination in NavigationDestination::ALL.into_iter().skip(1) {\n        let page = destination_page(destination);\n        stack.add_titled(&page, Some(destination.stack_name()), destination.title());\n    }",
                  "    for destination in NavigationDestination::ALL.into_iter().skip(1) {\n        let page = destination_page(destination);\n        let scroller = gtk::ScrolledWindow::new();\n        scroller.set_hexpand(true);\n        scroller.set_vexpand(true);\n        scroller.set_policy(gtk::PolicyType::Never, gtk::PolicyType::Automatic);\n        scroller.set_child(Some(&page));\n        stack.add_titled(\n            &scroller,\n            Some(destination.stack_name()),\n            destination.title(),\n        );\n    }",
              ),
              (
                  "    page.append(&section_label(\"Live reachability\"));\n    page.append(&detail_label(\n        \"Agent-backed candidate publication and traversal activation are not enabled from this desktop branch. Unknown reachability is never rendered as connected.\",\n    ));\n\n    page.append(&section_label(\"Port forwarding intent\"));",
                  "    page.append(&section_label(\"Live reachability\"));\n    page.append(&detail_label(\n        \"Agent-backed candidate publication and traversal activation are not enabled from this desktop branch. Unknown reachability is never rendered as connected.\",\n    ));\n    let connectivity_preview = connectivity_preview_section();\n    page.append(&connectivity_preview);\n\n    page.append(&section_label(\"Port forwarding intent\"));",
              ),
              (
                  "fn section_label(title: &str) -> gtk::Label {",
                  "fn connectivity_preview_section() -> gtk::Box {\n    let section = gtk::Box::new(gtk::Orientation::Vertical, 8);\n    section.append(&section_label(\"Connectivity selection preview\"));\n    section.append(&detail_label(\n        \"Declare disposable observations below to preview the existing deterministic LocalDirect → InternetDirect → Relay → Offline selector. This does not probe the network.\",\n    ));\n\n    let local_observation = reachability_selector();\n    let internet_observation = reachability_selector();\n    let relay_observation = reachability_selector();\n    section.append(&detail_label(\"LocalDirect observation\"));\n    section.append(&local_observation);\n    section.append(&detail_label(\"InternetDirect observation\"));\n    section.append(&internet_observation);\n    section.append(&detail_label(\"Relay observation\"));\n    section.append(&relay_observation);\n\n    let result = management_result_label();\n    let result_output = result.clone();\n    let preview = gtk::Button::with_label(\"Preview selected connectivity path\");\n    preview.connect_clicked(move |_| {\n        match management::select_disposable_connectivity_path(\n            selected_reachability(&local_observation),\n            selected_reachability(&internet_observation),\n            selected_reachability(&relay_observation),\n        ) {\n            Ok(SelectedConnectivityPath::Candidate(candidate)) => result_output.set_text(&format!(\n                \"Preview selected {} from disposable declared observations. No network probe or reachability publication occurred.\",\n                connectivity_path_label(candidate.kind())\n            )),\n            Ok(SelectedConnectivityPath::Offline) => result_output.set_text(\n                \"Preview selected Offline because no declared candidate is Reachable. No network probe occurred.\",\n            ),\n            Err(_) => result_output.set_text(\n                \"Connectivity preview could not construct the bounded disposable plan. No network state was changed.\",\n            ),\n        }\n    });\n    section.append(&preview);\n    section.append(&result);\n    section\n}\n\nfn reachability_selector() -> gtk::DropDown {\n    let selector = gtk::DropDown::from_strings(&[\"Unknown\", \"Reachable\", \"Unreachable\"]);\n    selector.set_selected(0);\n    selector\n}\n\nfn selected_reachability(selector: &gtk::DropDown) -> ReachabilityObservation {\n    match selector.selected() {\n        1 => ReachabilityObservation::Reachable,\n        2 => ReachabilityObservation::Unreachable,\n        _ => ReachabilityObservation::Unknown,\n    }\n}\n\nconst fn connectivity_path_label(kind: ConnectivityPathKind) -> &'static str {\n    match kind {\n        ConnectivityPathKind::LocalDirect => \"LocalDirect\",\n        ConnectivityPathKind::InternetDirect => \"InternetDirect\",\n        ConnectivityPathKind::Relay => \"Relay\",\n    }\n}\n\nfn section_label(title: &str) -> gtk::Label {",
              ),
              (
                  '''            match (\n                resolver_address.parse::<IpAddr>(),\n                resolver_port.parse::<u16>(),\n            ) {\n                (Ok(address), Ok(port)) => Some((address, port)),\n                _ => {\n                    dns_result_output.set_text(\n                        \"Resolver must be an explicit IP plus a valid non-zero port, or both resolver fields must be empty.\",\n                    );\n                    return;\n                }\n            }\n''',
                  '''            if let (Ok(address), Ok(port)) = (\n                resolver_address.parse::<IpAddr>(),\n                resolver_port.parse::<u16>(),\n            ) {\n                Some((address, port))\n            } else {\n                dns_result_output.set_text(\n                    \"Resolver must be an explicit IP plus a valid non-zero port, or both resolver fields must be empty.\",\n                );\n                return;\n            }\n''',
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"patch guard failed for marker: {old[:80]!r}; count={text.count(old)}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          PATCH_RC=$?

          cargo fmt --all
          FMT_APPLY_RC=$?
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          METADATA_RC=$?
          cargo clippy --locked -p prw-desktop --all-targets --all-features --no-deps -- -D warnings >"$CLIPPY_LOG" 2>&1
          APP_CLIPPY_RC=$?
          cargo test --locked -p prw-desktop --all-targets
          APP_TEST_RC=$?
          cargo build --locked -p prw-desktop --all-targets
          APP_BUILD_RC=$?

          git checkout -- target
          TARGET_RESTORE_RC=$?
          set -e

          mapfile -t FINAL_DIFF < <(git diff --name-only)
          DIFF_SCOPE_RC=0
          if [[ "${#FINAL_DIFF[@]}" -ne 1 || "${FINAL_DIFF[0]:-}" != "$SOURCE" ]]; then
            DIFF_SCOPE_RC=91
          fi

          STATUS=PASS
          FIRST_FAILURE=NONE
          for pair in \
            "PATCH:$PATCH_RC" \
            "FORMAT_APPLY:$FMT_APPLY_RC" \
            "METADATA:$METADATA_RC" \
            "APP_CLIPPY:$APP_CLIPPY_RC" \
            "APP_TEST:$APP_TEST_RC" \
            "APP_BUILD:$APP_BUILD_RC" \
            "TARGET_RESTORE:$TARGET_RESTORE_RC" \
            "DIFF_SCOPE:$DIFF_SCOPE_RC"; do
            name="${pair%%:*}"
            rc="${pair##*:}"
            if [[ "$rc" -ne 0 && "$STATUS" == PASS ]]; then
              STATUS=FAIL
              FIRST_FAILURE="$name"
            fi
          done

          {
            echo "PHASE=152_DESKTOP_CONNECTIVITY_PREVIEW"
            echo "BASE_HEAD=$BASE_HEAD"
            echo "PATCH_RC=$PATCH_RC"
            echo "FMT_APPLY_RC=$FMT_APPLY_RC"
            echo "METADATA_RC=$METADATA_RC"
            echo "APP_CLIPPY_SCOPE=PRW_DESKTOP_NO_DEPS"
            echo "APP_CLIPPY_RC=$APP_CLIPPY_RC"
            echo "APP_TEST_RC=$APP_TEST_RC"
            echo "APP_BUILD_RC=$APP_BUILD_RC"
            echo "TARGET_RESTORE_RC=$TARGET_RESTORE_RC"
            echo "DIFF_SCOPE_RC=$DIFF_SCOPE_RC"
            echo "DIFF_PATHS=$(printf '%s,' "${FINAL_DIFF[@]}" | sed 's/,$//')"
            echo "CONNECTIVITY_WIDGET=GTK_DROPDOWN"
            echo "CONNECTIVITY_SELECTOR_AUTHORITY=PRW_CONNECTIVITY"
            echo "DNS_CORRECTIVE=SINGLE_MATCH_ELSE_TO_IF_LET"
            echo "MANAGEMENT_PAGES_SCROLLABLE=YES"
            echo "NETWORK_PROBING=NO"
            echo "CANDIDATE_PUBLICATION=NO"
            echo "NETWORK_RUNTIME_ACTIVATION=NO"
            echo "FIRST_FAILURE=$FIRST_FAILURE"
            echo "STATUS=$STATUS"
            if [[ "$APP_CLIPPY_RC" -ne 0 ]]; then
              echo "===== APP_CLIPPY_FAILURE_TAIL ====="
              tail -n 160 "$CLIPPY_LOG"
            fi
          } > "$REPORT"

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "base_head=$BASE_HEAD" >> "$GITHUB_OUTPUT"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"

      - name: Preserve exact-head preview evidence
        shell: bash
        env:
          STATUS: ${{ steps.validation.outputs.status }}
          BASE_HEAD: ${{ steps.validation.outputs.base_head }}
          REPORT: ${{ steps.validation.outputs.report }}
        run: |
          set -euo pipefail
          BRANCH="phase-152-desktop-connectivity-preview"
          SOURCE="apps/desktop/src/ui.rs"
          SELF=".github/workflows/phase-152-desktop-connectivity-preview-validation.yml"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          [[ "$REMOTE_HEAD" == "$BASE_HEAD" ]]

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$STATUS" == PASS ]]; then
            git add "$SOURCE" "$REPORT"
            git rm "$SELF"
            git commit -m "phase 152 desktop: validate connectivity preview ${BASE_HEAD:0:12}"
          else
            git restore "$SOURCE"
            git add "$REPORT"
            git commit -m "phase 152 desktop: record connectivity preview failure ${BASE_HEAD:0:12}"
          fi
          git push origin "HEAD:$BRANCH"

      - name: Require PASS
        run: test "${{ steps.validation.outputs.status }}" = PASS
