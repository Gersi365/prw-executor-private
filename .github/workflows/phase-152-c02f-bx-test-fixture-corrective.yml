name: Phase 152 C02f-BX guarded test fixture corrective

on:
  push:
    branches:
      - phase-152-c02f-bx-provider-client-bootstrap-source-materialization-staging
    paths:
      - .github/workflows/phase-152-c02f-bx-test-fixture-corrective.yml
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase-152-c02f-bx-test-fixture-corrective
  cancel-in-progress: false

jobs:
  correct-test-fixture:
    if: >-
      github.repository == 'Gersi365/prw-executor-private' &&
      (github.event_name == 'push' || github.event.pull_request.head.ref == 'phase-152-c02f-bx-provider-client-bootstrap-source-materialization-staging')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: phase-152-c02f-bx-provider-client-bootstrap-source-materialization-staging
          fetch-depth: 0

      - name: Replace only whitespace fixture markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/prw-control-plane/src/reachability_acquisition_evidence/bootstrap.rs")
          text = path.read_text()
          replacements = {
              "identity(7, 9),": "identity(7, 20),",
              "identity(9, 8),": "identity(20, 8),",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one fixture occurrence of {old!r}")
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Prove exact test-only delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          path = "crates/prw-control-plane/src/reachability_acquisition_evidence/bootstrap.rs"
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          if changed != [path]:
              raise SystemExit(f"unexpected changed files: {changed!r}")

          patch = subprocess.check_output(["git", "diff", "--unified=3", "--", path], text=True)
          added = [line for line in patch.splitlines() if line.startswith("+") and not line.startswith("+++")]
          removed = [line for line in patch.splitlines() if line.startswith("-") and not line.startswith("---")]
          expected_added = ["+            identity(7, 20),", "+            identity(20, 8),"]
          expected_removed = ["-            identity(7, 9),", "-            identity(9, 8),"]
          if added != expected_added or removed != expected_removed:
              raise SystemExit(
                  f"unexpected fixture patch; added={added!r}, removed={removed!r}\n{patch}"
              )
          print(patch)
          PY

      - name: Commit exact fixture corrective
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/prw-control-plane/src/reachability_acquisition_evidence/bootstrap.rs
          git commit -m "phase 152 c02f-bx: correct bootstrap test fixture markers"
          git push origin HEAD:phase-152-c02f-bx-provider-client-bootstrap-source-materialization-staging
