name: C03e-FN literal correction helper

on:
  push:
    branches:
      - phase-152-c03e-fn-literal-correction-helper-noncanonical

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-152-c03e-fn-literal-correction-helper-noncanonical
      - name: Apply exact scoped Clippy custody expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs')
          data = path.read_text(encoding='utf-8')

          old = "    #[expect(\n        clippy::too_many_arguments,\n        reason = \"C03e-FN preserves the exact explicit FL authority and borrowed-custody inputs\"\n    )]"
          new = "    #[expect(\n        clippy::needless_pass_by_ref_mut,\n        clippy::too_many_arguments,\n        reason = \"C03e-FN preserves the FM-selected mutable executor custody boundary and exact FL input surface\"\n    )]"

          assert data.count(old) == 1, data.count(old)
          corrected = data.replace(old, new)
          path.write_text(corrected, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff -- crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs
      - name: Commit corrected executor blob on helper branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/prw-agent/src/remote_session_capability_runtime/remote_session_executor_runtime.rs
          git commit -m 'Noncanonical helper: scope FN mutable-executor Clippy expectation'
          git push origin HEAD:phase-152-c03e-fn-literal-correction-helper-noncanonical
