name: Phase 142 A03 Relay Clippy Corrective

on:
  push:
    paths:
      - '.github/workflows/phase-142-a03-clippy-corrective.yml'

permissions:
  contents: write

jobs:
  correct-validate-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Prove exact A03 baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f contracts/DISPOSABLE_RELAY_PROTOCOL_SERVICE_CONTRACT.md
          test -f crates/prw-relay-service/src/lib.rs
          test -f crates/prw-relay-service/tests/security_boundaries.rs
          grep -Fq 'let received = receiver' crates/prw-relay-service/tests/security_boundaries.rs
          grep -Fq 'let mut d = DisposableRelayProvider::new(service.clone());' crates/prw-relay-service/src/lib.rs
          rustc --version | grep -Fq 'rustc 1.97.1'
          cargo --version | grep -Fq 'cargo 1.97.1'
          echo phase142_a03_baseline=pass

      - name: Apply audited Phase 142 corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > crates/prw-relay-service/Cargo.toml <<'EOF'
          [package]
          name = "prw-relay-service"
          version.workspace = true
          edition.workspace = true
          license.workspace = true
          authors.workspace = true

          [dependencies]
          prw-connectivity = { path = "../prw-connectivity" }
          prw-relay = { path = "../prw-relay" }

          [dev-dependencies]
          prw-core = { path = "../prw-core" }

          [lints]
          workspace = true
          EOF
          python3 - <<'PY'
          from pathlib import Path

          relay = Path('crates/prw-relay/src/lib.rs')
          text = relay.read_text()
          old = '#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\npub struct RelayRouteToken([u8; 32]);\n\nimpl RelayRouteToken {'
          new = '#[derive(Clone, Copy, PartialEq, Eq, Hash)]\npub struct RelayRouteToken([u8; 32]);\n\nimpl fmt::Debug for RelayRouteToken {\n    fn fmt(&self, formatter: &mut fmt::Formatter<\'_>) -> fmt::Result {\n        formatter.write_str("RelayRouteToken(<redacted>)")\n    }\n}\n\nimpl RelayRouteToken {'
          if text.count(old) != 1:
              raise SystemExit('RelayRouteToken boundary mismatch')
          relay.write_text(text.replace(old, new))

          root = Path('Cargo.toml')
          text = root.read_text()
          member = '    "crates/prw-relay-service",\n'
          if member not in text:
              anchor = '    "crates/prw-relay",\n'
              if text.count(anchor) != 1:
                  raise SystemExit('workspace member anchor mismatch')
              root.write_text(text.replace(anchor, anchor + member))

          service = Path('crates/prw-relay-service/src/lib.rs')
          text = service.read_text()
          packet_old = 'pub struct RelayRoutingPacket {\n'
          packet_new = '#[derive(PartialEq, Eq)]\npub struct RelayRoutingPacket {\n'
          if text.count(packet_old) != 1:
              raise SystemExit('RelayRoutingPacket derive boundary mismatch')
          text = text.replace(packet_old, packet_new)
          doc_old = '    /// Encodes the fixed Phase 142 routing envelope.\n    #[must_use]\n    pub fn encode(&self) -> Vec<u8> {'
          doc_new = '    /// Encodes the fixed Phase 142 routing envelope.\n    ///\n    /// # Panics\n    ///\n    /// Panics only if the Phase 136 frame ceiling stops fitting in `u32`; the locked 65,536-byte bound fits.\n    #[must_use]\n    pub fn encode(&self) -> Vec<u8> {'
          if text.count(doc_old) != 1:
              raise SystemExit('encode documentation boundary mismatch')
          text = text.replace(doc_old, doc_new)
          redundant = '        let mut d = DisposableRelayProvider::new(service.clone());'
          corrected = '        let mut d = DisposableRelayProvider::new(service);'
          if text.count(redundant) != 1:
              raise SystemExit('redundant clone boundary mismatch')
          service.write_text(text.replace(redundant, corrected))

          regression = Path('crates/prw-relay-service/tests/security_boundaries.rs')
          text = regression.read_text()
          old = '        let received = receiver\n            .poll_receive(receiver_handle)\n            .expect("receive poll")\n            .expect("accepted queued frame");\n        assert_eq!(received.as_bytes(), frame.as_bytes());'
          new = '        let queued_frame = receiver\n            .poll_receive(receiver_handle)\n            .expect("receive poll")\n            .expect("accepted queued frame");\n        assert_eq!(queued_frame.as_bytes(), frame.as_bytes());'
          if text.count(old) != 1:
              raise SystemExit('similar-name regression boundary mismatch')
          regression.write_text(text.replace(old, new))
          PY
          echo phase142_a03_corrections=pass

      - name: Lock and prove dependency graph
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > /tmp/phase142-a03-metadata.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/phase142-a03-metadata.json'))
          root = next(p for p in data['packages'] if p['name'] == 'prw-relay-service')
          direct = {d['name']: d['req'] for d in root['dependencies']}
          expected = {'prw-connectivity': '*', 'prw-core': '*', 'prw-relay': '*'}
          if direct != expected:
              raise SystemExit(f'Phase 142 dependency mismatch: {direct!r}')
          if any(d.get('source') is not None for d in root['dependencies']):
              raise SystemExit('Phase 142 acquired an external direct dependency')
          print('phase142_a03_graph=pass')
          PY

      - name: Re-prove opacity and security boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          source=crates/prw-relay-service/src/lib.rs
          for forbidden in 'UdpSocket' 'TcpStream' 'TcpListener' 'ToSocketAddrs' 'lookup_host' 'tokio::' 'std::process' 'Command::new' '/dev/net/tun' 'iptables' 'nftables' 'quinn::' 'rustls::'; do
            if grep -Fq "$forbidden" "$source"; then
              echo "phase142_a03_forbidden_runtime_token=$forbidden" >&2
              exit 1
            fi
          done
          grep -Fq 'RELAY_HEADER_BYTES: usize = 48' "$source"
          grep -Fq 'MAX_DISPOSABLE_RELAY_ROUTES: usize = 32' "$source"
          grep -Fq 'MAX_QUEUED_RELAY_FRAMES: usize = 64' "$source"
          grep -Fq 'MAX_QUEUED_RELAY_BYTES: usize = 1024 * 1024' "$source"
          grep -Fq 'RelayRouteToken(<redacted>)' crates/prw-relay/src/lib.rs
          grep -Fq '.field("route_token", &"<redacted>")' "$source"
          echo phase142_a03_boundaries=pass

      - name: Focused Phase 142 validation
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all
          git diff --check -- . ':!target'
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-relay -p prw-relay-service --all-targets --all-features -- -D warnings
          cargo test --locked -p prw-relay -p prw-relay-service --all-targets
          cargo build --locked -p prw-relay-service --all-targets
          echo phase142_a03_focused=pass

      - name: Full workspace validation
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          echo phase142_a03_workspace=pass

      - name: Write authoritative Phase 142 report
        shell: bash
        run: |
          set -Eeuo pipefail
          report_dir=logs/audits/phase-142-disposable-relay-protocol-service
          report="$report_dir/PRW-PHASE-142-DISPOSABLE-RELAY-PROTOCOL-SERVICE-VALIDATION.txt"
          mkdir -p "$report_dir"
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          relay_sha=$(sha256sum crates/prw-relay/src/lib.rs | cut -d' ' -f1)
          service_sha=$(sha256sum crates/prw-relay-service/src/lib.rs | cut -d' ' -f1)
          printf '%s\n' \
            'Private Remote Workspace' \
            'Phase 142 — Disposable Relay Protocol and Service' \
            '' \
            'STATUS:' \
            'PASS / FALLBACK_ONLY / OPAQUE_PAYLOAD_FORWARDING / ROUTE_TOKEN_DEBUG_REDACTED / BOUNDED_IN_MEMORY_SERVICE / FULL_WORKSPACE_VALIDATION_PASS / NO_PRODUCTION_RELAY_SIDE_EFFECT' \
            '' \
            'Repository: Gersi365/prw-executor-private' \
            'Branch: main' \
            'Date: 2026-08-16' \
            "Validation source head: $GITHUB_SHA" \
            "Authoritative validation run: $GITHUB_RUN_ID" \
            "Cargo.lock SHA-256: $lock_sha" \
            "prw-relay/src/lib.rs SHA-256: $relay_sha" \
            "prw-relay-service/src/lib.rs SHA-256: $service_sha" \
            '' \
            'CONTRACT: contracts/DISPOSABLE_RELAY_PROTOCOL_SERVICE_CONTRACT.md' \
            'IMPLEMENTATION: crates/prw-relay-service plus RelayRouteToken Debug hardening in crates/prw-relay' \
            '' \
            'OUTCOME: Phase 136 fallback-only admission is preserved. The reference provider/service is dependency-local and in-memory, owns no socket/DNS/async/process/TUN/firewall/route/QUIC/TLS capability, and forwards OpaqueRelayFrame bytes byte-for-byte through the 48-byte PRWR metadata envelope.' \
            '' \
            'BOUNDS: 32 active routes, two participants per route, 64 queued frames and 1 MiB queued opaque payload per participant, retaining the Phase 136 65,536-byte single-frame ceiling.' \
            '' \
            'SECURITY: RelayRouteToken and nested RelaySessionSpec Debug redact route-token material. RelayRoutingPacket Debug redacts token and payload. Regression tests prove the byte queue ceiling, route isolation, route-token mismatch rejection, unpaired forwarding failure, third-participant rejection and bidirectional opaque byte preservation.' \
            '' \
            'VALIDATION: focused rustfmt, Clippy -D warnings, relay/service all-target tests and service build passed; full locked workspace Clippy, tests and build passed.' \
            '' \
            'CORRECTIVE HISTORY: initial workflow syntax failed before runner allocation; A01 reached compiler and isolated encode panic-doc plus Result equality requirements; A02 resolved those and isolated only one regression-test similar-name lint and one existing redundant test clone; A03 applies those two semantic-neutral hygiene corrections.' \
            '' \
            'PRODUCTION BOUNDARY: no production relay listener, TURN allocation, Agent restart/replacement, credential, firewall/NAT/router/TUN/TAP/route/DNS or client distribution state changed.' \
            '' \
            'FINAL CLASSIFICATION: PHASE_142_DONE / DISPOSABLE_RELAY_PROVIDER_VALIDATED / OPAQUE_END_TO_END_PAYLOAD / READY_FOR_PHASE_143' \
            > "$report"

      - name: Commit validated Phase 142 state only
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check -- . ':!target'
          git config user.name Gersi365
          git config user.email Gersi365@outlook.com
          git add Cargo.toml Cargo.lock crates/prw-relay/src/lib.rs crates/prw-relay-service logs/audits/phase-142-disposable-relay-protocol-service/PRW-PHASE-142-DISPOSABLE-RELAY-PROTOCOL-SERVICE-VALIDATION.txt
          git commit -m 'phase 142: validate disposable relay protocol and service'
          git push origin HEAD:main
          echo phase142_a03_materialization=pass
