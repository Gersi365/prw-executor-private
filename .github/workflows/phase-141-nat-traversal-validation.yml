name: Phase 141 NAT Traversal Validation

on:
  push:
    paths:
      - '.github/workflows/phase-141-nat-traversal-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Require architecture and dependency evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f contracts/NAT_TRAVERSAL_CONNECTIVITY_CHECKS_CONTRACT.md
          test -f logs/audits/phase-139-remote-transport-architecture/PRW-PHASE-139-A02-DUPLICATE-DECISION-RECONCILIATION.txt
          test -f logs/audits/phase-140-disposable-encrypted-remote-transport/PRW-PHASE-140-DISPOSABLE-REMOTE-TRANSPORT-VALIDATION.txt
          grep -Fq 'PHASE_140_DONE' logs/audits/phase-140-disposable-encrypted-remote-transport/PRW-PHASE-140-DISPOSABLE-REMOTE-TRANSPORT-VALIDATION.txt
          rustc --version | grep -Fq 'rustc 1.97.1'
          cargo --version | grep -Fq 'cargo 1.97.1'
          echo phase141_prerequisite=pass

      - name: Register crate and reproduce locked graph
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          member = '    "crates/prw-nat-traversal",\n'
          if member not in text:
              needle = '    "crates/prw-connectivity",\n'
              if text.count(needle) != 1:
                  raise SystemExit('Phase 141 workspace insertion point mismatch')
              cargo.write_text(text.replace(needle, needle + member))
          PY
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > /tmp/phase141-metadata.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/phase141-metadata.json'))
          root=next(p for p in data['packages'] if p['name']=='prw-nat-traversal')
          direct={d['name']: d['req'] for d in root['dependencies']}
          expected={
            'prw-connectivity':'*',
            'prw-core':'*',
            'rtc-ice':'=0.20.2',
            'rtc-shared':'=0.20.2',
            'rtc-stun':'=0.20.2',
            'sansio':'=1.0.0',
          }
          if direct != expected:
              raise SystemExit(f'Phase 141 direct dependency mismatch: {direct!r}')
          versions={p['name']:p['version'] for p in data['packages'] if p['name'] in {'rtc-ice','rtc-shared','rtc-stun','sansio'}}
          expected_versions={'rtc-ice':'0.20.2','rtc-shared':'0.20.2','rtc-stun':'0.20.2','sansio':'1.0.0'}
          if versions != expected_versions:
              raise SystemExit(f'Phase 141 exact version mismatch: {versions!r}')
          print('phase141_exact_graph=pass')
          PY
          echo "phase141_candidate_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"

      - name: Prove static Sans-I/O boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          source=crates/prw-nat-traversal/src/lib.rs
          for forbidden in \
            'UdpSocket' 'TcpStream' 'TcpListener' 'ToSocketAddrs' 'lookup_host' \
            'tokio::' 'std::process' 'Command::new' '/dev/net/tun' 'iptables' 'nftables'; do
            if grep -Fq "$forbidden" "$source"; then
              echo "phase141_forbidden_runtime_token=$forbidden" >&2
              exit 1
            fi
          done
          grep -Fq 'MulticastDnsMode::Disabled' "$source"
          grep -Fq 'NetworkType::Udp4' "$source"
          grep -Fq 'NetworkType::Udp6' "$source"
          grep -Fq 'RelayDeferred' "$source"
          grep -Fq 'MAX_TRAVERSAL_DATAGRAM_BYTES: usize = 2048' "$source"
          echo phase141_static_boundary=pass

      - name: Format candidate source with strict path guard
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all
          mapfile -t changed < <(git diff --name-only -- . ':!target')
          for path in "${changed[@]}"; do
            case "$path" in
              Cargo.toml|Cargo.lock|crates/prw-nat-traversal/src/lib.rs) ;;
              *) echo "phase141_unexpected_format_path=$path" >&2; exit 1 ;;
            esac
          done
          git diff --check -- . ':!target'

      - name: Focused Phase 141 validation
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-nat-traversal --all-targets --all-features -- -D warnings
          cargo test --locked -p prw-nat-traversal --all-targets
          echo phase141_focused_validation=pass

      - name: Full workspace validation
        id: workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          source_sha=$(sha256sum crates/prw-nat-traversal/src/lib.rs | cut -d' ' -f1)
          echo "lock_sha=$lock_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "phase141_workspace_validation=pass lock_sha=$lock_sha source_sha=$source_sha"

      - name: Record authoritative Phase 141 report
        shell: bash
        env:
          LOCK_SHA: ${{ steps.workspace.outputs.lock_sha }}
          SOURCE_SHA: ${{ steps.workspace.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          report_dir=logs/audits/phase-141-nat-traversal-connectivity-checks
          report="$report_dir/PRW-PHASE-141-NAT-TRAVERSAL-CONNECTIVITY-CHECKS-VALIDATION.txt"
          mkdir -p "$report_dir"
          cat > "$report" <<EOF
          Private Remote Workspace
          Phase 141 — NAT Traversal and Connectivity Checks

          STATUS:
          PASS / STANDARD_ICE_STUN / SANS_IO_BOUNDARY / PHASE135_SELECTOR_PRESERVED / FULL_WORKSPACE_VALIDATION_PASS / NO_PRODUCTION_NETWORK_SIDE_EFFECT

          Repository: Gersi365/prw-executor-private
          Branch: main
          Date: 2026-08-16
          Validation source head: $GITHUB_SHA
          Authoritative validation run: $GITHUB_RUN_ID
          Cargo.lock SHA-256: $LOCK_SHA
          prw-nat-traversal/src/lib.rs SHA-256: $SOURCE_SHA

          CONTRACT
          contracts/NAT_TRAVERSAL_CONNECTIVITY_CHECKS_CONTRACT.md

          IMPLEMENTATION
          crates/prw-nat-traversal

          DEPENDENCY DECISION
          Stable rtc-ice 0.20.2, rtc-stun 0.20.2, rtc-shared 0.20.2 and sansio 1.0.0, with default features disabled and AWS-LC selected for ICE/STUN cryptographic integrity paths.

          PROBE HISTORY
          Run 31951951887 resolved exact versions but failed only because the scratch harness attempted unsupported Vec<u8> -> BytesMut conversion. No repository runtime graph was mutated.
          Corrective run 31952085411 / job 95177012142 passed exact-version compile and repository-immutability checks on Rust/Cargo 1.97.1. Scratch lock SHA-256: ad791a289eb61b6d5839d8b94d612b2e67fbd6efa837f3648766393935e6cb96.
          Initial validation run 31952482522 passed prerequisite, exact graph and static boundary, then stopped only because its format guard included tracked target/.rustc_info.json build metadata. No Phase 141 runtime source was promoted by that run.

          SECURITY/ARCHITECTURE OUTCOME
          The PRW traversal crate owns no socket, async runtime, DNS resolver, process, TUN/TAP, route or firewall API. It emits/consumes typed datagrams no larger than 2048 bytes. STUN discovery accepts only an explicit server SocketAddr and rejects wrong-source responses. ICE is UDP4/UDP6 only with mDNS disabled and relay allocation deferred to Phase 142. Successful ICE selection yields only a candidate reachability observation correlated to an existing Phase 135 CandidateId; Phase 135 remains the authoritative LocalDirect -> InternetDirect -> Relay -> Offline selector.

          VALIDATION
          Focused rustfmt, Clippy -D warnings and all-target tests passed. Tests include bounded datagrams/credentials, synthetic STUN Binding/XOR-MAPPED result, wrong STUN source rejection, two-agent in-memory ICE selection, wrong ICE password fail-closed behavior, relay deferral, duplicate rejection, capacity bounds and Phase 135 observation application. Full workspace/all-target Clippy, tests and build then passed under the locked graph.

          PRODUCTION BOUNDARY
          No PowerCode production socket, service, Agent, key/certificate, firewall/NAT/router/TUN/TAP/route/DNS, persistent STUN/ICE/TURN traffic or relay was changed or activated.

          FINAL CLASSIFICATION
          PHASE_141_DONE / READY_FOR_PHASE_142_SOURCE_DISPOSABLE_RELAY_PROVIDER_WORK
          EOF

      - name: Commit only validated graph source and report
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check -- . ':!target'
          git config user.name Gersi365
          git config user.email Gersi365@outlook.com
          git add Cargo.toml Cargo.lock crates/prw-nat-traversal \
            logs/audits/phase-141-nat-traversal-connectivity-checks/PRW-PHASE-141-NAT-TRAVERSAL-CONNECTIVITY-CHECKS-VALIDATION.txt
          git commit -m 'phase 141: validate NAT traversal and connectivity checks'
          git push origin HEAD:main
          echo phase141_materialization=pass
