name: Phase 137 Optional Private DNS Foundation Validation

on:
  push:
    paths:
      - '.github/workflows/phase-137-private-dns-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Require Phase 136 authority and Phase 137 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f logs/audits/phase-136-relay-fallback-foundation/PRW-PHASE-136-RELAY-FALLBACK-FOUNDATION-VALIDATION.txt
          grep -Fq 'PHASE_136_DONE' \
            logs/audits/phase-136-relay-fallback-foundation/PRW-PHASE-136-RELAY-FALLBACK-FOUNDATION-VALIDATION.txt
          test -f contracts/OPTIONAL_PRIVATE_DNS_FOUNDATION_CONTRACT.md
          grep -Fq 'Status: Phase 137 implementation lock' contracts/OPTIONAL_PRIVATE_DNS_FOUNDATION_CONTRACT.md
          test -f crates/prw-private-dns/Cargo.toml
          test -f crates/prw-private-dns/src/lib.rs
          echo 'phase137_prerequisites=pass'

      - name: Register crate and normalize exact locked graph
        id: graph
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          member = '    "crates/prw-private-dns",\n'
          if member not in text:
              needle = '    "crates/prw-relay",\n'
              if text.count(needle) != 1:
                  raise SystemExit('private DNS workspace insertion point mismatch')
              cargo.write_text(text.replace(needle, needle + member))
          PY
          rustc --version
          cargo --version
          cargo fmt --all
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo clippy --fix --locked -p prw-private-dns --all-targets --all-features \
            --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
          git restore --worktree --staged -- target/.rustc_info.json 2>/dev/null || true
          mapfile -t changed < <(git diff --name-only -- . ':!target')
          for path in "${changed[@]}"; do
            case "$path" in
              Cargo.toml|Cargo.lock|crates/prw-private-dns/src/lib.rs) ;;
              *) echo "unexpected_phase137_fix_path=$path" >&2; exit 1 ;;
            esac
          done
          git diff --check
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          source_sha=$(sha256sum crates/prw-private-dns/src/lib.rs | cut -d' ' -f1)
          echo "lock_sha=$lock_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "phase137_lock_sha256=$lock_sha"
          echo "phase137_source_sha256=$source_sha"

      - name: Prove optional no-OS-mutation and connectivity-independence boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          source='crates/prw-private-dns/src/lib.rs'
          ! grep -Fq 'TcpListener' "$source"
          ! grep -Fq 'TcpStream' "$source"
          ! grep -Fq 'UdpSocket' "$source"
          ! grep -Fq 'ToSocketAddrs' "$source"
          ! grep -Fq 'lookup_host' "$source"
          ! grep -Fq 'resolvectl' "$source"
          ! grep -Fq '/etc/resolv.conf' "$source"
          ! grep -Fq 'NetworkManager' "$source"
          ! grep -Fq 'std::process::Command' "$source"
          ! grep -Fq 'Command::new' "$source"
          ! grep -Fq 'unsafe {' "$source"
          grep -Fq 'MAX_PRIVATE_DNS_RESOLVERS: usize = 4' "$source"
          grep -Fq 'MAX_SPLIT_DNS_DOMAINS: usize = 16' "$source"
          grep -Fq 'pub enum PrivateDnsMode' "$source"
          grep -Fq 'pub struct DeviceDnsLabel' "$source"
          grep -Fq 'pub struct DnsDomainSuffix' "$source"
          grep -Fq 'pub struct ResolverEndpoint' "$source"
          grep -Fq 'pub struct PrivateDnsConfig' "$source"

          ! grep -Fq 'prw-private-dns' crates/prw-connectivity/Cargo.toml
          ! grep -Fq 'prw_private_dns' crates/prw-connectivity/src/lib.rs
          ! grep -Fq 'ResolverEndpoint' crates/prw-connectivity/src/lib.rs
          echo 'phase137_optional_dns_boundary=pass'
          echo 'phase137_basic_connectivity_dns_independent=pass'

      - name: Run focused Phase 137 gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-private-dns --all-targets --all-features -- -D warnings
          cargo test --locked -p prw-private-dns --all-targets
          echo 'phase137_focused_validation=pass'

      - name: Run full workspace gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          echo 'phase137_workspace_validation=pass'

      - name: Record authoritative Phase 137 report
        shell: bash
        env:
          LOCK_SHA: ${{ steps.graph.outputs.lock_sha }}
          SOURCE_SHA: ${{ steps.graph.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          report_dir='logs/audits/phase-137-optional-private-dns-foundation'
          report="$report_dir/PRW-PHASE-137-OPTIONAL-PRIVATE-DNS-FOUNDATION-VALIDATION.txt"
          mkdir -p "$report_dir"
          cat > "$report" <<EOF
          Private Remote Workspace
          Phase 137 — Optional Private DNS Foundation

          STATUS:
          PASS / CONTRACT_LOCKED / DEFAULT_DISABLED / STRICT_DNS_NAME_VALIDATION / BOUNDED_RESOLVER_AND_SPLIT_CONFIG / BASIC_CONNECTIVITY_DNS_INDEPENDENT / FULL_WORKSPACE_VALIDATION_PASS / PRODUCTION_DNS_NOT_ACTIVE

          Repository: Gersi365/prw-executor-private
          Branch: main
          Date: 2026-08-16
          Validation input head: $GITHUB_SHA
          Authoritative validation run: $GITHUB_RUN_ID
          Cargo.lock SHA-256: $LOCK_SHA
          prw-private-dns source SHA-256: $SOURCE_SHA

          CONTRACT
          contracts/OPTIONAL_PRIVATE_DNS_FOUNDATION_CONTRACT.md

          IMPLEMENTATION
          crates/prw-private-dns

          OPTIONAL/DISABLED OUTCOME
          PrivateDnsMode defaults to Disabled. A disabled configuration may retain already-valid device naming, resolver and split-domain settings without becoming active. Enabled is configuration state only and does not imply any operating-system resolver mutation.

          VALIDATION OUTCOME
          DeviceDnsLabel is canonical lowercase ASCII, 1..63 bytes, alphanumeric at both ends and otherwise limited to alphanumeric/hyphen. DnsDomainSuffix is canonical lowercase ASCII without trailing dot, total 1..253 bytes, with each label independently bounded/validated. Resolver endpoints are explicit IP plus non-zero port, reject unspecified/multicast/IPv4 limited broadcast, allow loopback, are bounded to four and reject duplicates. Split domains are bounded to sixteen, reject duplicates and require at least one explicit resolver. Device naming requires a device-domain suffix.

          CONNECTIVITY INDEPENDENCE
          prw-connectivity has no dependency on prw-private-dns and contains no private-DNS resolver API. Its explicit-IP candidate selection remains independent from DNS. Therefore disabling or failing optional DNS does not invalidate the Phase 135 basic path-selection model.

          VALIDATION
          The authoritative run passed static no-socket/no-OS-resolver-mutation checks, explicit connectivity-independence checks, focused prw-private-dns rustfmt/Clippy -D warnings/all-target tests, then full workspace/all-target rustfmt, Clippy, tests and build under the locked graph.

          DEFERRED
          DNS queries/responses, device-record catalog, private address publication, DNSSEC/search-domain policy, systemd-resolved/NetworkManager integration, Android DNS integration, OS split-DNS mutation, production rollback/restore and production activation remain deferred.

          PRODUCTION BOUNDARY
          No PowerCode resolver setting, /etc/resolv.conf state, systemd-resolved/NetworkManager state, DNS listener, DNS query path, route/firewall state or other user-impacting production networking state was created or mutated.

          FINAL CLASSIFICATION
          PHASE_137_DONE / NO_PRODUCTION_DNS_SIDE_EFFECT / AUTHORIZED_SOURCE_ROADMAP_THROUGH_137_COMPLETE
          EOF
          git diff --check

      - name: Commit validated private-DNS graph and report only
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name Gersi365
          git config user.email Gersi365@outlook.com
          git add Cargo.toml Cargo.lock crates/prw-private-dns/src/lib.rs \
            logs/audits/phase-137-optional-private-dns-foundation/PRW-PHASE-137-OPTIONAL-PRIVATE-DNS-FOUNDATION-VALIDATION.txt
          git diff --cached --check
          git commit -m 'phase 137: validate optional private DNS foundation'
          git push origin HEAD:main
          echo 'phase137_materialization=pass'
