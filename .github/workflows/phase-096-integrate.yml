name: Phase 096 Integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase-096-integrate.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Integrate Phase 096 lifecycle assembly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/prw-agent/src/linux_identity.rs")
          text = path.read_text()
          old_docs = "//! immutable production-runtime configuration plus bounded evidence/disposition\n//! types. The Agent bootstrap remains inactive and no long-running runtime loop\n//! is enabled."
          new_docs = "//! immutable production-runtime configuration plus bounded evidence/disposition\n//! types, and Phase 096 adds scoped lifecycle resource assembly with explicit\n//! listener rollback/cleanup. The Agent bootstrap remains inactive and no\n//! long-running runtime loop is enabled."
          if text.count(old_docs) != 1:
              raise SystemExit("Phase 096 documentation anchor mismatch")
          text = text.replace(old_docs, new_docs, 1)

          anchor = "#[allow(\n    dead_code,\n    reason = \"pre-bootstrap Linux production runtime types are intentionally crate-internal\"\n)]\n#[path = \"linux_production_runtime_types.rs\"]\npub mod production_runtime_types;\n"
          insert = anchor + "#[allow(\n    dead_code,\n    reason = \"pre-bootstrap Linux production lifecycle assembly is intentionally crate-internal\"\n)]\n#[path = \"linux_production_lifecycle.rs\"]\npub mod production_lifecycle;\n"
          if text.count(anchor) != 1:
              raise SystemExit("Phase 096 module insertion anchor mismatch")
          path.write_text(text.replace(anchor, insert, 1))
          PY

          cargo fmt --all
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' crates/prw-agent/src/linux_identity.rs crates/prw-agent/src/linux_production_lifecycle.rs | sort)"
          test "$changed" = "$expected"
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          git diff --check

      - name: Commit integrated source and self-delete
        run: |
          rm .github/workflows/phase-096-integrate.yml
          git add crates/prw-agent/src/linux_identity.rs crates/prw-agent/src/linux_production_lifecycle.rs .github/workflows/phase-096-integrate.yml
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git commit -m "Integrate Phase 096 production lifecycle assembly"
          git push
