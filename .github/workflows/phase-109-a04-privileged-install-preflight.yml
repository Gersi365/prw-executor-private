name: Phase 109 A04 Privileged Install Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-109-a04-privileged-install-preflight.yml'

permissions:
  contents: read

jobs:
  install-preflight:
    runs-on: [self-hosted, prw-host]
    timeout-minutes: 5
    steps:
      - name: Verify fixed staging payload and install destinations
        shell: bash
        run: |
          set -euo pipefail

          stage='/home/gersi365/.local/state/private-remote-workspace/phase109/staging/8d283ec53bd37233a929fb720a189748dc7f992c'
          agent='/usr/lib/private-remote-workspace/prw-agent'
          unit='/usr/lib/systemd/user/prw-agent.service'
          parent='/usr/lib/private-remote-workspace'
          unit_parent='/usr/lib/systemd/user'

          echo '=== PRW PHASE 109 A04 FINAL READ-ONLY INSTALL PREFLIGHT ==='
          test "$(hostname)" = 'PowerCode'
          test "$(id -un)" = 'gersi365'
          test "$(id -u)" = '1000'

          test -d "$stage"
          test -f "$stage/prw-agent"
          test -f "$stage/prw-agent.service"
          test -f "$stage/SHA256SUMS"
          test "$(sha256sum "$stage/prw-agent" | awk '{print $1}')" = '8d0fa919676d1d55200801dd979a5463228610ad0f5aea1d2fd8bbded7047fbf'
          test "$(sha256sum "$stage/prw-agent.service" | awk '{print $1}')" = '24f646dc96777542904cd824f1678e6c32256b64911d4a031c0315d198c0a909'
          stat -Lc 'stage=%n mode=%a uid=%u gid=%g type=%F' "$stage" "$stage/prw-agent" "$stage/prw-agent.service"

          if [[ -e "$agent" || -L "$agent" ]]; then
            echo "Unexpected agent destination appeared: $agent" >&2
            exit 1
          fi
          if [[ -e "$unit" || -L "$unit" ]]; then
            echo "Unexpected unit destination appeared: $unit" >&2
            exit 1
          fi
          echo 'agent_destination=absent'
          echo 'unit_destination=absent'

          if [[ -e "$parent" || -L "$parent" ]]; then
            echo 'agent_parent=present'
            stat -Lc 'agent_parent=%n mode=%a uid=%u gid=%g type=%F' "$parent"
            find "$parent" -mindepth 1 -maxdepth 1 -printf 'agent_parent_child=%f type=%y\n' | sort
          else
            echo 'agent_parent=absent'
          fi

          test -d "$unit_parent"
          test ! -L "$unit_parent"
          stat -Lc 'unit_parent=%n mode=%a uid=%u gid=%g type=%F' "$unit_parent"

          loginctl show-user gersi365 -p Linger -p RuntimePath -p State
          systemctl --user show prw-agent.service -p LoadState -p ActiveState -p SubState -p UnitFileState 2>&1 || true
          echo '=== END A04 PREFLIGHT ==='
