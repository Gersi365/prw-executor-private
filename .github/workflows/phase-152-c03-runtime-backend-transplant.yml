name: Phase 152 C03 Runtime Backend Transplant

on:
  push:
    branches:
      - phase-152-c03-runtime-management-integration
    paths:
      - ".github/workflows/phase-152-c03-runtime-backend-transplant.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-152-c03-runtime-backend-transplant
  cancel-in-progress: true

jobs:
  transplant-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact runtime ancestry
        run: |
          test "$(git rev-parse HEAD^)" = "fb37d212e7e625cbfa6d1b71b53149ce4e217363"

      - name: Apply validated backend corrective
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/prw-agent/src/local_commands/management_linux_backends.rs')
          text = path.read_text()

          old_borrow = 'try_acquire_counter(&aggregate, MAX_FORWARD_CONNECTIONS_AGGREGATE)'
          if text.count(old_borrow) != 1:
              raise SystemExit(f'expected exactly one aggregate borrow anchor, found {text.count(old_borrow)}')
          text = text.replace(
              old_borrow,
              'try_acquire_counter(aggregate, MAX_FORWARD_CONNECTIONS_AGGREGATE)',
          )

          old_window = '.windows(13)'
          if text.count(old_window) != 2:
              raise SystemExit(f'expected exactly two PTY marker window anchors, found {text.count(old_window)}')
          text = text.replace(old_window, '.windows(b"PRW_C03_PTY_OK".len())')
          path.write_text(text)
          PY
          cargo fmt --all

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libgtk-4-dev libadwaita-1-dev

      - name: Validate clean workspace
        shell: bash
        run: |
          set +e
          export CARGO_TARGET_DIR=/tmp/prw-c03-runtime-backend-transplant-target
          rm -rf target "$CARGO_TARGET_DIR"
          mkdir -p /tmp/prw-c03-runtime-backend-transplant-logs

          cargo metadata --locked --no-deps --format-version 1 >/dev/null 2>/tmp/prw-c03-runtime-backend-transplant-logs/metadata.err
          METADATA_RC=$?
          cargo fmt --all -- --check >/tmp/prw-c03-runtime-backend-transplant-logs/fmt.out 2>&1
          FMT_RC=$?
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings >/tmp/prw-c03-runtime-backend-transplant-logs/clippy.out 2>&1
          CLIPPY_RC=$?
          cargo test --locked --workspace --all-targets >/tmp/prw-c03-runtime-backend-transplant-logs/test.out 2>&1
          TEST_RC=$?
          cargo build --locked --workspace --all-targets >/tmp/prw-c03-runtime-backend-transplant-logs/build.out 2>&1
          BUILD_RC=$?

          BASE_HEAD=$(git rev-parse HEAD)
          REPORT="logs/audits/phase-152-c03-runtime-management-integration/C03_RUNTIME_BACKEND_TRANSPLANT_VALIDATION_${BASE_HEAD}.txt"
          mkdir -p "$(dirname "$REPORT")"
          {
            echo "BASE_HEAD=$BASE_HEAD"
            echo "PARENT_EXPECTED=fb37d212e7e625cbfa6d1b71b53149ce4e217363"
            echo "SOURCE_PROOF=38629e1ad088c0a517bf2aabab349bc9f836e161"
            echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"
            rustc --version
            cargo --version
            rustfmt --version
            cargo clippy --version
            echo "METADATA_RC=$METADATA_RC"
            echo "FMT_RC=$FMT_RC"
            echo "CLIPPY_RC=$CLIPPY_RC"
            echo "TEST_RC=$TEST_RC"
            echo "BUILD_RC=$BUILD_RC"
            echo "--- CLIPPY_TAIL ---"
            tail -n 120 /tmp/prw-c03-runtime-backend-transplant-logs/clippy.out
            echo "--- TEST_TAIL ---"
            tail -n 160 /tmp/prw-c03-runtime-backend-transplant-logs/test.out
            echo "--- BUILD_TAIL ---"
            tail -n 80 /tmp/prw-c03-runtime-backend-transplant-logs/build.out
          } > "$REPORT"

          if [ "$METADATA_RC" -eq 0 ] && [ "$FMT_RC" -eq 0 ] && [ "$CLIPPY_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ] && [ "$BUILD_RC" -eq 0 ]; then
            echo 'STATUS=PASS' >> "$REPORT"
            echo 'VALIDATION_STATUS=PASS' >> "$GITHUB_ENV"
          else
            echo 'STATUS=FAIL' >> "$REPORT"
            echo 'VALIDATION_STATUS=FAIL' >> "$GITHUB_ENV"
          fi

      - name: Commit exact transplant evidence
        shell: bash
        run: |
          BASE_HEAD=$(git rev-parse HEAD)
          REMOTE_HEAD=$(git ls-remote origin refs/heads/phase-152-c03-runtime-management-integration | cut -f1)
          test "$REMOTE_HEAD" = "$BASE_HEAD"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/prw-agent/src/local_commands/management_linux_backends.rs logs/audits/phase-152-c03-runtime-management-integration/

          if [ "$VALIDATION_STATUS" = PASS ]; then
            git rm .github/workflows/phase-152-c03-runtime-backend-transplant.yml
            git commit -m "phase 152 c03: transplant validated backend corrective ${BASE_HEAD:0:12}"
          else
            git add .github/workflows/phase-152-c03-runtime-backend-transplant.yml
            git commit -m "phase 152 c03: record runtime backend transplant failure ${BASE_HEAD:0:12}"
          fi
          git push origin HEAD:phase-152-c03-runtime-management-integration

      - name: Fail on validation failure
        if: env.VALIDATION_STATUS != 'PASS'
        run: exit 1
