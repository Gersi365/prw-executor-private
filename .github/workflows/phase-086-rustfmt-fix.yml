name: Phase 086 Rustfmt Corrective

on:
  push:
    paths:
      - '.github/workflows/phase-086-rustfmt-fix.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply formatter-only corrective
        shell: bash
        run: |
          cargo fmt --all
          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "crates/prw-agent/src/linux_bounded_scheduler_cycle.rs" ]]; then
            printf 'Unexpected rustfmt mutation set:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi
          cargo fmt --all -- --check
          git diff --check
          rm .github/workflows/phase-086-rustfmt-fix.yml

      - name: Commit formatter-only corrective and self-delete
        shell: bash
        run: |
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          git add crates/prw-agent/src/linux_bounded_scheduler_cycle.rs .github/workflows/phase-086-rustfmt-fix.yml
          git diff --cached --check
          git commit -m 'Fix Phase 086 rustfmt baseline'
          git push origin HEAD:main
