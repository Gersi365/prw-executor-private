name: PRW Phase 152 C02e Tranche4 Clippy Const Corrective

on:
  push:
    branches:
      - phase-152-c02e-dynamic-reachability-design
    paths:
      - ".github/workflows/phase-152-c02e-tranche4-clippy-const-corrective.yml"

permissions:
  contents: write

jobs:
  corrective:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact const corrective and self-delete
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="phase-152-c02e-dynamic-reachability-design"
          SELF=".github/workflows/phase-152-c02e-tranche4-clippy-const-corrective.yml"
          SOURCE="crates/prw-remote-bridge/src/reachability_owner.rs"
          BASE_HEAD="$(git rev-parse HEAD)"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/prw-remote-bridge/src/reachability_owner.rs")
          text = p.read_text()
          old = "    fn require_current(&self) -> Result<(), ReachabilityOwnerError> {"
          new = "    const fn require_current(&self) -> Result<(), ReachabilityOwnerError> {"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one corrective target, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all -- --check
          mapfile -t CHANGED < <(git diff --name-only)
          if [[ ${#CHANGED[@]} -ne 1 || "${CHANGED[0]}" != "${SOURCE}" ]]; then
            printf 'unexpected corrective diff: %s\n' "${CHANGED[*]}" >&2
            exit 91
          fi
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [[ "${REMOTE_HEAD}" != "${BASE_HEAD}" ]]; then
            echo "branch advanced during corrective: base=${BASE_HEAD} remote=${REMOTE_HEAD}" >&2
            exit 92
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${SOURCE}"
          git rm "${SELF}"
          git commit -m "phase 152 c02e: apply tranche4 clippy const corrective ${BASE_HEAD:0:12}"
          git push origin "HEAD:${BRANCH}"
