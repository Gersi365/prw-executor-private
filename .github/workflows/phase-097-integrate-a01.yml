name: Phase 097 Integration A01

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase-097-integrate-a01.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Integrate refactored Phase 097 runtime loop
        run: |
          python3 - <<'PY'
          from pathlib import Path

          types_path = Path("crates/prw-agent/src/linux_production_runtime_types.rs")
          types = types_path.read_text()
          old_import = "use super::runtime_orchestration::{\n    LocalLinuxRuntimeOrchestrationError, LocalLinuxRuntimeOrchestrationReport,\n    LocalLinuxRuntimeOrchestrationStop,\n};"
          new_import = "use super::runtime_orchestration::{\n    LocalLinuxRuntimeOrchestrationError, LocalLinuxRuntimeOrchestrationReport,\n    LocalLinuxRuntimeOrchestrationStop, LocalLinuxRuntimeSchedulingCycleError,\n};"
          if types.count(old_import) != 1:
              raise SystemExit("Phase 097 runtime type import anchor mismatch")
          types = types.replace(old_import, new_import, 1)
          peer_anchor = '''    /// Records one connection-local peer-authorization rejection.\n    pub const fn record_peer_rejection(&mut self) {\n        self.peer_rejections.increment();\n    }\n'''
          extra = '''    /// Records evidence accumulated before one scheduling failure.\n    pub fn record_scheduling_error(&mut self, error: &LocalLinuxRuntimeSchedulingCycleError) {\n        self.readiness_steps.increment();\n        self.listener_armed_steps.increment();\n        self.scheduling_attempts\n            .add_usize(error.scheduling_attempts());\n        self.workers_registered.add_usize(error.workers_registered());\n        self.worker_completions.add_usize(error.completions().len());\n    }\n\n    /// Records worker completions joined during the final shutdown transaction.\n    pub fn record_final_completions(&mut self, count: usize) {\n        self.worker_completions.add_usize(count);\n    }\n\n'''
          if types.count(peer_anchor) != 1:
              raise SystemExit("Phase 097 counter extension anchor mismatch")
          types_path.write_text(types.replace(peer_anchor, extra + peer_anchor, 1))

          lifecycle_path = Path("crates/prw-agent/src/linux_production_lifecycle.rs")
          lifecycle = lifecycle_path.read_text()
          helper_old = "fn with_local_linux_production_lifecycle_in_root_path<R, F>(\n"
          helper_new = "pub(super) fn with_local_linux_production_lifecycle_in_root_path<R, F>(\n"
          if lifecycle.count(helper_old) != 1:
              raise SystemExit("Phase 097 Phase 096 test-helper visibility anchor mismatch")
          lifecycle_path.write_text(lifecycle.replace(helper_old, helper_new, 1))

          identity_path = Path("crates/prw-agent/src/linux_identity.rs")
          identity = identity_path.read_text()
          docs_old = "//! types, and Phase 096 adds scoped lifecycle resource assembly with explicit\n//! listener rollback/cleanup. The Agent bootstrap remains inactive and no\n//! long-running runtime loop is enabled."
          docs_new = "//! types, Phase 096 adds scoped lifecycle resource assembly with explicit\n//! listener rollback/cleanup, and Phase 097 adds the callable programmatic-\n//! shutdown long-running runtime loop. The Agent bootstrap remains inactive;\n//! `main.rs`, OS signals, and systemd still do not start this loop."
          if identity.count(docs_old) != 1:
              raise SystemExit("Phase 097 documentation anchor mismatch")
          identity = identity.replace(docs_old, docs_new, 1)
          module_anchor = "#[allow(\n    dead_code,\n    reason = \"pre-bootstrap Linux production lifecycle assembly is intentionally crate-internal\"\n)]\n#[path = \"linux_production_lifecycle.rs\"]\npub mod production_lifecycle;\n"
          module_insert = module_anchor + "#[allow(\n    dead_code,\n    reason = \"pre-bootstrap Linux production runtime loop is intentionally crate-internal\"\n)]\n#[path = \"linux_production_runtime_loop.rs\"]\npub mod production_runtime_loop;\n"
          if identity.count(module_anchor) != 1:
              raise SystemExit("Phase 097 module insertion anchor mismatch")
          identity_path.write_text(identity.replace(module_anchor, module_insert, 1))
          PY

          cargo fmt --all
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' crates/prw-agent/src/linux_identity.rs crates/prw-agent/src/linux_production_lifecycle.rs crates/prw-agent/src/linux_production_runtime_loop.rs crates/prw-agent/src/linux_production_runtime_types.rs | sort)"
          test "$changed" = "$expected"
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          git diff --check

      - name: Commit integrated source and remove temporary workflows
        run: |
          rm .github/workflows/phase-097-integrate.yml
          rm .github/workflows/phase-097-integrate-a01.yml
          git add crates/prw-agent/src/linux_identity.rs crates/prw-agent/src/linux_production_lifecycle.rs crates/prw-agent/src/linux_production_runtime_loop.rs crates/prw-agent/src/linux_production_runtime_types.rs .github/workflows/phase-097-integrate.yml .github/workflows/phase-097-integrate-a01.yml
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git commit -m "Integrate Phase 097 programmatic production runtime loop"
          git push
