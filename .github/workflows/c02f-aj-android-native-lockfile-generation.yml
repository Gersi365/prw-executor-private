name: Phase 152 C02f-AJ Android Native Lockfile Generation

on:
  push:
    branches:
      - phase-152-c02f-aj-provider-client-source-materialization-staging
    paths:
      - 'apps/android/native/Cargo.toml'
      - 'apps/android/native/Cargo.lock'
      - 'crates/prw-control-plane/Cargo.toml'
      - '.github/workflows/c02f-aj-android-native-lockfile-generation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    name: Generate and commit Android native Cargo lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record canonical Rust toolchain
        run: |
          rustc +1.97.1 --version
          cargo +1.97.1 --version

      - name: Generate Android native lockfile with canonical Cargo
        shell: bash
        run: |
          set -Eeuo pipefail
          cd apps/android/native
          cargo +1.97.1 generate-lockfile

      - name: Verify AJ dependency pins are locked
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'name = "google-cloud-spanner"' apps/android/native/Cargo.lock
          grep -F 'version = "0.34.4-preview"' apps/android/native/Cargo.lock
          grep -F 'name = "google-cloud-gax"' apps/android/native/Cargo.lock
          grep -F 'version = "1.13.0"' apps/android/native/Cargo.lock

      - name: Commit Cargo-generated Android native lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/android/native/Cargo.lock
          test "$(git diff --cached --name-only)" = "apps/android/native/Cargo.lock"
          git diff --cached --check
          git commit -m 'phase 152 c02f-aj: materialize Android native Cargo lockfile'
          git push origin "HEAD:${GITHUB_REF_NAME}"
