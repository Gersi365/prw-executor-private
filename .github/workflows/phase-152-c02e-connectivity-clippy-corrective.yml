name: PRW Phase 152 C02e Connectivity Clippy Corrective

on:
  push:
    branches:
      - phase-152-c02e-dynamic-reachability-design
    paths:
      - '.github/workflows/phase-152-c02e-connectivity-clippy-corrective.yml'

permissions:
  contents: write

concurrency:
  group: prw-phase-152-c02e-connectivity-clippy-corrective
  cancel-in-progress: true

jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply exact Clippy corrective and validate focused crate
        id: corrective
        shell: bash
        run: |
          set -euo pipefail
          BASE_HEAD="$(git rev-parse HEAD)"
          test "${BASE_HEAD}" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "phase-152-c02e-dynamic-reachability-design"
          C02D=857583b25ed1206317641a93fd8f927819c954d8
          git merge-base --is-ancestor "${C02D}" HEAD
          test "$(git merge-base "${C02D}" HEAD)" = "${C02D}"
          REPORT="logs/audits/phase-152-c02e-dynamic-reachability-design/C02E_CONNECTIVITY_CLIPPY_CORRECTIVE_${BASE_HEAD}.txt"
          mkdir -p "$(dirname "${REPORT}")"
          echo "report=${REPORT}" >> "${GITHUB_OUTPUT}"
          sha256sum Cargo.toml Cargo.lock crates/prw-connectivity/Cargo.toml > "${RUNNER_TEMP}/deps.before"
          cp Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('crates/prw-connectivity/src/lib.rs')
          text=path.read_text()
          old='''                Some(existing) if existing.candidate != *candidate => {\n                    return Err(ConnectivityError::CandidateIdRebound);\n                }\n                Some(_) => {}\n                None if candidate.id.get() <= self.candidate_id_high_watermark => {\n                    return Err(ConnectivityError::CandidateIdRebound);\n                }\n                None => {}\n'''
          new='''                Some(existing) if existing.candidate != *candidate => {\n                    return Err(ConnectivityError::CandidateIdRebound);\n                }\n                None if candidate.id.get() <= self.candidate_id_high_watermark => {\n                    return Err(ConnectivityError::CandidateIdRebound);\n                }\n                Some(_) | None => {}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'exact corrective source count != 1: {text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
          test "$(git diff --name-only)" = "crates/prw-connectivity/src/lib.rs"
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-connectivity --all-targets --all-features -- -D warnings
          cmp -s "${RUNNER_TEMP}/Cargo.lock.before" Cargo.lock
          sha256sum Cargo.toml Cargo.lock crates/prw-connectivity/Cargo.toml > "${RUNNER_TEMP}/deps.after"
          diff -u "${RUNNER_TEMP}/deps.before" "${RUNNER_TEMP}/deps.after"
          git diff --check -- crates/prw-connectivity/src/lib.rs
          {
            echo 'STATUS=PASS_EXACT_CONNECTIVITY_CLIPPY_CORRECTIVE'
            echo "BASE_HEAD=${BASE_HEAD}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUSTC=$(rustc --version)"
            echo "CARGO=$(cargo --version)"
            echo 'SOURCE_MUTATION=crates/prw-connectivity/src/lib.rs'
            echo 'CORRECTIVE=merge identical Some(_) and None no-op match arms'
            echo 'CARGO_FMT_CHECK=PASS'
            echo 'FOCUSED_PRW_CONNECTIVITY_CLIPPY=PASS'
            echo 'DEPENDENCY_STATE=UNCHANGED'
            echo 'RUNTIME_NETWORK_ACTIVATION=NONE'
          } > "${REPORT}"
      - name: Commit corrective and evidence
        shell: bash
        env:
          REPORT: ${{ steps.corrective.outputs.report }}
        run: |
          set -euo pipefail
          test -n "${REPORT}"
          test -f "${REPORT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/prw-connectivity/src/lib.rs "${REPORT}"
          git diff --cached --check
          git commit -m "phase 152 c02e: satisfy connectivity match-arm lint ${GITHUB_SHA::12}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
