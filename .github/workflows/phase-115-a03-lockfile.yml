name: Phase 115 A03 Lockfile Validation

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase-115-a03-lockfile
  cancel-in-progress: false

jobs:
  validate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pin Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
          rustc --version
          cargo --version

      - name: Generate and verify candidate lockfile
        run: |
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo tree --locked -p prw-device-identity -e normal,dev | tee /tmp/tree.txt
          grep -F 'prw-core v0.1.0' /tmp/tree.txt
          git diff -- Cargo.lock

      - name: Upload candidate lockfile
        uses: actions/upload-artifact@v4
        with:
          name: phase115-a03-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
