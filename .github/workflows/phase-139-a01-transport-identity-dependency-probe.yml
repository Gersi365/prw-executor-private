name: Phase 139 A01 Transport Identity Dependency Probe

on:
  push:
    paths:
      - '.github/workflows/phase-139-a01-transport-identity-dependency-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact transport stack plus existing AWS-LC digest provider
        shell: bash
        run: |
          set -Eeuo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cd "$scratch"
          cat > Cargo.toml <<'EOF'
          [package]
          name = "prw-phase139-a01-probe"
          version = "0.0.0"
          edition = "2024"
          rust-version = "1.97.1"
          publish = false

          [dependencies]
          quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
          rustls = { version = "=0.23.43", default-features = false, features = ["std", "aws_lc_rs"] }
          tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "net", "time", "sync", "io-util"] }
          aws-lc-rs = { version = "=1.18.0", default-features = true }
          EOF
          mkdir src
          cat > src/main.rs <<'EOF'
          use aws_lc_rs::digest::{SHA256, digest};
          use rustls::{pki_types::CertificateDer, server::ParsedCertificate};

          fn fingerprint(cert: &CertificateDer<'_>) -> Result<[u8; 32], rustls::Error> {
              let parsed = ParsedCertificate::try_from(cert)?;
              let spki = parsed.subject_public_key_info();
              let value = digest(&SHA256, spki.as_ref());
              let mut result = [0_u8; 32];
              result.copy_from_slice(value.as_ref());
              Ok(result)
          }

          fn main() {
              let _ = fingerprint as fn(&CertificateDer<'_>) -> Result<[u8; 32], rustls::Error>;
              let _ = std::mem::size_of::<quinn::EndpointConfig>();
              let _ = tokio::runtime::Builder::new_current_thread().enable_time().build();
          }
          EOF
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('metadata.json').read_text())
          expected = {
              'quinn': '0.11.11',
              'rustls': '0.23.43',
              'tokio': '1.53.1',
              'aws-lc-rs': '1.18.0',
          }
          found = {}
          for p in data['packages']:
              if p['name'] in expected:
                  found.setdefault(p['name'], set()).add(p['version'])
          for name, version in expected.items():
              if found.get(name) != {version}:
                  raise SystemExit(f'{name} mismatch: {found.get(name)!r}')
          print('phase139_a01_exact_versions=pass')
          PY
          cargo check --locked --all-targets
          echo "phase139_a01_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"
          echo 'phase139_a01_spki_sha256_compile=pass'
          cd "$GITHUB_WORKSPACE"
          git diff --exit-code
          echo 'phase139_a01_repo_immutable=pass'
