name: PRW Phase 152 C02e Tranche2 Format Corrective

on:
  push:
    branches:
      - phase-152-c02e-dynamic-reachability-design
    paths:
      - ".github/workflows/phase-152-c02e-tranche2-format-corrective.yml"

permissions:
  contents: write

concurrency:
  group: prw-phase-152-c02e-tranche2-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    name: Format only Phase141 integration test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact corrective base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pinned rustfmt only to Tranche2 test
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="phase-152-c02e-dynamic-reachability-design"
          BASE_HEAD="$(git rev-parse HEAD)"
          TEST="crates/prw-remote-bridge/tests/reachability_phase141_integration.rs"
          MANIFEST="crates/prw-remote-bridge/Cargo.toml"

          LOCK_BEFORE="$(sha256sum Cargo.lock | awk '{print $1}')"
          MANIFEST_BEFORE="$(sha256sum "${MANIFEST}" | awk '{print $1}')"

          rustc --version
          rustfmt --version
          rustfmt --edition 2024 "${TEST}"
          rustfmt --edition 2024 --check "${TEST}"

          LOCK_AFTER="$(sha256sum Cargo.lock | awk '{print $1}')"
          MANIFEST_AFTER="$(sha256sum "${MANIFEST}" | awk '{print $1}')"
          [[ "${LOCK_BEFORE}" == "${LOCK_AFTER}" ]]
          [[ "${MANIFEST_BEFORE}" == "${MANIFEST_AFTER}" ]]

          mapfile -t CHANGED < <(git diff --name-only)
          if [[ ${#CHANGED[@]} -ne 1 || "${CHANGED[0]}" != "${TEST}" ]]; then
            printf 'unexpected formatter mutation set:\n' >&2
            printf '%s\n' "${CHANGED[@]}" >&2
            exit 91
          fi

          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [[ "${REMOTE_HEAD}" != "${BASE_HEAD}" ]]; then
            echo "branch advanced during formatter corrective" >&2
            exit 92
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TEST}"
          git commit -m "phase 152 c02e: rustfmt tranche2 phase141 integration"
          git push origin "HEAD:${BRANCH}"
