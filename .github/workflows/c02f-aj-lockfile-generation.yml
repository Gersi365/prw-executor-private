name: Phase 152 C02f-AJ Lockfile Generation

on:
  push:
    branches:
      - phase-152-c02f-aj-provider-client-source-materialization-staging
    paths:
      - 'crates/prw-control-plane/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/c02f-aj-lockfile-generation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfile:
    name: Generate Cargo lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          rustc --version
          cargo --version

      - name: Generate lockfile with canonical Cargo
        run: cargo generate-lockfile

      - name: Verify AJ dependency pins are locked
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'name = "google-cloud-spanner"' Cargo.lock
          grep -F 'version = "0.34.4-preview"' Cargo.lock
          grep -F 'name = "google-cloud-gax"' Cargo.lock
          grep -F 'version = "1.13.0"' Cargo.lock

      - name: Upload Cargo.lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: c02f-aj-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
