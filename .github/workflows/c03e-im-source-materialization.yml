name: C03e-IM source materialization helper

on:
  push:
    branches:
      - phase-152-c03e-im-transport-helper

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded C03e-IM rustfmt correction
        shell: bash
        env:
          TARGET_BRANCH: phase-152-c03e-im-production-remote-bind-address-executable-input-population-source-materialization
          EXPECTED_TARGET_HEAD: 51b14eae597b703df81a8c37c6972f7ab4e0c989
          EXPECTED_SOURCE_BLOB: d797c9b7272dfa5fcd45a1383d1bef035e9bb10f
          SOURCE_PATH: crates/prw-agent/src/linux_bootstrap.rs
        run: |
          set -Eeuo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_TARGET_HEAD"
          git checkout -B c03e-im-format-work "origin/$TARGET_BRANCH"
          test "$(git hash-object "$SOURCE_PATH")" = "$EXPECTED_SOURCE_BLOB"

          python - <<'PY'
          from pathlib import Path

          path = Path("crates/prw-agent/src/linux_bootstrap.rs")
          text = path.read_text()
          old = """pub(crate) fn linux_agent_remote_process_operation_inputs_from_production_bind_addr<\n    P, D, T, F, C, R, E,\n>(\n"""
          new = """pub(crate) fn linux_agent_remote_process_operation_inputs_from_production_bind_addr<\n    P,\n    D,\n    T,\n    F,\n    C,\n    R,\n    E,\n>(\n"""
          if text.count(old) != 1:
              raise SystemExit("expected IM helper generic formatting target exactly once")
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$SOURCE_PATH"
          test "$(git diff --numstat -- "$SOURCE_PATH")" = $'7\t1\tcrates/prw-agent/src/linux_bootstrap.rs'
          test "$(grep -c '^pub(crate) fn linux_agent_remote_process_operation_inputs_from_production_bind_addr<' "$SOURCE_PATH")" -eq 1
          test "$(grep -c 'let bind_addr = load_linux_agent_remote_bind_addr_from_env()?;' "$SOURCE_PATH")" -eq 1

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SOURCE_PATH"
          git commit -m 'C03e-IM: rustfmt production bind input helper'
          git push origin HEAD:"$TARGET_BRANCH"
