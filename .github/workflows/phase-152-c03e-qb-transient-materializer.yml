name: Phase 152 C03e-QB Transient Guarded One-Path Materializer

on:
  push:
    branches:
      - phase-152-c03e-qb-production-durable-reachability-fallible-verifier-time-higher-owner-operation-source-materialization

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize selected higher-owner source seam
        shell: bash
        env:
          BASE: 00c3896fc9d5171b7ec3e52fb8afdee064bb3c9e
          BRANCH: phase-152-c03e-qb-production-durable-reachability-fallible-verifier-time-higher-owner-operation-source-materialization
          SOURCE: crates/prw-agent/src/production_durable_capability_higher_owner_custody.rs
          SOURCE_BLOB: 5c8943a43f100bcfea2e63056ed368ac3dbdeb2b
          HELPER: .github/workflows/phase-152-c03e-qb-transient-materializer.yml
          BLOCK_B64: 
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse "HEAD:$SOURCE")" = "$SOURCE_BLOB"

          mapfile -t pre_paths < <(git diff --name-only "$BASE..HEAD")
          test "${#pre_paths[@]}" -eq 1
          test "${pre_paths[0]}" = "$HELPER"

          target='pub(crate) fn linux_agent_production_durable_reachability_remote_process_operation_with_fallible_verifier_time_completion_projection<'
          lower='linux_agent_production_reachability_remote_process_operation_with_fallible_verifier_time_completion_projection('
          marker='/// Builds one dormant production operation that retains durable capability-authority custody.'

          test "$(grep -cF "$target" "$SOURCE" || true)" -eq 0
          test "$(grep -cF "$lower" "$SOURCE" || true)" -eq 0
          test "$(grep -cF "$marker" "$SOURCE" || true)" -eq 1

          printf '%s' "$BLOCK_B64" | base64 -d > /tmp/qb-block.rs
          python3 - "$SOURCE" /tmp/qb-block.rs <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1])
          block = Path(sys.argv[2]).read_text(encoding="utf-8")
          text = source.read_text(encoding="utf-8")
          marker = "/// Builds one dormant production operation that retains durable capability-authority custody."
          target = "pub(crate) fn linux_agent_production_durable_reachability_remote_process_operation_with_fallible_verifier_time_completion_projection<"
          lower = "linux_agent_production_reachability_remote_process_operation_with_fallible_verifier_time_completion_projection("
          assert text.count(marker) == 1
          assert text.count(target) == 0
          assert text.count(lower) == 0
          source.write_text(text.replace(marker, block + "\n" + marker, 1), encoding="utf-8")
          PY

          rustup component add rustfmt
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

          test "$(grep -cF "$target" "$SOURCE" || true)" -eq 1
          test "$(grep -cF "$lower" "$SOURCE" || true)" -eq 1

          git diff --unified=0 -- "$SOURCE" | grep '^+' | grep -v '^+++' > /tmp/qb-added-lines.txt || true
          if grep -E 'Arc::(new|clone)|authorize_capability_transaction|SharedRequesterRendezvousAuthority|sender\.send|block_on' /tmp/qb-added-lines.txt; then
            echo "forbidden selected-boundary widening detected" >&2
            exit 1
          fi

          mapfile -t source_paths < <(git diff --name-only)
          test "${#source_paths[@]}" -eq 1
          test "${source_paths[0]}" = "$SOURCE"

          git add "$SOURCE"
          git commit -m "C03e-QB: materialize durable reachability fallible verifier-time higher-owner operation"

          git rm "$HELPER"
          git commit -m "C03e-QB: remove transient one-path materializer"

          test ! -e "$HELPER"
          mapfile -t final_paths < <(git diff --name-only "$BASE..HEAD")
          test "${#final_paths[@]}" -eq 1
          test "${final_paths[0]}" = "$SOURCE"

          git push origin HEAD:"$BRANCH"
