name: Phase 152 C02f-BX guarded lockgraph corrective

on:
  push:
    branches:
      - phase-152-c02f-bx-provider-client-bootstrap-source-materialization-staging
    paths:
      - .github/workflows/phase-152-c02f-bx-lockgraph-corrective.yml
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase-152-c02f-bx-lockgraph-corrective
  cancel-in-progress: false

jobs:
  correct-lockgraph:
    if: >-
      github.repository == 'Gersi365/prw-executor-private' &&
      (github.event_name == 'push' || github.event.pull_request.head.ref == 'phase-152-c02f-bx-provider-client-bootstrap-source-materialization-staging')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: phase-152-c02f-bx-provider-client-bootstrap-source-materialization-staging
          fetch-depth: 0

      - name: Resolve all-feature lock graph
        run: cargo metadata --all-features --format-version 1 > /dev/null

      - name: Prove Cargo.lock delta is exact or already materialized
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          text = Path("Cargo.lock").read_text()
          marker = '''name = "rustls"\nversion = "0.23.43"'''
          start = text.index(marker)
          end = text.index("\n[[package]]", start)
          stanza = text[start:end]
          has_ring = '\n "ring",\n' in stanza
          output_path = os.environ["GITHUB_OUTPUT"]

          if not changed:
              if not has_ring:
                  raise SystemExit("Cargo produced no diff but rustls 0.23.43 still lacks ring")
              with open(output_path, "a") as output:
                  output.write("needs_commit=false\n")
              raise SystemExit(0)

          if changed != ["Cargo.lock"]:
              raise SystemExit(f"unexpected changed files: {changed!r}")

          patch = subprocess.check_output(["git", "diff", "--unified=3", "--", "Cargo.lock"], text=True)
          added = [line for line in patch.splitlines() if line.startswith("+") and not line.startswith("+++")]
          removed = [line for line in patch.splitlines() if line.startswith("-") and not line.startswith("---")]
          if added != ['+ "ring",'] or removed:
              raise SystemExit(f"unexpected Cargo.lock patch; added={added!r}, removed={removed!r}\n{patch}")
          if not has_ring:
              raise SystemExit("rustls 0.23.43 stanza does not contain ring dependency")
          print(patch)
          with open(output_path, "a") as output:
              output.write("needs_commit=true\n")
          PY

      - name: Commit exact guarded lock edge
        if: steps.guard.outputs.needs_commit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "phase 152 c02f-bx: materialize tls lock edge"
          git push origin HEAD:phase-152-c02f-bx-provider-client-bootstrap-source-materialization-staging
