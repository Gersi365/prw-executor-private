name: Phase 123 Real systemd Custody Delivery Proof

on:
  push:
    paths:
      - '.github/workflows/phase-123-real-systemd-delivery-proof.yml'

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record and validate locked toolchain
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Build disposable Phase 123 probe against exact Phase 122 adapter
        shell: bash
        run: |
          set -Eeuo pipefail
          example='crates/prw-device-identity-custody/examples/phase123_probe.rs'
          mkdir -p "$(dirname "$example")"
          cat > "$example" <<'RS'
          use std::{
              env,
              fs::{self, OpenOptions},
              io::Write,
              os::unix::fs::{MetadataExt, OpenOptionsExt},
              path::Path,
              process::ExitCode,
          };

          use aws_lc_rs::{
              rand::SystemRandom,
              signature::{ECDSA_P256_SHA256_ASN1_SIGNING, EcdsaKeyPair},
          };
          use prw_device_identity_custody::{
              SYSTEMD_CREDENTIALS_DIRECTORY_ENV, SYSTEMD_DEVICE_IDENTITY_CREDENTIAL_NAME,
              load_ubuntu_enrollment_signer_from_systemd_credential,
          };

          fn generate(path: &Path) -> Result<(), String> {
              let key = EcdsaKeyPair::generate_pkcs8(
                  &ECDSA_P256_SHA256_ASN1_SIGNING,
                  &SystemRandom::new(),
              )
              .map_err(|_| "disposable key generation failed".to_owned())?;
              let mut file = OpenOptions::new()
                  .write(true)
                  .create_new(true)
                  .mode(0o600)
                  .open(path)
                  .map_err(|_| "disposable key file creation failed".to_owned())?;
              file.write_all(key.as_ref())
                  .map_err(|_| "disposable key file write failed".to_owned())?;
              file.sync_all()
                  .map_err(|_| "disposable key file sync failed".to_owned())?;
              println!("phase123_generate=success bytes={}", key.as_ref().len());
              Ok(())
          }

          fn load() -> Result<(), String> {
              let directory = env::var_os(SYSTEMD_CREDENTIALS_DIRECTORY_ENV)
                  .ok_or_else(|| "credentials directory missing".to_owned())?;
              let directory = Path::new(&directory);
              let credential = directory.join(SYSTEMD_DEVICE_IDENTITY_CREDENTIAL_NAME);

              let directory_metadata = fs::symlink_metadata(directory)
                  .map_err(|_| "credential directory metadata unavailable".to_owned())?;
              let credential_metadata = fs::symlink_metadata(&credential)
                  .map_err(|_| "credential metadata unavailable".to_owned())?;

              println!(
                  "phase123_credentials_directory uid={} gid={} mode={:04o} symlink={} directory={}",
                  directory_metadata.uid(),
                  directory_metadata.gid(),
                  directory_metadata.mode() & 0o7777,
                  directory_metadata.file_type().is_symlink(),
                  directory_metadata.file_type().is_dir()
              );
              println!(
                  "phase123_credential_file uid={} gid={} mode={:04o} symlink={} regular={}",
                  credential_metadata.uid(),
                  credential_metadata.gid(),
                  credential_metadata.mode() & 0o7777,
                  credential_metadata.file_type().is_symlink(),
                  credential_metadata.file_type().is_file()
              );

              let signer = load_ubuntu_enrollment_signer_from_systemd_credential()
                  .map_err(|error| format!("custody adapter rejected delivered credential: {error}"))?;
              println!(
                  "phase123_custody_load=success public_identity_len={}",
                  signer.public_identity().as_bytes().len()
              );
              Ok(())
          }

          fn main() -> ExitCode {
              let mut args = env::args_os();
              let _program = args.next();
              let result = match args.next().as_deref() {
                  Some(command) if command == "generate" => match args.next() {
                      Some(path) if args.next().is_none() => generate(Path::new(&path)),
                      _ => Err("generate requires exactly one output path".to_owned()),
                  },
                  Some(command) if command == "load" && args.next().is_none() => load(),
                  _ => Err("expected generate <path> or load".to_owned()),
              };
              match result {
                  Ok(()) => ExitCode::SUCCESS,
                  Err(error) => {
                      eprintln!("phase123_probe_error={error}");
                      ExitCode::FAILURE
                  }
              }
          }
          RS
          cargo fmt -- "$example"
          cargo build --release --locked -p prw-device-identity-custody --example phase123_probe
          install -m 0755 target/release/examples/phase123_probe "$RUNNER_TEMP/phase123-probe"
          sha256sum "$RUNNER_TEMP/phase123-probe"
      - name: Upload probe binary only
        uses: actions/upload-artifact@v4
        with:
          name: phase123-probe
          path: ${{ runner.temp }}/phase123-probe
          if-no-files-found: error
          retention-days: 1

  real-host-proof:
    needs: build-probe
    runs-on: [self-hosted, prw-host]
    timeout-minutes: 8
    steps:
      - name: Download validated disposable probe
        uses: actions/download-artifact@v4
        with:
          name: phase123-probe
          path: ${{ runner.temp }}/phase123-download
      - name: Prove exact Phase 122 adapter through real transient user-service delivery
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "phase123_real_host=begin"
          echo "hostname=$(hostname)"
          echo "user=$(id -un)"
          echo "uid=$(id -u)"
          echo "gid=$(id -g)"
          echo "xdg_runtime_dir=${XDG_RUNTIME_DIR:-}"

          test "$(hostname)" = "PowerCode"
          test "$(id -un)" = "gersi365"
          test "$(id -u)" = "1000"
          test "$(id -g)" = "1000"
          test "${XDG_RUNTIME_DIR:-}" = "/run/user/1000"

          command -v systemd-creds
          command -v systemd-run
          command -v systemctl
          command -v loginctl
          systemd-creds --version | head -n 1
          systemctl --version | head -n 1
          systemctl --user is-system-running
          echo "tpm2_capability=$(systemd-creds has-tpm2 2>&1 || true)"

          agent=/usr/lib/private-remote-workspace/prw-agent
          unit=/usr/lib/systemd/user/prw-agent.service
          test -f "$agent"
          test -f "$unit"
          test ! -L "$agent"
          test ! -L "$unit"

          before_agent_sha=$(sha256sum "$agent" | awk '{print $1}')
          before_unit_sha=$(sha256sum "$unit" | awk '{print $1}')
          before_service=$(systemctl --user show prw-agent.service -p LoadState -p ActiveState -p SubState -p UnitFileState -p FragmentPath --no-pager)
          before_linger=$(loginctl show-user "$(id -un)" -p Linger --value)
          before_credential_files=$(find "$HOME" -maxdepth 5 -type f \( -iname '*credential*secret*' -o -path '*/systemd/*credential*' \) -printf '%p mode=%m uid=%U gid=%G\n' 2>/dev/null | sort || true)

          test "$before_agent_sha" = "8d0fa919676d1d55200801dd979a5463228610ad0f5aea1d2fd8bbded7047fbf"
          test "$before_unit_sha" = "24f646dc96777542904cd824f1678e6c32256b64911d4a031c0315d198c0a909"
          grep -Fxq 'LoadState=loaded' <<<"$before_service"
          grep -Fxq 'ActiveState=active' <<<"$before_service"
          grep -Fxq 'SubState=running' <<<"$before_service"
          grep -Fxq 'UnitFileState=enabled' <<<"$before_service"
          test "$before_linger" = "yes"

          echo "agent_sha_before=$before_agent_sha"
          echo "unit_sha_before=$before_unit_sha"
          printf '%s\n' "$before_service"
          echo "linger_before=$before_linger"

          tmp=$(mktemp -d "${RUNNER_TEMP:-/tmp}/prw-phase123.XXXXXX")
          chmod 700 "$tmp"
          cleanup() {
            if [[ -f "$tmp/plain.pk8" ]]; then
              python3 - "$tmp/plain.pk8" <<'PY' || true
          import os
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          try:
              size = path.stat().st_size
              with path.open('r+b', buffering=0) as handle:
                  handle.write(b'\0' * size)
                  handle.flush()
                  os.fsync(handle.fileno())
          finally:
              try:
                  path.unlink()
              except FileNotFoundError:
                  pass
          PY
            fi
            rm -rf -- "$tmp" "${RUNNER_TEMP:-/tmp}/phase123-download"
          }
          trap cleanup EXIT INT TERM

          probe="${RUNNER_TEMP:-/tmp}/phase123-download/phase123-probe"
          test -f "$probe"
          test ! -L "$probe"
          chmod 0755 "$probe"
          echo "probe_sha=$(sha256sum "$probe" | awk '{print $1}')"

          plain="$tmp/plain.pk8"
          encrypted="$tmp/device-identity.cred"
          output="$tmp/service-output.txt"

          "$probe" generate "$plain"
          test -f "$plain"
          test ! -L "$plain"
          test "$(stat -c '%u:%g:%a' "$plain")" = "1000:1000:600"
          plain_size=$(stat -c '%s' "$plain")
          test "$plain_size" -gt 0
          test "$plain_size" -le 4096
          echo "disposable_plaintext_size=$plain_size"

          systemd-creds --user encrypt \
            --name=prw.device-identity.private-key.v1 \
            "$plain" "$encrypted" >/dev/null
          test -s "$encrypted"
          test ! -L "$encrypted"
          echo "encrypted_credential_sha=$(sha256sum "$encrypted" | awk '{print $1}')"

          python3 - "$plain" <<'PY'
          import os
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          size = path.stat().st_size
          with path.open('r+b', buffering=0) as handle:
              handle.write(b'\0' * size)
              handle.flush()
              os.fsync(handle.fileno())
          path.unlink()
          PY
          test ! -e "$plain"
          echo "disposable_plaintext_removed_before_delivery=pass"

          set +e
          systemd-run --user --wait --pipe --collect \
            -p "LoadCredentialEncrypted=prw.device-identity.private-key.v1:$encrypted" \
            -- "$probe" load >"$output" 2>&1
          probe_rc=$?
          set -e
          echo "phase123_transient_service_rc=$probe_rc"
          cat "$output"

          after_agent_sha=$(sha256sum "$agent" | awk '{print $1}')
          after_unit_sha=$(sha256sum "$unit" | awk '{print $1}')
          after_service=$(systemctl --user show prw-agent.service -p LoadState -p ActiveState -p SubState -p UnitFileState -p FragmentPath --no-pager)
          after_linger=$(loginctl show-user "$(id -un)" -p Linger --value)
          after_credential_files=$(find "$HOME" -maxdepth 5 -type f \( -iname '*credential*secret*' -o -path '*/systemd/*credential*' \) -printf '%p mode=%m uid=%U gid=%G\n' 2>/dev/null | sort || true)

          test "$after_agent_sha" = "$before_agent_sha"
          test "$after_unit_sha" = "$before_unit_sha"
          test "$after_service" = "$before_service"
          test "$after_linger" = "$before_linger"
          test "$after_credential_files" = "$before_credential_files"

          echo "agent_sha_after=$after_agent_sha"
          echo "unit_sha_after=$after_unit_sha"
          printf '%s\n' "$after_service"
          echo "linger_after=$after_linger"
          echo "home_credential_inventory_unchanged=pass"

          rm -rf -- "$tmp" "${RUNNER_TEMP:-/tmp}/phase123-download"
          trap - EXIT INT TERM

          test "$probe_rc" -eq 0
          grep -Fq 'phase123_custody_load=success' "$output" 2>/dev/null || true
          echo "phase123_real_host=success"
