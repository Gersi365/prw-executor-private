name: PRW Phase 152 C02e Tranche5 Freshness Wire Validation
on:
  push:
    branches: [phase-152-c02e-dynamic-reachability-design]
    paths:
      - .github/workflows/phase-152-c02e-tranche5-freshness-wire-validation.yml
      - crates/prw-remote-bridge/src/root.rs
      - crates/prw-remote-bridge/src/reachability_freshness_wire.rs
      - crates/prw-remote-bridge/tests/reachability_freshness_wire.rs
      - contracts/DESKTOP_FUNCTIONAL_MANAGEMENT_SLICE_C02E_TRANCHE5_FRESHNESS_TOKEN_WIRE_RESYNCHRONIZATION.md
      - logs/audits/phase-152-c02e-dynamic-reachability-design/C02E_TRANCHE5_FRESHNESS_TOKEN_WIRE_RESYNCHRONIZATION_AUDIT.md
permissions:
  contents: write
concurrency:
  group: prw-c02e-tranche5-freshness-wire-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [focused, workspace_clippy, workspace_tests, workspace_build]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate lane with integrity guards
        shell: bash
        run: |
          set -uo pipefail
          LANE='${{ matrix.lane }}'
          OUT="${RUNNER_TEMP}/lane-${LANE}.txt"
          EXPECTED_LOCK=becbd46de66354591afd3a4d755a9b4ba06f9c9c15045069b85e04a99525423a
          BASE_HEAD="$(git rev-parse HEAD)"
          LOCK_BEFORE="$(sha256sum Cargo.lock | awk '{print $1}')"
          ROOT_MANIFEST_BEFORE="$(sha256sum Cargo.toml | awk '{print $1}')"
          BRIDGE_MANIFEST_BEFORE="$(sha256sum crates/prw-remote-bridge/Cargo.toml | awk '{print $1}')"
          ROOT_SOURCE_BEFORE="$(sha256sum crates/prw-remote-bridge/src/root.rs | awk '{print $1}')"
          WIRE_SOURCE_BEFORE="$(sha256sum crates/prw-remote-bridge/src/reachability_freshness_wire.rs | awk '{print $1}')"
          TEST_BEFORE="$(sha256sum crates/prw-remote-bridge/tests/reachability_freshness_wire.rs | awk '{print $1}')"
          STATUS=PASS
          FIRST_FAILURE=NONE
          : > "${RUNNER_TEMP}/rcs"
          : > "${RUNNER_TEMP}/failure-tail"
          fail_once() {
            if [[ "${STATUS}" == PASS ]]; then STATUS=FAIL; FIRST_FAILURE="$1"; fi
          }
          gate() {
            local name="$1"; shift
            set +e
            "$@" >"${RUNNER_TEMP}/${LANE}-${name}.log" 2>&1
            local rc=$?
            set -e
            echo "${name}_RC=${rc}" >> "${RUNNER_TEMP}/rcs"
            if [[ ${rc} -ne 0 ]]; then
              fail_once "${name}"
              { echo "===== ${name} FAILURE ====="; tail -n 240 "${RUNNER_TEMP}/${LANE}-${name}.log"; } >> "${RUNNER_TEMP}/failure-tail"
            fi
          }

          LOCK_AUDIT_RC=0
          if [[ "${LOCK_BEFORE}" != "${EXPECTED_LOCK}" ]]; then LOCK_AUDIT_RC=90; fail_once LOCK_AUDIT; fi
          gate NATIVE_PREREQUISITES bash -lc 'sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libgtk-4-dev libadwaita-1-dev'

          if [[ "${STATUS}" == PASS ]]; then
            case "${LANE}" in
              focused)
                gate LOCKED_METADATA cargo metadata --locked --no-deps --format-version 1
                if [[ "${STATUS}" == PASS ]]; then gate FORMAT cargo fmt --all -- --check; fi
                if [[ "${STATUS}" == PASS ]]; then gate FOCUSED_TEST cargo test --locked -p prw-remote-bridge --test reachability_freshness_wire; fi
                if [[ "${STATUS}" == PASS ]]; then gate FOCUSED_CLIPPY cargo clippy --locked -p prw-remote-bridge --all-targets --all-features -- -D warnings; fi
                ;;
              workspace_clippy)
                gate WORKSPACE_CLIPPY cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
                ;;
              workspace_tests)
                gate WORKSPACE_TESTS cargo test --locked --workspace --all-targets
                ;;
              workspace_build)
                gate WORKSPACE_BUILD cargo build --locked --workspace --all-targets
                ;;
              *)
                fail_once UNKNOWN_LANE
                ;;
            esac
          fi

          mapfile -t PRE_DIFF < <(git diff --name-only)
          PRE_NORMALIZE_DRIFT_RC=0
          for changed in "${PRE_DIFF[@]}"; do
            if [[ -n "${changed}" && "${changed}" != target/* ]]; then PRE_NORMALIZE_DRIFT_RC=91; fail_once PRE_NORMALIZE_DRIFT; break; fi
          done
          set +e
          git checkout -- target
          TARGET_RESTORE_RC=$?
          set -e
          if [[ ${TARGET_RESTORE_RC} -ne 0 ]]; then fail_once TARGET_RESTORE; fi

          LOCK_AFTER="$(sha256sum Cargo.lock | awk '{print $1}')"
          ROOT_MANIFEST_AFTER="$(sha256sum Cargo.toml | awk '{print $1}')"
          BRIDGE_MANIFEST_AFTER="$(sha256sum crates/prw-remote-bridge/Cargo.toml | awk '{print $1}')"
          ROOT_SOURCE_AFTER="$(sha256sum crates/prw-remote-bridge/src/root.rs | awk '{print $1}')"
          WIRE_SOURCE_AFTER="$(sha256sum crates/prw-remote-bridge/src/reachability_freshness_wire.rs | awk '{print $1}')"
          TEST_AFTER="$(sha256sum crates/prw-remote-bridge/tests/reachability_freshness_wire.rs | awk '{print $1}')"
          HASH_DRIFT_RC=0
          if [[ "${LOCK_BEFORE}" != "${LOCK_AFTER}" || "${LOCK_AFTER}" != "${EXPECTED_LOCK}" || "${ROOT_MANIFEST_BEFORE}" != "${ROOT_MANIFEST_AFTER}" || "${BRIDGE_MANIFEST_BEFORE}" != "${BRIDGE_MANIFEST_AFTER}" || "${ROOT_SOURCE_BEFORE}" != "${ROOT_SOURCE_AFTER}" || "${WIRE_SOURCE_BEFORE}" != "${WIRE_SOURCE_AFTER}" || "${TEST_BEFORE}" != "${TEST_AFTER}" ]]; then HASH_DRIFT_RC=92; fail_once HASH_DRIFT; fi
          mapfile -t FINAL_DIFF < <(git diff --name-only)
          FINAL_DRIFT_RC=0
          if [[ ${#FINAL_DIFF[@]} -ne 0 ]]; then FINAL_DRIFT_RC=93; fail_once FINAL_DRIFT; fi

          {
            echo "LANE=${LANE}"
            echo "BASE_HEAD=${BASE_HEAD}"
            echo "RUSTC=$(rustc --version)"
            echo "CARGO=$(cargo --version)"
            echo "RUSTFMT=$(rustfmt --version)"
            echo "CLIPPY=$(cargo clippy --version)"
            echo "GTK4=$(pkg-config --modversion gtk4 2>/dev/null || true)"
            echo "LIBADWAITA=$(pkg-config --modversion libadwaita-1 2>/dev/null || true)"
            echo "LOCK_SHA256_EXPECTED=${EXPECTED_LOCK}"
            echo "LOCK_SHA256_BEFORE=${LOCK_BEFORE}"
            echo "LOCK_SHA256_AFTER=${LOCK_AFTER}"
            echo "LOCK_AUDIT_RC=${LOCK_AUDIT_RC}"
            cat "${RUNNER_TEMP}/rcs"
            echo "PRE_NORMALIZE_DRIFT_RC=${PRE_NORMALIZE_DRIFT_RC}"
            echo "TARGET_RESTORE_RC=${TARGET_RESTORE_RC}"
            echo "HASH_DRIFT_RC=${HASH_DRIFT_RC}"
            echo "FINAL_DRIFT_RC=${FINAL_DRIFT_RC}"
            echo "FINAL_TRACKED_DIFF=$(printf '%s,' "${FINAL_DIFF[@]}" | sed 's/,$//')"
            echo "FIRST_FAILURE=${FIRST_FAILURE}"
            echo "STATUS=${STATUS}"
            cat "${RUNNER_TEMP}/failure-tail" 2>/dev/null || true
          } > "${OUT}"
      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tranche5-${{ matrix.lane }}
          path: ${{ runner.temp }}/lane-${{ matrix.lane }}.txt
          if-no-files-found: error
          retention-days: 1

  evidence:
    name: Commit authoritative evidence
    needs: gates
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Download lane evidence
        uses: actions/download-artifact@v4
        with:
          pattern: tranche5-*
          path: ${{ runner.temp }}/tranche5-results
          merge-multiple: true
      - name: Aggregate and commit exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=phase-152-c02e-dynamic-reachability-design
          SELF=.github/workflows/phase-152-c02e-tranche5-freshness-wire-validation.yml
          BASE_HEAD="$(git rev-parse HEAD)"
          RESULTS="${RUNNER_TEMP}/tranche5-results"
          REPORT="logs/audits/phase-152-c02e-dynamic-reachability-design/C02E_TRANCHE5_FRESHNESS_WIRE_VALIDATION_${BASE_HEAD}.txt"
          STATUS=PASS
          FIRST_FAILURE=NONE
          for lane in focused workspace_clippy workspace_tests workspace_build; do
            file="${RESULTS}/lane-${lane}.txt"
            if [[ ! -f "${file}" ]]; then STATUS=FAIL; [[ "${FIRST_FAILURE}" == NONE ]] && FIRST_FAILURE="MISSING_${lane^^}_EVIDENCE"; continue; fi
            lane_head="$(awk -F= '$1=="BASE_HEAD"{print $2; exit}' "${file}")"
            lane_status="$(awk -F= '$1=="STATUS"{print $2; exit}' "${file}")"
            lane_failure="$(awk -F= '$1=="FIRST_FAILURE"{print $2; exit}' "${file}")"
            if [[ "${lane_head}" != "${BASE_HEAD}" ]]; then STATUS=FAIL; [[ "${FIRST_FAILURE}" == NONE ]] && FIRST_FAILURE="${lane^^}_HEAD_MISMATCH"; fi
            if [[ "${lane_status}" != PASS ]]; then STATUS=FAIL; [[ "${FIRST_FAILURE}" == NONE ]] && FIRST_FAILURE="${lane_failure}"; fi
          done
          mkdir -p "$(dirname "${REPORT}")"
          {
            echo PHASE=152-C02e-Tranche5-FreshnessWire
            echo "BASE_HEAD=${BASE_HEAD}"
            echo VALIDATOR_MODE=PARALLEL_EXACT_HEAD
            for lane in focused workspace_clippy workspace_tests workspace_build; do
              echo "===== LANE ${lane} ====="
              cat "${RESULTS}/lane-${lane}.txt" 2>/dev/null || true
            done
            echo FRESHNESS_WIRE_MAGIC=PRWF
            echo FRESHNESS_WIRE_VERSION=1.0
            echo OUTER_CONTROL_KINDS=REQUEST,RESPONSE,ERROR
            echo AUTHENTICATED_DURABLE_RESYNC=YES
            echo RESYNC_COMPARE_AND_COMMIT=NO
            echo RESYNC_TOKEN_GENERATION=NO
            echo DISTRIBUTED_RUNTIME_TENANCY_SELECTED=NO
            echo NETWORK_RUNTIME_ACTIVATION=NO
            echo AGENT_BOOTSTRAP_ACTIVATION=NO
            echo "FIRST_FAILURE=${FIRST_FAILURE}"
            echo "STATUS=${STATUS}"
          } > "${REPORT}"
          REMOTE="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          [[ "${REMOTE}" == "${BASE_HEAD}" ]]
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${REPORT}"
          if [[ "${STATUS}" == PASS ]]; then
            git rm "${SELF}"
            git commit -m "phase 152 c02e: validate tranche5 freshness wire ${BASE_HEAD:0:12}"
          else
            git commit -m "phase 152 c02e: record tranche5 freshness wire failure ${BASE_HEAD:0:12}"
          fi
          git push origin "HEAD:${BRANCH}"
          test "${STATUS}" = PASS
