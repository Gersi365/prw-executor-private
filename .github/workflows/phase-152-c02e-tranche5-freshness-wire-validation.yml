name: PRW Phase 152 C02e Tranche5 Freshness Wire Validation
on:
  push:
    branches: [phase-152-c02e-dynamic-reachability-design]
    paths:
      - .github/workflows/phase-152-c02e-tranche5-freshness-wire-validation.yml
      - crates/prw-remote-bridge/src/root.rs
      - crates/prw-remote-bridge/src/reachability_freshness_wire.rs
      - crates/prw-remote-bridge/tests/reachability_freshness_wire.rs
      - contracts/DESKTOP_FUNCTIONAL_MANAGEMENT_SLICE_C02E_TRANCHE5_FRESHNESS_TOKEN_WIRE_RESYNCHRONIZATION.md
      - logs/audits/phase-152-c02e-dynamic-reachability-design/C02E_TRANCHE5_FRESHNESS_TOKEN_WIRE_RESYNCHRONIZATION_AUDIT.md
permissions:
  contents: write
concurrency:
  group: prw-c02e-tranche5-freshness-wire-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libgtk-4-dev libadwaita-1-dev
      - name: Validate exact candidate
        id: validate
        shell: bash
        run: |
          set -uo pipefail
          BASE_HEAD="$(git rev-parse HEAD)"
          REPORT="logs/audits/phase-152-c02e-dynamic-reachability-design/C02E_TRANCHE5_FRESHNESS_WIRE_VALIDATION_${BASE_HEAD}.txt"
          EXPECTED_LOCK=becbd46de66354591afd3a4d755a9b4ba06f9c9c15045069b85e04a99525423a
          LOCK_BEFORE="$(sha256sum Cargo.lock | awk '{print $1}')"
          ROOT_MANIFEST_BEFORE="$(sha256sum Cargo.toml | awk '{print $1}')"
          BRIDGE_MANIFEST_BEFORE="$(sha256sum crates/prw-remote-bridge/Cargo.toml | awk '{print $1}')"
          ROOT_SOURCE_BEFORE="$(sha256sum crates/prw-remote-bridge/src/root.rs | awk '{print $1}')"
          WIRE_SOURCE_BEFORE="$(sha256sum crates/prw-remote-bridge/src/reachability_freshness_wire.rs | awk '{print $1}')"
          TEST_BEFORE="$(sha256sum crates/prw-remote-bridge/tests/reachability_freshness_wire.rs | awk '{print $1}')"
          STATUS=PASS; FIRST_FAILURE=NONE
          : > "${RUNNER_TEMP}/gate-rcs"; : > "${RUNNER_TEMP}/failure-tail"
          fail_once() { if [[ "${STATUS}" == PASS ]]; then STATUS=FAIL; FIRST_FAILURE="$1"; fi; }
          gate() {
            local name="$1"; shift
            set +e; "$@" >"${RUNNER_TEMP}/${name}.log" 2>&1; local rc=$?; set -e
            echo "${name}_RC=${rc}" >> "${RUNNER_TEMP}/gate-rcs"
            if [[ ${rc} -ne 0 ]]; then fail_once "${name}"; { echo "===== ${name} FAILURE ====="; tail -n 240 "${RUNNER_TEMP}/${name}.log"; } >> "${RUNNER_TEMP}/failure-tail"; fi
          }
          LOCK_AUDIT_RC=0
          if [[ "${LOCK_BEFORE}" != "${EXPECTED_LOCK}" ]]; then LOCK_AUDIT_RC=90; fail_once LOCK_AUDIT; fi
          if [[ "${STATUS}" == PASS ]]; then gate LOCKED_METADATA cargo metadata --locked --no-deps --format-version 1; fi
          if [[ "${STATUS}" == PASS ]]; then gate FORMAT cargo fmt --all -- --check; fi
          if [[ "${STATUS}" == PASS ]]; then gate FOCUSED_TEST cargo test --locked -p prw-remote-bridge --test reachability_freshness_wire; fi
          if [[ "${STATUS}" == PASS ]]; then gate FOCUSED_CLIPPY cargo clippy --locked -p prw-remote-bridge --all-targets --all-features -- -D warnings; fi
          if [[ "${STATUS}" == PASS ]]; then gate WORKSPACE_CLIPPY cargo clippy --locked --workspace --all-targets --all-features -- -D warnings; fi
          if [[ "${STATUS}" == PASS ]]; then gate WORKSPACE_TESTS cargo test --locked --workspace --all-targets; fi
          if [[ "${STATUS}" == PASS ]]; then gate WORKSPACE_BUILD cargo build --locked --workspace --all-targets; fi
          mapfile -t PRE_DIFF < <(git diff --name-only)
          PRE_NORMALIZE_DRIFT_RC=0
          for changed in "${PRE_DIFF[@]}"; do if [[ -n "${changed}" && "${changed}" != target/* ]]; then PRE_NORMALIZE_DRIFT_RC=91; fail_once PRE_NORMALIZE_DRIFT; break; fi; done
          set +e; git checkout -- target; TARGET_RESTORE_RC=$?; set -e
          if [[ ${TARGET_RESTORE_RC} -ne 0 ]]; then fail_once TARGET_RESTORE; fi
          LOCK_AFTER="$(sha256sum Cargo.lock | awk '{print $1}')"
          ROOT_MANIFEST_AFTER="$(sha256sum Cargo.toml | awk '{print $1}')"
          BRIDGE_MANIFEST_AFTER="$(sha256sum crates/prw-remote-bridge/Cargo.toml | awk '{print $1}')"
          ROOT_SOURCE_AFTER="$(sha256sum crates/prw-remote-bridge/src/root.rs | awk '{print $1}')"
          WIRE_SOURCE_AFTER="$(sha256sum crates/prw-remote-bridge/src/reachability_freshness_wire.rs | awk '{print $1}')"
          TEST_AFTER="$(sha256sum crates/prw-remote-bridge/tests/reachability_freshness_wire.rs | awk '{print $1}')"
          HASH_DRIFT_RC=0
          if [[ "${LOCK_BEFORE}" != "${LOCK_AFTER}" || "${LOCK_AFTER}" != "${EXPECTED_LOCK}" || "${ROOT_MANIFEST_BEFORE}" != "${ROOT_MANIFEST_AFTER}" || "${BRIDGE_MANIFEST_BEFORE}" != "${BRIDGE_MANIFEST_AFTER}" || "${ROOT_SOURCE_BEFORE}" != "${ROOT_SOURCE_AFTER}" || "${WIRE_SOURCE_BEFORE}" != "${WIRE_SOURCE_AFTER}" || "${TEST_BEFORE}" != "${TEST_AFTER}" ]]; then HASH_DRIFT_RC=92; fail_once HASH_DRIFT; fi
          mapfile -t FINAL_DIFF < <(git diff --name-only)
          FINAL_DRIFT_RC=0
          if [[ ${#FINAL_DIFF[@]} -ne 0 ]]; then FINAL_DRIFT_RC=93; fail_once FINAL_DRIFT; fi
          {
            echo PHASE=152-C02e-Tranche5-FreshnessWire
            echo "BASE_HEAD=${BASE_HEAD}"
            echo "RUSTC=$(rustc --version)"; echo "CARGO=$(cargo --version)"; echo "RUSTFMT=$(rustfmt --version)"; echo "CLIPPY=$(cargo clippy --version)"
            echo "GTK4=$(pkg-config --modversion gtk4)"; echo "LIBADWAITA=$(pkg-config --modversion libadwaita-1)"
            echo "LOCK_SHA256_EXPECTED=${EXPECTED_LOCK}"; echo "LOCK_SHA256_BEFORE=${LOCK_BEFORE}"; echo "LOCK_SHA256_AFTER=${LOCK_AFTER}"
            echo "ROOT_MANIFEST_SHA256_BEFORE=${ROOT_MANIFEST_BEFORE}"; echo "ROOT_MANIFEST_SHA256_AFTER=${ROOT_MANIFEST_AFTER}"
            echo "BRIDGE_MANIFEST_SHA256_BEFORE=${BRIDGE_MANIFEST_BEFORE}"; echo "BRIDGE_MANIFEST_SHA256_AFTER=${BRIDGE_MANIFEST_AFTER}"
            echo "ROOT_SOURCE_SHA256_BEFORE=${ROOT_SOURCE_BEFORE}"; echo "ROOT_SOURCE_SHA256_AFTER=${ROOT_SOURCE_AFTER}"
            echo "WIRE_SOURCE_SHA256_BEFORE=${WIRE_SOURCE_BEFORE}"; echo "WIRE_SOURCE_SHA256_AFTER=${WIRE_SOURCE_AFTER}"
            echo "TEST_SHA256_BEFORE=${TEST_BEFORE}"; echo "TEST_SHA256_AFTER=${TEST_AFTER}"
            echo "LOCK_AUDIT_RC=${LOCK_AUDIT_RC}"; cat "${RUNNER_TEMP}/gate-rcs"
            echo "PRE_NORMALIZE_DRIFT_RC=${PRE_NORMALIZE_DRIFT_RC}"; echo "TARGET_RESTORE_RC=${TARGET_RESTORE_RC}"; echo "HASH_DRIFT_RC=${HASH_DRIFT_RC}"; echo "FINAL_DRIFT_RC=${FINAL_DRIFT_RC}"
            echo "FINAL_TRACKED_DIFF=$(printf '%s,' "${FINAL_DIFF[@]}" | sed 's/,$//')"
            echo FRESHNESS_WIRE_MAGIC=PRWF; echo FRESHNESS_WIRE_VERSION=1.0; echo OUTER_CONTROL_KINDS=REQUEST,RESPONSE,ERROR
            echo AUTHENTICATED_DURABLE_RESYNC=YES; echo RESYNC_COMPARE_AND_COMMIT=NO; echo RESYNC_TOKEN_GENERATION=NO
            echo DISTRIBUTED_RUNTIME_TENANCY_SELECTED=NO; echo NETWORK_RUNTIME_ACTIVATION=NO; echo AGENT_BOOTSTRAP_ACTIVATION=NO
            echo "FIRST_FAILURE=${FIRST_FAILURE}"; echo "STATUS=${STATUS}"
            cat "${RUNNER_TEMP}/failure-tail" 2>/dev/null || true
          } > "${REPORT}"
          echo "status=${STATUS}" >> "${GITHUB_OUTPUT}"; echo "base_head=${BASE_HEAD}" >> "${GITHUB_OUTPUT}"; echo "report=${REPORT}" >> "${GITHUB_OUTPUT}"
      - name: Commit authoritative evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS="${{ steps.validate.outputs.status }}"; BASE_HEAD="${{ steps.validate.outputs.base_head }}"; REPORT="${{ steps.validate.outputs.report }}"
          BRANCH=phase-152-c02e-dynamic-reachability-design; SELF=.github/workflows/phase-152-c02e-tranche5-freshness-wire-validation.yml
          [[ -n "${BASE_HEAD}" && -n "${REPORT}" && -f "${REPORT}" ]]
          REMOTE="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"; [[ "${REMOTE}" == "${BASE_HEAD}" ]]
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${REPORT}"
          if [[ "${STATUS}" == PASS ]]; then git rm "${SELF}"; git commit -m "phase 152 c02e: validate tranche5 freshness wire ${BASE_HEAD:0:12}"; else git commit -m "phase 152 c02e: record tranche5 freshness wire failure ${BASE_HEAD:0:12}"; fi
          git push origin "HEAD:${BRANCH}"
      - name: Surface validation result
        if: always()
        run: test "${{ steps.validate.outputs.status }}" = PASS
