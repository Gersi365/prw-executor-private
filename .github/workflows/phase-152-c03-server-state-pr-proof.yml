name: Phase 152 C03 Runtime Server-State PR Proof

on:
  pull_request:
    branches:
      - phase-152-c03-runtime-management-integration

permissions:
  contents: read

jobs:
  focused-server-state:
    if: github.head_ref == 'phase-152-c03-runtime-server-state-pr-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Materialize aggregate-state wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          modules = Path('crates/prw-agent/src/local_commands.rs')
          text = modules.read_text()
          anchor = '''#[allow(
              dead_code,
              reason = "C03 lock-late runtime boundary is validated before worker wiring"
          )]
          pub(crate) mod management_runtime_boundary;
          '''
          addition = anchor + '''#[allow(
              dead_code,
              reason = "C03 aggregate server-state runtime proof is validated before session wiring"
          )]
          pub(crate) mod management_runtime_server_connection;
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one runtime-boundary module anchor, found {text.count(anchor)}')
          modules.write_text(text.replace(anchor, addition))

          state = Path('crates/prw-agent/src/local_commands/server_connection_state.rs')
          text = state.read_text()
          anchor = '''    pub const fn response_write(self) -> LocalTerminalResponseWriteState {
              self.response_write
          }

          /// Returns whether this connection instance remains safe for another Request.
          '''
          addition = '''    pub const fn response_write(self) -> LocalTerminalResponseWriteState {
              self.response_write
          }

          /// Borrows the authoritative component states for a crate-internal composed boundary.
          pub(super) fn runtime_component_states_mut(
              &mut self,
          ) -> (&mut LocalInboundRequestState, &mut LocalTerminalResponseWriteState) {
              (&mut self.inbound, &mut self.response_write)
          }

          /// Returns whether this connection instance remains safe for another Request.
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one aggregate-state accessor anchor, found {text.count(anchor)}')
          state.write_text(text.replace(anchor, addition))
          PY
          cargo fmt --all

      - name: Focused server-state tests
        run: |
          export CARGO_TARGET_DIR="${RUNNER_TEMP}/prw-c03-server-state-pr-target"
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check
          cargo test --locked -p prw-agent management_runtime::tests -- --nocapture
          cargo test --locked -p prw-agent management_runtime_boundary::tests -- --nocapture
          cargo test --locked -p prw-agent management_runtime_server_connection::tests -- --nocapture

      - name: Agent Clippy
        run: |
          export CARGO_TARGET_DIR="${RUNNER_TEMP}/prw-c03-server-state-pr-target"
          cargo clippy --locked -p prw-agent --all-targets --all-features -- -D warnings
