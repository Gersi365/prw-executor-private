name: Phase 152 C03 Management Transaction Clippy Corrective

on:
  push:
    branches:
      - phase-152-c03-management-transaction-corrective
    paths:
      - '.github/workflows/phase-152-c03-management-transaction-clippy-corrective.yml'
      - 'crates/prw-agent/src/local_commands/management_boundary_transaction.rs'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-152-c03-management-transaction-corrective
          fetch-depth: 0
      - name: Verify exact source baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 1db00eecb993fd97af8381fa8fe825133ab4adeb HEAD
          git diff --quiet 1db00eecb993fd97af8381fa8fe825133ab4adeb -- crates/prw-agent/src/local_commands/management_boundary_transaction.rs
      - name: Apply bounded Clippy expectation
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/prw-agent/src/local_commands/management_boundary_transaction.rs')
          text = path.read_text()
          anchor = 'pub(super) fn process_one_management_capable_at_boundary<R, W, RE, ME, T, F, S>(\n'
          if text.count(anchor) != 1:
              raise SystemExit('unexpected transaction function anchor count')
          replacement = '#[expect(\n    clippy::too_many_arguments,\n    reason = "authority-bearing boundary inputs stay explicit rather than hidden in a context bag"\n)]\n' + anchor
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          git restore -- target || true
      - name: Verify corrective scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --name-only | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 1
          grep -qx 'crates/prw-agent/src/local_commands/management_boundary_transaction.rs' /tmp/changed.txt
      - name: Remove applicator and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/phase-152-c03-management-transaction-clippy-corrective.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/prw-agent/src/local_commands/management_boundary_transaction.rs .github/workflows/phase-152-c03-management-transaction-clippy-corrective.yml
          git commit -m 'phase 152 c03: document explicit transaction authorities'
          git push origin HEAD:phase-152-c03-management-transaction-corrective
