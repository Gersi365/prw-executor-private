name: Phase 098 Signal Dependency Preflight

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase-098-dependency-preflight.yml"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve exact nix signal dependency and validate graph
        run: |
          cp Cargo.lock /tmp/Cargo.lock.before
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/prw-agent/Cargo.toml")
          text = path.read_text()
          anchor = 'rustix = { version = "=1.1.4", default-features = false, features = ["std", "event", "fs", "net", "process"] }\n'
          addition = 'nix = { version = "=0.31.3", default-features = false, features = ["signal"] }\n'
          if text.count(anchor) != 1:
              raise SystemExit("Phase 098 rustix manifest anchor mismatch")
          if "nix =" in text:
              raise SystemExit("Phase 098 expected nix dependency to be absent before preflight")
          path.write_text(text.replace(anchor, anchor + addition, 1))
          PY

          cargo metadata --format-version 1 > /dev/null

          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          before = tomllib.loads(Path("/tmp/Cargo.lock.before").read_text())
          after = tomllib.loads(Path("Cargo.lock").read_text())

          def keyed(data):
              return {(p["name"], p["version"]): p for p in data["package"]}

          b = keyed(before)
          a = keyed(after)
          added = set(a) - set(b)
          removed = set(b) - set(a)

          added_names = {name for name, _ in added}
          if added_names != {"nix", "cfg-if", "cfg_aliases"}:
              raise SystemExit(f"unexpected Phase 098 added packages: {sorted(added)}")
          if removed:
              raise SystemExit(f"unexpected Phase 098 removed packages: {sorted(removed)}")

          nix_keys = [key for key in added if key[0] == "nix"]
          if nix_keys != [("nix", "0.31.3")]:
              raise SystemExit(f"nix exact pin mismatch: {nix_keys}")

          for key, before_pkg in b.items():
              after_pkg = a[key]
              if key == ("prw-agent", "0.1.0"):
                  old_deps = set(before_pkg.get("dependencies", []))
                  new_deps = set(after_pkg.get("dependencies", []))
                  if new_deps != old_deps | {"nix"}:
                      raise SystemExit(
                          f"unexpected prw-agent dependency delta: {sorted(new_deps - old_deps)}"
                      )
              elif after_pkg != before_pkg:
                  raise SystemExit(f"existing locked package changed unexpectedly: {key}")

          nix = a[("nix", "0.31.3")]
          deps = set(nix.get("dependencies", []))
          required = {"bitflags", "cfg-if", "cfg_aliases", "libc"}
          if not required.issubset(deps):
              raise SystemExit(f"nix locked dependency set missing expected entries: {sorted(required - deps)}")
          PY

          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace --all-targets
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' Cargo.lock crates/prw-agent/Cargo.toml | sort)"
          test "$changed" = "$expected"

      - name: Commit dependency baseline and self-delete
        run: |
          rm .github/workflows/phase-098-dependency-preflight.yml
          git add Cargo.lock crates/prw-agent/Cargo.toml .github/workflows/phase-098-dependency-preflight.yml
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git commit -m "Integrate Phase 098 safe signal dependency baseline"
          git push
