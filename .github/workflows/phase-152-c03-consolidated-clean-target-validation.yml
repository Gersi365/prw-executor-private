name: Phase 152 C03 Consolidated Clean Target Validation

on:
  push:
    branches:
      - phase-152-c03-source-consolidated-ci-clean
    paths:
      - '.github/workflows/phase-152-c03-consolidated-clean-target-validation.yml'
      - '.github/workflows/phase-001-rust-validation.yml'
      - 'Cargo.lock'
      - 'apps/android/native/Cargo.lock'
      - 'crates/prw-agent/Cargo.toml'
      - 'crates/prw-agent/src/local_commands.rs'
      - 'crates/prw-agent/src/local_commands/management_boundary_transaction.rs'
      - 'crates/prw-agent/src/local_commands/management_linux_backends.rs'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: /tmp/prw-c03-consolidated-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-152-c03-source-consolidated-ci-clean
          fetch-depth: 0
      - name: Capture exact head and isolate build artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          rm -rf target "$CARGO_TARGET_DIR"
      - name: Install desktop native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev
      - name: Validate full locked workspace
        shell: bash
        run: |
          set +e
          mkdir -p logs/audits/phase-152-c03-source-consolidated-ci-clean
          REPORT="logs/audits/phase-152-c03-source-consolidated-ci-clean/C03_CONSOLIDATED_CLEAN_TARGET_VALIDATION_${BASE_HEAD}.txt"
          {
            echo "BASE_HEAD=${BASE_HEAD}"
            echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR}"
            rustc --version
            cargo --version
            rustfmt --version
            cargo clippy --version
          } > "$REPORT"

          cargo metadata --locked --no-deps --format-version 1 >/dev/null 2>&1
          METADATA_RC=$?
          cargo fmt --all -- --check >/dev/null 2>&1
          FMT_RC=$?
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings >/tmp/c03-clippy.log 2>&1
          CLIPPY_RC=$?
          cargo test --locked --workspace --all-targets >/tmp/c03-test.log 2>&1
          TEST_RC=$?
          cargo build --locked --workspace --all-targets >/tmp/c03-build.log 2>&1
          BUILD_RC=$?

          {
            echo "METADATA_RC=${METADATA_RC}"
            echo "FMT_RC=${FMT_RC}"
            echo "CLIPPY_RC=${CLIPPY_RC}"
            echo "TEST_RC=${TEST_RC}"
            echo "BUILD_RC=${BUILD_RC}"
          } >> "$REPORT"

          if [ "$CLIPPY_RC" -ne 0 ]; then
            echo "--- CLIPPY_TAIL ---" >> "$REPORT"
            tail -n 120 /tmp/c03-clippy.log >> "$REPORT"
          fi
          if [ "$TEST_RC" -ne 0 ]; then
            echo "--- TEST_TAIL ---" >> "$REPORT"
            tail -n 120 /tmp/c03-test.log >> "$REPORT"
          fi
          if [ "$BUILD_RC" -ne 0 ]; then
            echo "--- BUILD_TAIL ---" >> "$REPORT"
            tail -n 120 /tmp/c03-build.log >> "$REPORT"
          fi

          if [ "$METADATA_RC" -eq 0 ] && [ "$FMT_RC" -eq 0 ] && [ "$CLIPPY_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ] && [ "$BUILD_RC" -eq 0 ]; then
            echo "STATUS=PASS" >> "$REPORT"
            echo "VALIDATION_STATUS=PASS" >> "$GITHUB_ENV"
          else
            echo "STATUS=FAIL" >> "$REPORT"
            echo "VALIDATION_STATUS=FAIL" >> "$GITHUB_ENV"
          fi
          exit 0
      - name: Verify exact head did not move during validation
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE_HEAD=$(git ls-remote origin refs/heads/phase-152-c03-source-consolidated-ci-clean | cut -f1)
          test "$REMOTE_HEAD" = "$BASE_HEAD"
      - name: Commit evidence and remove validator
        shell: bash
        run: |
          set -Eeuo pipefail
          git restore -- target || true
          rm -rf "$CARGO_TARGET_DIR"
          rm .github/workflows/phase-152-c03-consolidated-clean-target-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          REPORT="logs/audits/phase-152-c03-source-consolidated-ci-clean/C03_CONSOLIDATED_CLEAN_TARGET_VALIDATION_${BASE_HEAD}.txt"
          git add "$REPORT" .github/workflows/phase-152-c03-consolidated-clean-target-validation.yml
          if [ "$VALIDATION_STATUS" = PASS ]; then
            git commit -m "phase 152 c03: validate consolidated clean target ${BASE_HEAD:0:12}"
          else
            git commit -m "phase 152 c03: record consolidated clean target failure ${BASE_HEAD:0:12}"
          fi
          git push origin HEAD:phase-152-c03-source-consolidated-ci-clean
      - name: Fail workflow when validation failed
        if: env.VALIDATION_STATUS != 'PASS'
        run: exit 1
