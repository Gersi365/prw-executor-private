name: PRW Rust Validation

on:
  push:
    branches:
      - main
    paths-ignore:
      - "logs/audits/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prw-rust-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: /tmp/prw-cargo-target

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Isolate build artifacts from tracked target
        run: |
          rm -rf target
          rm -rf "$CARGO_TARGET_DIR"

      - name: Install desktop native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev

      - name: Record toolchain
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
          pkg-config --modversion gtk4
          pkg-config --modversion libadwaita-1

      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-targets

      - name: Build workspace
        run: cargo build --locked --workspace --all-targets
