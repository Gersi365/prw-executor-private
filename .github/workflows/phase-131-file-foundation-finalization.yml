name: Phase 131 File Foundation Finalization

on:
  push:
    paths:
      - '.github/workflows/phase-131-file-foundation-finalization.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Require Phase 130 and normalize workspace/source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f logs/audits/phase-130-device-registry-workspace-membership/PRW-PHASE-130-REGISTRY-MEMBERSHIP-VALIDATION.txt
          grep -Fq 'PHASE_130_SOURCE_AND_DISPOSABLE_REGISTRY_FOUNDATION_DONE' \
            logs/audits/phase-130-device-registry-workspace-membership/PRW-PHASE-130-REGISTRY-MEMBERSHIP-VALIDATION.txt
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          member = '    "crates/prw-file-service",\n'
          if member not in text:
              needle = '    "crates/prw-files",\n'
              if text.count(needle) != 1:
                  raise SystemExit('workspace insertion point mismatch')
              text = text.replace(needle, needle + member)
              cargo.write_text(text)

          source = Path('crates/prw-file-service/src/lib.rs')
          text = source.read_text()
          import_line = 'use std::os::unix::fs::PermissionsExt;\n'
          if import_line not in text:
              needle = 'use rustix::{\n'
              if text.count(needle) != 1:
                  raise SystemExit('PermissionsExt insertion point mismatch')
              text = text.replace(needle, import_line + '\n' + needle)
              source.write_text(text)
          PY
          cargo fmt --all

      - name: Lock dependency graph
        id: lock
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          grep -A3 '^name = "rustix"$' Cargo.lock | grep -Fq 'version = "1.1.4"'
          lock_sha=$(sha256sum Cargo.lock | cut -d' ' -f1)
          echo "sha=$lock_sha" >> "$GITHUB_OUTPUT"
          echo "phase131_lock_sha256=$lock_sha"

      - name: Run focused file-service gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked -p prw-file-service --all-targets --all-features -- -D warnings
          cargo test --locked -p prw-file-service --all-targets
          echo 'phase131_focused_validation=pass'

      - name: Run full workspace gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo build --locked --workspace
          echo 'phase131_workspace_validation=pass'

      - name: Record authoritative report and self-clean
        shell: bash
        env:
          LOCK_SHA: ${{ steps.lock.outputs.sha }}
        run: |
          set -Eeuo pipefail
          report_dir='logs/audits/phase-131-remote-file-management-foundation'
          report="$report_dir/PRW-PHASE-131-FILE-MANAGEMENT-FOUNDATION-VALIDATION.txt"
          mkdir -p "$report_dir"
          cat > "$report" <<EOF
          Private Remote Workspace
          Phase 131 — Remote File Management Foundation

          STATUS:
          PASS / CONTRACT_LOCKED / DESCRIPTOR_ANCHORED_ROOT_IMPLEMENTED / PATH_TRAVERSAL_FAIL_CLOSED / CREATE_ONLY_PRIMITIVES_VALIDATED / FULL_WORKSPACE_VALIDATION_PASS / PRODUCTION_REMOTE_FILES_NOT_ACTIVE

          Repository: Gersi365/prw-executor-private
          Branch: main
          Date: 2026-08-16
          Validation source head: $GITHUB_SHA
          Authoritative finalization run: $GITHUB_RUN_ID
          Cargo.lock SHA-256: $LOCK_SHA

          CONTRACT
          contracts/REMOTE_FILE_MANAGEMENT_CONTRACT.md

          IMPLEMENTATION
          crates/prw-file-service

          SECURITY MODEL
          - filesystem authority is anchored to an owned root directory descriptor;
          - no canonicalize-then-open security boundary;
          - descendant directory traversal uses descriptor-relative openat with NOFOLLOW;
          - final regular-file reads use NOFOLLOW;
          - remote paths are strict UTF-8 relative component lists and reject absolute paths, empty components, dot, dot-dot, NUL, backslash, and locked bound violations;
          - root path replacement after descriptor open does not redirect authority;
          - symlink escape attempts fail closed;
          - Phase 131 writes are creation-only and cannot overwrite an existing destination;
          - new files normalize/verify 0600; new directories normalize/verify 0700;
          - whole-file read/write is bounded to 1 MiB;
          - directory listing is bounded to 4096 entries and rejects lossy non-UTF-8 names.

          INITIAL OPERATIONS
          - list directory;
          - metadata/stat without final symlink following;
          - bounded regular-file read;
          - creation-only regular-file write;
          - creation-only directory creation.

          EXPLICITLY DEFERRED
          Phase 132 owns resumable/chunked transfer, transfer IDs, content integrity, atomic overwrite/replacement, partial-transfer recovery/cleanup, and production transfer hardening. Delete/recursive operations and policy/transport integration are also not activated by Phase 131.

          VALIDATION
          The authoritative run passed focused prw-file-service rustfmt, Clippy -D warnings, and all-target tests, followed by full workspace/all-target Clippy, tests, and build under the locked dependency graph.

          Disposable tests cover path parser boundaries, list/stat/read, intermediate and final symlink rejection, root path replacement after descriptor open, create-only file/directory modes, existing-file non-overwrite, payload bounds, and directory-listing bounds.

          PRODUCTION BOUNDARY
          No arbitrary PowerCode user files, production PRW state, remote transport, or capability grant were mutated or activated. Production remote file access remains dependent on authenticated transport, current registry validation, explicit file capability policy, and Phase 132 transfer hardening.

          FINAL CLASSIFICATION
          PHASE_131_SOURCE_AND_DISPOSABLE_FILE_FOUNDATION_DONE / NO_PRODUCTION_REMOTE_FILE_SIDE_EFFECT / READY_FOR_PHASE_132_SOURCE_WORK
          EOF

          git rm -f -- .github/workflows/phase-131-file-foundation-finalization.yml
          git diff --check
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          git add -A
          git commit -m 'phase 131: finalize anchored file management foundation'
          git push origin HEAD:main
          echo 'phase131_finalization=pass'
