name: Phase 145 A03 Rust Components Corrective

on:
  push:
    paths:
      - '.github/workflows/phase-145-a03-rust-components-corrective.yml'

permissions:
  contents: write

jobs:
  correct-validate-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact probe branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare focused Rust build prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Reuse exact C03e-CO source generator
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/phase-152-c03e-co-receive-seam-probe-v2.yml').read_text()
          marker = '      - name: Apply exact CN-selected receive seam\n'
          start = source.index(marker)
          body_start = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index('      - name: Canonical formatting\n', body_start)
          lines = source[body_start:end].splitlines()
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/c03e-co-apply.sh').write_text(body)
          PY
          bash /tmp/c03e-co-apply.sh

      - name: Canonical formatting and exact path guard
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo +1.97.1 fmt --all
          cargo +1.97.1 fmt --all -- --check
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf 'changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'crates/prw-remote-bridge/src/prwc_connection_authentication.rs'

      - name: Focused Clippy
        run: cargo +1.97.1 clippy -p prw-remote-bridge --all-targets -- -D warnings

      - name: Focused tests
        run: cargo +1.97.1 test -p prw-remote-bridge

      - name: Commit canonical source only
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/prw-remote-bridge/src/prwc_connection_authentication.rs
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 1
          test "${staged[0]}" = 'crates/prw-remote-bridge/src/prwc_connection_authentication.rs'
          git commit -m 'Probe C03e-CO canonical receive seam source'
          git push origin HEAD:probe/c03e-co-receive-seam
