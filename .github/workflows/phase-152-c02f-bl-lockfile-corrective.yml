name: PRW Phase 152 C02f-BL Lockfile Corrective

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: prw-phase-152-c02f-bl-lockfile-corrective-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'phase-152-c02f-bl-attempt-id-generation-materialization-staging'
    name: Materialize exact BL lockfile delta
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact BL candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase-152-c02f-bl-attempt-id-generation-materialization-staging
          fetch-depth: 0

      - name: Update existing lockfile with Cargo and enforce exact delta
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > /dev/null
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          git diff --check -- Cargo.lock
          numstat="$(git diff --numstat -- Cargo.lock)"
          additions="$(git diff -- Cargo.lock | grep '^+' | grep -v '^+++' || true)"
          deletions="$(git diff -- Cargo.lock | grep '^-' | grep -v '^---' || true)"
          test "$numstat" = $'1\t0\tCargo.lock'
          test "$additions" = '+ "aws-lc-rs",'
          test -z "$deletions"
          echo "base_blob=$(git rev-parse HEAD:Cargo.lock)" >> "$GITHUB_OUTPUT"
          echo "target_blob=$(git hash-object Cargo.lock)" >> "$GITHUB_OUTPUT"
          echo "source_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit exact Cargo-updated lockfile through Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: phase-152-c02f-bl-attempt-id-generation-materialization-staging
          BASE_BLOB: ${{ steps.classify.outputs.base_blob }}
          TARGET_BLOB: ${{ steps.classify.outputs.target_blob }}
          SOURCE_HEAD: ${{ steps.classify.outputs.source_head }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD:Cargo.lock)" = "$BASE_BLOB"
          test "$(git hash-object Cargo.lock)" = "$TARGET_BLOB"
          content="$(base64 -w0 Cargo.lock)"
          jq -n \
            --arg message 'phase 152 c02f-bl: materialize Cargo-generated lock dependency' \
            --arg content "$content" \
            --arg sha "$BASE_BLOB" \
            --arg branch "$BRANCH" \
            '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/cargo-lock-update.json
          response="$(curl --fail-with-body -sS \
            -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/Cargo.lock" \
            --data-binary @/tmp/cargo-lock-update.json)"
          committed_blob="$(printf '%s' "$response" | jq -r '.content.sha')"
          committed_sha="$(printf '%s' "$response" | jq -r '.commit.sha')"
          test "$committed_blob" = "$TARGET_BLOB"
          test -n "$committed_sha"
          printf 'C02F_BL_LOCK_COMMIT=%s\n' "$committed_sha"
          printf 'C02F_BL_LOCK_BLOB=%s\n' "$committed_blob"
