name: PRW Phase 152 C02e Tranche2 Final Validation

on:
  push:
    branches:
      - phase-152-c02e-dynamic-reachability-design
    paths:
      - ".github/workflows/phase-152-c02e-tranche2-final-validation.yml"

permissions:
  contents: write

concurrency:
  group: prw-phase-152-c02e-tranche2-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and materialize exact Phase141 test edge
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install native workspace prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev

      - name: Validate candidate and prepare authoritative evidence
        id: validate
        shell: bash
        run: |
          set -uo pipefail

          BRANCH="phase-152-c02e-dynamic-reachability-design"
          SELF=".github/workflows/phase-152-c02e-tranche2-final-validation.yml"
          BASE_HEAD="$(git rev-parse HEAD)"
          AUDIT_DIR="logs/audits/phase-152-c02e-dynamic-reachability-design"
          REPORT="${AUDIT_DIR}/C02E_TRANCHE2_FINAL_VALIDATION_${BASE_HEAD}.txt"
          mkdir -p "${AUDIT_DIR}"

          LOCK_BEFORE_FILE="${RUNNER_TEMP}/Cargo.lock.before"
          cp Cargo.lock "${LOCK_BEFORE_FILE}"

          ROOT_MANIFEST_BEFORE="$(sha256sum Cargo.toml | awk '{print $1}')"
          BRIDGE_MANIFEST_BEFORE="$(sha256sum crates/prw-remote-bridge/Cargo.toml | awk '{print $1}')"
          NAT_MANIFEST_BEFORE="$(sha256sum crates/prw-nat-traversal/Cargo.toml | awk '{print $1}')"
          TEST_BEFORE="$(sha256sum crates/prw-remote-bridge/tests/reachability_phase141_integration.rs | awk '{print $1}')"
          LOCK_SHA256_BEFORE="$(sha256sum Cargo.lock | awk '{print $1}')"

          STATUS=PASS
          FIRST_FAILURE=NONE
          MATERIALIZE_RC=SKIPPED
          LOCK_AUDIT_RC=SKIPPED
          LOCKED_METADATA_RC=SKIPPED
          FORMAT_RC=SKIPPED
          INTEGRATION_TEST_RC=SKIPPED
          FOCUSED_CLIPPY_RC=SKIPPED
          FOCUSED_TESTS_RC=SKIPPED
          WORKSPACE_CLIPPY_RC=SKIPPED
          WORKSPACE_TESTS_RC=SKIPPED
          WORKSPACE_BUILD_RC=SKIPPED
          PRE_NORMALIZE_DRIFT_RC=SKIPPED
          TARGET_RESTORE_RC=SKIPPED
          FINAL_DRIFT_RC=SKIPPED
          LOCK_SHA256_CANDIDATE=UNAVAILABLE

          fail_once() {
            local gate="$1"
            if [[ "${STATUS}" == "PASS" ]]; then
              STATUS=FAIL
              FIRST_FAILURE="${gate}"
            fi
          }

          run_gate() {
            local gate="$1"
            shift
            local log="${RUNNER_TEMP}/${gate}.log"
            set +e
            "$@" >"${log}" 2>&1
            local rc=$?
            set -e
            printf -v "${gate}_RC" '%s' "${rc}"
            if [[ ${rc} -ne 0 ]]; then
              fail_once "${gate}"
              {
                printf '\n===== %s FAILURE TAIL =====\n' "${gate}"
                tail -n 240 "${log}"
              } >> "${RUNNER_TEMP}/failure-tail.txt"
            fi
          }

          set +e
          cargo metadata --format-version 1 >"${RUNNER_TEMP}/metadata.json" 2>"${RUNNER_TEMP}/metadata.err"
          MATERIALIZE_RC=$?
          set -e
          if [[ ${MATERIALIZE_RC} -ne 0 ]]; then
            fail_once MATERIALIZE
          else
            LOCK_SHA256_CANDIDATE="$(sha256sum Cargo.lock | awk '{print $1}')"
            diff -u "${LOCK_BEFORE_FILE}" Cargo.lock >"${RUNNER_TEMP}/Cargo.lock.candidate.diff" || true
          fi

          if [[ "${STATUS}" == "PASS" ]]; then
            set +e
            python3 - "${LOCK_BEFORE_FILE}" Cargo.lock >"${RUNNER_TEMP}/lock-audit.txt" 2>&1 <<'PY'
          import sys
          import tomllib

          before_path, after_path = sys.argv[1:3]

          def load(path):
              with open(path, "rb") as handle:
                  return tomllib.load(handle)["package"]

          before = load(before_path)
          after = load(after_path)

          def key(pkg):
              return (pkg["name"], pkg["version"], pkg.get("source"))

          before_map = {key(pkg): pkg for pkg in before}
          after_map = {key(pkg): pkg for pkg in after}

          if before_map.keys() != after_map.keys():
              raise SystemExit(
                  "package identity drift: "
                  f"removed={sorted(before_map.keys() - after_map.keys())!r} "
                  f"added={sorted(after_map.keys() - before_map.keys())!r}"
              )

          bridge_key = next(
              item for item in before_map
              if item[0] == "prw-remote-bridge" and item[2] is None
          )

          for item in before_map:
              left = before_map[item]
              right = after_map[item]
              if item != bridge_key and left != right:
                  raise SystemExit(f"unexpected lock package mutation: {item!r}")

          left = dict(before_map[bridge_key])
          right = dict(after_map[bridge_key])
          before_deps = list(left.pop("dependencies", []))
          after_deps = list(right.pop("dependencies", []))
          if left != right:
              raise SystemExit("prw-remote-bridge lock metadata changed outside dependencies")
          if "prw-nat-traversal" in before_deps:
              raise SystemExit("Phase141 edge unexpectedly present in pre-materialization lock")
          if sorted(after_deps) != sorted(before_deps + ["prw-nat-traversal"]):
              raise SystemExit(
                  "unexpected prw-remote-bridge dependency delta: "
                  f"before={before_deps!r} after={after_deps!r}"
              )

          external_before = sorted(
              (pkg["name"], pkg["version"], pkg.get("source"), pkg.get("checksum"))
              for pkg in before
              if pkg.get("source") is not None
          )
          external_after = sorted(
              (pkg["name"], pkg["version"], pkg.get("source"), pkg.get("checksum"))
              for pkg in after
              if pkg.get("source") is not None
          )
          if external_before != external_after:
              raise SystemExit("external dependency tuple drift detected")

          print("LOCK_AUDIT=PASS")
          print("PACKAGE_IDENTITIES=UNCHANGED")
          print("EXTERNAL_DEPENDENCY_TUPLES=UNCHANGED")
          print("ONLY_LOCAL_GRAPH_DELTA=prw-remote-bridge:+prw-nat-traversal")
          PY
            LOCK_AUDIT_RC=$?
            set -e
            if [[ ${LOCK_AUDIT_RC} -ne 0 ]]; then
              fail_once LOCK_AUDIT
            fi
          fi

          if [[ "${STATUS}" == "PASS" ]]; then run_gate LOCKED_METADATA cargo metadata --locked --no-deps --format-version 1; fi
          if [[ "${STATUS}" == "PASS" ]]; then run_gate FORMAT cargo fmt --all -- --check; fi
          if [[ "${STATUS}" == "PASS" ]]; then run_gate INTEGRATION_TEST cargo test --locked -p prw-remote-bridge --test reachability_phase141_integration; fi
          if [[ "${STATUS}" == "PASS" ]]; then run_gate FOCUSED_CLIPPY cargo clippy --locked -p prw-remote-bridge -p prw-nat-traversal --all-targets --all-features -- -D warnings; fi
          if [[ "${STATUS}" == "PASS" ]]; then run_gate FOCUSED_TESTS cargo test --locked -p prw-remote-bridge -p prw-nat-traversal --all-targets; fi
          if [[ "${STATUS}" == "PASS" ]]; then run_gate WORKSPACE_CLIPPY cargo clippy --locked --workspace --all-targets --all-features -- -D warnings; fi
          if [[ "${STATUS}" == "PASS" ]]; then run_gate WORKSPACE_TESTS cargo test --locked --workspace --all-targets; fi
          if [[ "${STATUS}" == "PASS" ]]; then run_gate WORKSPACE_BUILD cargo build --locked --workspace --all-targets; fi

          ROOT_MANIFEST_AFTER="$(sha256sum Cargo.toml | awk '{print $1}')"
          BRIDGE_MANIFEST_AFTER="$(sha256sum crates/prw-remote-bridge/Cargo.toml | awk '{print $1}')"
          NAT_MANIFEST_AFTER="$(sha256sum crates/prw-nat-traversal/Cargo.toml | awk '{print $1}')"
          TEST_AFTER="$(sha256sum crates/prw-remote-bridge/tests/reachability_phase141_integration.rs | awk '{print $1}')"
          if [[ "${ROOT_MANIFEST_BEFORE}" != "${ROOT_MANIFEST_AFTER}" || \
                "${BRIDGE_MANIFEST_BEFORE}" != "${BRIDGE_MANIFEST_AFTER}" || \
                "${NAT_MANIFEST_BEFORE}" != "${NAT_MANIFEST_AFTER}" || \
                "${TEST_BEFORE}" != "${TEST_AFTER}" ]]; then
            fail_once SOURCE_HASH_DRIFT
          fi

          mapfile -t PRE_DIFF < <(git diff --name-only)
          printf '%s\n' "${PRE_DIFF[@]}" >"${RUNNER_TEMP}/pre-normalize-diff.txt"
          PRE_UNEXPECTED=()
          for path in "${PRE_DIFF[@]}"; do
            if [[ "${path}" != "Cargo.lock" && "${path}" != target/* ]]; then
              PRE_UNEXPECTED+=("${path}")
            fi
          done
          if [[ ${#PRE_UNEXPECTED[@]} -eq 0 ]]; then
            PRE_NORMALIZE_DRIFT_RC=0
          else
            PRE_NORMALIZE_DRIFT_RC=94
            fail_once PRE_NORMALIZE_TRACKED_DRIFT
          fi

          set +e
          git checkout -- target
          TARGET_RESTORE_RC=$?
          set -e
          if [[ ${TARGET_RESTORE_RC} -ne 0 ]]; then
            fail_once TARGET_RESTORE
          fi

          mapfile -t FINAL_DIFF < <(git diff --name-only)
          printf '%s\n' "${FINAL_DIFF[@]}" >"${RUNNER_TEMP}/final-diff.txt"
          if [[ "${STATUS}" == "PASS" ]]; then
            if [[ ${#FINAL_DIFF[@]} -eq 1 && "${FINAL_DIFF[0]}" == "Cargo.lock" ]]; then
              FINAL_DRIFT_RC=0
            else
              FINAL_DRIFT_RC=95
              fail_once FINAL_TRACKED_DRIFT
            fi
          fi

          if [[ "${STATUS}" != "PASS" ]]; then
            cp "${LOCK_BEFORE_FILE}" Cargo.lock
            git checkout -- target
          fi

          LOCK_SHA256_FINAL="$(sha256sum Cargo.lock | awk '{print $1}')"
          {
            echo "PHASE=152-C02e-Tranche2-Final"
            echo "BASE_HEAD=${BASE_HEAD}"
            echo "RUSTC=$(rustc --version)"
            echo "CARGO=$(cargo --version)"
            echo "RUSTFMT=$(rustfmt --version)"
            echo "CLIPPY=$(cargo clippy --version)"
            echo "GTK4=$(pkg-config --modversion gtk4)"
            echo "LIBADWAITA=$(pkg-config --modversion libadwaita-1)"
            echo "LOCK_SHA256_BEFORE=${LOCK_SHA256_BEFORE}"
            echo "LOCK_SHA256_CANDIDATE=${LOCK_SHA256_CANDIDATE}"
            echo "LOCK_SHA256_FINAL=${LOCK_SHA256_FINAL}"
            echo "ROOT_MANIFEST_SHA256_BEFORE=${ROOT_MANIFEST_BEFORE}"
            echo "ROOT_MANIFEST_SHA256_AFTER=${ROOT_MANIFEST_AFTER}"
            echo "BRIDGE_MANIFEST_SHA256_BEFORE=${BRIDGE_MANIFEST_BEFORE}"
            echo "BRIDGE_MANIFEST_SHA256_AFTER=${BRIDGE_MANIFEST_AFTER}"
            echo "NAT_MANIFEST_SHA256_BEFORE=${NAT_MANIFEST_BEFORE}"
            echo "NAT_MANIFEST_SHA256_AFTER=${NAT_MANIFEST_AFTER}"
            echo "TEST_SHA256_BEFORE=${TEST_BEFORE}"
            echo "TEST_SHA256_AFTER=${TEST_AFTER}"
            echo "MATERIALIZE_RC=${MATERIALIZE_RC}"
            echo "LOCK_AUDIT_RC=${LOCK_AUDIT_RC}"
            echo "LOCKED_METADATA_RC=${LOCKED_METADATA_RC}"
            echo "FORMAT_RC=${FORMAT_RC}"
            echo "INTEGRATION_TEST_RC=${INTEGRATION_TEST_RC}"
            echo "FOCUSED_CLIPPY_RC=${FOCUSED_CLIPPY_RC}"
            echo "FOCUSED_TESTS_RC=${FOCUSED_TESTS_RC}"
            echo "WORKSPACE_CLIPPY_RC=${WORKSPACE_CLIPPY_RC}"
            echo "WORKSPACE_TESTS_RC=${WORKSPACE_TESTS_RC}"
            echo "WORKSPACE_BUILD_RC=${WORKSPACE_BUILD_RC}"
            echo "PRE_NORMALIZE_DRIFT_RC=${PRE_NORMALIZE_DRIFT_RC}"
            echo "TARGET_RESTORE_RC=${TARGET_RESTORE_RC}"
            echo "FINAL_DRIFT_RC=${FINAL_DRIFT_RC}"
            echo "PRE_NORMALIZE_TRACKED_DIFF=$(paste -sd, "${RUNNER_TEMP}/pre-normalize-diff.txt" 2>/dev/null || true)"
            echo "PRE_NORMALIZE_UNEXPECTED_DIFF=$(printf '%s\n' "${PRE_UNEXPECTED[@]}" | paste -sd, -)"
            echo "FINAL_TRACKED_DIFF=$(paste -sd, "${RUNNER_TEMP}/final-diff.txt" 2>/dev/null || true)"
            echo "NETWORK_RUNTIME_ACTIVATION=NO"
            echo "PRODUCTION_TRAVERSAL_OWNER_SELECTION=NO"
            echo "FIRST_FAILURE=${FIRST_FAILURE}"
            echo "STATUS=${STATUS}"
            echo
            echo "===== LOCK AUDIT ====="
            cat "${RUNNER_TEMP}/lock-audit.txt" 2>/dev/null || true
            echo
            echo "===== CARGO.LOCK CANDIDATE DIFF ====="
            cat "${RUNNER_TEMP}/Cargo.lock.candidate.diff" 2>/dev/null || true
            echo
            echo "===== MATERIALIZATION STDERR ====="
            tail -n 240 "${RUNNER_TEMP}/metadata.err" 2>/dev/null || true
            cat "${RUNNER_TEMP}/failure-tail.txt" 2>/dev/null || true
          } >"${REPORT}"

          echo "status=${STATUS}" >>"${GITHUB_OUTPUT}"
          echo "base_head=${BASE_HEAD}" >>"${GITHUB_OUTPUT}"
          echo "report=${REPORT}" >>"${GITHUB_OUTPUT}"

      - name: Commit authoritative evidence and validated lock
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="phase-152-c02e-dynamic-reachability-design"
          SELF=".github/workflows/phase-152-c02e-tranche2-final-validation.yml"
          STATUS="${{ steps.validate.outputs.status }}"
          BASE_HEAD="${{ steps.validate.outputs.base_head }}"
          REPORT="${{ steps.validate.outputs.report }}"

          [[ -n "${BASE_HEAD}" && -n "${REPORT}" && -f "${REPORT}" ]]
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          [[ "${REMOTE_HEAD}" == "${BASE_HEAD}" ]]

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${STATUS}" == "PASS" ]]; then
            git rm "${SELF}"
            git add Cargo.lock "${REPORT}"
            git commit -m "phase 152 c02e: validate tranche2 phase141 edge ${BASE_HEAD:0:12}"
          else
            git add "${REPORT}"
            git commit -m "phase 152 c02e: record tranche2 final validation failure ${BASE_HEAD:0:12}"
          fi
          git push origin "HEAD:${BRANCH}"

      - name: Surface final result
        if: always()
        shell: bash
        run: |
          [[ "${{ steps.validate.outputs.status }}" == "PASS" ]]
